<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#121a3d">
<meta name="robots" content="noindex,nofollow">
<title>Get A Feel 问卷 · 一答一反馈</title>
<link rel="stylesheet" href="common.css">
<style>
.chat{display:flex;flex-direction:column;gap:10px;padding-bottom:12px}
.msg{max-width:84%;padding:10px 14px;border-radius:18px;line-height:1.65;animation:pop .28s ease both;white-space:pre-wrap;word-break:break-word}
@keyframes pop{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.host{align-self:flex-start;background:var(--card);border:1px solid var(--line);border-bottom-left-radius:6px}
.host .qn{display:block;font-size:13px;margin-bottom:2px}
.me{align-self:flex-end;background:var(--warm);color:var(--warm-ink);border-bottom-right-radius:6px}
.me .thumbs{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.me .thumbs img{width:64px;height:84px;object-fit:cover;border-radius:8px}
.who{display:flex;gap:8px;align-items:flex-end}
.avatar{width:30px;height:30px;border-radius:50%;flex:none;display:flex;align-items:center;justify-content:center;font-size:17px;background:var(--bg2);border:1px solid var(--line)}
.typing{display:inline-flex;gap:4px;padding:14px 16px}
.typing i{width:6px;height:6px;border-radius:50%;background:var(--dim);animation:blink 1s infinite}
.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
@keyframes blink{0%,80%,100%{opacity:.25}40%{opacity:1}}
.composer{position:sticky;bottom:0;margin:0 -18px;padding:16px 18px calc(env(safe-area-inset-bottom) + 12px);background:linear-gradient(rgba(18,26,61,0),rgba(18,26,61,.88) 30%)}
.composer .card{padding:14px}
.composer .send{display:flex;justify-content:flex-end;margin-top:10px;gap:10px;align-items:center}
</style>
</head>
<body>
<div class="wrap" id="app"><div class="chat" id="chat"></div><div class="composer" id="composer"></div></div>
<script src="common.js"></script>
<script src="ui.js"></script>
<script>
(() => {
const { QUESTIONS, session, feedbackFor } = GAF, { el, questionInputs, introCard, doSubmit } = GAFUI;
const sess = session('with_feedback'), chat = document.getElementById('chat'), comp = document.getElementById('composer');
const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
const scroll = () => window.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' });
function host(html, quiet) {
  const w = el('div', 'who'); w.appendChild(el('div', 'avatar', '🪐'));
  const m = el('div', 'msg host'); m.innerHTML = html; w.appendChild(m); chat.appendChild(w); if (!quiet) scroll(); return m;
}
function me(n) {
  const a = sess.answer(n), m = el('div', 'msg me');
  if (a.skipped) m.textContent = '👽';
  else {
    if ((a.text || '').trim()) m.appendChild(document.createTextNode(a.text.trim()));
    const ims = Object.values(a.images || {});
    if (ims.length) { const t = el('div', 'thumbs'); ims.forEach((im) => { const i = el('img'); i.alt = ''; i.src = 'data:' + im.mime + ';base64,' + im.data; t.appendChild(i); }); m.appendChild(t); }
  }
  chat.appendChild(m); scroll();
}
async function typing(ms) {
  const w = el('div', 'who'); w.appendChild(el('div', 'avatar', '🪐')); w.appendChild(el('div', 'msg host typing', '<i></i><i></i><i></i>'));
  chat.appendChild(w); scroll(); await sleep(ms); w.remove();
}
const ask = (q, quiet) => host(`<span class="qn">第 ${q.n} 题 · ${q.g} 组</span>${q.q}${q.hint ? `<br><span class="note">${q.hint}</span>` : ''}`, quiet);
function composer(q) {
  comp.innerHTML = '';
  const card = el('div', 'card'); let t0 = performance.now();
  const send = el('button', 'btn pri', '发送'); send.type = 'button';
  const refresh = () => (send.disabled = !sess.isDone(q.n));
  card.appendChild(questionInputs(q, sess, refresh));
  const r = el('div', 'send'); r.appendChild(send); card.appendChild(r); comp.appendChild(card); refresh();
  send.onclick = async () => {
    sess.tick(q.n, performance.now() - t0); comp.innerHTML = '';
    me(q.n);
    const fb = feedbackFor(q.n, sess.answer(q.n));
    sess.s.feedback = (sess.s.feedback || []).filter((f) => f.n !== q.n).concat([{ n: q.n, text: fb }]);
    sess.s.cursor = q.n; sess.save();
    await typing(700 + Math.random() * 600); host(fb);
    await sleep(500); next();
  };
}
async function next() {
  const i = sess.s.cursor || 0;
  if (i >= QUESTIONS.length) return finish();
  await typing(600); ask(QUESTIONS[i]); composer(QUESTIONS[i]);
}
async function finish() {
  await typing(800);
  host('全部答完了，谢谢你。\n接下来我会用这些回答做出 7 件作品，做好了通过链接告诉你，到时你来挑一件最像你的。');
  comp.innerHTML = '';
  const card = el('div', 'card stack'); const b = el('button', 'btn pri', '提交我的回答'); b.type = 'button';
  const r = el('div', 'row'); r.appendChild(b); card.appendChild(r); card.appendChild(el('p', 'err')); comp.appendChild(card);
  b.onclick = () => doSubmit(sess, card);
}
async function start() {
  comp.innerHTML = ''; chat.innerHTML = '';
  host('嗨，我会问你 10 个小问题，大约 3 到 5 分钟。', true);
  host('哪题不想答，回个 👽 就行，不用解释。', true);
  const done = sess.s.cursor || 0;   // 刷新后把聊过的内容补回来
  for (let k = 0; k < done; k++) { const q = QUESTIONS[k]; ask(q, true); me(q.n); const f = (sess.s.feedback || []).find((x) => x.n === q.n); if (f) host(f.text, true); }
  scroll(); next();
}
if (sess.s.consent && (sess.s.cursor || Object.keys(sess.s.answers).length)) start();
else chat.appendChild(introCard(sess, '我会像聊天一样一题一题地问，你每回答一句，我都会先回你一句，', start));
})();
</script>
</body>
</html>
