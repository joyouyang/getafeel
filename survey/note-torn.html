<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#cbd6d2">
<meta name="robots" content="noindex,nofollow">
<title>传纸条 · 撕边</title>
<link rel="preload" href="fonts/kuaile.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="common.css">
<link rel="stylesheet" href="note-core.css">
<style>
/* 只用一条不规则的撕边：纸是从本子上随手撕下来的。扔 = 整张抛出去。 */
:root{--desk:#cbd6d2}
.note{transform:rotate(-1deg);padding-top:34px}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<script src="common.js"></script>
<script src="ui.js"></script>
<script src="note-core.js"></script>
<script>
(() => {
const { anim, gone } = GAFNote, C = 'translate(-50%,-50%)';
// 每张纸条的撕边都不一样
function tear(note) { let p = ['0% 100%', '0% 9px']; for (let x = 0; x < 100; x += 2 + Math.random() * 3) p.push(`${x.toFixed(1)}% ${(Math.random() * 9).toFixed(1)}px`); p.push('100% 5px', '100% 100%'); note.style.clipPath = `polygon(${p.join(',')})`; }
GAFNote.start({ skin: 'torn', verb: '扔', throwLabel: '扔回去', decorate: tear,
  out(note) { return gone(note, [{ transform: 'rotate(-1deg)' }, { offset: .25, transform: 'translateY(16px) rotate(-1deg)' }, { transform: 'translate(25vw,-120vh) rotate(28deg)' }], { duration: 650, easing: 'cubic-bezier(.5,0,.75,0)' }); },
  in(note) { return anim(note, [{ transform: 'translate(-25vw,-120vh) rotate(-30deg)' }, { offset: .75, transform: 'translateY(8px) rotate(1.5deg)' }, { transform: 'rotate(-1deg)' }], { duration: 750, easing: 'cubic-bezier(.2,.7,.3,1)' }); },
});
})();
</script>
</body>
</html>
