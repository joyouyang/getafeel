<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#d8d2c4">
<meta name="robots" content="noindex,nofollow">
<title>Get A Feel 问卷 · 热敏小票</title>
<link rel="stylesheet" href="common.css">
<link rel="stylesheet" href="flip-core.css">
<style>
/* 热敏小票：收银台上打出来的一张张小票；翻面 = 打出回执联 */
:root{color-scheme:light;
  --bg:#d8d2c4; --card:#fbfaf4; --line:#d9d5c8; --line2:#b9b4a6; --ink:#1d1c1a; --dim:#5d5a52; --faint:#8f8a7e;
  --warm:#1d1c1a; --warm-ink:#fbfaf4; --red:#c8382e;
  --mono:"SF Mono","Menlo","Consolas","Courier New","PingFang SC","Microsoft YaHei",monospace; --hand:var(--mono); --sans:var(--mono)}
body{background:var(--bg) radial-gradient(circle at 20% 10%,rgba(255,255,255,.45),transparent 50%);font-family:var(--mono);color:var(--ink);background-attachment:fixed}
.wrap{max-width:420px}
.slot-mouth{height:14px;margin:0 6px -7px;border-radius:7px;background:#2a2926;box-shadow:inset 0 3px 4px rgba(0,0,0,.7);position:relative;z-index:2}
.card{background:var(--card);border:0;border-radius:0;padding:22px 20px 26px;box-shadow:0 8px 18px rgba(60,50,30,.18);-webkit-backdrop-filter:none;backdrop-filter:none;
  -webkit-mask:conic-gradient(from -45deg at bottom,#0000,#000 1deg 89deg,#0000 90deg) bottom/12px 51% repeat-x,conic-gradient(from 135deg at top,#0000,#000 1deg 89deg,#0000 90deg) top/12px 51% repeat-x;
  mask:conic-gradient(from -45deg at bottom,#0000,#000 1deg 89deg,#0000 90deg) bottom/12px 51% repeat-x,conic-gradient(from 135deg at top,#0000,#000 1deg 89deg,#0000 90deg) top/12px 51% repeat-x}
.face{gap:12px}
.flipper,.flipper.flipped{transform:none;transition:none}
.face{-webkit-backface-visibility:visible;backface-visibility:visible}
.back{transform:none;display:none}
.flipped .front{display:none}
.flipped .back{display:flex}
.printing{animation:print 1.1s steps(14) both}
@keyframes print{from{clip-path:inset(0 0 100% 0);transform:translateY(-12px)}to{clip-path:inset(0 0 0 0);transform:none}}
.shop{text-align:center;font-size:12px;line-height:1.6;color:var(--dim);border-bottom:1px dashed var(--line2);padding-bottom:10px}
.shop b{display:block;font-size:17px;letter-spacing:.3em;color:var(--ink)}
.qn{font-family:var(--mono);color:var(--dim);font-size:12px;letter-spacing:.2em}
.qhead h2,h1,h2{font-family:var(--mono);font-weight:700;letter-spacing:0;line-height:1.5}
.qhead h2{font-size:19px}
.hint,.note,.lead{color:var(--dim)}
input[type=text],input[type=number],textarea{background:transparent;border:0;border-bottom:1.5px dashed var(--line2);border-radius:0;color:var(--ink);padding:8px 2px;font-family:var(--mono)}
textarea{border:1.5px dashed var(--line2);padding:8px}
input::placeholder,textarea::placeholder{color:#a9a496}
.btn{border-radius:0;border:1.5px solid var(--ink);background:transparent;color:var(--ink);font-family:var(--mono);letter-spacing:.05em}
.btn.pri{background:var(--ink);color:var(--card)}
.alien{border-radius:0;border-style:dashed;color:var(--dim)}
.alien.on{background:var(--ink);color:var(--card);border-color:var(--ink)}
.slot{border-radius:0;background:#f0eee6}
.seg{border-radius:0}.seg button{border-radius:0}
.seg button.on{background:var(--ink);color:var(--card)}
.tool{border-radius:0;color:var(--ink);background:transparent}
.pad canvas{border-radius:0;box-shadow:0 0 0 1.5px var(--line2)}
.progress{background:repeating-linear-gradient(90deg,var(--line2) 0 6px,transparent 6px 10px);height:6px;border-radius:0}
.progress i{background:var(--ink)}
.top .count{color:var(--dim)}
.echo{border-left:0;padding:0;font-size:13px}
.echo::before{content:"> ";color:var(--faint)}
.reply{color:var(--ink);font-size:20px;font-weight:700;text-align:left}
.reply::before{content:"*** 回 应 ***";display:block;text-align:center;font-size:12px;letter-spacing:.25em;font-weight:400;color:var(--dim);margin-bottom:6px}
.stamp{align-self:flex-end;margin:-6px 6px 0 0;transform:rotate(-12deg);border:3px double var(--red);color:var(--red);font-weight:700;letter-spacing:.2em;padding:4px 10px;font-size:15px;opacity:.85;border-radius:6px}
.barcode{height:44px;margin-top:6px;background:repeating-linear-gradient(90deg,var(--ink) 0 2px,transparent 2px 4px,var(--ink) 4px 5px,transparent 5px 8px,var(--ink) 8px 11px,transparent 11px 12px)}
.barno{text-align:center;font-size:11px;letter-spacing:.3em;color:var(--dim);margin-top:-8px}
.follow{border-top:1px dashed var(--line2)}
.done-mark{filter:grayscale(1)}
</style>
</head>
<body>
<div class="wrap stack" id="app"></div>
<script src="common.js"></script>
<script src="ui.js"></script>
<script src="flip-core.js"></script>
<script>
(() => {
const { el, blip } = Object.assign({}, GAFUI, GAFFlip);
const now = () => { const d = new Date(), p = (x) => String(x).padStart(2, '0'); return `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`; };
const printSound = () => { for (let k = 0; k < 9; k++) setTimeout(() => blip(90 + Math.random() * 40, 0.05, 'square', 0.035), k * 110); };
const print = (face) => { face.classList.remove('printing'); void face.offsetWidth; face.classList.add('printing'); printSound(); };
GAFFlip.start({
  skin: 'receipt',
  intro: '每一题会像小票一样打印出来，写好后再打出一张回执联给你。',
  labels: { turn: '打印回执', again: '重打这一联', next: '下一张', submit: '结账提交', mine: '你写的', group: (q) => `${q.g} 组 · 第 ${String(q.n).padStart(2, '0')} 联`, count: (q) => `NO.${String(q.n).padStart(4, '0')} / 0010` },
  hooks: {
    front(face, q) {
      const shop = el('div', 'shop', `<b>GET·A·FEEL</b>一家只收"你"的小店<br>${now()}　收银员：🪐`);
      face.prepend(shop);
      const mouth = el('div', 'slot-mouth'); face.closest('.scene').before(mouth);
      print(face);
    },
    back(face, q) {
      face.prepend(el('div', 'shop', `<b>回 执 联</b>NO.${String(q.n).padStart(4, '0')}　${now()}`));
      face.querySelector('.reply').after(el('div', 'stamp', '已收到'));
      const nav = face.querySelector('.nav');
      nav.before(el('div', 'barcode')); nav.before(el('div', 'barno', `*GAF${String(q.n).padStart(4, '0')}${Math.floor(Math.random() * 9000 + 1000)}*`));
    },
    flip(toBack, scene) { print(scene.querySelector(toBack ? '.back' : '.front')); },
  },
});
})();
</script>
</body>
</html>
