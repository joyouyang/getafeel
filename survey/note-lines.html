<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#e6dac3">
<meta name="robots" content="noindex,nofollow">
<title>传纸条 · 横线</title>
<link rel="preload" href="fonts/kuaile.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="common.css">
<link rel="stylesheet" href="note-core.css">
<style>
/* 只用横线 + 一条红色页边线：一看就是作业本上撕下来的。扔 = 缩成一个圆团飞走。 */
:root{--desk:#e6dac3}
.note{background-color:var(--paper);background-image:linear-gradient(90deg,transparent 30px,#f1a7a7 30px 32px,transparent 32px),repeating-linear-gradient(transparent 0 33px,#bcd5ee 33px 34px);padding-left:46px;box-shadow:0 1px 3px rgba(0,0,0,.12)}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<script src="common.js"></script>
<script src="ui.js"></script>
<script src="note-core.js"></script>
<script>
(() => {
const { anim, gone } = GAFNote, C = 'translate(-50%,-50%)';
const ball = (note) => { const w = note.offsetWidth, h = note.offsetHeight, s = 90 / w; return `scale(${s.toFixed(3)},${(s * w / h).toFixed(3)})`; };
GAFNote.start({ skin: 'lines', verb: '揉成团扔', throwLabel: '揉成团扔回去',
  out(note) { const b = ball(note);
    return gone(note, [{ transform: 'none', borderRadius: '0' }, { offset: .4, transform: b + ' rotate(170deg)', borderRadius: '50%' }, { offset: .5, transform: b + ' rotate(200deg)', borderRadius: '50%' }, { transform: 'translate(35vw,-110vh) ' + b + ' rotate(540deg)', borderRadius: '50%' }], { duration: 1000, easing: 'ease-in' }); },
  in(note) { const b = ball(note);
    return anim(note, [{ transform: 'translate(-30vw,-110vh) ' + b + ' rotate(-400deg)', borderRadius: '50%' }, { offset: .5, transform: b + ' rotate(-30deg)', borderRadius: '50%' }, { offset: .6, transform: b + ' rotate(-10deg)', borderRadius: '50%' }, { transform: 'none', borderRadius: '0' }], { duration: 1000, easing: 'ease-out' }); },
});
})();
</script>
</body>
</html>
