<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#fbfaf6">
<meta name="robots" content="noindex,nofollow">
<title>传纸条</title>
<link rel="stylesheet" href="common.css">
<link rel="stylesheet" href="note-core.css">
<style>
/* 正式版：不画纸，只画一圈会抖的线，像在本子上随手框出来的一块。往左滑，纸条缩成一团乱线往左飞走；下一张从左边扔回来。
 * 只用三种颜色：页面上的字和线是蓝色，用户写的是黑色，箭头和提醒是红色。字体用系统自带的无衬线体。 */
:root{--desk:#fbfaf6;--blue:#2557d6;--red:#e23b3b;--user:#111;
  --kid:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Helvetica Neue","Microsoft YaHei",sans-serif;
  --pencil:var(--blue);--pen:var(--user);--gel:var(--blue);--mark:transparent;--arrow:var(--red);
  --dim:rgba(37,87,214,.75);--faint:rgba(37,87,214,.5);--line:rgba(37,87,214,.16);--line2:rgba(37,87,214,.4);--ink:var(--blue);--warm:var(--blue)}
body{-webkit-font-smoothing:antialiased}
.note{background:transparent;padding:30px 26px 22px;gap:16px;touch-action:pan-y}
.note h1{font-size:26px;font-weight:600;letter-spacing:0}
.note h2{font-size:20px;font-weight:500;letter-spacing:0;line-height:1.55}
.note .lead{font-size:17px;color:var(--blue)}
.note .small{font-size:13px;color:var(--faint)}
.from .reply{font-size:18px;color:var(--blue)}
.from .ask{font-size:15px;color:var(--blue);opacity:1}
input[type=text],input[type=number],textarea{font-size:18px;color:var(--user)}
input::placeholder,textarea::placeholder{color:rgba(37,87,214,.32)}
.btn:focus-visible,.alien:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid rgba(37,87,214,.3)}
.btn{font-size:16px;color:var(--blue);border-color:var(--blue)}
.btn.pri{background:var(--blue);color:#fff;border-color:var(--blue)}
.link{color:var(--blue);text-decoration-color:rgba(37,87,214,.35)}
.alien{color:var(--blue);border-color:rgba(37,87,214,.45)}
.alien.on{background:var(--blue);color:#fff;border-color:var(--blue)}
.slot{border-color:rgba(37,87,214,.4);color:var(--blue);background:transparent}
.slot.pic .plabel{color:var(--blue)}
.slot.pic .tag,.slot .x{background:var(--blue);color:#fff}
.pbtn{color:var(--blue);border-color:var(--blue)}
.tool{color:var(--blue);border-color:rgba(37,87,214,.4)}
.pad canvas{box-shadow:0 0 0 2px rgba(37,87,214,.3)}
.sw.on{box-shadow:0 0 0 2px var(--blue)}
.sheet-card h2{color:var(--blue)}
.err{color:var(--red)}
.top{color:var(--blue)}
.outline{position:absolute;inset:0;width:100%;height:100%;overflow:visible;pointer-events:none}
.outline path,.token path{fill:none;stroke:var(--blue);stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.token{position:fixed;left:50%;top:34vh;width:84px;height:84px;z-index:20;pointer-events:none}
.token svg{width:100%;height:100%;overflow:visible}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<script>window.GAF_PAD_COLORS = ['#111', '#2557d6', '#e23b3b'];</script>
<script src="common.js"></script>
<script src="ui.js"></script>
<script src="note-core.js"></script>
<script>
(() => {
const { anim, gone } = GAFNote, C = 'translate(-50%,-50%)';
const wob = (n) => (Math.random() - .5) * n;
function roughRect(w, h) {   // 一圈抖动的框，起笔和收笔错开一点，像手画的
  const pts = [], step = 36, add = (x, y) => pts.push(`${(x + wob(4)).toFixed(1)} ${(y + wob(4)).toFixed(1)}`);
  for (let x = 4; x < w - 4; x += step) add(x, 4); for (let y = 4; y < h - 4; y += step) add(w - 4, y);
  for (let x = w - 4; x > 4; x -= step) add(x, h - 4); for (let y = h - 4; y > 4; y -= step) add(4, y); add(14, 2);
  return 'M' + pts.join(' L');
}
function scribble() {   // 一团乱线：几圈歪歪扭扭的圆叠在一起
  let d = '';
  for (let k = 0; k < 4; k++) { const r = 22 + wob(14), cx = 42 + wob(8), cy = 42 + wob(8);
    for (let a = 0; a <= 360; a += 30) { const t = (a + k * 50) * Math.PI / 180, rr = r + wob(10); d += (a ? ' L' : (k ? ' M' : 'M')) + (cx + rr * Math.cos(t)).toFixed(1) + ' ' + (cy + rr * Math.sin(t)).toFixed(1); } }
  return `<svg viewBox="0 0 84 84"><path d="${d}"/></svg>`;
}
// 线条每 150ms 换一种抖法（"线条沸腾"），看起来像一帧一帧手画的
function outline(note) {
  const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg'); svg.setAttribute('class', 'outline'); svg.setAttribute('aria-hidden', 'true');
  const path = document.createElementNS('http://www.w3.org/2000/svg', 'path'); svg.appendChild(path); note.prepend(svg);
  let frames = [], k = 0;
  const build = () => { const w = note.offsetWidth, h = note.offsetHeight; svg.setAttribute('viewBox', `0 0 ${w} ${h}`); frames = [0, 1, 2].map(() => roughRect(w, h)); path.setAttribute('d', frames[0]); };
  new ResizeObserver(build).observe(note); build();
  const id = setInterval(() => { if (!note.isConnected) return clearInterval(id); path.setAttribute('d', frames[k = (k + 1) % 3]); }, 150);
}
function token(x, y) { const t = document.createElement('div'); t.className = 'token'; t.setAttribute('aria-hidden', 'true'); t.innerHTML = scribble();
  if (x != null) { t.style.left = x + 'px'; t.style.top = y + 'px'; } document.body.appendChild(t); return t; }
// 扔走：纸条从手指松开的位置缩成一团乱线，接着往左飞出屏幕
async function away(note, dx) {
  const r = note.getBoundingClientRect(), x = r.left + r.width / 2, y = Math.max(70, Math.min(innerHeight - 90, r.top + Math.min(r.height, innerHeight) / 2));
  const from = `translateX(${dx}px) rotate(${(dx * 0.02).toFixed(2)}deg)`;
  const t = token(x, y);
  await Promise.all([
    gone(note, [{ transform: from, opacity: 1 }, { transform: `translateX(${dx - 40}px) scale(.25) rotate(-20deg)`, opacity: 0 }], { duration: 300, easing: 'ease-in' }),
    anim(t, [{ transform: C + ' scale(.4)', opacity: 0 }, { transform: C + ' scale(1)', opacity: 1 }], { duration: 240, delay: 100, fill: 'both' }),
  ]);
  await gone(t, [{ transform: C + ' rotate(0)' }, { transform: `${C} translate(${-(x + 140)}px,${(-60 + wob(60)).toFixed(0)}px) rotate(-420deg)` }], { duration: 420, easing: 'cubic-bezier(.3,.2,.7,.4)' });
  t.remove();
}
// 扔回来：一团乱线从左边扔过来，弹一下，再展开成纸条
async function back(note) {
  const t = token();
  const fly = anim(t, [{ transform: C + ' translate(-75vw,-18vh) rotate(500deg)' }, { offset: .8, transform: C + ' translateX(10px) rotate(-10deg)' }, { transform: C }], { duration: 650, easing: 'cubic-bezier(.2,.7,.35,1)', fill: 'both' });
  const open = anim(note, [{ transform: 'scale(.25) rotate(-12deg)', opacity: 0 }, { transform: 'none', opacity: 1 }], { duration: 360, delay: 710, easing: 'cubic-bezier(.3,1.4,.5,1)' });
  await fly; await gone(t, [{ opacity: 1 }, { opacity: 0 }], { duration: 200 }); t.remove(); await open;
}
GAFNote.start({ skin: 'doodle', swipe: true, decorate: outline,
  introLine: '我传你 10 张小纸条，写完往左一滑，就扔回给我了。<br>不想答的，点「不告诉你」就行。',
  out(note, kind, info) { return away(note, (info && info.dx) || 0); },
  in(note) { return back(note); },
});
})();
</script>
</body>
</html>
