<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#121a3d">
<meta name="robots" content="noindex,nofollow">
<title>小行星</title>
<style>
:root{
  color-scheme:dark;
  --bg:#121a3d;--ink:rgba(252,246,230,.93);--dim:rgba(252,246,230,.58);--faint:rgba(252,246,230,.28);
  --glass:rgba(22,30,72,.62);--line:rgba(255,236,200,.2);--warm:#f6d78b;--rose:#e0656a;
  --ease:cubic-bezier(.65,0,.15,1);
  --hand:"Kaiti SC","STKaiti","KaiTi","BiauKai","Songti SC","STSong",serif;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--ink)}
body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Noto Sans CJK SC","Microsoft YaHei",sans-serif;
  -webkit-font-smoothing:antialiased;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;touch-action:none}
canvas{display:block}
#sky{position:fixed;inset:0;width:100%;height:100%}

.glass{background:var(--glass);border:1px solid var(--line);-webkit-backdrop-filter:blur(16px) saturate(1.2);backdrop-filter:blur(16px) saturate(1.2);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.07),0 10px 36px rgba(4,6,24,.45)}
#hint{position:fixed;left:0;right:0;top:calc(env(safe-area-inset-top) + 24px);text-align:center;font-family:var(--hand);font-size:14px;letter-spacing:.4em;padding-left:.4em;
  color:var(--dim);pointer-events:none;opacity:0;transition:opacity 2s ease}
#hint.on{opacity:1}
#doneBtn{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 26px);transform:translateX(-50%);font:inherit;font-family:var(--hand);font-size:15px;letter-spacing:.36em;
  padding:11px 22px 11px 28px;border-radius:999px;color:var(--ink);opacity:0;pointer-events:none;transition:opacity 1.4s ease;cursor:pointer}
#doneBtn.on{pointer-events:auto;opacity:1}
#aboutBtn{position:fixed;top:calc(env(safe-area-inset-top) + 14px);right:calc(env(safe-area-inset-right) + 14px);z-index:12;width:38px;height:38px;border-radius:50%;
  font:inherit;font-family:var(--hand);font-size:18px;color:var(--ink);cursor:pointer;opacity:0;pointer-events:none;transition:opacity 1.4s ease}
#aboutBtn.on{opacity:1;pointer-events:auto}
.qlist{text-align:left;font-size:13px;line-height:1.75;margin:0 0 16px}
.qlist h3{font-family:var(--hand);font-weight:400;font-size:15px;color:var(--warm);margin:12px 0 2px;letter-spacing:.08em}
.qlist ol{margin:0;padding-left:1.7em}
body.flying #aboutBtn,body.flying #hint,body.flying #doneBtn,body.flying #pop{opacity:0!important;pointer-events:none!important}

/* 星球上的小卡片 */
#pop{position:fixed;left:0;top:0;z-index:15;width:236px;padding:15px 14px 13px;border-radius:18px;text-align:center;opacity:0;pointer-events:none;
  transform:translateY(6px);transition:opacity .35s ease,transform .35s ease}
#pop.show{opacity:1;pointer-events:auto;transform:none}
#pop p{margin:0 0 10px;font-family:var(--hand);font-size:15.5px;line-height:1.7;letter-spacing:.06em}
#pop p.s{font-family:inherit;font-size:11.5px;color:var(--dim);margin:-6px 0 11px;letter-spacing:.04em}
#pop .col{display:flex;flex-direction:column;gap:8px}

#viewer{position:fixed;inset:0;z-index:20;background:#000;opacity:0;visibility:hidden;transition:opacity .45s ease}
#viewer.open{opacity:1;visibility:visible}
#veil{position:absolute;inset:0;z-index:2;pointer-events:none;opacity:0}
#veil.on{animation:veil 1s ease-out both}
@keyframes veil{0%,25%{opacity:1}100%{opacity:0}}
#frame{position:absolute;left:0;top:0;width:100%;height:calc(100% - env(safe-area-inset-bottom) - 72px);border:0;background:transparent}
#bar{position:absolute;left:0;right:0;bottom:0;height:calc(env(safe-area-inset-bottom) + 72px);padding:10px 10px calc(env(safe-area-inset-bottom) + 12px);
  display:flex;align-items:center;justify-content:center;gap:7px;background:rgba(14,19,48,.9);border-top:1px solid rgba(255,236,200,.1)}
#bar button{font:inherit;font-size:13px;color:var(--ink);background:rgba(255,255,255,.05);border:1px solid rgba(255,236,200,.18);border-radius:999px;
  padding:11px 13px;cursor:pointer;white-space:nowrap;transition:background .3s,border-color .3s,color .3s,transform .2s}
#bar button:active{transform:scale(.96)}
#bar #back{padding:11px 14px;color:var(--dim)}
#bar .c.act{color:#1d1608;background:var(--warm);border-color:var(--warm)}
#bar .c[data-v=deny].act{color:#151530;background:#d6d2f2;border-color:#d6d2f2}
#bar .c[data-v=no].act{color:var(--ink);background:rgba(255,255,255,.2);border-color:rgba(255,255,255,.32)}

/* 口令、开场 */
.layer{position:fixed;inset:0;z-index:30;display:flex;align-items:center;justify-content:center;flex-direction:column;text-align:center;padding:0 30px;transition:opacity 1.8s ease}
.layer.gone{opacity:0;pointer-events:none}
#lock .t{font-family:var(--hand);font-size:17px;letter-spacing:.8em;padding-left:.8em;color:var(--warm);margin-bottom:40px}
#pw{width:min(240px,78vw);font:inherit;font-size:16px;letter-spacing:.24em;text-align:center;color:var(--ink);background:transparent;border:0;
  border-bottom:1px solid rgba(255,236,200,.3);padding:10px 4px;outline:none;-webkit-user-select:text;user-select:text;border-radius:0}
#pw::placeholder{color:var(--faint);letter-spacing:.4em}
#lockMsg{height:20px;margin-top:20px;font-size:12px;letter-spacing:.24em;color:var(--dim)}
.shake{animation:shake .45s}
@keyframes shake{20%{transform:translateX(-8px)}40%{transform:translateX(7px)}60%{transform:translateX(-4px)}80%{transform:translateX(2px)}}
#intro p{margin:0;font-family:var(--hand);font-size:18px;line-height:2.3;letter-spacing:.12em;opacity:0;filter:blur(6px);transform:translateY(6px);
  transition:opacity 2s ease,filter 2s ease,transform 2s ease;text-shadow:0 2px 14px rgba(6,8,30,.6)}
#intro p.on{opacity:1;filter:none;transform:none}
#intro p.s{font-family:inherit;font-size:12.5px;color:var(--dim);margin-top:1.6em;line-height:2.1}

/* 结束 */
#panel{position:fixed;inset:0;z-index:25;display:flex;align-items:center;justify-content:center;padding:22px;background:rgba(8,12,34,.5);
  -webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);opacity:0;pointer-events:none;transition:opacity .7s ease}
#panel.show{opacity:1;pointer-events:auto}
#panel .box{width:min(420px,100%);max-height:100%;overflow:auto;padding:28px 22px 24px;border-radius:24px;text-align:center;-webkit-overflow-scrolling:touch;touch-action:pan-y}
#panel h2{font-weight:400;font-family:var(--hand);font-size:19px;letter-spacing:.2em;margin:0 0 10px}
#panel .sub{font-size:12.5px;color:var(--dim);line-height:1.9;margin:0 0 18px}
#panel .big{font-family:var(--hand);font-size:17px;line-height:2;margin:0 0 6px}
#panel .big b{font-weight:500;color:var(--warm)}
.chips{display:flex;flex-wrap:wrap;justify-content:center;gap:12px;margin:4px 0 20px;min-height:30px}
.chip{position:relative;border:0;padding:0;background:transparent;cursor:pointer;width:64px;transition:transform .25s var(--ease)}
.chip img{width:64px;height:64px;display:block;transition:filter .3s,opacity .3s}
.chip.pick img{filter:drop-shadow(0 0 10px rgba(246,215,139,.85))}
.chip .tag{display:block;margin-top:4px;font-size:10.5px;letter-spacing:.06em;color:var(--dim);white-space:nowrap}
.chip.pick .tag{color:var(--warm)}
.dots{display:flex;justify-content:center;gap:4px;margin-top:4px}
.dots i{width:9px;height:9px;border-radius:50%;border:1px solid rgba(255,236,200,.4);display:block;cursor:pointer}
.dots i.f{background:var(--warm);border-color:var(--warm)}
.row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:6px}
.btn{font:inherit;font-size:13px;letter-spacing:.12em;color:var(--ink);background:rgba(255,255,255,.06);border:1px solid rgba(255,236,200,.2);border-radius:999px;padding:10px 18px;cursor:pointer}
.btn.pri{background:rgba(246,215,139,.16);border-color:rgba(246,215,139,.5);color:var(--warm)}
.btn.rose{background:rgba(224,101,106,.16);border-color:rgba(224,101,106,.55);color:#f6b3b0}
#out{width:100%;height:120px;font:inherit;font-size:12px;line-height:1.7;color:var(--ink);background:rgba(0,0,0,.25);border:1px solid rgba(255,236,200,.14);
  border-radius:12px;padding:10px;resize:none;-webkit-user-select:text;user-select:text}
</style>
</head>
<body>
<canvas id="sky"></canvas>
<div id="hint">拖 动 星 空 · 挑 一 颗 降 落</div>
<button id="doneBtn" class="glass" type="button">看 完 了</button>
<button id="aboutBtn" class="glass" type="button" aria-label="这些星球从哪里来">?</button>
<div id="pop" class="glass"></div>

<div id="viewer">
  <iframe id="frame" title="作品" sandbox="allow-scripts" allow="autoplay"></iframe>
  <div id="veil"></div>
  <div id="bar">
    <button id="back" type="button" aria-label="回到星空">←</button>
    <button class="c" data-v="me" type="button">Me！</button>
    <button class="c" data-v="deny" type="button">可以不承认是我吗？</button>
    <button class="c" data-v="no" type="button">不是我</button>
  </div>
</div>

<div id="panel"><div class="box glass" id="box"></div></div>

<div class="layer" id="lock">
  <div class="t">小 行 星</div>
  <input id="pw" type="password" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="口 令" enterkeyhint="go">
  <div id="lockMsg"></div>
</div>
<div class="layer gone" id="intro">
  <p>每一颗小星球上，都住着一个人。</p>
  <p>有的你认识，有的你没见过。</p>
  <p>有几颗，也许就是你。</p>
  <p class="s">拖动星空，挑一颗降落。<br>是你，就说 Me！</p>
</div>
<audio id="unmute" playsinline loop preload="auto"></audio>

<script>
(() => {
'use strict';
/* 后台：填上就会自动记录；留空则只显示一段可复制的结果 */
const ENDPOINT = 'https://chrxqhraickomolmvnap.supabase.co/rest/v1/responses';
const ANON_KEY = 'sb_publishable_Me2STWDSBkhxlGJWXPWBKQ_a9vgAQaI';   // 只能写入，读改删都被 RLS 挡住

const $ = (id) => document.getElementById(id);
const store = { get(k) { try { return JSON.parse(localStorage.getItem(k)); } catch (e) { return null; } },
                set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} } };
const clamp = (x, a, b) => Math.max(a, Math.min(b, x));
const lerp = (a, b, t) => a + (b - a) * t;
const sstep = (a, b, x) => { const t = clamp((x - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };
const easeOut = (t) => 1 - Math.pow(1 - t, 3);
const TAU = Math.PI * 2;
const SLOW = clamp(+new URLSearchParams(location.search).get('slow') || 1, 1, 20);   // 调试用：放慢降落动画
const KEY = ((location.hash.match(/k=([a-z]+)/) || location.hash.match(/^#([a-z]{6})$/) || [])[1] || '');
const STORE_KEY = 'gaf-mirror-v2' + (KEY ? '-' + KEY : '');   // 沿用旧键：朋友之前的记录还在
let W = innerWidth, H = innerHeight, DPR = Math.min(devicePixelRatio || 1, 2);
let works = [], owners = {}, planets = [], opened = null, paused = false, mine = null;
let rateMode = false, panelReturn = null;
let state = store.get(STORE_KEY) || { seen: {}, choice: {}, t0: 0 };
state.lit = state.lit || {}; state.rose = state.rose || {};
const anim = { lit: {}, rose: {} };   // 刚点亮、刚种下的动画起点
function save() { store.set(STORE_KEY, state); }

/* ================= 口令 ================= */
const pw = $('pw'), lockMsg = $('lockMsg');
const dataBuf = fetch('data.bin').then((r) => { if (!r.ok) throw 0; return r.arrayBuffer(); })
  .catch(() => fetch('data.txt').then((r) => r.text()).then((t) => Uint8Array.from(atob(t.trim()), (c) => c.charCodeAt(0)).buffer));
const ub64 = (s) => Uint8Array.from(atob(s), (c) => c.charCodeAt(0));
async function unseal(secret, salt, iv, ct, iterations) {
  const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(secret), 'PBKDF2', false, ['deriveKey']);
  const key = await crypto.subtle.deriveKey({ name: 'PBKDF2', salt, iterations, hash: 'SHA-256' }, base, { name: 'AES-GCM', length: 256 }, false, ['decrypt']);
  return JSON.parse(new TextDecoder().decode(await crypto.subtle.decrypt({ name: 'AES-GCM', iv }, key, ct)));
}
async function unlock() {
  const word = pw.value.trim(); if (!word) return;
  lockMsg.textContent = '星星在亮起来……';
  try {
    const b = new Uint8Array(await dataBuf);
    const box = await unseal(word, b.slice(0, 16), b.slice(16, 28), b.slice(28), 310000);
    works = box.works; owners = box.owners || {};
  } catch (e) {
    lockMsg.textContent = '不对，再试试';
    pw.classList.remove('shake'); void pw.offsetWidth; pw.classList.add('shake'); return;
  }
  pw.blur();
  if (!state.t0) state.t0 = Date.now();
  save();
  begin();
}
pw.addEventListener('keydown', (e) => { if (e.key === 'Enter') unlock(); });
pw.addEventListener('change', unlock);
setTimeout(() => pw.focus(), 300);

let planetsIn = 0, planetsT0 = 0;
function begin() {
  $('lock').classList.add('gone');
  const intro = $('intro'), ps = intro.querySelectorAll('p'), again = Object.keys(state.seen).length > 0;
  setTimeout(() => { intro.classList.remove('gone'); ps.forEach((p, i) => setTimeout(() => p.classList.add('on'), 700 + i * (again ? 380 : 1500))); }, 1300);
  const total = again ? 4400 : 9800;
  setTimeout(() => intro.classList.add('gone'), total);
  setTimeout(() => {
    buildPlanets(); planetsT0 = performance.now();
    setTimeout(() => { $('hint').classList.add('on'); $('aboutBtn').classList.add('on'); }, 1400);
    setTimeout(() => $('hint').classList.remove('on'), 9000);
    updateDone();
  }, total - 600);
}

/* ================= 颜色和随机 ================= */
function hashStr(s) { let h = 2166136261; for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); } return h >>> 0; }
function rng(seed) { let s = seed || 1; return () => { s ^= s << 13; s ^= s >>> 17; s ^= s << 5; return (s >>> 0) / 4294967296; }; }
const isHex = (h) => typeof h === 'string' && /^#[0-9a-f]{6}$/i.test(h);
function hex2rgb(h) { const n = parseInt(h.slice(1), 16); return [n >> 16 & 255, n >> 8 & 255, n & 255]; }
function mixHex(a, b, t) { const A = hex2rgb(a), B = hex2rgb(b); return '#' + A.map((v, i) => Math.round(v + (B[i] - v) * t).toString(16).padStart(2, '0')).join(''); }
function rgba(h, a) { const c = hex2rgb(h); return `rgba(${c[0]},${c[1]},${c[2]},${a})`; }
function hslHex(h, s, l) { s /= 100; l /= 100; const k = (n) => (n + h / 30) % 12, a = s * Math.min(l, 1 - l);
  const f = (n) => Math.round(255 * (l - a * Math.max(-1, Math.min(k(n) - 3, Math.min(9 - k(n), 1))))).toString(16).padStart(2, '0'); return '#' + f(0) + f(8) + f(4); }
const mk = (w, h) => { const c = document.createElement('canvas'); c.width = Math.max(1, Math.round(w)); c.height = Math.max(1, Math.round(h)); return c; };
const INK = '#2c2742';

/* ================= 星空背景 ================= */
const sky = $('sky'), ctx = sky.getContext('2d');
let skyBg = null, grain = null, stars = [], bookStars = [], shoot = null, nextShoot = 4;
(() => {
  const R = rng(20261015);
  for (let i = 0; i < 260; i++) stars.push({ x: R(), y: R(), r: .35 + R() * R() * 1.3, a: .35 + R() * .6, ph: R() * TAU, sp: .6 + R() * 2.2, f: .12 + R() * .2 });
  for (let i = 0; i < 22; i++) bookStars.push({ x: R(), y: R(), s: 2.6 + R() * 3.8, rot: R() * TAU, ph: R() * TAU, f: .3 + R() * .18 });
  grain = mk(180, 180); const g = grain.getContext('2d');
  for (let i = 0; i < 2600; i++) { g.fillStyle = R() < .5 ? 'rgba(255,248,230,.5)' : 'rgba(10,8,30,.6)'; g.fillRect(R() * 180, R() * 180, 1, 1); }
})();
let grainPat = null;
function paintSky() {
  const q = Math.min(DPR, 1.5);
  skyBg = mk(W * q, H * q); const x = skyBg.getContext('2d'); x.scale(q, q);
  let g = x.createLinearGradient(0, 0, W * .3, H);
  g.addColorStop(0, '#0e1636'); g.addColorStop(.45, '#1a2758'); g.addColorStop(1, '#2a3c70');
  x.fillStyle = g; x.fillRect(0, 0, W, H);
  const R = rng(77), washes = ['#2c3d7c', '#3a4b8c', '#1a2350', '#46407a', '#2b5577', '#5a4a7e'];
  for (let i = 0; i < 22; i++) {   // 水彩晕开的天
    const cx = R() * W, cy = R() * H, r = (.25 + R() * .5) * Math.max(W, H), c = washes[i % washes.length];
    g = x.createRadialGradient(cx, cy, 0, cx, cy, r);
    g.addColorStop(0, rgba(c, .26 + R() * .16)); g.addColorStop(.6, rgba(c, .1)); g.addColorStop(1, rgba(c, 0));
    x.fillStyle = g; x.fillRect(0, 0, W, H);
  }
  x.save(); x.translate(W * .5, H * .5); x.rotate(-.55);   // 一条很淡的银河
  for (let i = 0; i < 9; i++) {
    const oy = (R() - .5) * H * .12, r = Math.max(W, H) * (.25 + R() * .3), ox = (R() - .5) * Math.max(W, H) * .9;
    g = x.createRadialGradient(ox, oy, 0, ox, oy, r);
    g.addColorStop(0, 'rgba(220,214,255,.07)'); g.addColorStop(1, 'rgba(220,214,255,0)');
    x.fillStyle = g; x.save(); x.scale(1, .28); x.fillRect(-W * 2, -H * 4, W * 4, H * 8); x.restore();
  }
  for (let i = 0; i < W * H / 900; i++) { x.fillStyle = `rgba(240,236,255,${R() * .35})`; x.fillRect((R() - .5) * Math.max(W, H) * 1.6, (R() - .5) * H * .22 * (1 + R()), .8, .8); }
  x.restore();
  for (let i = 0; i < 26; i++) {   // 纸面上淡淡的水渍
    const cx = R() * W, cy = R() * H, r = 30 + R() * 120;
    x.strokeStyle = `rgba(200,210,255,${.012 + R() * .014})`; x.lineWidth = 1 + R() * 2;
    x.beginPath(); for (let k = 0; k <= 24; k++) { const a = k / 24 * TAU, rr = r * (1 + Math.sin(a * 3 + i) * .08); x.lineTo(cx + Math.cos(a) * rr, cy + Math.sin(a) * rr); } x.stroke();
  }
  grainPat = ctx.createPattern(grain, 'repeat');
}
function starPath(c, s) {
  c.beginPath();
  for (let i = 0; i < 10; i++) { const a = i / 10 * TAU - Math.PI / 2, r = i % 2 ? s * .42 : s * (1 + (i % 4 ? .05 : -.05)); c.lineTo(Math.cos(a) * r, Math.sin(a) * r); }
  c.closePath();
}

/* ================= 星球 ================= */
const SURF = ['smooth', 'crater', 'striped', 'stone', 'water', 'grid', 'dunes', 'cloud', 'crystal'];
const FEATS = ['volcano', 'baobab', 'grass', 'house', 'chair', 'well', 'stele', 'clock', 'ladder', 'signpost', 'cactus', 'mushroom', 'flag', 'bench', 'tower', 'kite'];
function paramsFor(w) {
  const R = rng(hashStr(w.c) ^ 0x51ed27), d = w.p || {}, hue = R() * 360;
  const fb = [hslHex(hue, 32, 64), hslHex(hue + 28, 38, 52), hslHex(hue + 170, 44, 72)];
  const colors = Array.isArray(d.colors) && d.colors.length === 3 && d.colors.every(isHex) ? d.colors : fb;
  const feats = (Array.isArray(d.features) ? d.features : []).filter((f) => FEATS.includes(f)).slice(0, 3);
  const P = {
    seed: hashStr(w.c), colors,
    surface: SURF.includes(d.surface) ? d.surface : SURF[R() * SURF.length | 0],
    shape: ['round', 'oblate', 'lumpy'].includes(d.shape) ? d.shape : 'round',
    size: clamp(+d.size || (.7 + R() * .6), .6, 1.4),
    spin: clamp(+d.spin || (.3 + R()), .15, 1.6) * (R() < .5 ? -1 : 1),
    features: feats, ring: !!d.ring, moons: clamp(d.moons | 0, 0, 2),
    glow: isHex(d.glow) ? d.glow : colors[2],
  };
  P.lump = [[2, .03 + R() * .04, R() * TAU], [3, .02 + R() * .04, R() * TAU], [5, .01 + R() * .025, R() * TAU]];
  const n = feats.length, base = R() * TAU, gap = TAU / Math.max(n, 1);
  P.fa = feats.map((_, i) => base + i * gap + (R() - .5) * .3);
  if (n === 0) { P.lampA = base; P.roseA = base + 1.9; }
  else if (n === 1) { P.lampA = base + 2.1; P.roseA = base - 2.1; }

/* ================= 摆星球 ================= */
let WW = 0, WH = 0, RB = 30;
const cam = { x: 0, y: 0, vx: 0, vy: 0 };
function buildPlanets() {
  RB = clamp(Math.min(W, H) * .088, 26, 50);
  WW = Math.max(W * 2.8, 1100); WH = Math.max(H * 2.1, 1400);
  const order = works.map((w) => w);
  for (let i = order.length - 1; i > 0; i--) { const j = Math.floor(crypto.getRandomValues(new Uint32Array(1))[0] / 4294967296 * (i + 1)); [order[i], order[j]] = [order[j], order[i]]; }
  planets = [];
  const wd = (a, b, m) => { const d = Math.abs(a - b) % m; return Math.min(d, m - d); };
  for (const w of order) {
    const P = paramsFor(w), r = RB * P.size;
    let best = null, bestD = -Infinity;
    for (let k = 0; k < 400; k++) {
      const x = Math.random() * WW, y = Math.random() * WH;
      let md = Infinity;
      for (const o of planets) md = Math.min(md, Math.hypot(wd(x, o.x, WW), wd(y, o.y, WH)) - (r + o.r) * 2.1);
      if (md > 34) { best = { x, y }; break; }
      if (md > bestD) { bestD = md; best = { x, y }; }
    }
    planets.push({ c: w.c, P, r, x: best.x, y: best.y, rot: Math.random() * TAU, spr: makeSprite(P, r, 1), sx: -999, sy: -999, rs: r });
  }
  cam.x = -W / 2 + WW / 2; cam.y = -H / 2 + WH / 2;
}
const wrapv = (v, m) => ((v % m) + m) % m;
function scr(p) { const m = Math.max(140, p.r * 3.4); return { x: wrapv(p.x - cam.x + m, WW) - m, y: wrapv(p.y - cam.y + m, WH) - m }; }

/* ================= 画一颗星球 ================= */
function drawPlanet(x, p, cx, cy, rs, t, now, alpha, still) {
  const P = p.P, sq = P.shape === 'oblate' ? .86 : 1, C = P.colors, k = rs / p.r;
  const seen = !!state.seen[p.c], litT = state.lit[p.c] ? (anim.lit[p.c] ? clamp((now - anim.lit[p.c]) / 1200, 0, 1) : 1) : 0;
  const roseG = state.rose[p.c] === 1 ? (anim.rose[p.c] ? clamp((now - anim.rose[p.c]) / 2600, 0, 1) : 1) : 0;
  x.save(); x.translate(cx, cy); x.globalAlpha = alpha;
  let g = x.createRadialGradient(0, 0, rs * .5, 0, 0, rs * 2);   // 光晕
  g.addColorStop(0, rgba(P.glow, .26)); g.addColorStop(1, rgba(P.glow, 0)); x.fillStyle = g; x.fillRect(-rs * 2, -rs * 2, rs * 4, rs * 4);
  if (litT > 0) { const R2 = rs * (2.8 + .15 * Math.sin(t * 1.7)); g = x.createRadialGradient(0, 0, rs * .6, 0, 0, R2);
    g.addColorStop(0, `rgba(255,220,140,${.42 * litT})`); g.addColorStop(1, 'rgba(255,220,140,0)'); x.fillStyle = g; x.fillRect(-R2, -R2, R2 * 2, R2 * 2); }
  if (seen && !still) {   // 来过的星球：一圈慢慢转的虚线
    x.save(); x.rotate(t * .12); x.setLineDash([rs * .09, rs * .14]); x.strokeStyle = litT > 0 ? `rgba(255,226,150,${.35 + .3 * litT})` : 'rgba(255,240,214,.42)';
    x.lineWidth = Math.max(1, rs * .028); x.beginPath(); x.arc(0, 0, rs * (P.ring ? P.ringR + .35 : 1.62), 0, TAU); x.stroke(); x.restore();
  }
  const moonPos = P.moonL.map((m) => { const a = m.a0 + t * m.sp; return { m, x: Math.cos(a) * m.d * rs, y: Math.sin(a) * m.d * rs * .34, back: Math.sin(a) < 0 }; });
  const moon = (o) => { x.beginPath(); x.arc(o.x, o.y, o.m.r * rs, 0, TAU); x.fillStyle = mixHex(C[2], '#f4f0e6', .45); x.fill(); x.strokeStyle = rgba(INK, .6); x.lineWidth = Math.max(.7, rs * .02); x.stroke(); };
  const ring = (front) => { x.save(); x.rotate(P.ringRot); x.lineCap = 'round';
    [[.11, .5, C[2]], [.04, .7, mixHex(C[2], '#ffffff', .4)]].forEach(([w, a, c]) => { x.strokeStyle = rgba(c, a); x.lineWidth = Math.max(1, rs * w);
      x.beginPath(); x.ellipse(0, 0, rs * P.ringR, rs * P.ringR * P.ringT, 0, front ? 0 : Math.PI, front ? Math.PI : TAU); x.stroke(); });
    x.restore(); };
  moonPos.filter((o) => o.back).forEach(moon);
  if (P.ring) ring(false);
  const S = p.spr, sz = S.cv.width / S.q * k;
  x.save(); x.scale(1, sq); x.rotate(p.rot); x.drawImage(S.cv, -sz / 2, -sz / 2, sz, sz); x.restore();
  x.save(); x.scale(1, sq); x.drawImage(SHADE, -rs, -rs, rs * 2, rs * 2); x.restore();
  const s = rs * FSCALE;
  const at = (a, f) => { const rr = radAt(P, rs, a); x.save(); x.scale(1, sq); x.rotate(p.rot + a); x.translate(0, -rr * .985); f(); x.restore(); };
  if (seen) at(P.lampA, () => drawLamp(x, s, litT, t));
  if (roseG > 0) at(P.roseA, () => drawRose(x, s, roseG, t));
  if (P.ring) ring(true);
  moonPos.filter((o) => !o.back).forEach(moon);
  x.restore();
}

/* ================= 一帧 ================= */
let fly = null, V = null;
function frameView() {
  if (!fly) return null;
  const k = fly.k, Z = Math.exp(Math.log(fly.zmax) * Math.pow(k, 2.1)), e = easeOut(Math.min(1, k * 1.3));
  return { Z, Fx: lerp(fly.f0.x, W / 2, e), Fy: lerp(fly.f0.y, H / 2, e), fx: fly.f0.x, fy: fly.f0.y,
    w: sstep(.06, .42, k) * (1 - sstep(.84, 1, k)) * fly.ws, cover: sstep(.76, 1, k) };
}
function draw(t, now, dt) {
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);

  V = frameView();
  const SW = W + 40, SH = H + 40;
  // 星星
  ctx.save(); if (V && V.w > .01) ctx.globalCompositeOperation = 'lighter';
  for (const s of stars) {

    const tw = .55 + .45 * Math.sin(t * s.sp + s.ph), a = s.a * tw;
    if (V) {

      if (V.w > .01) {
        const dx = x - V.Fx, dy = y - V.Fy, L = V.w * .55;
        ctx.strokeStyle = `rgba(214,226,255,${Math.min(1, a * (1 + V.w))})`; ctx.lineWidth = s.r * (1 + V.w);
        ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x - dx * L, y - dy * L); ctx.stroke(); continue;
      }
    }
    ctx.fillStyle = `rgba(250,246,230,${a})`; ctx.beginPath(); ctx.arc(x, y, s.r, 0, TAU); ctx.fill();
  }
  ctx.restore();
  if (!V || V.w < .3) for (const b of bookStars) {
    let x = wrapv(b.x * SW - cam.x * b.f, SW) - 20, y = wrapv(b.y * SH - cam.y * b.f, SH) - 20;
    if (V) { const z = Math.pow(V.Z, .4); x = V.Fx + (x - V.fx) * z; y = V.Fy + (y - V.fy) * z; }
    const tw = .7 + .3 * Math.sin(t * 1.3 + b.ph);
    ctx.save(); ctx.translate(x, y); ctx.rotate(b.rot + Math.sin(t * .4 + b.ph) * .1); ctx.globalAlpha = tw * (V ? 1 - V.w / .3 : 1);
    const g = ctx.createRadialGradient(0, 0, 0, 0, 0, b.s * 3); g.addColorStop(0, 'rgba(255,224,140,.35)'); g.addColorStop(1, 'rgba(255,224,140,0)');
    ctx.fillStyle = g; ctx.fillRect(-b.s * 3, -b.s * 3, b.s * 6, b.s * 6);
    starPath(ctx, b.s); ctx.fillStyle = '#f8dc8c'; ctx.fill(); ctx.strokeStyle = 'rgba(120,90,40,.5)'; ctx.lineWidth = .7; ctx.stroke(); ctx.restore();
  }
  // 流星
  if (!V) {
    nextShoot -= dt;
    if (nextShoot < 0 && !shoot) { shoot = { x: Math.random() * W * .8 + W * .2, y: Math.random() * H * .4, a: Math.PI * (.78 + Math.random() * .12), life: 0 }; nextShoot = 7 + Math.random() * 10; }
    if (shoot) { shoot.life += dt; const u = shoot.life / 1.1, L = 90, sx = shoot.x + Math.cos(shoot.a) * u * 420, sy = shoot.y + Math.sin(shoot.a) * u * 420;
      const g = ctx.createLinearGradient(sx, sy, sx - Math.cos(shoot.a) * L, sy - Math.sin(shoot.a) * L);
      g.addColorStop(0, `rgba(255,246,220,${.85 * (1 - u)})`); g.addColorStop(1, 'rgba(255,246,220,0)');
      ctx.strokeStyle = g; ctx.lineWidth = 1.4; ctx.beginPath(); ctx.moveTo(sx, sy); ctx.lineTo(sx - Math.cos(shoot.a) * L, sy - Math.sin(shoot.a) * L); ctx.stroke();

}

/* ================= 手指：拖是飞，点是降落 ================= */
let down = null, lastMoveT = 0;
addEventListener('pointerdown', (e) => {
  if (fly || opened || e.target.closest('#panel,#doneBtn,#aboutBtn,#lock,#viewer,#pop')) return;
  down = { x: e.clientX, y: e.clientY, moved: 0 }; cam.vx = cam.vy = 0; lastMoveT = performance.now();
});
addEventListener('pointermove', (e) => {
  if (!down) return;
  const dx = e.clientX - down.x, dy = e.clientY - down.y, now = performance.now(), dt = Math.max(8, now - lastMoveT) / 1000;
  down.moved += Math.hypot(dx, dy);
  cam.x -= dx; cam.y -= dy; cam.vx = lerp(cam.vx, -dx / dt, .35); cam.vy = lerp(cam.vy, -dy / dt, .35);
  if (down.moved > 10) hidePop();
  down.x = e.clientX; down.y = e.clientY; lastMoveT = now;
});
function release() {
  if (!down) return;
  const d = down; down = null;
  if (performance.now() - lastMoveT > 90) { cam.vx *= .2; cam.vy *= .2; }
  const sp = Math.hypot(cam.vx, cam.vy); if (sp > 2400) { cam.vx *= 2400 / sp; cam.vy *= 2400 / sp; }
  if (d.moved >= 10) return;
  const p = hitPlanet(d.x, d.y);
  if (!p) { hidePop(); return; }
  if (state.seen[p.c]) showPop(p.c, 'menu'); else openWork(p);
}
addEventListener('pointerup', release);
addEventListener('pointercancel', release);
addEventListener('wheel', (e) => { if (opened || fly) return; cam.x += e.deltaX; cam.y += e.deltaY; hidePop(); }, { passive: true });
function hitPlanet(x, y) {
  let best = null, bd = Infinity;
  for (const p of planets) { const d = Math.hypot(x - p.sx, y - p.sy), lim = Math.max(p.rs * 1.3, 26); if (d < lim && d < bd) { bd = d; best = p; } }
  return best;
}

/* ================= 小卡片：点灯、种玫瑰 ================= */
const popEl = $('pop'); let pop = null;

function hidePop() { pop = null; popEl.classList.remove('show'); }
function renderPop() {
  const c = pop.c, lit = !!state.lit[c], rose = state.rose[c];
  let h = '';

    if (!lit) h = `<p>这颗星球的灯，还没亮。</p><div class="row"><button class="btn pri" data-a="lit" type="button">点亮它</button><button class="btn" data-a="close" type="button">先不</button></div>`;
    else if (rose === undefined) h = `<p>要在这里，留下一朵玫瑰吗？</p><p class="s">它会一直长在这颗星球上。</p><div class="row"><button class="btn rose" data-a="rose" type="button">留下一朵</button><button class="btn" data-a="norose" type="button">不留</button></div>`;
    else { hidePop(); return false; }
  } else {
    h = `<div class="col"><button class="btn pri" data-a="land" type="button">再降落一次</button>${lit ? '' : '<button class="btn" data-a="lit" type="button">点亮它的灯</button>'}${rose === 1 ? '<button class="btn" data-a="unrose" type="button">收回玫瑰</button>' : '<button class="btn rose" data-a="rose" type="button">留下一朵玫瑰</button>'}</div>`;

}
popEl.addEventListener('click', (e) => {
  const b = e.target.closest('button'); if (!b || !pop) return;
  const c = pop.c, a = b.dataset.a, now = performance.now();
  if (a === 'lit') { state.lit[c] = Date.now(); anim.lit[c] = now; save();
    if (pop.kind === 'after') { popEl.classList.remove('show'); setTimeout(() => { if (pop && pop.c === c && renderPop()) popEl.classList.add('show'); }, 1300); } else renderPop(); }
  else if (a === 'rose') { state.rose[c] = 1; anim.rose[c] = now; save(); hidePop(); }
  else if (a === 'norose' || a === 'unrose') { state.rose[c] = 0; save(); hidePop(); }

  else hidePop();

/* ================= 降落 / 起飞 ================= */
const viewer = $('viewer'), frame = $('frame'), unmute = $('unmute');
// 很短的无声音频：让 iPhone 在静音开关打开时也能放出作品里的声音
unmute.src = 'data:audio/wav;base64,UklGRiQAAABXQVZFZm10IBAAAAABAAEARKwAAIhYAQACABAAZGF0YQAAAAA=';

  try { if (navigator.audioSession) navigator.audioSession.type = 'playback'; } catch (e) {}
  try { const p = unmute.play(); if (p && p.catch) p.catch(() => {}); } catch (e) {}
}
function makeRays() {
  return Array.from({ length: 150 }, () => ({ a: Math.random() * TAU, d: Math.pow(Math.random(), .6), len: .04 + Math.random() * .22, o: .3 + Math.random() * .7, wd: .6 + Math.random() * 1.6 }));
}

  let s = scr(p);
  if (s.x < 0 || s.x > W || s.y < 0 || s.y > H) { cam.x = p.x - W / 2; cam.y = p.y - H / 2; s = scr(p); }
  cam.vx = cam.vy = 0;
  fly = { p, w, dir: 1, t0: performance.now(), dur: 1350 * SLOW, f0: s, zmax: Math.max(W, H) / p.r * 1.35, rays: makeRays(), k: 0, ws: 1, loaded: false, done: false };

let pauseTimer = 0;

  viewer.style.background = C[0]; veil.style.background = C[0];

}

  viewer.classList.remove('open');

    fly = { p, dir: -1, t0: performance.now(), dur: 1050 * SLOW, f0: scr(p), zmax: Math.max(W, H) / p.r * 1.35, rays: makeRays(), k: 1, ws: .55, done: false };

}

function chipsHTML(list, tagFn) { return list.map((c) => `<button class="chip" data-c="${c}" type="button"><img alt="" src="${thumb(c)}"><span class="tag">${tagFn ? tagFn(c) : ''}</span></button>`).join(''); }
function showPanel(html) { hidePop(); boxEl.innerHTML = html; panel.classList.add('show'); }
function hidePanel() { panel.classList.remove('show'); }
doneBtn.addEventListener('click', stepPick);
$('aboutBtn').addEventListener('click', () => {
  showPanel(`<h2>这些星球从哪里来</h2>
    <p class="sub">每位朋友回答了下面 10 个问题，不想答的可以只回一个 👽。<br>每颗星球只用了同一位朋友的一部分回答：只用 A、B、C 其中一组，或者两组、三组，一共 7 种组合。<br>哪颗星球用了哪些，这里先不说。</p>
    <div class="qlist">
      <h3>A 组</h3><ol start="1"><li>你的出生日期，年月日和时辰</li><li>你的真名</li><li>你的出生地</li></ol>
      <h3>B 组</h3><ol start="4"><li>微信 combo：头像、朋友圈背景（或 IG 头像和置顶），加个性签名</li><li>你的"人生作品"：电影、书、戏剧、音乐、游戏、综艺都行，可以不止一个，也可以没有</li><li>你的 comfort food：不知道吃什么的时候就吃它</li><li>你的 comfort 衣服：不知道穿什么的时候就穿它</li></ol>
      <h3>C 组</h3><ol start="8"><li>解锁手机后看到的第一屏截图</li><li>随便发一句话，什么都行，不一定连贯、有逻辑</li><li>从 1 到 100 里随机选一个数字</li></ol>
    </div>
    <div class="row"><button class="btn pri" id="pBack" type="button">知道了</button></div>`);
  $('pBack').onclick = hidePanel;
});
function stepPick() {
  const cand = Object.keys(state.choice).filter((c) => state.choice[c] !== 'no');
  if (!cand.length) {
    showPanel(`<h2>还没有说过 Me！</h2><p class="sub">降落到一颗星球上，觉得是你，就按 Me！<br>觉得是你但不想承认，也可以按中间那个。</p>
      <div class="row"><button class="btn" id="pBack" type="button">再看看</button><button class="btn" id="pSkip" type="button">我都不像</button></div>`);
    $('pBack').onclick = hidePanel; $('pSkip').onclick = () => { state.best = null; save(); stepReveal(); }; return;
  }
  showPanel(`<h2>哪一颗最像你？</h2><p class="sub">在你说过 Me！ 和"可以不承认"的星球里，挑一颗最像你的。</p>
    <div class="chips" id="cc">${chipsHTML(cand, (c) => state.choice[c] === 'me' ? 'Me！' : '不承认')}</div>
    <div class="row"><button class="btn" id="pBack" type="button">再看看</button><button class="btn pri" id="pGo" type="button">就它了</button></div>`);
  let pick = state.best && cand.includes(state.best) ? state.best : null;
  const mark = () => boxEl.querySelectorAll('#cc .chip').forEach((el) => el.classList.toggle('pick', el.dataset.c === pick));
  boxEl.querySelectorAll('#cc .chip').forEach((el) => (el.onclick = () => { pick = el.dataset.c; mark(); }));
  mark();
  $('pBack').onclick = hidePanel;
  $('pGo').onclick = () => { if (!pick) return; state.best = pick; save(); stepReveal(); };
}
async function ownList() {
  if (!KEY) return null;
  const hex = Array.from(new Uint8Array(await crypto.subtle.digest('SHA-256', new TextEncoder().encode(KEY))), (b) => b.toString(16).padStart(2, '0')).join('').slice(0, 16);
  const o = owners[hex]; if (!o) return null;
  try { return await unseal(KEY, ub64(o.s), ub64(o.i), ub64(o.d), 100000); } catch (e) { return null; }
}
async function stepReveal() {
  showPanel(`<p class="sub" style="margin:20px 0">星星在想……</p>`);
  mine = await ownList();
  if (!mine) { stepSubmit(); return; }
  const own = new Set(mine.items.map((x) => x.c));
  const said = (v) => Object.keys(state.choice).filter((c) => state.choice[c] === v);
  const me = said('me'), deny = said('deny'), no = said('no');
  const hitN = (arr) => arr.filter((c) => own.has(c)).length;
  const bestLine = state.best ? (own.has(state.best) ? '你挑的最像你的那一颗，<b>真的是你</b>。' : '你挑的最像你的那一颗，<b>其实不是你</b>。') : '';
  showPanel(`<h2>这片星空里，有 ${own.size} 颗是你</h2>
    ${bestLine ? `<p class="big">${bestLine}</p>` : ''}
    <p class="sub">你说 Me！ 的 ${me.length} 颗里，${hitN(me)} 颗是你。<br>你说"可以不承认"的 ${deny.length} 颗里，${hitN(deny)} 颗是你。<br>你说"不是我"的 ${no.length} 颗里，${hitN(no)} 颗其实是你。</p>
    <div class="row"><button class="btn pri" id="pRate" type="button">看看哪些是我</button></div>`);
  $('pRate').onclick = stepRate;
}
function stepRate() {
  state.rate = state.rate || {};
  const list = mine.items.map((x) => x.c);
  const render = () => {
    showPanel(`<h2>这些，都是你</h2><p class="sub">点一颗可以再去一次。<br>每一颗下面点圆点打分：越像你，点得越多。</p>
      <div class="chips" id="rc">${list.map((c) => `<div><button class="chip" data-c="${c}" type="button"><img alt="" src="${thumb(c)}"></button>
        <div class="dots" data-c="${c}">${[1, 2, 3, 4, 5].map((n) => `<i data-n="${n}" class="${(state.rate[c] || 0) >= n ? 'f' : ''}"></i>`).join('')}</div></div>`).join('')}</div>
      <div class="row"><button class="btn pri" id="pSend" type="button">打完了</button></div>`);
    boxEl.querySelectorAll('#rc .chip').forEach((el) => (el.onclick = () => {
      const p = planets.find((x) => x.c === el.dataset.c); if (!p) return;
      hidePanel(); rateMode = true; panelReturn = () => { rateMode = false; render(); };
      openWork(p);
    }));
    boxEl.querySelectorAll('.dots i').forEach((el) => (el.onclick = () => { state.rate[el.parentNode.dataset.c] = +el.dataset.n; save(); render(); }));
    $('pSend').onclick = stepSubmit;
  };
  render();
}
async function stepSubmit() {
  const roses = Object.keys(state.rose).filter((c) => state.rose[c] === 1), noRose = Object.keys(state.rose).filter((c) => state.rose[c] === 0);
  const payload = { key: KEY || null, who: mine ? mine.p : null, best: state.best || null, choice: state.choice, rate: state.rate || {},
    lit: Object.keys(state.lit), rose: roses, noRose, seen: Object.keys(state.seen), minutes: Math.round((Date.now() - state.t0) / 60000), ua: navigator.userAgent.slice(0, 120) };
  let ok = false;
  if (ENDPOINT && ANON_KEY) {
    try {
      // 新版 sb_publishable_ 密钥不是 JWT，只放 apikey；旧版 anon JWT 两个头都要
      const hd = { 'Content-Type': 'application/json', apikey: ANON_KEY, Prefer: 'return=minimal' };
      if (!ANON_KEY.startsWith('sb_')) hd.Authorization = 'Bearer ' + ANON_KEY;
      const r = await fetch(ENDPOINT, { method: 'POST', headers: hd, body: JSON.stringify({ payload }) });
      ok = r.ok;
    } catch (e) { ok = false; }
  }
  const text = 'GetAFeel · 星球\n' + JSON.stringify({ k: payload.key, best: payload.best, choice: payload.choice, rate: payload.rate, lit: payload.lit, rose: roses, seen: payload.seen.length, min: payload.minutes });
  showPanel(ok
    ? `<h2>收到了，谢谢你</h2><p class="sub">你的选择已经记下来了。<br>星星还在，想再看可以随时回来。</p><div class="row"><button class="btn" id="pBack" type="button">回到星空</button></div>`
    : `<h2>谢谢你</h2><p class="sub">把下面这段发给邀请你的人。</p><textarea id="out" readonly>${text.replace(/</g, '&lt;')}</textarea>
       <div class="row"><button class="btn pri" id="pCopy" type="button">复制</button>${navigator.share ? '<button class="btn" id="pShare" type="button">发送</button>' : ''}<button class="btn" id="pBack" type="button">回到星空</button></div>`);
  $('pBack').onclick = hidePanel;
  if (!ok) {
    $('pCopy').onclick = async () => { const t = $('out'); try { await navigator.clipboard.writeText(t.value); } catch (e) { t.focus(); t.select(); document.execCommand('copy'); } $('pCopy').textContent = '已复制'; };
    if ($('pShare')) $('pShare').onclick = () => navigator.share({ text }).catch(() => {});
  }
}

/* ================= 尺寸与循环 ================= */
function resize() {
  const oldW = W, oldH = H;
  W = innerWidth; H = innerHeight; DPR = Math.min(devicePixelRatio || 1, 2);
  sky.width = Math.round(W * DPR); sky.height = Math.round(H * DPR);
  paintSky();
  if (planets.length && (Math.abs(W - oldW) > 80 || Math.abs(H - oldH) > 160)) { cam.x += (oldW - W) / 2; cam.y += (oldH - H) / 2; }
}
let rt = 0; addEventListener('resize', () => { clearTimeout(rt); rt = setTimeout(resize, 150); });
resize();
const T0 = performance.now(); let last = T0;
function loop(now) {
  if (paused) return;
  const dt = Math.min(.05, Math.max(0, (now - last) / 1000)); last = now;
  const t = Math.max(0, (now - T0) / 1000);
  if (!down && !fly) {   // 松手后的惯性，然后慢慢漂
    cam.vx *= Math.pow(.94, dt * 60); cam.vy *= Math.pow(.94, dt * 60);
    const drift = pop ? 0 : 1;
    cam.x += (cam.vx + 7 * drift) * dt; cam.y += (cam.vy + 3 * drift) * dt;
  }
  if (fly) {
    const u = clamp((now - fly.t0) / fly.dur, 0, 1);
    if (fly.dir > 0) {
      if (!fly.done) {
        fly.k = u;
        if (u >= 1) landed();
      }
    } else {
      fly.k = 1 - u;
      if (u >= 1) { const p = fly.p; draw(t, now, dt); returned(p); requestAnimationFrame(loop); return; }
    }
  }
  draw(t, now, dt);
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
document.addEventListener('visibilitychange', () => { last = performance.now(); });
})();
</script>
