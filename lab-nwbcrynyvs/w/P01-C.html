<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#eef0f6">
<title>随便</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; height: 100%; overflow: hidden;
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    -webkit-user-select: none; user-select: none;
    touch-action: manipulation;
    background: #eef0f6;
  }
  #stage { position: fixed; inset: 0; cursor: pointer; }

  /* 壁纸：很淡的白、雾蓝、薰衣草、一点粉 */
  .bg { position: absolute; inset: -10%; pointer-events: none; }
  .bg.day {
    background:
      radial-gradient(60% 40% at 20% 8%, #f7f7fa 0%, rgba(247,247,250,0) 70%),
      radial-gradient(55% 35% at 85% 30%, #dfe6f6 0%, rgba(223,230,246,0) 70%),
      radial-gradient(50% 30% at 15% 52%, #e9e2f1 0%, rgba(233,226,241,0) 70%),
      radial-gradient(60% 35% at 80% 70%, #f2dfe8 0%, rgba(242,223,232,0) 70%),
      radial-gradient(70% 30% at 30% 98%, #c9cde0 0%, rgba(201,205,224,0) 70%),
      linear-gradient(180deg, #f3f3f6 0%, #e8eaf3 45%, #ece3ee 75%, #d9dbe8 100%);
    animation: drift 26s ease-in-out infinite alternate;
  }
  .bg.night {
    background:
      radial-gradient(55% 35% at 80% 25%, #34385a 0%, rgba(52,56,90,0) 70%),
      radial-gradient(60% 35% at 20% 65%, #3a3150 0%, rgba(58,49,80,0) 70%),
      linear-gradient(180deg, #1c1e2c 0%, #23253a 50%, #2a2538 100%);
    opacity: 0; transition: opacity 3.2s ease;
    animation: drift 30s ease-in-out infinite alternate;
  }
  body.isNight .bg.night { opacity: 1; }
  @keyframes drift {
    from { transform: translate3d(0,0,0) scale(1); }
    to   { transform: translate3d(-2%,1.5%,0) scale(1.04); }
  }

  .ring {
    position: absolute; left: 0; top: 0;
    will-change: transform;
    transition: transform .78s cubic-bezier(.25,.9,.3,1), opacity .5s ease;
    pointer-events: none;
  }
  .ring svg { display: block; width: 100%; height: 100%; overflow: visible; }
  .ring .face { fill: rgba(255,255,255,.55); transition: fill 3s ease; }
  .ring .track { fill: none; stroke: rgba(60,60,80,.10); transition: stroke 3s ease; }
  .ring .fill {
    fill: none; stroke: #4cc764; stroke-linecap: round;
    transition: stroke-dashoffset .95s cubic-bezier(.3,.7,.2,1), stroke 3s ease, opacity 3s ease;
  }
  body.isNight .ring .face { fill: rgba(255,255,255,.06); }
  body.isNight .ring .track { stroke: rgba(255,255,255,.06); }
  body.isNight .ring .fill { stroke: #3fae58; opacity: .85; }

  .ring.drop { animation: drop .32s cubic-bezier(.3,1.5,.5,1); }
  @keyframes drop { from { scale: .4; opacity: 0; } to { scale: 1; opacity: 1; } }
  .ring.settle { animation: settle .42s ease-out; }
  @keyframes settle { 0% { scale: 1; } 40% { scale: 1.07; } 100% { scale: 1; } }
  .ring.nope { animation: nope .4s ease; }
  @keyframes nope {
    0%,100% { translate: 0 0; } 20% { translate: -4px 0; } 40% { translate: 4px 0; }
    60% { translate: -3px 0; } 80% { translate: 2px 0; }
  }
  .ring.wave { animation: wave .7s ease; }
  @keyframes wave { 0%,100% { scale: 1; } 45% { scale: 1.1; } }

  .badge {
    position: absolute; right: 2%; top: 2%;
    width: 24%; height: 24%; border-radius: 50%;
    background: #ff3b30;
    box-shadow: 0 0 0 2px rgba(255,255,255,.75);
    transform: scale(0); transition: transform .35s cubic-bezier(.3,1.6,.5,1), opacity 3s ease, box-shadow 3s ease;
  }
  .badge.on { transform: scale(1); }
  body.isNight .badge { opacity: .7; box-shadow: 0 0 0 2px rgba(30,30,50,.6); }

  #caption {
    position: absolute; left: 0; right: 0; text-align: center;
    font-size: 15px; letter-spacing: .14em; color: #6f7080;
    transition: opacity .45s ease, color 3s ease;
    pointer-events: none; padding: 0 24px;
  }
  body.isNight #caption { color: #b9bbd0; }

  #again {
    position: absolute; left: 50%; transform: translateX(-50%);
    bottom: calc(34px + env(safe-area-inset-bottom));
    font: inherit; font-size: 13px; letter-spacing: .2em;
    color: #8e90a8; background: rgba(255,255,255,.06);
    border: 1px solid rgba(255,255,255,.14); border-radius: 999px;
    padding: 9px 22px; opacity: 0; pointer-events: none;
    transition: opacity 1.2s ease; cursor: pointer;
  }
  #again.show { opacity: 1; pointer-events: auto; }

  #snd {
    position: absolute; top: calc(14px + env(safe-area-inset-top)); right: 14px;
    width: 38px; height: 38px; border: 0; background: transparent; padding: 9px;
    opacity: .35; cursor: pointer; transition: opacity .3s;
  }
  #snd:hover { opacity: .6; }
  #snd svg { width: 100%; height: 100%; }
  #snd path { stroke: #555766; fill: none; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; transition: stroke 3s; }
  body.isNight #snd path { stroke: #c0c2d8; }
  #snd .waves { transition: opacity .2s; }
  #snd.off .waves { opacity: 0; }
  #snd .x { opacity: 0; }
  #snd.off .x { opacity: 1; }
</style>
</head>
<body>
<div id="stage">
  <div class="bg day"></div>
  <div class="bg night"></div>
  <div id="caption"></div>
</div>
<button id="snd" aria-label="声音">
  <svg viewBox="0 0 20 20">
    <path d="M3 8 h3 l4 -3.5 v11 l-4 -3.5 h-3 z"/>
    <path class="waves" d="M13 7.5 q1.6 2.5 0 5"/>
    <path class="waves" d="M15.3 5.5 q3 4.5 0 9"/>
    <path class="x" d="M13.5 8 l4 4 M17.5 8 l-4 4"/>
  </svg>
</button>
<button id="again">再来</button>

<script>
(() => {
  const COLS = 4, ROWS = 4, TOTAL = COLS * ROWS;
  const BADGED = new Set([5, 11]);           // 有两个红点，留着
  const stage = document.getElementById('stage');
  const cap = document.getElementById('caption');
  const again = document.getElementById('again');
  const sndBtn = document.getElementById('snd');

  let geo = {};
  let rings = [];        // {el, slot, badge}
  let placed = 0;
  let settled = 0;
  let done = false;
  let capTimer = null;
  let soundOn = true;

  // ---------- 几何 ----------
  function layout() {
    const W = innerWidth, H = innerHeight;
    const gridW = Math.min(W * 0.84, H * 0.56, 400);
    const cell = gridW / COLS;
    const size = cell * 0.74;
    const left = (W - gridW) / 2;
    const top = Math.max(56, (H - gridW) / 2 - H * 0.07);
    geo = { cell, size, left, top, gridW };
    cap.style.top = (top + gridW + Math.max(26, H * 0.05)) + 'px';
    rings.forEach(r => {
      r.el.style.width = r.el.style.height = size + 'px';
      if (r.home) moveTo(r.el, slotXY(r.slot), true);
    });
  }
  function slotXY(i) {
    const c = i % COLS, r = Math.floor(i / COLS);
    return { x: geo.left + geo.cell * (c + .5), y: geo.top + geo.cell * (r + .5) };
  }
  function moveTo(el, p, instant) {
    if (instant) el.style.transition = 'none';
    el.style.transform = `translate(${p.x - geo.size / 2}px, ${p.y - geo.size / 2}px)`;
    if (instant) { el.offsetWidth; el.style.transition = ''; }
  }

  // ---------- 声音：每放好一个，往上走一级 ----------
  let ac = null;
  const SCALE = [0, 2, 4, 5, 7, 9, 11];
  function audio() {
    if (!ac) {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (AC) ac = new AC();
    }
    if (ac && ac.state === 'suspended') ac.resume();
    return ac;
  }
  function noteFreq(step) {
    const oct = Math.floor(step / 7), deg = step % 7;
    return 523.25 * Math.pow(2, (SCALE[deg] + 12 * oct) / 12) / 2; // 从中音 do 起
  }
  function tone(freq, when = 0, dur = .5, vol = .07, type = 'sine') {
    if (!soundOn) return;
    const a = audio(); if (!a) return;
    const t = a.currentTime + when;
    const o = a.createOscillator(), g = a.createGain();
    o.type = type; o.frequency.value = freq;
    g.gain.setValueAtTime(0, t);
    g.gain.linearRampToValueAtTime(vol, t + .012);
    g.gain.exponentialRampToValueAtTime(.0001, t + dur);
    o.connect(g); g.connect(a.destination);
    o.start(t); o.stop(t + dur + .05);
    // 一点点泛音，像木头
    const o2 = a.createOscillator(), g2 = a.createGain();
    o2.type = 'sine'; o2.frequency.value = freq * 2;
    g2.gain.setValueAtTime(0, t);
    g2.gain.linearRampToValueAtTime(vol * .25, t + .008);
    g2.gain.exponentialRampToValueAtTime(.0001, t + dur * .4);
    o2.connect(g2); g2.connect(a.destination);
    o2.start(t); o2.stop(t + dur);
  }
  function thud() { tone(140, 0, .18, .05, 'triangle'); }

  sndBtn.addEventListener('pointerdown', e => e.stopPropagation());
  sndBtn.addEventListener('click', e => {
    e.stopPropagation();
    soundOn = !soundOn;
    sndBtn.classList.toggle('off', !soundOn);
    if (soundOn) audio();
  });

  // ---------- 文字 ----------
  function say(text, hold) {
    clearTimeout(capTimer);
    cap.style.opacity = 0;
    capTimer = setTimeout(() => {
      cap.textContent = text;
      cap.style.opacity = text ? 1 : 0;
      if (hold) capTimer = setTimeout(() => { cap.style.opacity = 0; }, hold);
    }, cap.textContent ? 380 : 0);
  }

  // ---------- 圈 ----------
  function makeRing(slot) {
    const el = document.createElement('div');
    el.className = 'ring drop';
    el.style.width = el.style.height = geo.size + 'px';
    const R = 40, C = 2 * Math.PI * R;
    const start = .18 + Math.random() * .55;   // 来的时候电量随便
    el.innerHTML = `
      <svg viewBox="0 0 100 100">
        <circle class="face" cx="50" cy="50" r="${R}"/>
        <circle class="track" cx="50" cy="50" r="${R}" stroke-width="9"/>
        <circle class="fill" cx="50" cy="50" r="${R}" stroke-width="9"
          transform="rotate(-90 50 50)"
          stroke-dasharray="${C}" stroke-dashoffset="${C * (1 - start)}"/>
      </svg>
      <div class="badge"></div>`;
    stage.appendChild(el);
    return { el, slot, badge: BADGED.has(slot), home: false, C };
  }

  function hitRing(x, y) {
    for (const r of rings) {
      if (!r.home) continue;
      const p = slotXY(r.slot);
      if (Math.hypot(p.x - x, p.y - y) < geo.size / 2) return r;
    }
    return null;
  }

  function onTap(x, y) {
    audio();
    if (done) { thud(); return; }
    if (placed >= TOTAL) { say('满了。', 1400); thud(); return; }

    const hit = hitRing(x, y);
    if (hit && hit.badge) {
      hit.el.classList.remove('nope'); hit.el.offsetWidth; hit.el.classList.add('nope');
      thud();
      say('先放着吧。', 1600);
      return;
    }

    const slot = placed++;
    const r = makeRing(slot);
    rings.push(r);
    moveTo(r.el, { x, y }, true);

    if (slot === 0) say('');

    setTimeout(() => {
      r.el.classList.remove('drop');
      moveTo(r.el, slotXY(slot));
      r.home = true;
      r.el.querySelector('.fill').style.strokeDashoffset = 0;
    }, 260);

    setTimeout(() => {
      r.el.classList.add('settle');
      tone(noteFreq(slot), 0, .55);
      if (r.badge) setTimeout(() => r.el.querySelector('.badge').classList.add('on'), 220);
      settled++;
      after(slot);
    }, 260 + 760);
  }

  function after(slot) {
    if (slot === 2) say('点哪儿都一样。', 2400);
    else if (slot === 5) say('有红点。不急。', 2400);
    else if (slot === 10) say('还差一点。', 2000);
    else if (slot === TOTAL - 1) finish();
  }

  function finish() {
    done = true;
    setTimeout(() => {
      say('刚好。');
      // 一圈一圈亮过去
      rings.slice().sort((a, b) => a.slot - b.slot).forEach((r, i) => {
        setTimeout(() => {
          r.el.classList.remove('settle', 'wave'); r.el.offsetWidth;
          r.el.classList.add('wave');
        }, i * 70);
      });
      [0, 2, 4, 7].forEach((s, i) => tone(noteFreq(s + 7), .05 * i + .2, 2.2, .045));
    }, 450);
    setTimeout(() => { document.body.classList.add('isNight'); }, 2600);
    setTimeout(() => { say('晚安。'); tone(noteFreq(0), 0, 2.6, .05); tone(noteFreq(4), .02, 2.6, .03); }, 4600);
    setTimeout(() => { again.classList.add('show'); }, 7600);
  }

  function reset() {
    again.classList.remove('show');
    say('');
    rings.forEach((r, i) => {
      setTimeout(() => { r.el.style.opacity = 0; }, i * 25);
      setTimeout(() => r.el.remove(), 900);
    });
    rings = []; placed = 0; settled = 0;
    document.body.classList.remove('isNight');
    setTimeout(() => { done = false; say('随便点。'); }, 1400);
  }

  again.addEventListener('pointerdown', e => e.stopPropagation());
  again.addEventListener('click', e => { e.stopPropagation(); reset(); });

  stage.addEventListener('pointerdown', e => {
    if (e.button !== undefined && e.button > 0) return;
    e.preventDefault();
    onTap(e.clientX, e.clientY);
  });
  document.addEventListener('gesturestart', e => e.preventDefault());
  addEventListener('resize', layout);

  layout();
  cap.textContent = '';
  setTimeout(() => say('随便点。'), 500);
})();
</script>
</body>
</html>
