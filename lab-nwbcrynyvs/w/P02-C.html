<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#24345f">
<title>顺路</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;overflow:hidden;background:#24345f}
  body{font-family:-apple-system,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;color:#fff;
    -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;touch-action:none}
  #bg{position:fixed;inset:0;width:100%;height:100%;display:block}
  #app{position:fixed;top:0;bottom:0;left:50%;width:100%;max-width:460px;transform:translateX(-50%);overflow:hidden}

  /* 黄条 */
  #ribbon{position:absolute;top:0;bottom:0;left:50%;width:46%;transform:translateX(-50%);overflow:hidden;
    background:
      repeating-linear-gradient(90deg,rgba(255,255,255,.05) 0 1px,transparent 1px 3px),
      repeating-linear-gradient(0deg,rgba(120,70,0,.035) 0 1px,transparent 1px 4px),
      linear-gradient(90deg,#e9a91f 0%,#f4bd33 9%,#f7c63d 50%,#f3bb30 91%,#e3a01b 100%);
    box-shadow:0 0 0 1px rgba(150,90,0,.25),0 0 28px rgba(0,0,0,.35)}
  #ribbon:before,#ribbon:after{content:"";position:absolute;top:0;bottom:0;width:6px;z-index:3;pointer-events:none}
  #ribbon:before{left:0;background:linear-gradient(90deg,rgba(110,60,0,.25),transparent)}
  #ribbon:after{right:0;background:linear-gradient(-90deg,rgba(110,60,0,.25),transparent)}
  #layer{position:absolute;left:0;top:0;width:100%;will-change:transform}
  #route{position:absolute;left:0;top:0;overflow:visible}

  .gl{color:transparent;
    background:
      radial-gradient(circle,rgba(255,250,220,.95) 0 .6px,transparent 1.1px) 0 0/6px 7px,
      radial-gradient(circle,rgba(255,215,120,.9) 0 .7px,transparent 1.2px) 3px 2px/5px 5px,
      radial-gradient(circle,rgba(170,40,0,.55) 0 .8px,transparent 1.3px) 1px 4px/4px 6px,
      linear-gradient(170deg,#ff8a1e,#f0621a 55%,#ff9a2a);
    -webkit-background-clip:text;background-clip:text;
    animation:sparkle 2.4s steps(6) infinite}
  @keyframes sparkle{to{background-position:6px 7px,-2px 7px,5px -2px,0 0}}

  .brush{font-family:"STXingkai","Xingkai SC","Kaiti SC","STKaiti","KaiTi","Songti SC",serif;font-weight:700}
  .dest{position:absolute;writing-mode:vertical-rl;text-orientation:upright;font-size:34px;line-height:1.05;letter-spacing:.02em;
    filter:drop-shadow(0 0 .5px rgba(160,60,0,.6));white-space:nowrap;
    clip-path:inset(0 0 100% 0);transition:clip-path 1.6s cubic-bezier(.5,0,.3,1)}
  .dest.on{clip-path:inset(0 0 0 0)}
  .dest.old{opacity:.38}
  .dest.old:after{content:"";position:absolute;left:50%;top:-6%;bottom:-6%;width:2px;margin-left:-1px;background:rgba(150,60,10,.55);transform:rotate(4deg)}
  .note{position:absolute;writing-mode:vertical-rl;font-size:13px;letter-spacing:.18em;color:#8a4d0c;white-space:nowrap;
    opacity:0;transform:translateY(10px);transition:opacity .8s,transform .8s}
  .note.on{opacity:.85;transform:none}

  #dot{position:absolute;width:22px;height:22px;margin:-11px 0 0 -11px;border-radius:50%;z-index:4;pointer-events:none;
    background:radial-gradient(circle at 35% 35%,#fff3c4,#ff9a2a 45%,#e35a12 80%);
    box-shadow:0 0 0 4px rgba(255,255,255,.75),0 2px 8px rgba(120,40,0,.5)}
  #dot:after{content:"";position:absolute;inset:-12px;border-radius:50%;border:2px solid rgba(255,140,40,.6);animation:ping 1.8s ease-out infinite}
  @keyframes ping{from{transform:scale(.5);opacity:1}to{transform:scale(1.4);opacity:0}}

  /* 状态栏 */
  #status{position:absolute;top:0;left:0;right:0;height:calc(env(safe-area-inset-top,0px) + 34px);
    padding:calc(env(safe-area-inset-top,0px) + 10px) 22px 0;display:flex;justify-content:space-between;align-items:center;z-index:10;
    font-weight:600;font-size:15px;letter-spacing:.02em;text-shadow:0 1px 3px rgba(0,0,0,.35)}
  #clock{display:flex;align-items:center;gap:6px;font-variant-numeric:tabular-nums}
  #bed{width:20px;height:12px;opacity:0;transition:opacity 1s}
  #bed.on{opacity:1}
  #batt{width:27px;height:13px;border:1.5px solid rgba(255,255,255,.85);border-radius:4px;position:relative;padding:1.5px}
  #batt:after{content:"";position:absolute;right:-4px;top:3.5px;width:2px;height:4px;border-radius:0 2px 2px 0;background:rgba(255,255,255,.85)}
  #lvl{height:100%;border-radius:1.5px;background:#fff;width:60%;transition:width .3s,background .6s}

  /* 导航卡 */
  #nav{position:absolute;left:12px;right:12px;top:calc(env(safe-area-inset-top,0px) + 42px);z-index:10;
    background:rgba(28,38,66,.86);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);
    border-radius:18px;padding:13px 16px 13px;box-shadow:0 8px 24px rgba(0,0,0,.3);display:flex;gap:13px;align-items:center}
  #arrow{flex:none;width:44px;height:44px;border-radius:12px;background:#f5bd36;display:flex;align-items:center;justify-content:center;transition:transform .9s cubic-bezier(.5,0,.3,1)}
  #arrow svg{width:26px;height:26px}
  #navtxt{flex:1;min-width:0}
  #lab{font-size:12px;color:rgba(255,255,255,.55);letter-spacing:.1em}
  #destWrap{position:relative;height:28px;overflow:hidden;margin-top:1px}
  .dl{position:absolute;left:0;top:0;font-size:21px;font-weight:600;white-space:nowrap;transition:transform .7s cubic-bezier(.5,0,.3,1),opacity .7s}
  .dl.out{transform:translateY(-30px);opacity:0;text-decoration:line-through}
  .dl.in{transform:translateY(30px);opacity:0}
  #sub{font-size:12.5px;color:#9fd8b4;margin-top:2px;transition:opacity .4s;letter-spacing:.04em}

  /* 改道提示 */
  #toast{position:absolute;left:50%;top:calc(env(safe-area-inset-top,0px) + 142px);transform:translate(-50%,-8px);z-index:11;
    background:rgba(255,250,238,.96);color:#4a2e10;border-radius:14px;padding:11px 16px 12px;min-width:236px;text-align:center;
    box-shadow:0 10px 26px rgba(0,0,0,.28);opacity:0;pointer-events:none;transition:opacity .45s,transform .45s}
  #toast.on{opacity:1;transform:translate(-50%,0)}
  #t1{font-size:13px;color:#a0662a;letter-spacing:.06em}
  #t2{font-size:16px;font-weight:600;margin-top:3px;letter-spacing:.04em}

  /* 按钮 */
  #bottom{position:absolute;left:0;right:0;bottom:0;z-index:10;padding:0 22px calc(env(safe-area-inset-bottom,0px) + 22px);text-align:center}
  #hint{font-size:12.5px;color:rgba(255,255,255,.8);margin-bottom:10px;letter-spacing:.12em;text-shadow:0 1px 3px rgba(0,0,0,.6);transition:opacity .5s}
  #go{width:100%;max-width:330px;height:60px;border:0;border-radius:30px;font-size:18px;font-weight:600;letter-spacing:.2em;color:#4a2a08;
    background:linear-gradient(#ffd25a,#f2ad25);box-shadow:0 6px 0 #b9761a,0 10px 24px rgba(0,0,0,.35);
    font-family:inherit;cursor:pointer;transition:transform .08s,box-shadow .08s,opacity .5s;position:relative;overflow:hidden}
  #go.down{transform:translateY(4px);box-shadow:0 2px 0 #b9761a,0 6px 16px rgba(0,0,0,.35)}
  #go.hide{opacity:0;pointer-events:none}

  /* 结尾 */
  #big{position:absolute;left:50%;writing-mode:vertical-rl;font-size:min(36vw,170px);line-height:1;transform:translate(-50%,0);
    clip-path:inset(0 0 100% 0);transition:clip-path 2.4s cubic-bezier(.45,0,.25,1);filter:drop-shadow(0 0 1px rgba(150,50,0,.6))}
  #big.on{clip-path:inset(0 0 0 0)}
  #sum{position:absolute;left:12px;right:12px;bottom:calc(env(safe-area-inset-bottom,0px) + 14px);z-index:12;
    background:rgba(255,250,238,.97);color:#3d2810;border-radius:22px;padding:18px 20px 16px;
    box-shadow:0 14px 40px rgba(0,0,0,.4);transform:translateY(120%);transition:transform .9s cubic-bezier(.3,.9,.3,1)}
  #sum.on{transform:none}
  #sum h3{font-size:12px;letter-spacing:.3em;color:#a0662a;font-weight:600;margin-bottom:10px}
  .row{display:flex;justify-content:space-between;align-items:baseline;padding:7px 0;border-bottom:1px dashed rgba(120,70,20,.22);font-size:15px}
  .row span:first-child{color:#8b6a45;font-size:13.5px;letter-spacing:.08em}
  .row b{font-weight:600}
  .row s{color:#a99079;text-decoration-color:#d0632a;text-decoration-thickness:2px}
  .row.good b{color:#2f8a5b}
  #foot{font-size:12.5px;color:#8b6a45;margin-top:12px;line-height:1.75;letter-spacing:.04em}
  #again{margin-top:12px;width:100%;height:44px;border-radius:22px;border:1.5px solid #e6a634;background:transparent;color:#a0662a;
    font-size:14.5px;letter-spacing:.2em;font-family:inherit;cursor:pointer}
</style>
</head>
<body>
<canvas id="bg"></canvas>
<div id="app">
  <div id="ribbon">
    <div id="layer"><svg id="route"></svg></div>
  </div>
  <div id="dot"></div>

  <div id="status">
    <div id="clock"><span id="time">18:52</span>
      <svg id="bed" viewBox="0 0 20 12" fill="#fff"><rect x="0" y="1" width="2.2" height="11" rx="1"/><rect x="0" y="7" width="20" height="2.6" rx="1"/><rect x="17.8" y="5" width="2.2" height="7" rx="1"/><rect x="3.4" y="3.6" width="5" height="3.2" rx="1.6"/><rect x="9" y="3.6" width="8.4" height="3.2" rx="1.4"/></svg>
    </div>
    <div id="batt"><div id="lvl"></div></div>
  </div>

  <div id="nav">
    <div id="arrow"><svg viewBox="0 0 24 24"><path d="M12 2.5 L20 20.5 L12 16.3 L4 20.5 Z" fill="#3a2406"/></svg></div>
    <div id="navtxt">
      <div id="lab">目的地</div>
      <div id="destWrap"><div class="dl" id="dl0">回家 做一顿正经的饭</div></div>
      <div id="sub">沿当前路线 顺行</div>
    </div>
  </div>

  <div id="toast"><div id="t1"></div><div id="t2">已为你重新规划路线</div></div>

  <div id="bottom">
    <div id="hint">按住往前走 · 松手就停</div>
    <button id="go">按住 出发</button>
  </div>

  <div id="sum">
    <h3>本次行程</h3>
    <div class="row"><span>原定</span><s>回家 做一顿正经的饭</s></div>
    <div class="row"><span>到达</span><b>床</b></div>
    <div class="row"><span>改道</span><b>五次</b></div>
    <div class="row good"><span>偏航</span><b>零次</b></div>
    <div class="row good"><span>评价</span><b>一路都很顺</b></div>
    <div id="foot">「做一顿正经的饭」已自动加入明天的路线<br>葱在冰箱里 不急</div>
    <button id="again">再走一遍</button>
  </div>
</div>

<script>
(function(){
/* ---------- 挂毯背景 ---------- */
const bg=document.getElementById('bg');
function drawBg(){
  const dpr=Math.min(window.devicePixelRatio||1,2);
  const W=innerWidth,H=innerHeight;
  bg.width=W*dpr;bg.height=H*dpr;
  const c=bg.getContext('2d');c.setTransform(dpr,0,0,dpr,0,0);
  let seed=7;const rnd=()=>{seed=(seed*16807)%2147483647;return seed/2147483647};
  c.fillStyle='#2b3f74';c.fillRect(0,0,W,H);
  c.save();c.filter='blur(2px)';
  const P=['#c8642e','#e3923e','#3f8a86','#8fb08a','#e8d6a8','#7a2f2a','#3b5aa0','#5fa6a0'];
  // 大的团花
  const cx=W/2;
  const motifs=[[cx-W*.42,H*.18,W*.5],[cx+W*.45,H*.36,W*.55],[cx-W*.46,H*.62,W*.52],[cx+W*.42,H*.86,W*.5],[cx,H*.5,W*.75]];
  motifs.forEach((m,mi)=>{
    const [x,y,R]=m;
    const rings=7;
    for(let i=0;i<rings;i++){
      const r=R*(1-i/rings);
      c.beginPath();
      const lobes=8+((mi+i)%3)*2,amp=r*.07;
      for(let a=0;a<=Math.PI*2+.01;a+=.04){
        const rr=r+Math.sin(a*lobes+mi)*amp;
        c.lineTo(x+Math.cos(a)*rr,y+Math.sin(a)*rr);
      }
      c.fillStyle=P[(mi*3+i)%P.length];c.fill();
    }
  });
  // 卷草
  c.lineCap='round';
  for(let k=0;k<26;k++){
    const x=rnd()*W,y=rnd()*H,r=18+rnd()*40;
    c.strokeStyle=P[k%P.length];c.lineWidth=5+rnd()*6;
    c.beginPath();
    for(let t=0;t<9;t+=.12){const rr=r*(1-t/11);c.lineTo(x+Math.cos(t)*rr,y+Math.sin(t)*rr)}
    c.stroke();
  }
  c.restore();
  // 织纹
  const s=3;
  for(let y=0;y<H;y+=s){
    for(let x=0;x<W;x+=s){
      const v=((x/s+y/s)&1);
      c.fillStyle=v?'rgba(255,245,220,'+(0.05+rnd()*0.08)+')':'rgba(10,15,40,'+(0.08+rnd()*0.1)+')';
      c.fillRect(x,y,s-.6,s-.6);
    }
  }
  const g=c.createRadialGradient(W/2,H/2,H*.2,W/2,H/2,H*.8);
  g.addColorStop(0,'rgba(0,0,0,0)');g.addColorStop(1,'rgba(10,12,30,.45)');
  c.fillStyle=g;c.fillRect(0,0,W,H);
}

/* ---------- 路线数据 ---------- */
const TOTAL=3500;
const EV=[
  {y:330, note:'路过 便利店'},
  {y:620, note:'顺手 买了根葱'},
  {y:900, re:'检测到你的腿有点沉', dest:'回家 煮碗面', off:-20},
  {y:1190,note:'路过一只猫 停留了一会儿'},
  {y:1480,re:'检测到你叹了一口气', dest:'回家 随便吃两口', off:16},
  {y:1760,note:'到家 已为你系上围裙'},
  {y:2040,re:'检测到沙发', dest:'喝点热的', off:-14},
  {y:2290,note:'围裙 还系着'},
  {y:2560,re:'检测到热水很舒服', dest:'洗个澡就睡', off:18},
  {y:2810,note:'手机 也带进去了'},
  {y:3080,re:'检测到被子', dest:'床', off:0, bed:true},
];
const STEPS=EV.filter(e=>e.re);

const app=document.getElementById('app'),ribbon=document.getElementById('ribbon'),layer=document.getElementById('layer'),
  route=document.getElementById('route'),dot=document.getElementById('dot');
let RW=0,RH=0,DOTY=0;
const START=110; // 路线在纸条上的起点
function offAt(y){ // 路线的横向偏移，改道处平滑过渡，没有拐角
  let prev=0;
  for(const e of STEPS){
    if(y<e.y)return prev;
    const t=(y-e.y)/260;
    if(t<1){const s=t*t*(3-2*t);return prev+(e.off-prev)*s}
    prev=e.off;
  }
  return prev;
}
function build(){
  RW=ribbon.clientWidth;RH=ribbon.clientHeight;DOTY=RH*.64;
  layer.innerHTML='';
  const H=TOTAL+START+RH;
  layer.style.height=H+'px';
  const ns='http://www.w3.org/2000/svg';
  const svg=document.createElementNS(ns,'svg');svg.id='route';
  svg.setAttribute('width',RW);svg.setAttribute('height',H);
  svg.innerHTML='<defs><pattern id="gp" width="6" height="6" patternUnits="userSpaceOnUse"><rect width="6" height="6" fill="#f26a1c"/><circle cx="1.5" cy="1.5" r=".9" fill="#ffe9a8"/><circle cx="4.5" cy="4" r=".7" fill="#ffc96a"/><circle cx="3" cy="5.2" r=".6" fill="#b5370a"/></pattern>'+
    '<linearGradient id="fade" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#9a5a12" stop-opacity=".55"/><stop offset="1" stop-color="#9a5a12" stop-opacity="0"/></linearGradient></defs>';
  // 被放弃的原路线：笔直往下，慢慢淡掉
  STEPS.forEach(e=>{
    if(e.off===undefined)return;
    const x=RW/2+offAt(e.y-1);
    const l=document.createElementNS(ns,'line');
    l.setAttribute('x1',x);l.setAttribute('x2',x);l.setAttribute('y1',START+e.y);l.setAttribute('y2',START+e.y+150);
    l.setAttribute('stroke','url(#fade)');l.setAttribute('stroke-width','3');l.setAttribute('stroke-dasharray','2 7');l.setAttribute('stroke-linecap','round');
    svg.appendChild(l);
  });
  let d='M'+(RW/2)+' 0 L'+(RW/2)+' '+START;
  for(let y=0;y<=TOTAL;y+=8){d+=' L'+(RW/2+offAt(y)).toFixed(1)+' '+(START+y)}
  const ahead=document.createElementNS(ns,'path');
  ahead.setAttribute('d',d);ahead.setAttribute('fill','none');ahead.setAttribute('stroke','rgba(140,80,10,.45)');
  ahead.setAttribute('stroke-width','4');ahead.setAttribute('stroke-dasharray','1 10');ahead.setAttribute('stroke-linecap','round');
  svg.appendChild(ahead);
  done=document.createElementNS(ns,'path');
  done.setAttribute('d',d);done.setAttribute('fill','none');done.setAttribute('stroke','url(#gp)');
  done.setAttribute('stroke-width','7');done.setAttribute('stroke-linecap','round');
  svg.appendChild(done);
  pathLen=done.getTotalLength();
  // 预先算好 y→路径长度
  lenAt=[];let acc=START;let px=RW/2,py=START;
  for(let y=0;y<=TOTAL;y+=8){const x=RW/2+offAt(y),yy=START+y;acc+=Math.hypot(x-px,yy-py);px=x;py=yy;lenAt.push(acc)}
  layer.appendChild(svg);
  // 起点的字
  const s0=mk('div','dest brush gl on','做一顿正经的饭');
  s0.style.top=(START-90)+'px';
  layer.appendChild(s0);startDest=s0;
  sizeDest(s0);
  s0.style.left=(RW*.5+22)+'px';s0.style.top='14px';
  // 事件文字
  EV.forEach((e,i)=>{
    const side=i%2?1:-1;
    const x=RW/2+offAt(e.y+120);
    if(e.note){
      const n=mk('div','note',e.note);
      n.style.top=(START+e.y-20)+'px';
      n.style.left=(side>0? x+20 : x-38)+'px';
      layer.appendChild(n);e.el=n;
    }else{
      const t=mk('div','dest brush gl',e.dest.replace(/^回家 /,''));
      t.style.top=(START+e.y+28)+'px';
      layer.appendChild(t);sizeDest(t);
      const w=t.offsetWidth,h=t.offsetHeight;
      t.style.top=(START+e.y-h+60)+'px';
      t.style.left=(e.off>0? x-w-18 : x+18)+'px';
      if(e.bed){t.style.left=(x-w/2+(w>0?0:0))+'px';t.style.display='none'}
      e.el=t;
    }
  });
  big=mk('div','brush gl','顺');big.id='big';
  big.style.top=(START+TOTAL-RH*.64+RH*.19)+'px';
  layer.appendChild(big);
  applyState();
}
function sizeDest(t){
  const n=t.textContent.length;
  const maxH=Math.min(RH*.34,260);
  t.style.fontSize=Math.max(22,Math.min(40,maxH/n))+'px';
}
function mk(tag,cls,txt){const e=document.createElement(tag);e.className=cls;e.textContent=txt;return e}
let done,pathLen,lenAt=[],startDest,big;

/* ---------- 状态 ---------- */
let pos=0,vel=0,holding=false,paused=0,stepI=0,noteI=0,finished=false,started=false;
const timeEl=document.getElementById('time'),lvl=document.getElementById('lvl'),bed=document.getElementById('bed');
const toast=document.getElementById('toast'),t1=document.getElementById('t1'),sub=document.getElementById('sub');
const go=document.getElementById('go'),hint=document.getElementById('hint'),sum=document.getElementById('sum');
const arrow=document.getElementById('arrow');
let arrowRot=0;

function applyState(){
  const x=RW/2+offAt(Math.max(0,pos));
  layer.style.transform='translateY('+(DOTY-START-pos)+'px)';
  const rr=ribbon.getBoundingClientRect(),ar=app.getBoundingClientRect();
  dot.style.left=(rr.left-ar.left+x)+'px';dot.style.top=(rr.top-ar.top+DOTY)+'px';
  if(done&&lenAt.length){
    const i=Math.max(0,Math.min(lenAt.length-1,Math.round(pos/8)));
    const L=(pos<=0?START:lenAt[i]);
    done.setAttribute('stroke-dasharray',L+' '+(pathLen+999));
  }
  // 时间：傍晚到过了午夜
  const p=Math.max(0,Math.min(1,pos/TOTAL));
  const startMin=18*60+52,endMin=24*60+31;
  let m=Math.round(startMin+(endMin-startMin)*Math.pow(p,1.25));m%=1440;
  timeEl.textContent=String(Math.floor(m/60)).padStart(2,'0')+':'+String(m%60).padStart(2,'0');
  const b=.64-.58*p;
  lvl.style.width=(b*100)+'%';
  lvl.style.background=b<.2?'#ff453a':(b<.35?'#ffd60a':'#fff');
}

/* ---------- 声音 ---------- */
let ac=null;
function chime(notes,gap){
  try{
    ac=ac||new (window.AudioContext||window.webkitAudioContext)();
    if(ac.state==='suspended')ac.resume();
    notes.forEach((f,i)=>{
      const o=ac.createOscillator(),g=ac.createGain(),t=ac.currentTime+i*(gap||.16);
      o.type='sine';o.frequency.value=f;
      g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(.09,t+.02);g.gain.exponentialRampToValueAtTime(.0001,t+1.1);
      o.connect(g);g.connect(ac.destination);o.start(t);o.stop(t+1.2);
    });
  }catch(e){}
}

/* ---------- 改道 ---------- */
function setDest(txt){
  const wrap=document.getElementById('destWrap');
  wrap.querySelectorAll('.dl:not(.out)').forEach(o=>{o.classList.add('out');setTimeout(()=>o.remove(),900)});
  const n=mk('div','dl in',txt);wrap.appendChild(n);
  n.offsetWidth;n.classList.remove('in');
}
function reroute(e){
  paused=2.6;
  t1.textContent=e.re;
  toast.classList.add('on');
  chime([659.25,880]);
  if(navigator.vibrate)try{navigator.vibrate(18)}catch(_){}
  arrowRot+= e.off>0?-38:38; if(e.bed)arrowRot=0;
  arrow.style.transform='rotate('+arrowRot+'deg)';
  setTimeout(()=>{arrow.style.transform='rotate(0deg)';arrowRot=0},1500);
  setTimeout(()=>{
    setDest(e.dest);
    sub.textContent=e.bed?'就在前面了':'新路线更近 更省力';
    // 纸条上：上一个目的地淡掉，新的写上去
    const prev=STEPS[STEPS.indexOf(e)-1];
    (prev?prev.el:startDest).classList.add('old');
    if(!e.bed){e.el.classList.add('on')}
    if(e.bed)bed.classList.add('on');
  },650);
  setTimeout(()=>{toast.classList.remove('on')},2300);
}
function finish(){
  finished=true;holding=false;go.classList.remove('down');
  go.classList.add('hide');hint.style.opacity=0;
  setDest('已到达');sub.textContent='全程无偏航';
  (STEPS[STEPS.length-2].el).classList.add('old');
  chime([523.25,659.25,783.99,1046.5],.22);
  setTimeout(()=>big.classList.add('on'),500);
  setTimeout(()=>sum.classList.add('on'),2900);
}
function reset(){
  sum.classList.remove('on');
  setTimeout(()=>{
    pos=0;vel=0;paused=0;stepI=0;noteI=0;finished=false;started=false;
    const wrap=document.getElementById('destWrap');wrap.innerHTML='';wrap.appendChild(mk('div','dl','回家 做一顿正经的饭'));
    sub.textContent='沿当前路线 顺行';bed.classList.remove('on');
    go.textContent='按住 出发';go.classList.remove('hide');hint.style.opacity=1;
    build();
  },600);
}

/* ---------- 主循环 ---------- */
let last=performance.now();
function loop(){tick(performance.now());requestAnimationFrame(loop)}
function tick(now){
  const dt=Math.max(0,Math.min(.05,(now-last)/1000));last=now;
  if(!finished){
    if(paused>0){paused-=dt;vel*=Math.pow(.02,dt)}
    else{
      const target=holding?210:0;
      vel+=(target-vel)*Math.min(1,dt*(holding?3.2:6));
      if(vel<1&&!holding)vel=0;
    }
    pos+=vel*dt;
    while(noteI<EV.length&&pos>=EV[noteI].y-(EV[noteI].re?0:70)){
      const e=EV[noteI];
      if(e.re){reroute(e);pos=e.y;vel*=.3}
      else e.el&&e.el.classList.add('on');
      noteI++;
    }
    if(pos>=TOTAL-40){pos=Math.min(pos,TOTAL);}
    if(pos>=TOTAL-2&&!finished){pos=TOTAL;finish()}
    applyState();
  }
}

/* ---------- 输入 ---------- */
function down(ev){
  if(finished)return;
  if(ev)ev.preventDefault();
  holding=true;go.classList.add('down');
  if(!started){started=true;go.textContent='走着呢';chime([523.25],.1)}
}
function up(){holding=false;go.classList.remove('down');if(started&&!finished)go.textContent='按住 继续走'}
go.addEventListener('pointerdown',e=>{try{go.setPointerCapture(e.pointerId)}catch(_){};down(e)});
go.addEventListener('pointerup',up);go.addEventListener('pointercancel',up);go.addEventListener('lostpointercapture',up);
go.addEventListener('contextmenu',e=>e.preventDefault());
addEventListener('keydown',e=>{if((e.code==='Space'||e.code==='ArrowDown'||e.code==='Enter')&&!e.repeat){down(e)}});
addEventListener('keyup',e=>{if(e.code==='Space'||e.code==='ArrowDown'||e.code==='Enter')up()});
addEventListener('blur',up);
document.getElementById('again').addEventListener('click',reset);

let rt;addEventListener('resize',()=>{clearTimeout(rt);rt=setTimeout(()=>{drawBg();const keep=pos;build();pos=keep;
  EV.forEach((e,i)=>{if(i<noteI&&e.el){e.el.classList.add('on');}});
  STEPS.forEach((e,i)=>{if(pos>e.y){const prev=STEPS[i-1];(prev?prev.el:startDest).classList.add('old')}});
  if(finished){(STEPS[STEPS.length-2].el).classList.add('old');big.classList.add('on')}
  applyState()},150)});

drawBg();build();requestAnimationFrame(loop);

// 截图调试：?p=0.5 直接跳到某处
const q=new URLSearchParams(location.search);
if(q.has('static')){const st=document.createElement('style');st.textContent='*{transition:none!important}';document.head.appendChild(st)}
if(q.has('auto')){setTimeout(()=>down(),300);setInterval(()=>tick(performance.now()),16)}
if(q.has('p')){
  const p=parseFloat(q.get('p'));pos=p*TOTAL;
  for(;noteI<EV.length&&EV[noteI].y<=pos;noteI++){const e=EV[noteI];
    if(e.re){const prev=STEPS[STEPS.indexOf(e)-1];(prev?prev.el:startDest).classList.add('old');if(!e.bed)e.el.classList.add('on');setDest(e.dest);if(e.bed)bed.classList.add('on')}
    else e.el.classList.add('on');}
  if(q.has('t')){const e=STEPS.find(s=>s.y>=pos-1);if(e){t1.textContent=e.re;toast.classList.add('on')}}
  if(p>=1){finish();}
  started=true;go.textContent='按住 继续走';applyState();
}
})();
</script>
