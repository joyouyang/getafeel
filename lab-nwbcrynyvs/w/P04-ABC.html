<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>节拍</title>
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:#dcdad5;}
  body{touch-action:none;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;
       font-family:"Songti SC","Noto Serif SC","Source Han Serif SC","STSong",serif;color:#3a3226;}
  canvas{position:fixed;inset:0;width:100%;height:100%;display:block;}
  #worries{position:fixed;inset:0;pointer-events:none;overflow:hidden;}
  .w{position:absolute;font-size:13px;color:#6d7378;opacity:0;white-space:nowrap;
     animation:wf 1.1s ease-out forwards;letter-spacing:.05em;}
  @keyframes wf{0%{opacity:0;transform:translateY(4px)}18%{opacity:.75}100%{opacity:0;transform:translateY(-10px)}}
  #lines{position:fixed;left:0;right:0;top:calc(env(safe-area-inset-top) + 7vh);padding:0 30px;
         max-width:460px;margin:0 auto;pointer-events:none;font-size:16.5px;line-height:1.8;transition:opacity 1.2s;}
  #lines p{margin:0 0 .15em;opacity:0;transform:translateY(6px);transition:opacity 1.8s ease,transform 1.8s ease;}
  #lines p.on{opacity:1;transform:none;}
  #lines p.gap{margin-top:.55em;}
  #lines p.small{font-size:14px;color:#6a5c48;}
  #note{position:fixed;left:0;right:0;text-align:center;font-size:15px;pointer-events:none;
        transition:opacity 1s;opacity:0;padding:0 24px;line-height:1.7;}
  #zone{position:fixed;left:0;right:0;text-align:center;font-size:14px;letter-spacing:.4em;
        pointer-events:none;transition:color 1s;padding-left:.4em;}
  #sound{position:fixed;right:calc(env(safe-area-inset-right) + 14px);top:calc(env(safe-area-inset-top) + 12px);
         font-size:12px;color:#7a7060;background:rgba(255,255,255,.35);border:0;border-radius:14px;
         padding:6px 11px;font-family:inherit;letter-spacing:.1em;opacity:0;transition:opacity 1s;cursor:pointer;}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="worries"></div>
<div id="lines"></div>
<div id="note"></div>
<div id="zone"></div>
<button id="sound">声音 开</button>
<script>
(()=>{
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
const worriesEl=document.getElementById('worries'),linesEl=document.getElementById('lines');
const noteEl=document.getElementById('note'),zoneEl=document.getElementById('zone'),soundBtn=document.getElementById('sound');
let W=0,H=0,DPR=1;
function resize(){DPR=Math.min(window.devicePixelRatio||1,2.5);W=innerWidth;H=innerHeight;
  cv.width=W*DPR;cv.height=H*DPR;ctx.setTransform(DPR,0,0,DPR,0,0);}
addEventListener('resize',resize);resize();

/* ---------- helpers ---------- */
const clamp=(x,a=0,b=1)=>Math.max(a,Math.min(b,x));
const lerp=(a,b,t)=>a+(b-a)*t;
const ease=t=>t<.5?2*t*t:1-Math.pow(-2*t+2,2)/2;
function hex(h){const n=parseInt(h.slice(1),16);return[(n>>16)&255,(n>>8)&255,n&255];}
function mix(a,b,t){const A=hex(a),B=hex(b);return`rgb(${A.map((v,i)=>Math.round(lerp(v,B[i],t))).join(',')})`;}
function mixA(a,b,t,al){const A=hex(a),B=hex(b);return`rgba(${A.map((v,i)=>Math.round(lerp(v,B[i],t))).join(',')},${al})`;}

/* ---------- tempo ---------- */
// t: 砝码在摆杆上的位置。0 = 最低（最快），1 = 最高（最慢）
let t=0.04;
const bpmOf=t=>184*Math.pow(52/184,t);
function zoneOf(b){
  if(b>150)return'赶';if(b>125)return'小跑';if(b>102)return'快走';
  if(b>80)return'走';if(b>62)return'慢慢走';return'停一停';}

/* ---------- state ---------- */
let started=false,phase=0,lastBeat=0,calm=0,arrived=false,L=0,slowBeats=0,dragged=false;
let shadowRecede=0,beatFlash=0,startTime=0,lineIdx=0,lineTimer=0,linesShown=false,fastAgain=false,stopNoteShown=false;
let lastNow=performance.now();

const LINES=[
  {s:'你说你那个名字，是走路的速度。'},
  {s:'其实它是小跑。'},
  {s:'不过，也没说错。',gap:true},
  {s:'心一直是小跑着的，人呢，想慢慢走。'},
  {s:'两个都是你。'},
  {s:'还没来的事，就让它在前面站着等。',gap:true},
  {s:'走到跟前了，再看它，也来得及。'},
];
LINES.forEach(o=>{const p=document.createElement('p');p.textContent=o.s;if(o.gap)p.className='gap';linesEl.appendChild(p);o.el=p;});

const WORRIES=['万一','来得及吗','以后呢','会不会','要是','怎么办','该不该','再想想','下一步','如果','还差一点','快点','然后呢','可是','还没'];

/* ---------- audio ---------- */
let ac=null,master=null,seaGain=null,muted=false,noiseBuf=null;
function initAudio(){
  try{
    ac=new (window.AudioContext||window.webkitAudioContext)();
    master=ac.createGain();master.gain.value=.9;master.connect(ac.destination);
    const len=ac.sampleRate*2;noiseBuf=ac.createBuffer(1,len,ac.sampleRate);
    const d=noiseBuf.getChannelData(0);for(let i=0;i<len;i++)d[i]=Math.random()*2-1;
    // 海：棕噪声 + 慢慢起伏
    const bl=ac.sampleRate*4,bb=ac.createBuffer(1,bl,ac.sampleRate),bd=bb.getChannelData(0);let last=0;
    for(let i=0;i<bl;i++){last=(last+.02*(Math.random()*2-1))/1.02;bd[i]=last*3.2;}
    const src=ac.createBufferSource();src.buffer=bb;src.loop=true;
    const lp=ac.createBiquadFilter();lp.type='lowpass';lp.frequency.value=520;
    const swell=ac.createGain();swell.gain.value=.55;
    const lfo=ac.createOscillator();lfo.frequency.value=.085;const lfoG=ac.createGain();lfoG.gain.value=.4;
    lfo.connect(lfoG);lfoG.connect(swell.gain);lfo.start();
    seaGain=ac.createGain();seaGain.gain.value=0;
    src.connect(lp);lp.connect(swell);swell.connect(seaGain);seaGain.connect(master);src.start();
  }catch(e){ac=null;}
}
function tick(){
  if(!ac||muted)return;
  const now=ac.currentTime,c=calm;
  // 木头的“嗒”
  const o=ac.createOscillator(),g=ac.createGain();
  o.type='sine';o.frequency.setValueAtTime(lerp(1650,520,c),now);
  o.frequency.exponentialRampToValueAtTime(lerp(1100,300,c),now+.05);
  const v=lerp(.32,.07,c);
  g.gain.setValueAtTime(0,now);g.gain.linearRampToValueAtTime(v,now+.002);
  g.gain.exponentialRampToValueAtTime(.0001,now+lerp(.045,.09,c));
  o.connect(g);g.connect(master);o.start(now);o.stop(now+.15);
  // 草地上的脚步
  const n=ac.createBufferSource();n.buffer=noiseBuf;
  const f=ac.createBiquadFilter();f.type=c>.5?'lowpass':'bandpass';f.frequency.value=lerp(3200,700,c);f.Q.value=lerp(3,.7,c);
  const ng=ac.createGain();const nv=lerp(.18,.22,c);
  ng.gain.setValueAtTime(0,now);ng.gain.linearRampToValueAtTime(nv,now+lerp(.001,.012,c));
  ng.gain.exponentialRampToValueAtTime(.0001,now+lerp(.03,.14,c));
  n.connect(f);f.connect(ng);ng.connect(master);n.start(now,Math.random()*1.5);n.stop(now+.2);
}
soundBtn.addEventListener('pointerdown',e=>{e.stopPropagation();});
soundBtn.addEventListener('click',e=>{e.stopPropagation();muted=!muted;soundBtn.textContent=muted?'声音 关':'声音 开';
  if(master)master.gain.value=muted?0:.9;});

/* ---------- input ---------- */
let dragY=null,dragT=0;
function start(){
  if(started)return;started=true;startTime=performance.now();lastNow=startTime;phase=0;lastBeat=0;
  initAudio();if(ac&&ac.state==='suspended')ac.resume();
  tick();soundBtn.style.opacity=1;
  noteEl.style.opacity=0;
  setTimeout(()=>{if(!dragged){showNote('按住屏幕往上推，<br>砝码上去，它就慢下来 ↑');}},2600);
}
function showNote(html){noteEl.innerHTML=html;noteEl.style.opacity=1;}
cv.addEventListener('pointerdown',e=>{
  if(!started){start();return;}
  if(ac&&ac.state==='suspended')ac.resume();
  dragY=e.clientY;dragT=t;try{cv.setPointerCapture(e.pointerId);}catch(_){}
});
cv.addEventListener('pointermove',e=>{
  if(dragY===null)return;
  const dy=dragY-e.clientY;
  t=clamp(dragT+dy/(H*.55));
  if(Math.abs(dy)>12&&!dragged){dragged=true;if(!arrived)noteEl.style.opacity=0;}
});
const endDrag=()=>{dragY=null;};
cv.addEventListener('pointerup',endDrag);cv.addEventListener('pointercancel',endDrag);
addEventListener('wheel',e=>{if(!started)return;t=clamp(t-e.deltaY/1400);dragged=true;if(!arrived)noteEl.style.opacity=0;},{passive:true});
addEventListener('keydown',e=>{
  if(!started&&(e.key===' '||e.key==='Enter')){start();return;}
  if(e.key==='ArrowUp'){t=clamp(t+.04);dragged=true;}
  if(e.key==='ArrowDown'){t=clamp(t-.04);dragged=true;}
});

/* ---------- worries ---------- */
function spawnWorry(){
  const s=document.createElement('div');s.className='w';
  s.textContent=WORRIES[Math.floor(Math.random()*WORRIES.length)]+(Math.random()<.35?'……':'');
  s.style.left=(6+Math.random()*78)+'%';s.style.top=(5+Math.random()*80)+'%';
  s.style.fontSize=(11+Math.random()*5)+'px';
  worriesEl.appendChild(s);setTimeout(()=>s.remove(),1200);
}

/* ---------- scene: walkers ---------- */
const CLOTH=['#2b2a2c','#e9e6de','#3a3f4a','#7a3b2c','#2b2a2c','#b98a6a','#f2efe8','#22262d','#5a4a3a','#2f3a34'];
const walkers=[];
for(let i=0;i<11;i++){
  const pair=i%4===1;
  walkers.push({x:Math.random(),dir:Math.random()<.5?1:-1,stride:.0042+Math.random()*.0022,
    s:.85+Math.random()*.3,cloth:CLOTH[i%CLOTH.length],off:Math.random()*.4,pair,z:Math.random()});
}
walkers.sort((a,b)=>a.z-b.z);
const houses=[];for(let i=0;i<70;i++)houses.push({x:Math.random(),w:.006+Math.random()*.014,h:.004+Math.random()*.012,
  c:['#d8cfc2','#e6dccb','#c9b8a3','#bfa58a','#e9e2d6','#b88f74'][i%6]});
houses.sort((a,b)=>a.x-b.x);
const towers=[{x:.48,w:.035,h:.03},{x:.57,w:.02,h:.04},{x:.7,w:.03,h:.022},{x:.24,w:.02,h:.02}];

/* ---------- draw ---------- */
function parseRGB(s){return s.match(/\d+/g).map(Number);}
function rgb2hex(s){const a=Array.isArray(s)?s:parseRGB(s);return'#'+a.map(v=>v.toString(16).padStart(2,'0')).join('');}
function lerpRGB(a,b,t){const A=parseRGB(a),B=parseRGB(b);return A.map((v,i)=>Math.round(lerp(v,B[i],t)));}

let walkDt=0,curBpm=90;
function drawLand(Lv,c,beatPos,now){
  if(Lv<=0.001)return;
  const a=Lv;
  const hz=H*.43;               // 海平线
  const wallTop=hz+H*.03,wallBot=wallTop+H*.022,path=wallBot+H*.012;
  ctx.save();ctx.globalAlpha=a;
  // 远处的岸：山 + 小房子
  ctx.fillStyle='#9aa48a';
  ctx.beginPath();ctx.moveTo(0,hz);
  for(let x=0;x<=W;x+=W/40){const y=hz-H*(.012+.014*Math.sin(x/W*3.1+.6)+.008*Math.sin(x/W*9));ctx.lineTo(x,y);}
  ctx.lineTo(W,hz);ctx.closePath();ctx.fill();
  houses.forEach(h=>{const x=h.x*W,base=hz-H*(.006+.01*Math.sin(h.x*3.1+.6));
    ctx.fillStyle=h.c;ctx.fillRect(x,base-h.h*H,h.w*W,h.h*H);});
  towers.forEach(tw=>{ctx.fillStyle='#e3ddd2';ctx.fillRect(tw.x*W,hz-H*.012-tw.h*H,tw.w*W,tw.h*H);
    ctx.fillStyle='rgba(120,110,100,.25)';ctx.fillRect(tw.x*W+tw.w*W*.6,hz-H*.012-tw.h*H,tw.w*W*.4,tw.h*H);});
  // 海
  const sg=ctx.createLinearGradient(0,hz,0,wallTop);sg.addColorStop(0,'#3f5f86');sg.addColorStop(1,'#2f4c70');
  ctx.fillStyle=sg;ctx.fillRect(0,hz,W,wallTop-hz+1);
  ctx.strokeStyle='rgba(255,240,215,.35)';ctx.lineWidth=1;
  for(let i=0;i<14;i++){const y=hz+(i%5+.5)/5*(wallTop-hz);const x=((i*137+now*.006*(i%3+1))%(W+60))-30;
    ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(x+10+i%4*5,y);ctx.stroke();}
  // 砂岩海堤
  const wg=ctx.createLinearGradient(0,wallTop,0,wallBot);wg.addColorStop(0,'#e9cf9f');wg.addColorStop(1,'#c9a676');
  ctx.fillStyle=wg;ctx.fillRect(0,wallTop,W,wallBot-wallTop);
  ctx.strokeStyle='rgba(140,105,65,.25)';
  for(let x=0;x<W;x+=26){ctx.beginPath();ctx.moveTo(x,wallTop+2);ctx.lineTo(x,wallBot);ctx.stroke();}
  // 步道
  ctx.fillStyle='#d8c39c';ctx.fillRect(0,wallBot,W,path-wallBot);
  // 草地（亮）
  const gg=ctx.createLinearGradient(0,path,0,H);gg.addColorStop(0,'#a6ad55');gg.addColorStop(.3,'#7f9a43');gg.addColorStop(1,'#5d7d35');
  ctx.fillStyle=gg;ctx.fillRect(0,path,W,H-path);
  // 路灯
  [[.2,.13],[.56,.15],[.93,.19]].forEach(([px,ph])=>{const x=px*W,y=path,top=y-H*ph;
    ctx.strokeStyle='#26282a';ctx.lineWidth=Math.max(1.5,W*.004);ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(x,top);ctx.stroke();
    ctx.fillStyle='#26282a';ctx.beginPath();ctx.ellipse(x,top,W*.022,H*.004,0,0,Math.PI*2);ctx.fill();
  });
  // 一张长椅
  ctx.fillStyle='#4a3b2d';const bx=W*.36,by=wallBot+1;ctx.fillRect(bx,by-H*.012,W*.05,H*.004);ctx.fillRect(bx,by-H*.018,W*.05,H*.004);
  ctx.fillRect(bx+2,by-H*.012,2,H*.012);ctx.fillRect(bx+W*.05-4,by-H*.012,2,H*.012);
  // 走路的人：脚步跟着节拍
  const fh=H*.038;
  walkers.forEach(w=>{w.x+=w.dir*(fh*w.s*.3/Math.max(W,1))*walkDt*curBpm/60;if(w.x>1.06)w.x=-.06;if(w.x<-.06)w.x=1.06;});
  walkers.forEach((w,i)=>{
    const x=w.x*W,y=path+(w.z-.5)*H*.008;
    const ph=(beatPos+w.off)*Math.PI; // 每一拍迈一步
    const sw=Math.sin(ph);
    const s=w.s*fh;
    ctx.save();ctx.translate(x,y);
    const bob=-Math.abs(Math.cos(ph))*s*.03;
    // 影子
    ctx.fillStyle='rgba(30,40,20,.22)';ctx.beginPath();ctx.ellipse(-s*.35,1,s*.32,s*.04,0,0,Math.PI*2);ctx.fill();
    ctx.strokeStyle='#2a2a2a';ctx.lineCap='round';ctx.lineWidth=s*.09;
    // 腿
    ctx.beginPath();ctx.moveTo(0,-s*.45+bob);ctx.lineTo(sw*s*.13*w.dir,0);ctx.stroke();
    ctx.beginPath();ctx.moveTo(0,-s*.45+bob);ctx.lineTo(-sw*s*.13*w.dir,0);ctx.stroke();
    // 身体
    ctx.fillStyle=w.cloth;ctx.beginPath();
    if(ctx.roundRect)ctx.roundRect(-s*.1,-s*.86+bob,s*.2,s*.44,s*.06);else ctx.rect(-s*.1,-s*.86+bob,s*.2,s*.44);
    ctx.fill();
    // 头
    ctx.fillStyle='#2e2622';ctx.beginPath();ctx.arc(0,-s*.95+bob,s*.085,0,Math.PI*2);ctx.fill();
    ctx.restore();
  });
  ctx.restore();
}

function drawShadow(Lv,recede){
  if(Lv<=0.001)return;
  // 近处的大片树影：你站的地方。站久了，光会慢慢挪过来一点
  const edge=H*lerp(.6,.8,recede);
  ctx.save();ctx.globalAlpha=Lv;
  const g=ctx.createLinearGradient(0,edge-H*.03,0,edge+H*.05);
  g.addColorStop(0,'rgba(30,48,30,0)');g.addColorStop(.45,'rgba(30,48,30,.78)');g.addColorStop(1,'rgba(26,40,26,.9)');
  ctx.fillStyle=g;
  ctx.beginPath();ctx.moveTo(0,edge-H*.02);
  for(let x=0;x<=W;x+=W/24){ctx.lineTo(x,edge+Math.sin(x/W*5+1.3)*H*.012+Math.sin(x/W*13)*H*.004);}
  ctx.lineTo(W,H);ctx.lineTo(0,H);ctx.closePath();ctx.fill();
  ctx.restore();
}

function drawOranges(Lv,mx,baseY,mH){
  if(Lv<=0.001)return;
  ctx.save();ctx.globalAlpha=Lv;
  const r=mH*.07;
  [[-.62,.0,1],[.58,.02,.9],[.9,-.03,.8],[-.95,.05,.75]].forEach(([dx,dy,s])=>{
    const x=clamp(mx+dx*mH,r*1.6,W-r*1.6),y=baseY+dy*mH-r*s*.8;
    ctx.fillStyle='rgba(10,20,10,.3)';ctx.beginPath();ctx.ellipse(x+r*.2,y+r*s*.8,r*s*1.1,r*s*.28,0,0,Math.PI*2);ctx.fill();
    const g=ctx.createRadialGradient(x-r*s*.35,y-r*s*.35,r*s*.1,x,y,r*s*1.05);
    g.addColorStop(0,'#f7b24a');g.addColorStop(1,'#c96e1c');
    ctx.fillStyle=g;ctx.beginPath();ctx.ellipse(x,y,r*s*1.08,r*s*.88,0,0,Math.PI*2);ctx.fill();
    ctx.strokeStyle='rgba(150,80,20,.35)';ctx.lineWidth=1;
    ctx.beginPath();ctx.ellipse(x,y,r*s*.45,r*s*.86,0,0,Math.PI*2);ctx.stroke();
    ctx.fillStyle='#6b5a2e';ctx.fillRect(x-1.5,y-r*s*.98,3,r*s*.28);
  });
  ctx.restore();
}

function drawMetronome(mx,baseY,mH,angle,tw,c,flash){
  const bw=mH*.62,tw2=mH*.17,top=baseY-mH;
  ctx.save();
  // 影子
  ctx.fillStyle='rgba(0,0,0,.14)';ctx.beginPath();ctx.ellipse(mx+bw*.08,baseY+2,bw*.62,mH*.03,0,0,Math.PI*2);ctx.fill();
  // 机身
  const bg=ctx.createLinearGradient(mx-bw/2,0,mx+bw/2,0);
  bg.addColorStop(0,mix('#8a5a34','#7a4a2a',c));bg.addColorStop(.5,mix('#b07a48','#b5733e',c));bg.addColorStop(1,mix('#6e4528','#5e3a20',c));
  ctx.fillStyle=bg;
  ctx.beginPath();ctx.moveTo(mx-bw/2,baseY);ctx.lineTo(mx-tw2/2,top+mH*.05);
  ctx.quadraticCurveTo(mx,top-mH*.03,mx+tw2/2,top+mH*.05);ctx.lineTo(mx+bw/2,baseY);ctx.closePath();ctx.fill();
  // 底座
  ctx.fillStyle='#4a2f1c';ctx.fillRect(mx-bw/2-mH*.02,baseY-mH*.035,bw+mH*.04,mH*.035);
  // 前面的槽
  const sTop=top+mH*.12,sBot=baseY-mH*.13,sw1=mH*.08,sw2=mH*.2;
  ctx.fillStyle='#efe4cf';
  ctx.beginPath();ctx.moveTo(mx-sw2/2,sBot);ctx.lineTo(mx-sw1/2,sTop);ctx.lineTo(mx+sw1/2,sTop);ctx.lineTo(mx+sw2/2,sBot);ctx.closePath();ctx.fill();
  // 刻度
  ctx.strokeStyle='rgba(90,60,30,.45)';ctx.lineWidth=1;
  for(let i=0;i<=16;i++){const y=lerp(sBot-mH*.04,sTop+mH*.04,i/16),hw=lerp(sw2,sw1,(y-sBot)/(sTop-sBot))/2*.55;
    ctx.beginPath();ctx.moveTo(mx-hw*(i%4===0?1:.55),y);ctx.lineTo(mx-hw*.15,y);ctx.stroke();}
  // 摆杆（倒摆，支点在下）
  const px=mx,py=baseY-mH*.1,len=mH*1.0;
  ctx.save();ctx.translate(px,py);ctx.rotate(angle);
  ctx.strokeStyle='#3b3b3d';ctx.lineWidth=Math.max(2,mH*.012);ctx.lineCap='round';
  ctx.beginPath();ctx.moveTo(0,0);ctx.lineTo(0,-len);ctx.stroke();
  // 砝码
  const d=lerp(.26,.9,tw)*len,wh=mH*.075,ww=mH*.085;
  const wg=ctx.createLinearGradient(-ww,0,ww,0);wg.addColorStop(0,'#c98a2c');wg.addColorStop(.5,'#f0c060');wg.addColorStop(1,'#a8701e');
  ctx.fillStyle=wg;
  ctx.beginPath();ctx.moveTo(-ww*.7,-d+wh/2);ctx.lineTo(-ww*.45,-d-wh/2);ctx.lineTo(ww*.45,-d-wh/2);ctx.lineTo(ww*.7,-d+wh/2);ctx.closePath();ctx.fill();
  ctx.fillStyle='rgba(255,255,255,'+(.15+flash*.25)+')';ctx.fillRect(-ww*.4,-d-wh*.35,ww*.25,wh*.6);
  ctx.restore();
  // 支点盖
  ctx.fillStyle='#4a2f1c';ctx.beginPath();ctx.arc(px,py,mH*.022,0,Math.PI*2);ctx.fill();
  ctx.restore();
}

/* ---------- loop ---------- */
function frame(now){
  const dt=Math.min(.05,(now-lastNow)/1000);lastNow=now;
  const bpm=bpmOf(t);
  const targetCalm=clamp((140-bpm)/(140-96));
  calm+=(targetCalm-calm)*Math.min(1,dt*1.6);

  if(started){
    phase+=dt*bpm/60;
    const b=Math.floor(phase);
    if(b>lastBeat){
      lastBeat=b;tick();beatFlash=1;
      if(!arrived){
        if(bpm<=102&&dragged)slowBeats++;else slowBeats=0;
        if(slowBeats>=4){arrived=true;noteEl.style.opacity=0;lineTimer=1.2;}
      }
      const wp=clamp((bpm-108)/60);
      if(wp>0&&Math.random()<wp*1.1)spawnWorry();
      if(wp>.55&&Math.random()<wp*.6)spawnWorry();
    }
  }
  beatFlash=Math.max(0,beatFlash-dt*5);
  if(arrived)L=Math.min(1,L+dt/3.2);
  const Lv=ease(L);
  const vivid=Lv*lerp(.35,1,calm);

  // 台词
  if(arrived){
    if(calm>.8){
      if(fastAgain){fastAgain=false;linesEl.style.opacity=1;noteEl.style.opacity=0;}
      lineTimer-=dt;
      if(lineTimer<=0&&lineIdx<LINES.length){LINES[lineIdx].el.classList.add('on');lineIdx++;lineTimer=lineIdx===2||lineIdx===5?3.6:2.7;}
      if(lineIdx>=LINES.length)shadowRecede=Math.min(1,shadowRecede+dt/40);
      if(bpm<62&&!stopNoteShown&&lineIdx>=LINES.length){stopNoteShown=true;noteEl.style.top='';
        setNote('也可以停一下。<br>海又不会走。',.545);}
      if(bpm>=66&&stopNoteShown&&noteEl.dataset.k==='stop'){noteEl.style.opacity=0;noteEl.dataset.k='';stopNoteShown=false;}
    }else if(calm<.45&&!fastAgain){
      fastAgain=true;linesEl.style.opacity=0;
      setNote('又快起来了也没关系。<br>往上推一推就好。',.18,'fast');
    }
  }

  // 画
  const c=calm;
  drawSkyFlat(c,Lv);
  const beatPos=phase;walkDt=started?dt:0;curBpm=bpm;
  drawLand(vivid,c,beatPos,now);
  drawShadow(vivid,shadowRecede);
  // 节拍器的位置：一开始站在正中，后来退到前景的树影里
  const mH=lerp(Math.min(H*.46,W*1.05),Math.min(H*.25,W*.62),Lv);
  const baseY=lerp(H*.73,H*.92,Lv);
  const mx=W/2;
  drawOranges(vivid,mx,baseY,mH);
  const amp=started?lerp(.36,.3,c):0;
  const angle=amp*Math.cos(Math.PI*phase);
  drawMetronome(mx,baseY,mH,angle,t,c,beatFlash);

  // 档位字
  zoneEl.textContent=started?zoneOf(bpm):'轻点一下';
  zoneEl.style.top=(baseY+lerp(18,10,Lv))+'px';
  zoneEl.style.color=Lv>.5?'rgba(235,225,200,.85)':'#5b5040';
  zoneEl.style.letterSpacing=started?'.4em':'.25em';
  if(!arrived&&!fastAgain){noteEl.style.top=(H*.1)+'px';}
  requestAnimationFrame(frame);
}
function setNote(html,topFrac,k){noteEl.innerHTML=html;noteEl.style.top=(H*topFrac)+'px';noteEl.style.opacity=1;noteEl.dataset.k=k||'stop';
  noteEl.style.color=k==='fast'?'#4a4a4a':'#3a3226';}
function drawSkyFlat(c,Lv){
  const top0=mix('#cdd2d4','#eadcc4',c), bot0=mix('#e1dfda','#f3e5cc',c);
  const g=ctx.createLinearGradient(0,0,0,H);
  g.addColorStop(0,mixRGB(top0,'#a7c2d6',Lv));
  g.addColorStop(.25,mixRGB(top0,'#c6d0d2',Lv));
  g.addColorStop(.43,mixRGB(bot0,'#f1d7b4',Lv));
  g.addColorStop(1,bot0);
  ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
}
function mixRGB(a,bHex,t){const A=parseRGB(a),B=hex(bHex);return`rgb(${A.map((v,i)=>Math.round(lerp(v,B[i],t))).join(',')})`;}
requestAnimationFrame(frame);

document.addEventListener('visibilitychange',()=>{if(ac){document.hidden?ac.suspend():ac.resume();}lastNow=performance.now();});
})();
</script>
