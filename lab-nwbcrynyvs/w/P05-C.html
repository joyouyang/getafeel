<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>寄过去</title>
<style>
  html,body{margin:0;height:100%;background:#9cca82;overflow:hidden;
    font-family:-apple-system,"PingFang SC","Hiragino Sans GB","Noto Sans CJK SC","Microsoft YaHei",sans-serif;
    -webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
  #app{position:relative;margin:0 auto;max-width:460px;height:100%;height:100dvh}
  svg#scene{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
  #words{position:absolute;left:0;right:0;top:0;padding:calc(env(safe-area-inset-top) + 34px) 28px 0;
    color:#fff;font-size:19px;line-height:1.75;letter-spacing:.04em;text-shadow:0 1px 8px rgba(40,90,30,.25);pointer-events:none}
  #words p{margin:0;opacity:0;transform:translateY(6px);transition:opacity 1.1s ease,transform 1.1s ease}
  #words p.on{opacity:1;transform:none}
  #words p.small{font-size:14px;opacity:0;letter-spacing:.06em}
  #words p.small.on{opacity:.82}
  #bar{position:absolute;left:16px;right:16px;bottom:calc(env(safe-area-inset-bottom) + 18px);
    display:flex;align-items:center;gap:10px;padding:9px 9px 9px 18px;border-radius:30px;
    background:rgba(255,255,255,.32);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);
    box-shadow:0 2px 18px rgba(30,80,20,.12)}
  #draft{flex:1;min-height:24px;color:#2f4a26;font-size:17px;white-space:nowrap;overflow:hidden}
  #caret{display:inline-block;width:2px;height:19px;background:#3f8a33;vertical-align:-3px;margin-left:1px;animation:blink 1s steps(1) infinite}
  @keyframes blink{50%{opacity:0}}
  #send{flex:none;width:44px;height:44px;border-radius:50%;border:0;background:#3dbd5c;color:#fff;
    display:flex;align-items:center;justify-content:center;cursor:pointer;box-shadow:0 2px 8px rgba(20,90,30,.25);
    transition:transform .15s ease, background .3s}
  #send:active{transform:scale(.9)}
  #send[disabled]{background:#8bbf86;cursor:default}
  #tip{position:absolute;pointer-events:none;padding:6px 11px;border-radius:12px;background:rgba(255,255,255,.88);
    color:#33502b;font-size:13px;white-space:nowrap;opacity:0;transform:translate(-50%,-100%);transition:opacity .35s}
  #tip.on{opacity:1}
  .cap{font-size:11px;fill:#fff;letter-spacing:.05em}
</style>
</head>
<body>
<div id="app">
  <svg id="scene" viewBox="0 0 390 780" preserveAspectRatio="xMidYMid meet">
    <defs>
      <linearGradient id="fadeG" gradientUnits="userSpaceOnUse" x1="230" y1="330" x2="395" y2="130">
        <stop offset="0" stop-color="#fff"/><stop offset="1" stop-color="#000"/>
      </linearGradient>
      <mask id="fade" maskUnits="userSpaceOnUse" x="-800" y="-400" width="2000" height="1800">
        <rect x="-800" y="-400" width="2000" height="1800" fill="url(#fadeG)"/>
      </mask>
      <radialGradient id="glow"><stop offset="0" stop-color="#fffbe8"/><stop offset=".35" stop-color="#fff2b8" stop-opacity=".9"/><stop offset="1" stop-color="#fff2b8" stop-opacity="0"/></radialGradient>
      <filter id="soft" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="1.2"/></filter>
    </defs>
    <g id="band" mask="url(#fade)"></g>
    <g id="trail"></g>
    <g id="clocks"></g>
    <g id="sparks"></g>
  </svg>
  <div id="words"></div>
  <div id="tip"></div>
  <div id="bar">
    <div id="draft"><span id="txt"></span><span id="caret"></span></div>
    <button id="send" aria-label="发送">
      <svg width="20" height="20" viewBox="0 0 20 20"><path d="M10 16V4M4.5 9.5 10 4l5.5 5.5" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
  </div>
</div>
<script>
(function(){
const NS='http://www.w3.org/2000/svg';
const $=id=>document.getElementById(id);
function el(tag,attrs,parent){const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);if(parent)parent.appendChild(e);return e;}

/* ---------- 一条往远处去的彩虹 ---------- */
const C=t=>({x:-20+390*t,y:640-470*t});          // 中线
const W=t=>Math.max(240-200*t,30);                 // 宽度，越远越窄
const COLORS=['#7fbd5c','#f4bb45','#ee8c38','#e04a42','#9a529b','#3f9bd8'];
(function drawBand(){
  const g=$('band'),N=60,t0=-1.4,t1=1.12;
  COLORS.forEach((col,i)=>{
    const top=[],bot=[];
    for(let k=0;k<=N;k++){
      const t=t0+(t1-t0)*k/N,c=C(t),w=W(t);
      top.push([c.x,c.y-w/2+w*i/6]);bot.push([c.x,c.y-w/2+w*(i+1)/6]);
    }
    const pts=top.concat(bot.reverse()).map(p=>p[0].toFixed(1)+','+p[1].toFixed(1)).join(' ');
    el('polygon',{points:pts,fill:col},g);
  });
})();

/* ---------- 钟 ---------- */
const ME={tz:'Asia/Shanghai',t:.25,r:50,me:true};
const FAR=[
  {tz:'Europe/Amsterdam',t:.56,r:31},
  {tz:'Europe/London',t:.78,r:23},
  {tz:'America/Los_Angeles',t:.94,r:16}
];
const ALL=[ME].concat(FAR);

function timeIn(tz){
  try{
    const p=new Intl.DateTimeFormat('en-GB',{timeZone:tz,hour:'2-digit',minute:'2-digit',second:'2-digit',hourCycle:'h23'}).formatToParts(new Date());
    const g=k=>+p.find(x=>x.type===k).value;
    return {h:g('hour'),m:g('minute'),s:g('second')};
  }catch(e){const d=new Date();return {h:d.getHours(),m:d.getMinutes(),s:d.getSeconds()};}
}
const isDay=h=>h>=6&&h<18;
function doing(h){
  if(h<5)return '睡着呢';
  if(h<7)return '快醒了吧';
  if(h<9)return '在出门吧';
  if(h<12)return '在忙吧';
  if(h<14)return '在吃饭吧';
  if(h<18)return '下午了';
  if(h<21)return '晚饭了吧';
  return '该睡了';
}
const pad=n=>(n<10?'0':'')+n;

ALL.forEach((c,idx)=>{
  const p=C(c.t);c.x=p.x;c.y=p.y-(c.me?14:0);
  const g=el('g',{transform:`translate(${c.x},${c.y})`,style:'cursor:pointer'},$('clocks'));
  c.g=g;
  c.halo=el('circle',{r:c.r*1.9,fill:'url(#glow)',opacity:0},g);
  el('circle',{r:c.r+2.5,fill:'rgba(0,0,0,.12)',cy:1.5,filter:'url(#soft)'},g);
  c.face=el('circle',{r:c.r,fill:'#222'},g);
  c.ticks=[];
  for(let i=0;i<12;i++){
    const a=i*Math.PI/6,r1=c.r*.8,r2=c.r*(i%3?0.88:0.92);
    c.ticks.push(el('line',{x1:Math.sin(a)*r1,y1:-Math.cos(a)*r1,x2:Math.sin(a)*r2,y2:-Math.cos(a)*r2,'stroke-width':Math.max(c.r/28,0.7),'stroke-linecap':'round'},g));
  }
  c.hh=el('line',{x1:0,y1:0,x2:0,y2:-c.r*.5,'stroke-width':c.r*.075,'stroke-linecap':'round'},g);
  c.mh=el('line',{x1:0,y1:0,x2:0,y2:-c.r*.76,'stroke-width':c.r*.05,'stroke-linecap':'round'},g);
  c.sh=el('line',{x1:0,y1:c.r*.14,x2:0,y2:-c.r*.82,stroke:'#f39a1d','stroke-width':Math.max(c.r*.022,.6),'stroke-linecap':'round'},g);
  el('circle',{r:c.r*.05,fill:'#f39a1d'},g);
  // 未读小红点
  c.badge=el('g',{transform:`translate(${c.r*.74},${-c.r*.74}) scale(0)`},g);
  const br=Math.max(c.r*.3,8.5);
  el('circle',{r:br,fill:'#f2443a',stroke:'#fff','stroke-width':1.2},c.badge);
  c.bt=el('text',{'text-anchor':'middle','dominant-baseline':'central',fill:'#fff','font-size':br*1.15,'font-weight':600},c.badge);
  c.count=0;
  // 说明
  const capY=c.r+(c.me?18:13);
  c.cap=el('text',{class:'cap',x:0,y:capY,'text-anchor':'middle','font-size':c.me?13:Math.max(10.5,c.r*.42)},g);
  g.addEventListener('click',e=>{e.stopPropagation();showTip(c);});
});

function tick(){
  ALL.forEach(c=>{
    const t=timeIn(c.tz),day=isDay(t.h);
    c.now=t;c.day=day;
    c.face.setAttribute('fill',day?'#fbfbf7':'#1f1f22');
    const ink=day?'#1c1c1c':'#f2f2f2';
    c.ticks.forEach(l=>l.setAttribute('stroke',day?'#555':'#9a9a9a'));
    c.hh.setAttribute('stroke',ink);c.mh.setAttribute('stroke',ink);
    c.hh.setAttribute('transform',`rotate(${(t.h%12)*30+t.m*.5})`);
    c.mh.setAttribute('transform',`rotate(${t.m*6+t.s*.1})`);
    c.sh.setAttribute('transform',`rotate(${t.s*6})`);
    c.cap.textContent=c.me?'我这边':(c.count?(day?'会看到的':'醒来会看到'):doing(t.h));
    if(c.me&&c.count)c.cap.textContent='有人回了';
  });
}
tick();setInterval(tick,1000);

/* ---------- 点钟看一眼那边 ---------- */
let tipTimer;
function showTip(c){
  const tip=$('tip'),svg=$('scene'),pt=svg.createSVGPoint();
  pt.x=c.x;pt.y=c.y-c.r-8;
  const m=svg.getScreenCTM(),s=pt.matrixTransform(m),box=$('app').getBoundingClientRect();
  const t=c.now;
  tip.textContent=c.me?`这边 ${pad(t.h)}:${pad(t.m)}，${c.day?'亮着':'黑着'}`:
    `那边 ${pad(t.h)}:${pad(t.m)}，${c.count?'有'+c.count+'条等着看':doing(t.h)}`;
  let x=s.x-box.left;x=Math.min(Math.max(x,90),box.width-90);
  tip.style.left=x+'px';tip.style.top=(s.y-box.top)+'px';
  tip.classList.add('on');clearTimeout(tipTimer);tipTimer=setTimeout(()=>tip.classList.remove('on'),2200);
}

/* ---------- 顶上的话 ---------- */
const words=$('words');
function say(text,cls,delay){
  return new Promise(res=>setTimeout(()=>{
    const p=document.createElement('p');p.textContent=text;if(cls)p.className=cls;
    words.appendChild(p);requestAnimationFrame(()=>requestAnimationFrame(()=>p.classList.add('on')));
    res();
  },delay||0));
}
function clearWords(){
  [...words.children].forEach(p=>{p.classList.remove('on');});
  return new Promise(r=>setTimeout(()=>{words.innerHTML='';r();},900));
}
(function opening(){
  const far=FAR.map(c=>c.now),dark=FAR.filter(c=>!c.day).length;
  let line;
  if(ME.day&&dark===FAR.length)line='这边亮着，那边都还黑着，';
  else if(!ME.day&&dark===0)line='这边黑了，那边倒都亮着，';
  else if(ME.day)line='这边亮着，那边有的还黑着，';
  else line='这边已经黑了，那边还各过各的钟点，';
  say(line,'',400);
  say('想说点什么，','',1600);
})();

/* ---------- 打字、删掉、再打 ---------- */
const DRAFTS=['发点什么好呢','在干嘛','那个……','想不出来，','嗯，随便说一句吧','算了，不想了'];
const txt=$('txt');
let typing=true,di=0;
function sleep(ms){return new Promise(r=>setTimeout(r,ms));}
let gen=0;
async function typeLoop(){
  const me=++gen,alive=()=>typing&&gen===me;
  await sleep(2600);
  while(alive()){
    const s=DRAFTS[di%DRAFTS.length];di++;
    for(const ch of s){if(!alive())return;txt.textContent+=ch;await sleep(150+Math.random()*120);}
    await sleep(1100);
    while(txt.textContent.length){if(!alive())return;txt.textContent=txt.textContent.slice(0,-1);await sleep(55);}
    await sleep(500);
  }
}
typeLoop();

/* ---------- 光沿着彩虹走 ---------- */
function flight(from,to,dur,hueStart){
  return new Promise(res=>{
    const t0=performance.now(),a=from.t,b=to.t;
    const lift=(to.me?-1:1)*18;
    const dot=el('g',{},$('sparks'));
    el('circle',{r:16,fill:'url(#glow)'},dot);
    el('circle',{r:3.6,fill:'#fff'},dot);
    let lastSpark=0,k=0;
    function step(now){
      let u=Math.min((now-t0)/dur,1);
      const e=u<.5?2*u*u:1-Math.pow(-2*u+2,2)/2;
      const tt=a+(b-a)*e,p=C(tt);
      const y=p.y+ (from.me?-14:0)*(1-e)+(to.me?-14:0)*e - Math.sin(Math.PI*e)*lift;
      const sc=Math.max(0.45,1-tt*.55);
      dot.setAttribute('transform',`translate(${p.x},${y}) scale(${sc})`);
      if(now-lastSpark>38){
        lastSpark=now;k++;
        const s=el('circle',{cx:p.x+(Math.random()-.5)*6,cy:y+(Math.random()-.5)*6,r:(1.4+Math.random()*1.6)*sc,fill:COLORS[(k+hueStart)%6]},$('trail'));
        fadeOut(s,900+Math.random()*500);
      }
      if(u<1)requestAnimationFrame(step);else{dot.remove();res();}
    }
    requestAnimationFrame(step);
  });
}
function fadeOut(node,ms){
  const t0=performance.now();
  (function f(now){const u=(now-t0)/ms;if(u>=1){node.remove();return;}
    node.setAttribute('opacity',1-u);node.setAttribute('transform',`translate(0,${u*6})`);requestAnimationFrame(f);})(t0);
}
function arrive(c){
  c.count++;c.bt.textContent=c.count>99?'…':c.count;
  const bx=c.r*.74,by=-c.r*.74,t0=performance.now();
  (function pop(now){const u=Math.min((now-t0)/420,1);const s=u<.6?u/.6*1.25:1.25-(u-.6)/.4*.25;
    c.badge.setAttribute('transform',`translate(${bx},${by}) scale(${s})`);if(u<1)requestAnimationFrame(pop);})(t0);
  const t1=performance.now();
  (function halo(now){const u=Math.min((now-t1)/1400,1);c.halo.setAttribute('opacity',(u<.25?u/.25:1-(u-.25)/.75)*.95);
    if(u<1)requestAnimationFrame(halo);})(t1);
  tick();
  if(navigator.vibrate)try{navigator.vibrate(12);}catch(e){}
}

let round=0,busy=false;
$('send').addEventListener('click',async()=>{
  if(busy)return;busy=true;$('send').disabled=true;
  typing=false;round++;
  // 没打完的草稿化成光
  const t=txt.textContent;
  for(let i=t.length;i>=0;i--){txt.textContent=t.slice(0,i);await sleep(25);}
  $('caret').style.visibility='hidden';
  await clearWords();
  if(round===1){
    say('想了半天，也没想好说什么，','',100);
    say('那就先寄过去吧，','',1300);
  }else if(round===2){
    say('又寄了一次，','',100);
    say('反正这种东西不嫌多，','',1200);
  }else{
    say(['再来一遍，','还是寄，','多寄点，'][round%3],'',100);
  }
  await sleep(round===1?2000:900);
  for(let i=0;i<FAR.length;i++){
    await flight(ME,FAR[i],round===1?1700+i*350:1100+i*200,i*2);
    arrive(FAR[i]);
    await sleep(round===1?350:150);
  }
  if(round===1){
    const anyDark=FAR.some(c=>!c.day);
    await say(anyDark?'等那边天亮，':'等那边看手机，','',500);
    await say('会有人看着屏幕笑一下的，','',1500);
    await sleep(2600);
    // 有一束光回来了
    const back=FAR.find(c=>c.day)||FAR[0];
    await flight(back,ME,2200,3);
    arrive(ME);
    await sleep(700);
    await clearWords();
    say('你看，','',100);
    say('那边也有人惦记着你这边几点，','',1200);
    say('能这样，运气真的好','',2900);
    say('再按一下，还能接着寄','small',5200);
  }else{
    await sleep(600);
  }
  busy=false;$('send').disabled=false;
  // 还是想不好说什么，接着打、接着删
  $('caret').style.visibility='visible';txt.textContent='';typing=true;typeLoop();
});
document.addEventListener('touchmove',e=>e.preventDefault(),{passive:false});
})();
</script>
</body>
</html>
