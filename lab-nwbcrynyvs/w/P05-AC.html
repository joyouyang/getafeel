<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#9cca84">
<title>抽支签</title>
<style>
  :root{
    --field:#9cca84;
    --field-deep:#8bbd72;
    --ink:#2f3b2a;
    --ink-soft:rgba(47,59,42,.55);
    --paper:#fbf7ec;
    --s1:#7cb55c; --s2:#f4bd47; --s3:#ee8a36; --s4:#e44a41; --s5:#9a4f9c; --s6:#4b9bd9;
    --serif:"Songti SC","STSong","Noto Serif SC","Source Han Serif SC","SimSun",serif;
    --sans:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;background:var(--field);color:var(--ink);font-family:var(--sans);overflow:hidden}
  body{-webkit-user-select:none;user-select:none}

  .scene{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;
    padding:max(28px,env(safe-area-inset-top)) 24px max(28px,env(safe-area-inset-bottom));
    opacity:0;pointer-events:none;transition:opacity .7s ease}
  .scene.on{opacity:1;pointer-events:auto}
  .wrap{width:100%;max-width:400px;margin:0 auto}

  /* ---------- 1 form ---------- */
  #s1{justify-content:center}
  .slip{background:var(--paper);border-radius:4px;padding:30px 26px 26px;
    box-shadow:0 1px 0 rgba(0,0,0,.04),0 18px 40px -22px rgba(40,70,30,.45)}
  .slip h1{font-family:var(--serif);font-weight:600;font-size:26px;letter-spacing:.3em}
  .slip .sub{margin-top:10px;font-size:14px;color:var(--ink-soft);line-height:1.7}
  .row{display:flex;align-items:flex-end;gap:14px;margin-top:26px;font-family:var(--serif);font-size:16px}
  .row label{flex:none;width:3em;letter-spacing:.2em}
  .row .line{flex:1;height:26px;border-bottom:1px solid rgba(47,59,42,.35);position:relative}
  .row .line::after{content:"";position:absolute;left:0;right:100%;top:55%;height:1.5px;background:var(--ink);
    transition:right .5s cubic-bezier(.6,.1,.2,1)}
  .slip.refused .row .line::after{right:0}
  .slip.refused .row:nth-of-type(2) .line::after{transition-delay:.18s}
  .btns{margin-top:34px;display:flex;justify-content:flex-end}
  button{font:inherit;border:0;background:none;color:inherit;cursor:pointer}
  .pill{font-size:15px;padding:11px 26px;border-radius:999px;background:var(--ink);color:var(--paper);letter-spacing:.15em;transition:opacity .3s,transform .15s}
  .pill:active{transform:scale(.96)}
  .say{min-height:5.6em;margin-top:28px;font-size:16px;line-height:1.8;text-align:center;color:var(--ink)}
  .say p{opacity:0;transform:translateY(6px);transition:all .6s ease}
  .say p.in{opacity:1;transform:none}

  /* ---------- 2 tube ---------- */
  #s2{justify-content:center}
  #tubeBox{position:relative;width:200px;height:460px;cursor:pointer;touch-action:manipulation}
  #tube{width:100%;height:100%;overflow:visible;transform-origin:50% 85%}
  #tube.shake{animation:shake .32s ease}
  @keyframes shake{
    0%{transform:rotate(0)}20%{transform:rotate(-9deg) translateX(-4px)}45%{transform:rotate(7deg) translateX(3px)}
    70%{transform:rotate(-4deg)}100%{transform:rotate(0)}}
  .stick{transition:transform .18s ease}
  #lucky{transition:transform .35s cubic-bezier(.3,1.4,.5,1)}
  #flyStick{position:absolute;left:50%;top:40px;width:14px;height:190px;margin-left:-7px;border-radius:3px;
    opacity:0;pointer-events:none}
  #flyStick.out{pointer-events:auto;cursor:pointer}
  .hint{margin-top:-10px;font-size:14px;color:var(--ink-soft);letter-spacing:.1em;min-height:1.6em;text-align:center;transition:opacity .4s}
  .note{font-size:15px;color:var(--ink);min-height:1.6em;margin-bottom:22px;text-align:center;transition:opacity .4s}

  /* ---------- 3 card ---------- */
  #s3{overflow-y:auto;-webkit-overflow-scrolling:touch;justify-content:flex-start;padding-top:max(36px,env(safe-area-inset-top))}
  #band{position:fixed;left:50%;top:52%;width:240vmax;height:min(300px,40vh);margin-left:-120vmax;margin-top:calc(min(300px,40vh) / -2);
    transform:rotate(-24deg);pointer-events:none;z-index:0}
  #band .in{width:100%;height:100%;display:flex;flex-direction:column;transform:scaleX(0);transform-origin:0 50%}
  #band i{flex:1}
  #band.go .in{transform:scaleX(1);transition:transform 1.6s cubic-bezier(.7,0,.2,1)}
  .card{position:relative;z-index:1;background:var(--paper);border-radius:4px;padding:26px 24px 26px;
    box-shadow:0 26px 60px -26px rgba(30,40,30,.55);opacity:0;transform:translateY(24px) scale(.98);
    transition:opacity .9s ease .9s,transform .9s ease .9s}
  #s3.on .card.show{opacity:1;transform:none}
  .head{display:flex;justify-content:space-between;align-items:center;font-family:var(--serif)}
  .head .no{font-size:15px;letter-spacing:.35em;color:var(--ink-soft)}
  .seal{font-family:var(--serif);font-size:17px;font-weight:700;color:#c8433a;border:2px solid #c8433a;
    padding:6px 5px;border-radius:3px;writing-mode:vertical-rl;letter-spacing:.15em;line-height:1;transform:rotate(4deg)}
  .poem{margin:20px auto 4px;font-family:var(--serif);font-size:22px;display:flex;flex-direction:row-reverse;
    justify-content:center;gap:1.15em;width:100%}
  .poem span{display:block;writing-mode:vertical-rl;letter-spacing:.5em;line-height:1;opacity:0;transition:opacity 1.2s ease}
  .poem span:last-child{color:#2a3526}
  .poem span.in{opacity:1}
  .rule{height:1px;background:rgba(47,59,42,.18);margin:20px 0}
  .tag{font-family:var(--serif);font-size:14px;letter-spacing:.3em;color:var(--ink-soft);margin-bottom:10px}
  .jie p{font-size:16px;line-height:1.9}
  .jie p+p{margin-top:8px}
  .yj{display:grid;grid-template-columns:auto 1fr;gap:12px 14px;align-items:start}
  .yj b{font-family:var(--serif);font-size:15px;width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;
    color:var(--paper);background:var(--s1);font-weight:600}
  .yj b.ji{background:#8a8f86}
  .yj ul{list-style:none;font-size:15px;line-height:1.75}
  .yj li+li{margin-top:5px}
  .reveal{opacity:0;transform:translateY(8px);transition:all .8s ease}
  .reveal.in{opacity:1;transform:none}
  .foot{display:flex;justify-content:space-between;align-items:center;margin-top:26px}
  .foot small{font-size:13px;color:var(--ink-soft);letter-spacing:.1em}
  .ghost{font-size:14px;padding:9px 18px;border-radius:999px;border:1px solid rgba(47,59,42,.35);letter-spacing:.1em}
  .ghost:active{transform:scale(.96)}
  .again{position:relative;z-index:1;text-align:center;font-size:15px;margin-bottom:14px;min-height:1.6em;color:var(--ink)}
  .sun{display:flex;gap:7px;align-items:center}
  .sun i{width:9px;height:9px;border-radius:50%;background:#3a4436}
  .sun i:first-child{background:#fff;box-shadow:0 0 0 1px rgba(47,59,42,.25)}
  .spacer{flex:none;height:40px}

  @media (max-width:350px){ .poem{font-size:19px} .card{padding:22px 18px} }
</style>
</head>
<body>

<!-- 1 -->
<section class="scene on" id="s1">
  <div class="wrap">
    <div class="slip" id="slip">
      <h1>抽支签</h1>
      <p class="sub">按老规矩，先报上名字，<br>再报生辰八字，精确到时辰。</p>
      <div class="row"><label>姓名</label><div class="line"></div></div>
      <div class="row"><label>生辰</label><div class="line"></div></div>
      <div class="btns"><button class="pill" id="refuse">不报</button></div>
    </div>
    <div class="say" id="say1">
      <p>行。</p>
      <p>不报的话，命是算不出来的。</p>
      <p>那就不算了，直接抽。</p>
    </div>
  </div>
</section>

<!-- 2 -->
<section class="scene" id="s2">
  <div class="note" id="note"></div>
  <div id="tubeBox">
    <svg id="tube" viewBox="0 -60 200 460" aria-label="签筒">
      <defs>
        <linearGradient id="bamboo" x1="0" x2="1">
          <stop offset="0" stop-color="#d9c08a"/><stop offset=".5" stop-color="#ecd9a8"/><stop offset="1" stop-color="#cdb279"/>
        </linearGradient>
        <linearGradient id="body" x1="0" x2="1">
          <stop offset="0" stop-color="#e9e3d2"/><stop offset=".45" stop-color="#fbf7ec"/><stop offset="1" stop-color="#d9d2bf"/>
        </linearGradient>
        <linearGradient id="rb" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#7cb55c"/><stop offset=".17" stop-color="#7cb55c"/>
          <stop offset=".17" stop-color="#f4bd47"/><stop offset=".34" stop-color="#f4bd47"/>
          <stop offset=".34" stop-color="#ee8a36"/><stop offset=".5" stop-color="#ee8a36"/>
          <stop offset=".5" stop-color="#e44a41"/><stop offset=".67" stop-color="#e44a41"/>
          <stop offset=".67" stop-color="#9a4f9c"/><stop offset=".84" stop-color="#9a4f9c"/>
          <stop offset=".84" stop-color="#4b9bd9"/><stop offset="1" stop-color="#4b9bd9"/>
        </linearGradient>
        <clipPath id="mouth"><rect x="0" y="-200" width="200" height="368"/></clipPath>
      </defs>
      <g id="sticks" clip-path="url(#mouth)"></g>
      <!-- tube -->
      <ellipse cx="100" cy="330" rx="56" ry="9" fill="rgba(40,60,30,.18)"/>
      <path d="M44 160 L50 318 Q100 334 150 318 L156 160 Z" fill="url(#body)"/>
      <ellipse cx="100" cy="160" rx="56" ry="13" fill="#d8d0bb"/>
      <ellipse cx="100" cy="160" rx="49" ry="9.5" fill="#6d6655"/>
      <path d="M47 196 Q100 210 153 196" stroke="#9cca84" stroke-width="5" fill="none"/>
      <path d="M49 286 Q100 300 151 286" stroke="#9cca84" stroke-width="5" fill="none"/>
    </svg>
    <div id="flyStick"></div>
  </div>
  <div class="hint" id="hint">点它，摇一摇</div>
</section>

<!-- 3 -->
<div id="band"><div class="in"><i style="background:var(--s1)"></i><i style="background:var(--s2)"></i><i style="background:var(--s3)"></i><i style="background:var(--s4)"></i><i style="background:var(--s5)"></i><i style="background:var(--s6)"></i></div></div>
<section class="scene" id="s3">
  <div class="wrap">
    <div class="again" id="again"></div>
    <div class="card" id="card">
      <div class="head">
        <span class="no">无号签</span>
        <span class="seal">自定</span>
      </div>
      <div class="poem" id="poem">
        <span>静了铃声锁了门</span>
        <span>不留名姓不留辰</span>
        <span>此间正午他乡夜</span>
        <span>一开口便是真心</span>
      </div>
      <div class="rule"></div>
      <div class="reveal">
        <div class="tag">解曰</div>
        <div class="jie">
          <p>怎么解呢，说不太上来，反正是好的，好得有点不讲理</p>
          <p>别人的运气要掐着时辰算，你的不用，你说了就算</p>
        </div>
      </div>
      <div class="rule reveal"></div>
      <div class="yj reveal">
        <b>宜</b>
        <ul>
          <li>把日子料理妥当，连坏运气都提前上好保险</li>
          <li>白天的时候，顺手惦记一下天黑那边的人</li>
          <li>想不好说什么的时候，就说心里那句</li>
          <li>空一块地方，留给还没来的好事</li>
        </ul>
        <b class="ji">忌</b>
        <ul>
          <li>把生辰交给别人去算</li>
        </ul>
      </div>
      <div class="foot reveal">
        <div class="sun" title="这边亮着，那边睡着"><i></i><i></i><i></i><i></i></div>
        <button class="ghost" id="reshake">再摇一次</button>
      </div>
    </div>
    <div class="spacer"></div>
  </div>
</section>

<script>
(function(){
  var $ = function(id){return document.getElementById(id)};
  function wait(ms){return new Promise(function(r){setTimeout(r,ms)})}
  function show(id){
    document.querySelectorAll('.scene').forEach(function(s){s.classList.toggle('on', s.id===id)});
  }

  /* ---- scene 1 ---- */
  var refused=false;
  $('refuse').addEventListener('click', async function(){
    if(refused) return; refused=true;
    $('slip').classList.add('refused');
    this.style.opacity=.25;
    var ps=$('say1').querySelectorAll('p');
    await wait(700);  ps[0].classList.add('in');
    await wait(1100); ps[1].classList.add('in');
    await wait(1500); ps[2].classList.add('in');
    await wait(1700);
    show('s2');
  });

  /* ---- scene 2: tube ---- */
  var NS='http://www.w3.org/2000/svg';
  var sticksG=$('sticks');
  var xs=[66,76,86,94,102,110,118,127,136];   // 九支
  var luckyIndex=4, sticks=[], lucky;
  xs.forEach(function(x,i){
    var g=document.createElementNS(NS,'g'); g.setAttribute('class','stick');
    var h=118+((i*37)%23), top=160-h+ (i%3)*6;
    var r=document.createElementNS(NS,'rect');
    r.setAttribute('x',x-4); r.setAttribute('y',top); r.setAttribute('width',8); r.setAttribute('height',200);
    r.setAttribute('rx',2);
    var rot=(i-4)*2.6;
    g.setAttribute('transform','rotate('+rot+' 100 300)');
    if(i===luckyIndex){
      r.setAttribute('fill','#efe6cf');
      var tip=document.createElementNS(NS,'rect');
      tip.setAttribute('x',x-4); tip.setAttribute('y',top); tip.setAttribute('width',8); tip.setAttribute('height',34); tip.setAttribute('rx',2);
      tip.setAttribute('fill','url(#rb)');
      g.appendChild(r); g.appendChild(tip); g.id='lucky'; lucky=g;
    } else {
      r.setAttribute('fill','url(#bamboo)');
      r.setAttribute('stroke','rgba(120,90,40,.25)'); r.setAttribute('stroke-width','.6');
      g.appendChild(r);
    }
    g.dataset.rot=rot;
    sticksG.appendChild(g); sticks.push(g);
  });
  // put lucky stick in back so it's not obviously first
  sticksG.insertBefore(lucky, sticksG.firstChild);

  var taps=0, NEED=9, done=false, busy=false, round=0;
  var tube=$('tube'), fly=$('flyStick');
  fly.style.background='linear-gradient(#7cb55c 0 4%,#f4bd47 0 8%,#ee8a36 0 12%,#e44a41 0 16%,#9a4f9c 0 20%,#4b9bd9 0 24%,#efe6cf 0)';

  function clack(){
    if(navigator.vibrate) try{navigator.vibrate(12)}catch(e){}
  }
  function jitter(){
    sticks.forEach(function(g){
      var rot=+g.dataset.rot + (Math.random()*6-3);
      var up = g===lucky ? -Math.min(taps,NEED)*7 : -(Math.random()*8);
      g.setAttribute('transform','translate(0 '+up+') rotate('+rot+' 100 300)');
    });
  }
  var hints=['点它，摇一摇','再摇','嗯，再来','快了','有一支冒头了','……','再一下'];
  $('tubeBox').addEventListener('click', async function(){
    if(done){ if(fly.classList.contains('out')) openCard(); return; }
    if(busy) return;
    taps++;
    tube.classList.remove('shake'); void tube.offsetWidth; tube.classList.add('shake');
    clack(); jitter();
    var k=Math.min(Math.floor(taps*hints.length/NEED),hints.length-1);
    if(taps>1) $('hint').textContent=hints[k];
    if(taps>=NEED){ done=true; busy=true; await wait(380); popOut(); }
  });

  function popOut(){
    lucky.style.opacity=0;
    $('hint').textContent='';
    fly.style.transition='none';
    fly.style.opacity=1;
    fly.style.transform='translateY(10px) rotate(0deg)';
    void fly.offsetWidth;
    fly.animate([
      {transform:'translateY(10px) rotate(0deg)'},
      {transform:'translateY(-160px) rotate(-200deg)',offset:.45},
      {transform:'translateY(300px) rotate(-450deg)'}
    ],{duration:1200,easing:'cubic-bezier(.3,.6,.4,1)',fill:'forwards'});
    setTimeout(function(){
      fly.classList.add('out'); busy=false;
      clack();
      $('hint').textContent='掉出来一支，点开看看';
    },1250);
  }

  /* ---- scene 3 ---- */
  var againLines=['','还是这支。','又是这支。','摇几次都是这支，没办法，你运气就是这么好'];
  async function openCard(){
    if(busy) return; busy=true;
    round++;
    $('again').textContent=againLines[Math.min(round-1,againLines.length-1)];
    show('s3');
    $('s3').scrollTop=0;
    var band=$('band');
    band.classList.remove('go'); void band.offsetWidth;
    band.classList.add('go');
    var card=$('card');
    card.classList.remove('show'); void card.offsetWidth; card.classList.add('show');
    var spans=$('poem').querySelectorAll('span');
    var rev=card.querySelectorAll('.reveal');
    spans.forEach(function(s){s.classList.remove('in')});
    rev.forEach(function(s){s.classList.remove('in')});
    await wait(1700);
    for(var i=0;i<spans.length;i++){ spans[i].classList.add('in'); await wait(i===spans.length-2?1300:850); }
    await wait(700);
    for(var j=0;j<rev.length;j++){ rev[j].classList.add('in'); await wait(650); }
    busy=false;
  }

  $('reshake').addEventListener('click', async function(e){
    e.stopPropagation();
    if(busy) return;
    var band=$('band');
    band.style.transition='opacity .6s'; band.style.opacity=0;
    show('s2');
    await wait(650);
    band.classList.remove('go'); band.style.transition=''; band.style.opacity='';
    // reset tube
    taps=0; done=false;
    fly.getAnimations().forEach(function(a){a.cancel()});
    fly.style.opacity=0; fly.classList.remove('out');
    lucky.style.opacity=1; jitter();
    $('note').textContent= round===1 ? '再来一次也行' : (round===2 ? '还摇？' : '摇吧');
    $('hint').textContent='点它，摇一摇';
  });
})();
</script>
</body>
</html>
