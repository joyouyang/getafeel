<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#a9c4dd">
<title>走着就好</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #a9c4dd; }
  body {
    font-family: "Songti SC", "Noto Serif SC", "Source Han Serif SC", "STSong", serif;
    color: #2b3346;
    touch-action: manipulation;
    -webkit-user-select: none; user-select: none;
    cursor: pointer;
  }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }

  /* 谱头：速度记号 */
  #mark {
    position: fixed;
    top: calc(env(safe-area-inset-top, 0px) + 22px);
    left: 22px;
    display: flex; align-items: baseline; gap: 8px;
    font-size: 19px; letter-spacing: .04em;
    color: #2b3346;
    pointer-events: none;
    transition: color 2s;
  }
  #mark .note { font-family: "Apple Symbols", "Segoe UI Symbol", serif; font-size: 22px; }
  #mark .word { position: relative; font-weight: 600; }
  #mark .strike {
    position: absolute; left: -6px; top: 50%; width: calc(100% + 12px); height: 14px;
    transform: translateY(-50%); overflow: visible;
  }
  #mark .strike path {
    fill: none; stroke: #6b6a66; stroke-width: 1.6; stroke-linecap: round;
    stroke-dasharray: 60; stroke-dashoffset: 60;
    transition: stroke-dashoffset .7s ease-out;
  }
  #mark.changed .strike path { stroke-dashoffset: 0; }
  #mark .pencil {
    font-family: "Kaiti SC", "STKaiti", "KaiTi", "Songti SC", serif;
    color: var(--pencil, #6b6a66); font-size: 22px;
    transform: rotate(-7deg) translateY(2px);
    opacity: 0; transition: opacity 1.2s .6s;
    display: inline-block;
  }
  #mark.changed .pencil { opacity: 1; }
  #mark .word { transition: color 1s; }
  #mark.changed .word { color: #8b8f99; }

  #mute {
    position: fixed;
    top: calc(env(safe-area-inset-top, 0px) + 14px);
    right: 14px;
    width: 40px; height: 40px; border-radius: 20px;
    border: none; background: rgba(255,255,255,.22);
    color: #2b3346; font-size: 17px;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer; z-index: 5;
    transition: background .3s, color 2s;
  }
  #mute.off { opacity: .45; }
  #mute.off::after {
    content: ""; position: absolute; width: 22px; height: 1.5px; background: currentColor;
    transform: rotate(-40deg);
  }

  /* 正文 */
  #text {
    position: fixed; left: 0; right: 0;
    top: 15vh; height: 34vh;
    padding: 0 28px;
    max-width: 620px; margin: 0 auto;
    display: flex; flex-direction: column; justify-content: flex-end;
    pointer-events: none;
  }
  .line {
    font-size: clamp(18px, 5.3vw, 27px);
    line-height: 1.7;
    letter-spacing: .06em;
    transition: opacity 1.2s, transform 1.2s, font-size 1.2s;
  }
  .line.old { opacity: .38; }
  .line.older { opacity: .14; }
  .line.gone { opacity: 0; }
  .chunk {
    display: inline-block; opacity: 0; transform: translateY(6px);
    animation: inchunk .9s ease-out forwards;
  }
  @keyframes inchunk { to { opacity: 1; transform: none; } }
  .line, #mark, #mute { color: var(--ink, #2b3346); }

  /* 抢拍时的喊叫 */
  .shout {
    position: fixed; pointer-events: none;
    font-family: "PingFang SC", "Hiragino Sans GB", "Heiti SC", sans-serif;
    font-weight: 900;
    color: #c8102e;
    white-space: nowrap;
    letter-spacing: -.02em;
    animation: shout 1.1s cubic-bezier(.2,1.4,.4,1) forwards;
    z-index: 3;
    text-shadow: 0 0 1px rgba(0,0,0,.15);
  }
  @keyframes shout {
    0%   { opacity: 0; transform: translate(-50%,-50%) rotate(var(--r)) scale(.4); }
    18%  { opacity: 1; transform: translate(-50%,-50%) rotate(var(--r)) scale(1.08); }
    55%  { opacity: .95; transform: translate(-50%,-50%) rotate(var(--r)) scale(1); }
    100% { opacity: 0; transform: translate(-50%,-50%) rotate(var(--r)) scale(.96); filter: blur(2px); }
  }

  /* 小字提示 */
  #hint {
    position: fixed; left: 0; right: 0;
    bottom: calc(env(safe-area-inset-bottom, 0px) + 7vh);
    text-align: center;
    font-size: 15px; letter-spacing: .14em;
    color: rgba(240, 236, 220, .82);
    pointer-events: none;
    transition: opacity .8s;
  }
  #hint.hide { opacity: 0; }

  #again {
    position: fixed; left: 50%;
    bottom: calc(env(safe-area-inset-bottom, 0px) + 7vh);
    transform: translateX(-50%);
    background: none; border: none;
    font-family: inherit; font-size: 15px; letter-spacing: .2em;
    color: rgba(250, 226, 180, .9);
    padding: 12px 20px; cursor: pointer;
    opacity: 0; pointer-events: none; transition: opacity 1.5s;
    z-index: 5;
  }
  #again.show { opacity: 1; pointer-events: auto; }
</style>
</head>
<body>
<canvas id="c"></canvas>

<div id="mark">
  <span class="note">♩</span><span>=</span>
  <span class="word">快<svg class="strike" viewBox="0 0 40 14" preserveAspectRatio="none"><path d="M2 9 C 12 6, 26 8, 38 4"/></svg></span>
  <span class="pencil">走着就好</span>
</div>

<button id="mute" aria-label="声音">♪</button>

<div id="text"></div>
<div id="hint">点一下，走一步。</div>
<button id="again">再走一遍</button>

<script>
(() => {
  // ───────── 词 ─────────
  // 每一行用 | 切成几步；只有按走路的速度点，才会往下走一步。
  const SCRIPT = [
    "名字里|写的是“快”，",
    "你却一直|当它是|慢慢走。",
    "记错了，|但记得|刚刚好。",
    "你喜欢的人|都很敢——",
    "敢一辈子|不下船，",
    "敢在冬天|好看得|让人说不出话，",
    "敢把歌|唱得又野|又讲究。",
    "也喜欢|一群好人|上班，下班，吃饭。",
    "你自己呢，|穿最不用想的|那一身，",
    "吃最不用想的|那一碗。",
    "敢的那部分，|你都放进|耳机里了。",
    "你站在树影里，|拍走在光里的人。",
    "其实|你脚下那块|也是同一片草地。",
    "明天的事|会自己|走到你跟前，",
    "不用|跑过去接。",
    "想戴副眼镜，|显得|什么都想好了？",
    "不戴|也挺聪明的。",
    "就这个速度。|走吧。"
  ];
  const LINES = SCRIPT.map(s => s.split("|"));
  const TOTAL = LINES.reduce((a, l) => a + l.length, 0);
  const MARK_AFTER_LINE = 1; // 第二行说完，改速度记号

  const SHOUTS = [
    "来得及吗？", "万一呢", "然后呢？？", "得先想好！", "要是不行呢",
    "怎么办怎么办", "快点快点", "还差得远！", "会不会……", "现在就要知道！",
    "那以后呢", "来不及了！"
  ];

  // ───────── 声音 ─────────
  // 一条 walking bass：每走一步，一个四分音符。
  const BARS = [
    { chord: [62, 66, 69, 73], bass: [50, 54, 57, 48] },  // Dmaj7
    { chord: [62, 66, 69, 71], bass: [47, 50, 54, 51] },  // Bm7
    { chord: [62, 67, 71, 74], bass: [52, 55, 59, 58] },  // Em7
    { chord: [61, 64, 67, 69], bass: [57, 55, 52, 49] },  // A7
    { chord: [62, 66, 67, 71], bass: [55, 59, 57, 55] },  // Gmaj7
    { chord: [61, 64, 66, 69], bass: [54, 57, 52, 53] },  // F#m7
    { chord: [62, 64, 67, 71], bass: [52, 55, 57, 56] },  // Em7
    { chord: [61, 64, 67, 69], bass: [57, 61, 52, 49] },  // A7
  ];
  let ac = null, master = null, muted = false;
  function initAudio() {
    if (ac) { if (ac.state === "suspended") ac.resume(); return; }
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    ac = new AC();
    master = ac.createGain();
    master.gain.value = muted ? 0 : 0.9;
    const lp = ac.createBiquadFilter();
    lp.type = "lowpass"; lp.frequency.value = 2600; lp.Q.value = 0.3;
    const comp = ac.createDynamicsCompressor();
    master.connect(lp); lp.connect(comp); comp.connect(ac.destination);
    // 一点点房间感
    const dl = ac.createDelay(); dl.delayTime.value = 0.23;
    const fb = ac.createGain(); fb.gain.value = 0.22;
    const wet = ac.createGain(); wet.gain.value = 0.18;
    lp.connect(dl); dl.connect(fb); fb.connect(dl); dl.connect(wet); wet.connect(comp);
  }
  const mtof = m => 440 * Math.pow(2, (m - 69) / 12);
  function tone(midi, { type = "triangle", vel = 0.3, dur = 1.2, attack = 0.006, at = 0, detune = 0 } = {}) {
    if (!ac) return;
    const t = ac.currentTime + at;
    const o = ac.createOscillator(), g = ac.createGain();
    o.type = type; o.frequency.value = mtof(midi); o.detune.value = detune;
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(vel, t + attack);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(master);
    o.start(t); o.stop(t + dur + 0.05);
  }
  function playStep(i) {
    const bar = BARS[Math.floor(i / 4) % BARS.length];
    const beat = i % 4;
    const n = bar.bass[beat];
    tone(n, { vel: 0.42, dur: 1.1 });
    tone(n + 12, { type: "sine", vel: 0.12, dur: 0.8 });
    if (beat === 0) {
      bar.chord.forEach((c, k) => tone(c, { type: "sine", vel: 0.06, dur: 2.6, attack: 0.05, at: 0.02 + k * 0.035 }));
    }
    if (beat === 2 && Math.random() < 0.5) {
      tone(bar.chord[3] + 12, { type: "sine", vel: 0.035, dur: 1.4, attack: 0.02, at: 0.05 });
    }
  }
  function playRush() {
    const base = 79 + Math.floor(Math.random() * 6);
    tone(base, { type: "square", vel: 0.05, dur: 0.18 });
    tone(base + 1, { type: "square", vel: 0.04, dur: 0.16, at: 0.01 });
  }
  function playEnd() {
    [74, 78, 81, 85, 88].forEach((m, k) => tone(m, { type: "sine", vel: 0.06, dur: 4.5, attack: 0.08, at: 0.3 + k * 0.18 }));
  }

  // ───────── 画面 ─────────
  const cv = document.getElementById("c");
  const ctx = cv.getContext("2d");
  let W = 0, H = 0, DPR = 1;
  let G = {}; // 几何
  function resize() {
    DPR = Math.min(window.devicePixelRatio || 1, 2.5);
    W = window.innerWidth; H = window.innerHeight;
    cv.width = Math.round(W * DPR); cv.height = Math.round(H * DPR);
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    const horizon = H * 0.585;
    const water = H * 0.035;
    const gap = Math.max(7, Math.min(11, H * 0.011));
    const staffTop = horizon + water + gap * 0.9;
    G = {
      horizon,
      waterBottom: horizon + water,
      gap,
      staffTop,
      staffBottom: staffTop + gap * 4,
      wallBottom: staffTop + gap * 4 + gap * 1.3,
      spacing: Math.max(38, Math.min(56, W * 0.115)),
    };
  }
  window.addEventListener("resize", resize);
  resize();

  // 远处的一排房子（固定种子，所以每次都一样）
  let seed = 7;
  const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
  const CITY = [];
  for (let x = -200, i = 0; i < 400; i++) {
    const w = 6 + rnd() * 16;
    const tall = rnd() < 0.08;
    const h = tall ? 14 + rnd() * 18 : 3 + rnd() * 9 + Math.sin(i * 0.07) * 4 + 4;
    CITY.push({ x, w, h: Math.max(2, h) });
    x += w + rnd() * 3;
  }

  const lerp = (a, b, t) => a + (b - a) * t;
  const hex = h => [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)];
  const mix = (a, b, t, al = 1) => {
    const A = hex(a), B = hex(b);
    return `rgba(${Math.round(lerp(A[0], B[0], t))},${Math.round(lerp(A[1], B[1], t))},${Math.round(lerp(A[2], B[2], t))},${al})`;
  };

  // midi → 低音谱表上的位置（G2 在第一线）
  const LETTER = [0, 0, 1, 1, 2, 3, 3, 4, 4, 5, 5, 6]; // C C# D D# E F F# G G# A A# B
  function staffStep(m) {
    const oct = Math.floor(m / 12) - 1;
    return oct * 7 + LETTER[m % 12] - (2 * 7 + 4);
  }
  const isSharp = m => [1, 3, 6, 8, 10].includes(m % 12);

  // ───────── 状态 ─────────
  let notes = [];     // {i, midi, born}
  let ghosts = [];    // 抢出来的音 {x, y, born}
  let steps = 0;      // 走了几步（含结束后的散步）
  let chunk = 0;      // 念到第几块
  let lineIdx = 0, inLine = 0;
  let lastTap = 0, rushStreak = 0;
  let started = false, ended = false, endAt = 0;
  let prog = 0, progShown = 0;  // 天色
  let shake = 0;
  let camX = 0;
  let lastAny = 0;

  const textEl = document.getElementById("text");
  const hintEl = document.getElementById("hint");
  const markEl = document.getElementById("mark");
  const againEl = document.getElementById("again");
  const muteEl = document.getElementById("mute");
  let curLineEl = null;

  function setHint(t) {
    hintEl.textContent = t;
    hintEl.classList.remove("hide");
  }
  function hideHint() { hintEl.classList.add("hide"); }

  function newLine() {
    const el = document.createElement("div");
    el.className = "line";
    textEl.appendChild(el);
    const all = [...textEl.children];
    all.forEach((l, k) => {
      const d = all.length - 1 - k;
      l.classList.toggle("old", d === 1 || d === 2);
      l.classList.toggle("older", d === 3);
      l.classList.toggle("gone", d >= 4);
      if (d >= 6) l.remove();
    });
    return el;
  }

  function sayNext() {
    if (lineIdx >= LINES.length) return;
    if (inLine === 0) curLineEl = newLine();
    const span = document.createElement("span");
    span.className = "chunk";
    span.textContent = LINES[lineIdx][inLine];
    curLineEl.appendChild(span);
    inLine++;
    chunk++;
    if (inLine >= LINES[lineIdx].length) {
      if (lineIdx === MARK_AFTER_LINE) setTimeout(() => markEl.classList.add("changed"), 500);
      lineIdx++; inLine = 0;
    }
    if (chunk >= TOTAL) finish();
  }

  function finish() {
    ended = true; endAt = performance.now();
    playEnd();
    setTimeout(() => {
      // 最后一行留下，其余淡掉
      [...textEl.children].forEach(l => { if (l !== curLineEl) l.classList.add("gone"); });
    }, 2400);
    setTimeout(() => againEl.classList.add("show"), 6500);
  }

  function walk(now) {
    const bar = BARS[Math.floor(steps / 4) % BARS.length];
    const midi = bar.bass[steps % 4];
    notes.push({ i: steps, midi, born: now });
    playStep(steps);
    steps++;
    if (!ended) sayNext();
    rushStreak = 0;
  }

  function rush(now) {
    rushStreak++;
    playRush();
    shake = Math.min(1, shake + 0.45);
    // 一个歪掉的小音符
    const head = notes.length ? notes[notes.length - 1].i + 0.5 : -0.5;
    ghosts.push({ i: head + (Math.random() - 0.5) * 0.6, dy: -(2 + Math.random() * 5), born: now });
    // 喊出来
    const y = document.createElement("div");
    y.className = "shout";
    y.textContent = SHOUTS[Math.floor(Math.random() * SHOUTS.length)];
    const size = 22 + Math.random() * 26 + Math.min(rushStreak, 6) * 4;
    y.style.fontSize = size + "px";
    y.style.left = (18 + Math.random() * 64) + "vw";
    y.style.top = (14 + Math.random() * 38) + "vh";
    y.style.setProperty("--r", ((Math.random() - 0.5) * 22).toFixed(1) + "deg");
    document.body.appendChild(y);
    setTimeout(() => y.remove(), 1200);
    if (rushStreak >= 3) setHint("慢一点。它又不会跑。");
  }

  const RUSH_MS = 400;
  function tap(e) {
    if (e && e.target === muteEl) return;
    if (e && e.target === againEl) return;
    const now = performance.now();
    initAudio();
    if (!started) { started = true; hideHint(); }
    const dt = now - lastTap;
    if (lastTap && dt < RUSH_MS) rush(now);
    else {
      walk(now);
      if (rushStreak === 0 && !hintEl.classList.contains("hide")) hideHint();
    }
    lastTap = now; lastAny = now;
  }

  window.addEventListener("pointerdown", e => { if (e.button === 0 || e.pointerType !== "mouse") tap(e); });
  window.addEventListener("keydown", e => {
    if (e.repeat) return;
    if (e.key === " " || e.key === "Enter" || e.key.length === 1 || e.key.startsWith("Arrow")) { e.preventDefault(); tap(null); }
  });
  document.addEventListener("touchend", e => { if (e.target !== againEl && e.target !== muteEl) e.preventDefault(); }, { passive: false });

  muteEl.addEventListener("click", e => {
    e.stopPropagation();
    muted = !muted;
    muteEl.classList.toggle("off", muted);
    if (master) master.gain.value = muted ? 0 : 0.9;
  });
  muteEl.addEventListener("pointerdown", e => e.stopPropagation());

  againEl.addEventListener("pointerdown", e => e.stopPropagation());
  againEl.addEventListener("click", e => {
    e.stopPropagation();
    notes = []; ghosts = []; steps = 0; chunk = 0; lineIdx = 0; inLine = 0;
    lastTap = 0; rushStreak = 0; ended = false; started = false;
    textEl.innerHTML = ""; curLineEl = null;
    markEl.classList.remove("changed");
    againEl.classList.remove("show");
    camX = 0;
    setHint("点一下，走一步。");
  });

  // 站着不动也没关系
  setInterval(() => {
    if (!started || ended) return;
    if (performance.now() - lastAny > 8000 && hintEl.classList.contains("hide")) {
      setHint("站一会儿也行。");
    }
  }, 1000);

  // ───────── 绘制 ─────────
  function draw() {
    const now = performance.now();
    prog = ended ? 1 : chunk / TOTAL;
    progShown += (prog - progShown) * 0.02;
    const p = progShown;
    const endT = ended ? Math.min(1, (now - endAt) / 4000) : 0;
    shake *= 0.9;

    const { horizon, waterBottom, gap, staffTop, staffBottom, wallBottom, spacing } = G;

    // 天
    const sky = ctx.createLinearGradient(0, 0, 0, horizon);
    sky.addColorStop(0, mix("#a9c4dd", "#34466b", Math.pow(p, 1.6)));
    sky.addColorStop(0.62, mix("#d3dbe2", "#9a7f95", Math.pow(p, 1.4)));
    sky.addColorStop(1, mix("#f2ddca", "#eba27a", p));
    ctx.fillStyle = sky;
    ctx.fillRect(0, 0, W, horizon + 1);

    // 字的颜色跟着天走
    const ink = p > 0.72 ? mix("#2b3346", "#f3e9da", Math.min(1, (p - 0.72) / 0.2)) : "#2b3346";
    document.documentElement.style.setProperty("--ink", ink);
    document.documentElement.style.setProperty("--pencil", mix("#6b6a66", "#d8cbb8", Math.min(1, Math.max(0, (p - 0.6) / 0.3))));

    // 远处
    const cityShift = camX * 0.12;
    ctx.fillStyle = mix("#b9b4ad", "#5d5068", p, 0.85);
    for (const b of CITY) {
      const x = b.x - cityShift;
      const xx = ((x % (W + 600)) + (W + 600)) % (W + 600) - 300;
      if (xx > W + 20 || xx + b.w < -20) continue;
      ctx.fillRect(xx, horizon - b.h, b.w, b.h + 1);
    }
    // 远处小窗（傍晚才亮）
    if (p > 0.6) {
      ctx.fillStyle = `rgba(255,214,150,${(p - 0.6) * 1.6 * 0.8})`;
      for (let k = 0; k < CITY.length; k += 3) {
        const b = CITY[k];
        const x = b.x - cityShift;
        const xx = ((x % (W + 600)) + (W + 600)) % (W + 600) - 300;
        if (xx > W || xx < 0 || b.h < 6) continue;
        ctx.fillRect(xx + b.w * 0.4, horizon - b.h * 0.6, 1.5, 1.5);
      }
    }

    // 水
    ctx.fillStyle = mix("#35577c", "#1e2b47", p);
    ctx.fillRect(0, horizon, W, waterBottom - horizon + 1);
    ctx.strokeStyle = mix("#7f9dbb", "#d98f6d", p, 0.35);
    ctx.lineWidth = 1;
    for (let k = 0; k < 4; k++) {
      const yy = horizon + 3 + k * ((waterBottom - horizon - 4) / 4);
      ctx.beginPath();
      const off = (now * 0.01 + k * 37) % 60;
      for (let x = -off; x < W; x += 60) { ctx.moveTo(x, yy); ctx.lineTo(x + 18 + k * 4, yy); }
      ctx.stroke();
    }

    // 石堤 = 谱表
    const wall = ctx.createLinearGradient(0, waterBottom, 0, wallBottom);
    wall.addColorStop(0, mix("#e6d3a8", "#b48a6d", p));
    wall.addColorStop(1, mix("#cdb488", "#7d6253", p));
    ctx.fillStyle = wall;
    ctx.fillRect(0, waterBottom, W, wallBottom - waterBottom);

    // 五线
    ctx.strokeStyle = mix("#5b4a35", "#3a2c2a", p, 0.55);
    ctx.lineWidth = 1;
    for (let k = 0; k < 5; k++) {
      const y0 = staffTop + k * gap;
      ctx.beginPath();
      if (shake > 0.02) {
        for (let x = 0; x <= W; x += 8) {
          const yy = y0 + Math.sin(x * 0.09 + now * 0.05 + k) * shake * 2.5;
          x === 0 ? ctx.moveTo(x, yy) : ctx.lineTo(x, yy);
        }
      } else { ctx.moveTo(0, y0 + 0.5); ctx.lineTo(W, y0 + 0.5); }
      ctx.stroke();
    }

    // 草地 + 越拉越长的影子
    ctx.fillStyle = mix("#76a24a", "#4a5f35", p);
    ctx.fillRect(0, wallBottom, W, H - wallBottom);
    const lit = ctx.createLinearGradient(0, wallBottom, 0, H);
    lit.addColorStop(0, mix("#9cbd5a", "#8a6a3e", p, 0.55));
    lit.addColorStop(0.3, "rgba(0,0,0,0)");
    ctx.fillStyle = lit;
    ctx.fillRect(0, wallBottom, W, H - wallBottom);
    const grassH = H - wallBottom;
    const shadowTop = lerp(wallBottom + grassH * 0.42, wallBottom + 3, Math.pow(p, 1.3));
    const sh = ctx.createLinearGradient(0, shadowTop - 10, 0, shadowTop + 18);
    sh.addColorStop(0, "rgba(22,40,24,0)");
    sh.addColorStop(1, mix("#1f3421", "#141d1d", p, 0.94));
    ctx.fillStyle = sh;
    ctx.fillRect(0, shadowTop - 10, W, H - shadowTop + 10);
    // 草纹
    ctx.strokeStyle = "rgba(255,255,255,0.035)";
    for (let k = 0; k < 40; k++) {
      const yy = wallBottom + ((k * 53.7) % grassH);
      ctx.beginPath(); ctx.moveTo(0, yy); ctx.lineTo(W, yy + 2); ctx.stroke();
    }

    // 相机跟着最后一个音
    const lastI = notes.length ? notes[notes.length - 1].i : -1;
    const targetCam = Math.max(0, (lastI + 1) * spacing - W * 0.62 + 40);
    camX += (targetCam - camX) * 0.08;
    const xOf = i => 40 + i * spacing + spacing * 0.5 - camX;

    // 路灯 = 小节线
    const bars = Math.floor(steps / 4);
    const lampTop = staffTop - gap * 9.5;
    for (let b = 1; b <= bars; b++) {
      const x = 40 + b * 4 * spacing - camX;
      if (x < -30 || x > W + 30) continue;
      const bornNote = notes.find(n => n.i === b * 4 - 1);
      const age = bornNote ? Math.max(0, Math.min(1, (now - bornNote.born) / 500)) : 1;
      const top = lerp(staffBottom, lampTop, age);
      ctx.strokeStyle = mix("#2d2a2a", "#1a1416", p, 0.9);
      ctx.lineWidth = 1.6;
      ctx.beginPath(); ctx.moveTo(x, staffBottom + gap * 1.2); ctx.lineTo(x, top); ctx.stroke();
      if (age >= 1) {
        // 灯罩
        ctx.fillStyle = mix("#2d2a2a", "#1a1416", p, 0.95);
        ctx.beginPath();
        ctx.moveTo(x - 8, lampTop); ctx.lineTo(x + 8, lampTop);
        ctx.lineTo(x + 3, lampTop + 4); ctx.lineTo(x - 3, lampTop + 4); ctx.closePath();
        ctx.fill();
        // 傍晚亮灯
        const glow = Math.max(0, (p - 0.78) / 0.22) * 0.6 + endT * 0.4;
        if (glow > 0.01) {
          const flick = 1 + Math.sin(now * 0.003 + b) * 0.03;
          const rg = ctx.createRadialGradient(x, lampTop + 4, 0, x, lampTop + 4, 46 * flick);
          rg.addColorStop(0, `rgba(255,214,140,${0.85 * glow})`);
          rg.addColorStop(0.25, `rgba(255,190,110,${0.35 * glow})`);
          rg.addColorStop(1, "rgba(255,180,100,0)");
          ctx.fillStyle = rg;
          ctx.fillRect(x - 50, lampTop - 46, 100, 100);
          ctx.fillStyle = `rgba(255,236,190,${glow})`;
          ctx.beginPath(); ctx.ellipse(x, lampTop + 4.5, 3.2, 1.6, 0, 0, Math.PI * 2); ctx.fill();
          // 地上的光斑
          ctx.fillStyle = `rgba(255,200,120,${0.10 * glow})`;
          ctx.beginPath(); ctx.ellipse(x, wallBottom + 14, 34, 7, 0, 0, Math.PI * 2); ctx.fill();
        }
      }
    }
    // 谱表起头的竖线
    {
      const x = 40 - camX;
      if (x > -10) {
        ctx.strokeStyle = mix("#5b4a35", "#3a2c2a", p, 0.7);
        ctx.lineWidth = 1.2;
        ctx.beginPath(); ctx.moveTo(x, staffTop); ctx.lineTo(x, staffBottom); ctx.stroke();
      }
    }

    // 音符 = 堤上走路的人
    for (const n of notes) {
      const x = xOf(n.i);
      if (x < -20 || x > W + 20) continue;
      const step = staffStep(n.midi);
      const y = staffBottom - step * gap / 2;
      const age = Math.max(0, Math.min(1, (now - n.born) / 380));
      const ease = 1 - Math.pow(1 - age, 3);
      const yy = y - (1 - ease) * 10;
      // 加线
      ctx.strokeStyle = mix("#5b4a35", "#3a2c2a", p, 0.55);
      ctx.lineWidth = 1;
      for (let s = -2; s >= step; s -= 2) {
        const ly = staffBottom - s * gap / 2;
        ctx.beginPath(); ctx.moveTo(x - 8, ly); ctx.lineTo(x + 8, ly); ctx.stroke();
      }
      for (let s = 10; s <= step; s += 2) {
        const ly = staffBottom - s * gap / 2;
        ctx.beginPath(); ctx.moveTo(x - 8, ly); ctx.lineTo(x + 8, ly); ctx.stroke();
      }
      // 小小的升号
      if (isSharp(n.midi)) {
        ctx.fillStyle = mix("#5b4a35", "#3a2c2a", p, 0.7 * ease);
        ctx.font = `${gap * 1.5}px serif`;
        ctx.textAlign = "center"; ctx.textBaseline = "middle";
        ctx.fillText("♯", x - gap * 1.25, yy);
      }
      // 符杆
      const stemUp = step < 4;
      ctx.strokeStyle = mix("#3b2a1c", "#2a1c18", p, ease);
      ctx.lineWidth = 1.3;
      ctx.beginPath();
      if (stemUp) { ctx.moveTo(x + gap * 0.62, yy); ctx.lineTo(x + gap * 0.62, yy - gap * 3.4); }
      else { ctx.moveTo(x - gap * 0.62, yy); ctx.lineTo(x - gap * 0.62, yy + gap * 3.4); }
      ctx.stroke();
      // 符头：一颗颗小橘色
      ctx.save();
      ctx.translate(x, yy);
      ctx.rotate(-0.35);
      ctx.fillStyle = mix("#ef9a32", "#f2a347", p, ease);
      ctx.beginPath(); ctx.ellipse(0, 0, gap * 0.66, gap * 0.48, 0, 0, Math.PI * 2); ctx.fill();
      ctx.strokeStyle = mix("#b76516", "#8d4a1c", p, ease * 0.9);
      ctx.lineWidth = 1;
      ctx.stroke();
      ctx.fillStyle = `rgba(255,240,200,${0.55 * ease})`;
      ctx.beginPath(); ctx.ellipse(-gap * 0.2, -gap * 0.15, gap * 0.16, gap * 0.1, 0, 0, Math.PI * 2); ctx.fill();
      ctx.restore();
      // 被路灯照到时，脚下一点影子
      if (p > 0.8) {
        ctx.fillStyle = `rgba(20,14,12,${(p - 0.8) * 1.2})`;
        ctx.beginPath(); ctx.ellipse(x + 3, staffBottom + gap * 1.15, gap * 0.7, 1.4, 0, 0, Math.PI * 2); ctx.fill();
      }
    }

    // 抢出来的音：歪的、红的、很快就散
    ghosts = ghosts.filter(g => now - g.born < 1600);
    for (const g of ghosts) {
      const t = Math.max(0, (now - g.born) / 1600);
      const x = xOf(g.i) + Math.sin(g.born) * 6;
      const y = staffTop + g.dy * gap / 2 - t * 26;
      ctx.save();
      ctx.globalAlpha = 1 - t;
      ctx.strokeStyle = "#c8102e";
      ctx.lineWidth = 1.6;
      const s = gap * 0.5;
      ctx.beginPath();
      ctx.moveTo(x - s, y - s); ctx.lineTo(x + s, y + s);
      ctx.moveTo(x + s, y - s); ctx.lineTo(x - s, y + s);
      ctx.stroke();
      ctx.restore();
    }

    // 主题色跟随
    if (now % 500 < 20) {
      const meta = document.querySelector('meta[name="theme-color"]');
      meta && meta.setAttribute("content", mix("#a9c4dd", "#34466b", Math.pow(p, 1.6)).replace(/rgba\((\d+),(\d+),(\d+),[^)]+\)/, (m, r, g, b) => "#" + [r, g, b].map(v => (+v).toString(16).padStart(2, "0")).join("")));
    }

    requestAnimationFrame(draw);
  }
  requestAnimationFrame(draw);
})();
</script>
</body>
</html>
