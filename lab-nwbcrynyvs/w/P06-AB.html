<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>拓</title>
<style>
  html,body{margin:0;height:100%;background:#1d1b19;overflow:hidden;
    -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
  #wrap{position:fixed;left:0;top:0}
  canvas#c{display:block;touch-action:none;cursor:crosshair}
  body{touch-action:none}
  .kai{font-family:"Kaiti SC","STKaiti","KaiTi","BiauKai","Songti SC","STSong","Noto Serif CJK SC","Source Han Serif SC",serif}
  #hint{position:absolute;left:0;right:0;text-align:center;color:#8a8073;font-size:14px;letter-spacing:.3em;
    opacity:0;transition:opacity 1.2s ease;pointer-events:none}
  #colo{position:absolute;color:#2f2924;pointer-events:none;line-height:1.9;letter-spacing:.12em}
  #colo span{opacity:0;transition:opacity .9s ease}
  #colo span.on{opacity:1}
  #seal{position:absolute;opacity:0;pointer-events:none;transform:scale(1.35);
    transition:opacity .25s ease, transform .35s cubic-bezier(.2,.9,.3,1.2)}
  #seal.on{opacity:.92;transform:scale(1)}
  #again{position:absolute;color:#8a8073;font-size:13px;letter-spacing:.25em;background:none;border:0;padding:10px 6px;
    opacity:0;pointer-events:none;transition:opacity 1s ease;cursor:pointer}
  #again.on{opacity:1;pointer-events:auto}
</style>
</head>
<body>
<div id="wrap">
  <canvas id="c"></canvas>
  <div id="hint" class="kai">慢 慢 拍</div>
  <div id="colo" class="kai"></div>
  <canvas id="seal"></canvas>
  <button id="again" class="kai">再拓一张</button>
</div>
<script>
(() => {
'use strict';

const COLS = ['风很大','手很稳','喜欢很久以前的人','和不存在的人','看得清清楚楚','照样喜欢'];
const ROWS = 8;
const COLO = ['石头搬不走','那就把它的样子带走','裂的地方也要'];
const SERIF = '"Songti SC","STSong","SimSun","Noto Serif CJK SC","Source Han Serif SC","Noto Serif SC",serif';

const wrap = document.getElementById('wrap');
const cv = document.getElementById('c');
const ctx = cv.getContext('2d');
const hint = document.getElementById('hint');
const colo = document.getElementById('colo');
const sealCv = document.getElementById('seal');
const again = document.getElementById('again');

// seeded rng so the stone is always the same stone
function rng(seed){ let s = seed>>>0; return () => { s = (s + 0x6D2B79F5)>>>0; let t = s;
  t = Math.imul(t ^ t>>>15, t|1); t ^= t + Math.imul(t ^ t>>>7, t|61); return ((t ^ t>>>14)>>>0)/4294967296; }; }

function mk(w,h){ const c=document.createElement('canvas'); c.width=w; c.height=h; return c; }

// layered value noise via scaled-up random grids
function noiseCanvas(W,H,rand,octaves){
  const out = mk(W,H), o = out.getContext('2d');
  o.fillStyle='#808080'; o.fillRect(0,0,W,H);
  for(const [cell,alpha] of octaves){
    const gw=Math.max(2,Math.ceil(W/cell)+1), gh=Math.max(2,Math.ceil(H/cell)+1);
    const g=mk(gw,gh), gx=g.getContext('2d'), id=gx.createImageData(gw,gh);
    for(let i=0;i<gw*gh;i++){ const v=rand()*255|0; id.data[i*4]=id.data[i*4+1]=id.data[i*4+2]=v; id.data[i*4+3]=255; }
    gx.putImageData(id,0,0);
    o.globalAlpha=alpha; o.imageSmoothingEnabled=true; o.imageSmoothingQuality='high';
    o.drawImage(g,0,0,gw*cell,gh*cell);
  }
  o.globalAlpha=1;
  return o.getImageData(0,0,W,H).data;
}

let S = {}; // scene state

function build(){
  const vw = window.innerWidth, vh = window.innerHeight;
  const dpr = Math.min(2, window.devicePixelRatio||1);
  const sw = Math.round(Math.min(vw, vh*0.62)), sh = vh;
  const ox = Math.round((vw-sw)/2);
  wrap.style.left = ox+'px'; wrap.style.width = sw+'px'; wrap.style.height = sh+'px';
  cv.style.width = sw+'px'; cv.style.height = sh+'px';
  const W = Math.round(sw*dpr), H = Math.round(sh*dpr);
  cv.width = W; cv.height = H;

  const rand = rng(1017);
  // stone rectangle (css px)
  const mx = sw*0.065, top = sh*0.055;
  const stW = sw-2*mx, stH = sh*0.70;
  const pad = stW*0.075;
  const cell = Math.min((stW-2*pad)/COLS.length, (stH-2*pad)/ROWS);
  const gridW = cell*COLS.length, gridH = cell*ROWS;
  const gx0 = mx + (stW-gridW)/2, gy0 = top + (stH-gridH)/2;

  // --- stone outline with rough edges
  const shape = mk(W,H), sx = shape.getContext('2d');
  sx.scale(dpr,dpr);
  sx.beginPath();
  const edge = (x0,y0,x1,y1,n,amp) => { for(let i=0;i<=n;i++){ const t=i/n;
    const j=(rand()-.5)*amp*(i===0||i===n?0:1);
    const x=x0+(x1-x0)*t + (y0===y1?0:j), y=y0+(y1-y0)*t + (y0===y1?j:0);
    if(i===0 && x0===mx && y0===top) sx.moveTo(x,y); else sx.lineTo(x,y);} };
  edge(mx,top, mx+stW,top, 40, 2.2);
  edge(mx+stW,top, mx+stW,top+stH, 70, 2.2);
  // a bitten bottom-right corner
  sx.lineTo(mx+stW-stW*0.06, top+stH+1);
  edge(mx+stW-stW*0.06,top+stH, mx,top+stH, 40, 2.2);
  edge(mx,top+stH, mx,top, 70, 2.2);
  sx.closePath(); sx.fillStyle='#fff'; sx.fill();
  const shapeD = sx.getImageData(0,0,W,H).data;

  // --- carving: characters, frame line, the crack
  const carve = mk(W,H), cx = carve.getContext('2d');
  cx.scale(dpr,dpr);
  cx.fillStyle='#000'; cx.fillRect(0,0,sw,sh);
  cx.fillStyle='#fff'; cx.textAlign='center'; cx.textBaseline='middle';
  cx.font = `900 ${Math.round(cell*0.80)}px ${SERIF}`;
  COLS.forEach((col,ci) => {
    const x = gx0 + gridW - cell*(ci+0.5);
    [...col].forEach((ch,ri) => {
      const y = gy0 + cell*(ri+0.5);
      cx.save(); cx.translate(x+(rand()-.5)*cell*0.04, y+(rand()-.5)*cell*0.04);
      cx.rotate((rand()-.5)*0.03);
      cx.fillText(ch,0,0);
      cx.restore();
    });
  });
  // thin ruled frame
  cx.strokeStyle='#fff'; cx.lineWidth=Math.max(1.2,cell*0.03);
  const fr = cell*0.28;
  cx.strokeRect(gx0-fr, gy0-fr, gridW+2*fr, gridH+2*fr);
  // the crack: from low-left to high-right, cutting through the middle
  const crack = [];
  { let x = mx-4, y = top + stH*0.66; const ex = mx+stW+4, ey = top+stH*0.40;
    const n = 26;
    for(let i=0;i<=n;i++){ const t=i/n; crack.push([x+(ex-x)*t + (rand()-.5)*cell*0.25, y+(ey-y)*t + (rand()-.5)*cell*0.32 + Math.sin(t*5.2)*cell*0.25]); } }
  const drawCrack = (pts, w0) => {
    for(let i=1;i<pts.length;i++){
      cx.lineWidth = w0*(0.55+rand()*0.9); cx.lineCap='round';
      cx.beginPath(); cx.moveTo(pts[i-1][0],pts[i-1][1]); cx.lineTo(pts[i][0],pts[i][1]); cx.stroke();
    } };
  drawCrack(crack, Math.max(2.2, cell*0.07));
  // a short branch off the crack
  { const b = crack[17]; const br=[[b[0],b[1]]]; let x=b[0],y=b[1];
    for(let i=0;i<7;i++){ x += cell*0.22 + (rand()-.5)*cell*0.1; y += cell*0.20 + (rand()-.5)*cell*0.12; br.push([x,y]); }
    drawCrack(br, Math.max(1.2, cell*0.035)); }
  const carveD = cx.getImageData(0,0,W,H).data;

  // --- surface grain
  const g1 = noiseCanvas(W,H,rand,[[Math.round(160*dpr),.55],[Math.round(40*dpr),.45],[Math.round(9*dpr),.35],[Math.round(2*dpr),.35]]);
  const g2 = noiseCanvas(W,H,rand,[[Math.round(22*dpr),.6],[Math.round(5*dpr),.5]]);

  // receptivity: where ink can land (alpha), stone view, paper base
  const rec = mk(W,H), rx = rec.getContext('2d'), rD = rx.createImageData(W,H), rd = rD.data;
  const stone = mk(W,H), stx = stone.getContext('2d'), sD = stx.createImageData(W,H), sd = sD.data;
  const carvedBin = new Uint8Array(W*H);
  for(let i=0,p=0;p<W*H;p++,i+=4){
    const inS = shapeD[i+3]/255;
    const n1 = g1[i]/255, n2 = g2[i]/255;
    // weathered edges: carving threshold wobbles with noise
    const cv_ = carveD[i]/255;
    const carved = cv_ > 0.32 + (n2-0.5)*0.9 + (n1-0.5)*0.35 ? 1 : 0;
    carvedBin[p]=carved;
    let grain = 0.92 + 1.1*(n1-0.5) + 0.7*(n2-0.5);
    grain = grain<0?0:grain>1?1:grain;
    if(n2 > 0.78) grain *= 0.12;            // pits
    if(n1 < 0.32) grain *= 0.5 + n1;        // worn patches
    const a = inS*(1-carved)*grain;
    rd[i]=rd[i+1]=rd[i+2]=0; rd[i+3]=a*255|0;
    // stone view
    let v = 84 + (n1-0.5)*70 + (n2-0.5)*44;
    if(carved) v = v*0.86;
    sd[i]=v*0.98|0; sd[i+1]=v*0.97|0; sd[i+2]=v*0.93|0; sd[i+3]=inS*255|0;
  }
  rx.putImageData(rD,0,0);
  stx.putImageData(sD,0,0);

  // paper base: warm sheet, fibres, faint emboss where the paper sinks into the carving
  const paper = mk(W,H), px = paper.getContext('2d');
  const pD = px.createImageData(W,H), pd = pD.data;
  for(let i=0,p=0;p<W*H;p++,i+=4){
    const n1=g1[i]/255, n2=g2[(i+4*W*7)%(W*H*4)]/255;
    let r=236,g=231,b=220;
    const f=(n1-0.5)*10+(n2-0.5)*8;
    r+=f; g+=f; b+=f*1.1;
    // emboss: light on upper-left lip of a cut, shade on lower-right
    const x=p%W;
    if(x>2 && p>W*2 && carvedBin[p] !== carvedBin[p-W*2-2]){
      const d = carvedBin[p] ? -9 : 6; r+=d; g+=d; b+=d;
    }
    pd[i]=r; pd[i+1]=g; pd[i+2]=b; pd[i+3]=255;
  }
  px.putImageData(pD,0,0);
  // long fibres
  px.strokeStyle='rgba(120,105,85,0.06)'; px.lineWidth=dpr*0.7;
  for(let k=0;k<420;k++){ const x=rand()*W,y=rand()*H,l=(8+rand()*30)*dpr,a=rand()*Math.PI;
    px.beginPath(); px.moveTo(x,y); px.quadraticCurveTo(x+Math.cos(a+.6)*l*.5,y+Math.sin(a+.6)*l*.5,x+Math.cos(a)*l,y+Math.sin(a)*l); px.stroke(); }

  // fibre veil drawn over the ink so it reads as ink *in* paper
  const veil = mk(W,H), vx = veil.getContext('2d');
  vx.strokeStyle='rgba(236,231,220,0.10)'; vx.lineWidth=dpr*0.8;
  for(let k=0;k<900;k++){ const x=rand()*W,y=rand()*H,l=(5+rand()*22)*dpr,a=rand()*Math.PI;
    vx.beginPath(); vx.moveTo(x,y); vx.lineTo(x+Math.cos(a)*l,y+Math.sin(a)*l); vx.stroke(); }

  // small coverage probe
  const PW = 64, PH = Math.round(64*H/W);
  const probe = mk(PW,PH), prx = probe.getContext('2d',{willReadFrequently:true});
  prx.drawImage(rec,0,0,PW,PH);
  const recSmall = prx.getImageData(0,0,PW,PH).data;
  let recSum=0; for(let i=3;i<recSmall.length;i+=4) recSum+=recSmall[i];

  const ink = mk(W,H), ix = ink.getContext('2d');
  const tmp = mk(W,H), tx = tmp.getContext('2d');

  // dabber prints: a cloth pad, never a clean circle
  const sprites = [];
  for(let s=0;s<5;s++){
    const R=64, c=mk(R*2,R*2), c2=c.getContext('2d'), d=c2.createImageData(R*2,R*2);
    const lob = [rand()*6.28, 0.10+rand()*0.12, 2+(rand()*3|0)];
    for(let y=0;y<R*2;y++) for(let x=0;x<R*2;x++){
      const dx=x-R, dy=y-R, r=Math.hypot(dx,dy)/R, ang=Math.atan2(dy,dx);
      const rr = r*(1+lob[1]*Math.sin(ang*lob[2]+lob[0]));
      if(rr>=1) continue;
      let a = Math.pow(1-rr*rr, 1.3);
      a *= 0.55 + 0.45*rand();
      if(((x*7+y*13)%11)===0) a*=0.4; // weave
      const k=(y*R*2+x)*4; d.data[k]=20; d.data[k+1]=18; d.data[k+2]=16; d.data[k+3]=a*255|0;
    }
    c2.putImageData(d,0,0); sprites.push(c);
  }

  S = { vw, vh, sw, sh, W, H, dpr, mx, top, stW, stH, cell, stone, paper, rec, veil, ink, ix, tmp, tx,
        probe, prx, recSmall, recSum, PW, PH, sprites,
        phase: 'stone', drop: 0, dirty: true, done: false, strokes: 0 };

  // overlay layout
  const below = top + stH;
  hint.style.top = (below + (sh-below)*0.42) + 'px';
  colo.style.left = (mx + stW*0.04) + 'px';
  colo.style.top = (below + Math.max(14, (sh-below)*0.14)) + 'px';
  colo.style.fontSize = Math.max(13, Math.min(17, sw*0.040)) + 'px';
  const sealSize = Math.round(Math.max(34, Math.min(50, sw*0.11)));
  sealCv.style.width = sealCv.style.height = sealSize+'px';
  sealCv.style.left = (mx + stW - sealSize - stW*0.04) + 'px';
  sealCv.style.top = (below + Math.max(18, (sh-below)*0.20)) + 'px';
  again.style.right = (mx + stW*0.02) + 'px';
  again.style.bottom = Math.max(8, (sh-below)*0.06) + 'px';
  drawSeal(sealSize);
  resetOverlay();
}

function drawSeal(size){
  const d = Math.min(2, window.devicePixelRatio||1), N = size*d;
  sealCv.width = sealCv.height = N;
  const g = sealCv.getContext('2d');
  g.clearRect(0,0,N,N);
  g.fillStyle = '#b8321f';
  g.beginPath();
  const m=N*0.04; g.moveTo(m,m*1.5); g.lineTo(N-m*1.2,m); g.lineTo(N-m,N-m*1.3); g.lineTo(m*1.3,N-m); g.closePath(); g.fill();
  g.globalCompositeOperation='destination-out';
  g.textAlign='center'; g.textBaseline='middle';
  g.font = `900 ${N*0.40}px ${SERIF}`;
  g.fillText('不', N/2, N*0.29);
  g.fillText('补', N/2, N*0.72);
  // worn speckle
  const r = rng(77);
  for(let k=0;k<N*1.6;k++){ g.globalAlpha = 0.3+r()*0.7; const s=r()*N*0.035+0.5;
    g.fillRect(r()*N, r()*N, s, s); }
  g.globalAlpha=1; g.globalCompositeOperation='source-over';
}

function resetOverlay(){
  colo.innerHTML='';
  COLO.forEach(line => { const div=document.createElement('div');
    [...line].forEach(ch => { const s=document.createElement('span'); s.textContent=ch; div.appendChild(s); });
    colo.appendChild(div); });
  sealCv.classList.remove('on'); again.classList.remove('on');
  hint.style.opacity = 0;
}

// ---------- render
function render(){
  const {W,H} = S;
  if(S.phase==='stone' || S.phase==='drop'){
    ctx.fillStyle='#e6e0d4'; ctx.fillRect(0,0,W,H);
    ctx.drawImage(S.stone,0,0);
    if(S.phase==='drop'){
      const e = S.drop<1 ? 1-Math.pow(1-S.drop,3) : 1;
      const y = Math.round(H*e);
      ctx.save(); ctx.beginPath(); ctx.rect(0,0,W,y); ctx.clip();
      ctx.drawImage(S.paper,0,0); ctx.restore();
      const gr = ctx.createLinearGradient(0,y,0,y+24*S.dpr);
      gr.addColorStop(0,'rgba(0,0,0,0.28)'); gr.addColorStop(1,'rgba(0,0,0,0)');
      ctx.fillStyle=gr; ctx.fillRect(0,y,W,24*S.dpr);
    }
    return;
  }
  ctx.drawImage(S.paper,0,0);
  const tx=S.tx; tx.globalCompositeOperation='copy'; tx.drawImage(S.ink,0,0);
  tx.globalCompositeOperation='destination-in'; tx.drawImage(S.rec,0,0);
  tx.globalCompositeOperation='source-over';
  ctx.drawImage(S.tmp,0,0);
  ctx.drawImage(S.veil,0,0);
}

function loop(t){
  if(S.phase==='drop'){
    S.drop = Math.min(1,(t - S.dropStart)/1500);
    if(S.drop>=1){ S.phase='paper'; setTimeout(()=>{ if(!S.strokes) hint.style.opacity=1; }, 400); }
    S.dirty = true;
  }
  if(S.dirty){ render(); S.dirty=false; }
  requestAnimationFrame(loop);
}

// ---------- sound: soft cloth-on-paper "pff"
let ac=null, noiseBuf=null, lastSnd=0;
function ensureAudio(){
  if(ac) return;
  try{
    ac = new (window.AudioContext||window.webkitAudioContext)();
    noiseBuf = ac.createBuffer(1, ac.sampleRate*0.12, ac.sampleRate);
    const d=noiseBuf.getChannelData(0); for(let i=0;i<d.length;i++) d[i]=(Math.random()*2-1);
  }catch(e){ ac=null; }
}
function pat(strength){
  if(!ac) return;
  const now = ac.currentTime; if(now-lastSnd<0.07) return; lastSnd=now;
  const s=ac.createBufferSource(); s.buffer=noiseBuf; s.playbackRate.value=0.8+Math.random()*0.4;
  const f=ac.createBiquadFilter(); f.type='lowpass'; f.frequency.value=700+Math.random()*500;
  const g=ac.createGain(); g.gain.setValueAtTime(0,now);
  g.gain.linearRampToValueAtTime(0.10*strength,now+0.004);
  g.gain.exponentialRampToValueAtTime(0.0008,now+0.09);
  s.connect(f); f.connect(g); g.connect(ac.destination); s.start(now); s.stop(now+0.12);
}

// ---------- dabbing
function dab(x,y,alpha){
  const {ix,dpr,cell,sprites} = S;
  const r = cell*0.62*dpr*(0.85+Math.random()*0.3);
  const sp = sprites[Math.random()*sprites.length|0];
  ix.save(); ix.globalAlpha=alpha; ix.translate(x*dpr,y*dpr); ix.rotate(Math.random()*6.28);
  ix.drawImage(sp,-r,-r,r*2,r*2); ix.restore();
  S.dirty=true;
}

const pointers = new Map();
function local(e){ const b=cv.getBoundingClientRect(); return [e.clientX-b.left, e.clientY-b.top]; }

window.addEventListener('pointerdown', e => {
  if(e.target===again) return;
  e.preventDefault();
  ensureAudio(); if(ac && ac.state==='suspended') ac.resume();
  if(S.phase!=='paper') return;
  const [x,y]=local(e);
  pointers.set(e.pointerId,{x,y,acc:0});
  dab(x,y,0.38); dab(x+(Math.random()-.5)*6,y+(Math.random()-.5)*6,0.18);
  pat(1);
  S.strokes++;
  if(S.strokes===6) hint.style.opacity=0;
  scheduleProbe();
});
window.addEventListener('pointermove', e => {
  const p = pointers.get(e.pointerId); if(!p) return;
  const [x,y]=local(e);
  const dx=x-p.x, dy=y-p.y, d=Math.hypot(dx,dy);
  const step = S.cell*0.22;
  if(d<step) return;
  const n = Math.floor(d/step);
  for(let i=1;i<=n;i++){ const t=i/n; dab(p.x+dx*t+(Math.random()-.5)*4, p.y+dy*t+(Math.random()-.5)*4, 0.16); }
  p.acc += d; if(p.acc > S.cell*0.9){ p.acc=0; pat(0.55); }
  p.x=x; p.y=y;
  scheduleProbe();
});
const up = e => { pointers.delete(e.pointerId); };
window.addEventListener('pointerup', up); window.addEventListener('pointercancel', up);
document.addEventListener('touchmove', e => e.preventDefault(), {passive:false});

let probeT=null;
function scheduleProbe(){ if(probeT||S.done) return; probeT=setTimeout(()=>{ probeT=null; probe(); }, 450); }
function probe(){
  const {prx,PW,PH,recSmall,recSum} = S;
  // ink actually landed on stone
  render(); S.dirty=false;
  prx.globalCompositeOperation='copy';
  prx.drawImage(S.tmp,0,0,PW,PH);
  prx.globalCompositeOperation='source-over';
  const d = prx.getImageData(0,0,PW,PH).data;
  let s=0; for(let i=3;i<d.length;i+=4) s+=d[i];
  const ratio = s/recSum;
  if(ratio>0.56) finish();
}

function finish(){
  if(S.done) return; S.done=true;
  hint.style.opacity=0;
  const spans = colo.querySelectorAll('span');
  let k=0, delay=900;
  spans.forEach((sp,i) => {
    const lineBreak = sp.parentNode.firstChild===sp && i>0;
    delay += lineBreak ? 650 : 0;
    setTimeout(()=>sp.classList.add('on'), delay + k*170);
    k++;
  });
  const end = delay + k*170 + 700;
  setTimeout(()=>{ sealCv.classList.add('on'); pat(1.4); }, end);
  setTimeout(()=>again.classList.add('on'), end+1600);
}

again.addEventListener('click', () => {
  if(!S.done) return;
  S.ix.clearRect(0,0,S.W,S.H);
  S.done=false; S.strokes=0;
  resetOverlay();
  S.dirty=true;
  setTimeout(()=>{ if(!S.strokes) hint.style.opacity=1; }, 300);
});

function start(){
  build();
  S.phase='stone'; S.dirty=true;
  setTimeout(()=>{ S.phase='drop'; S.dropStart=performance.now(); }, 1500);
}
let lastW = window.innerWidth, lastH = window.innerHeight;
window.addEventListener('resize', () => {
  const w=window.innerWidth, h=window.innerHeight;
  if(w===lastW && Math.abs(h-lastH)<140) return;
  lastW=w; lastH=h; start();
});
start();
requestAnimationFrame(loop);
})();
</script>
</body>
