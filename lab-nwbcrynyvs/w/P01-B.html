<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#14182f">
<title>一整天</title>
<style>
  html,body{margin:0;height:100%;background:#14182f;overflow:hidden;overscroll-behavior:none}
  body{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;touch-action:none;
       font-family:"Songti SC","STSong","Noto Serif SC","Source Han Serif SC","SimSun",serif}
  canvas{position:fixed;inset:0;width:100%;height:100%;display:block;cursor:grab}
  canvas:active{cursor:grabbing}
  .cap{position:fixed;left:9vw;right:9vw;top:calc(env(safe-area-inset-top,0px) + 15vh);
       font-size:clamp(16px,4.4vw,21px);line-height:1.9;letter-spacing:.08em;
       opacity:0;transition:opacity 1.1s ease,color 1.2s ease;pointer-events:none;white-space:pre-line}
  @media (min-aspect-ratio: 4/5){ .cap{left:50%;right:auto;width:min(520px,80vw);transform:translateX(-50%);top:14vh} }
  #hint{position:fixed;left:0;right:0;bottom:calc(env(safe-area-inset-bottom,0px) + 7vh);text-align:center;
        font-size:13px;letter-spacing:.3em;color:rgba(50,46,42,.6);text-shadow:0 0 6px rgba(230,226,218,.9);pointer-events:none;
        transition:opacity 1.2s ease;animation:breathe 2.8s ease-in-out infinite}
  @keyframes breathe{0%,100%{transform:translateX(-6px)}50%{transform:translateX(6px)}}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="cap" id="capA"></div>
<div class="cap" id="capB"></div>
<div id="hint">← 按住，左右拖，让太阳走 →</div>
<script>
(() => {
const cv = document.getElementById('c');
const ctx = cv.getContext('2d');
const capEls = [document.getElementById('capA'), document.getElementById('capB')];
const hint = document.getElementById('hint');

let W, H, DPR, ground, lightC, lctx, sunC, sctx, maskC, mctx;

const mk = (w, h) => { const c = document.createElement('canvas'); c.width = w; c.height = h; return c; };

/* ---------- 地面：浅灰石砖，斜着铺 ---------- */
function buildGround() {
  const w = cv.width, h = cv.height;
  ground = mk(w, h);
  const g = ground.getContext('2d');
  g.fillStyle = 'rgb(204,199,190)';
  g.fillRect(0, 0, w, h);

  // 每块砖一点点不一样的灰
  const S = Math.min(w, h) * 0.42;
  const ang = -0.47;
  const D = Math.hypot(w, h);
  g.save();
  g.translate(w / 2, h / 2);
  g.rotate(ang);
  let seed = 7;
  const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
  const n = Math.ceil(D / S) + 1;
  for (let i = -n; i <= n; i++) for (let j = -n; j <= n; j++) {
    const v = rnd();
    g.fillStyle = v < .5 ? `rgba(90,84,76,${(.5 - v) * .09})` : `rgba(255,252,246,${(v - .5) * .12})`;
    g.fillRect(i * S, j * S * 0.62, S, S * 0.62);
  }
  g.restore();

  // 石面颗粒
  const img = g.getImageData(0, 0, w, h);
  const d = img.data;
  for (let p = 0; p < d.length; p += 4) {
    let r = Math.random();
    let k = (Math.random() - .5) * 14;
    if (r < .018) k -= 26 + Math.random() * 30;
    else if (r < .03) k += 18 + Math.random() * 16;
    d[p] += k; d[p + 1] += k; d[p + 2] += k * .95;
  }
  g.putImageData(img, 0, 0);

  // 砖缝
  g.save();
  g.translate(w / 2, h / 2);
  g.rotate(ang);
  const lw = Math.max(1, DPR * .9);
  for (let i = -n; i <= n + 1; i++) {
    line(g, i * S, -D, i * S, D, lw);
  }
  for (let j = -n * 2; j <= n * 2; j++) {
    line(g, -D, j * S * 0.62, D, j * S * 0.62, lw);
  }
  g.restore();
}
function line(g, x1, y1, x2, y2, lw) {
  g.strokeStyle = 'rgba(238,235,228,.75)'; g.lineWidth = lw;
  g.beginPath(); g.moveTo(x1, y1); g.lineTo(x2, y2); g.stroke();
  g.strokeStyle = 'rgba(110,104,96,.22)'; g.lineWidth = lw;
  g.beginPath(); g.moveTo(x1 + lw, y1 + lw); g.lineTo(x2 + lw, y2 + lw); g.stroke();
}

function resize() {
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = window.innerWidth; H = window.innerHeight;
  cv.width = Math.round(W * DPR); cv.height = Math.round(H * DPR);
  lightC = mk(cv.width, cv.height); lctx = lightC.getContext('2d');
  sunC = mk(cv.width, cv.height); sctx = sunC.getContext('2d');
  maskC = mk(cv.width, cv.height); mctx = maskC.getContext('2d');
  buildGround();
  dirty = true;
}

/* ---------- 影子的轮廓（脚在 0，头在 1；x 以半肩宽为单位） ---------- */
const BODY = [
  [0.52, 0.00], [0.62, 0.14], [0.66, 0.27], [0.92, 0.37], [1.00, 0.41],
  [1.12, 0.43], [1.16, 0.47], [1.04, 0.50], [0.98, 0.58], [0.96, 0.70],
  [0.90, 0.78], [0.62, 0.81], [0.36, 0.84], [0.42, 0.90], [0.40, 0.96],
  [0.18, 1.00], [-0.18, 1.00], [-0.40, 0.96], [-0.42, 0.90], [-0.36, 0.84],
  [-0.62, 0.81], [-0.90, 0.78], [-1.04, 0.72], [-1.22, 0.66], [-1.40, 0.635],
  [-1.56, 0.615], [-1.66, 0.63], [-1.68, 0.70], [-1.62, 0.735], [-1.52, 0.75],
  [-1.46, 0.79], [-1.40, 0.76], [-1.36, 0.70], [-1.18, 0.665], [-0.98, 0.63],
  [-0.96, 0.52], [-0.94, 0.40], [-0.70, 0.30], [-0.62, 0.14], [-0.50, 0.00]
];

function drawShadowMask(phi, L, blur, half) {
  const c = mctx;
  c.setTransform(1, 0, 0, 1, 0, 0);
  c.clearRect(0, 0, maskC.width, maskC.height);
  if (L <= 0) return;
  const OFF = 40000;
  const fx = W * 0.5 * DPR, fy = (H + 6) * DPR;
  c.save();
  c.shadowColor = '#000';
  c.shadowBlur = blur * DPR;
  c.shadowOffsetX = OFF;
  c.translate(fx - OFF, fy);
  c.rotate(phi);
  c.scale(half * DPR, L * DPR);
  c.fillStyle = '#000';
  c.beginPath();
  const P = BODY.map(([x, y]) => [x, -y]);
  const m = (a, b) => [(a[0] + b[0]) / 2, (a[1] + b[1]) / 2];
  let s = m(P[P.length - 1], P[0]);
  c.moveTo(s[0], s[1]);
  for (let i = 0; i < P.length; i++) {
    const p = P[i], q = P[(i + 1) % P.length], e = m(p, q);
    c.quadraticCurveTo(p[0], p[1], e[0], e[1]);
  }
  c.closePath();
  c.fill();
  // 脚下再压实一点
  c.beginPath();
  c.ellipse(0, -0.01, 0.8, 0.03, 0, 0, Math.PI * 2);
  c.fill();
  c.restore();
}

/* ---------- 时间轴：0~1 白天，1~2 夜里 ---------- */
let T = 0.1, target = 0.1, vel = 0, dirty = true, touched = false;
const clamp = (x, a, b) => Math.max(a, Math.min(b, x));
const sstep = (a, b, x) => { const t = clamp((x - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };
const mix = (a, b, t) => a.map((v, i) => v + (b[i] - v) * t);
function ramp(stops, x) {
  if (x <= stops[0][0]) return stops[0][1];
  for (let i = 1; i < stops.length; i++) {
    if (x <= stops[i][0]) {
      const [x0, c0] = stops[i - 1], [x1, c1] = stops[i];
      return mix(c0, c1, sstep(0, 1, (x - x0) / (x1 - x0)));
    }
  }
  return stops[stops.length - 1][1];
}

const SKY = [
  [0.00, [96, 98, 112]], [0.20, [100, 104, 120]], [0.50, [104, 106, 118]],
  [0.80, [104, 98, 112]], [0.97, [92, 82, 104]], [1.04, [46, 44, 78]],
  [1.14, [17, 20, 42]], [1.32, [17, 20, 42]], [1.75, [24, 30, 64]], [2.0, [26, 33, 70]]
];
const SUN = [
  [0.00, [158, 128, 84]], [0.10, [156, 142, 112]], [0.50, [151, 146, 132]],
  [0.82, [160, 136, 96]], [0.94, [172, 116, 62]], [1.00, [0, 0, 0]]
];
const MOON = [
  [1.00, [0, 0, 0]], [1.52, [0, 0, 0]], [1.78, [52, 68, 110]], [2.0, [66, 86, 132]]
];

function state(T) {
  const out = { sky: ramp(SKY, T) };
  if (T < 1) {
    const elev = (62 * Math.PI / 180) * Math.sin(Math.PI * clamp(T, 0, 1)) ;
    const e = Math.max(elev, 0.006);
    out.L = Math.min((H * 0.21) / Math.tan(e), H * 6);
    out.phi = (-21 + 42 * T) * Math.PI / 180;
    out.light = ramp(SUN, T);
    out.blur = 1.5 + out.L * 0.01;
  } else {
    const k = sstep(1.56, 1.9, T);
    const elev = (8 + 34 * k) * Math.PI / 180;
    out.L = k > 0 ? (H * 0.21) / Math.tan(elev) : 0;
    out.phi = (-46 + 40 * k) * Math.PI / 180;
    out.light = ramp(MOON, T);
    out.blur = 4 + out.L * 0.012;
  }
  return out;
}

/* ---------- 字 ---------- */
const LINES = [
  [0.000, 0.215, '早上，影子比你先出门。'],
  [0.360, 0.640, '中午，它缩回脚下，\n一句话也不多说。'],
  [0.680, 0.840, '下午它又往外走了。\n你站着没动。'],
  [0.945, 0.998, '它走出了画面。\n你看上去还是小小一个人。'],
  [1.080, 1.320, '天黑了。\n影子没有消失，\n只是大到找不着边。'],
  [1.360, 1.600, '所以现在，\n哪儿都是你。'],
  [1.760, 2.010, '原来一身黑不是低调。\n是把夜晚提前穿在了身上。']
];
let curLine = -1, capIdx = 0;
function updateCaption(T) {
  let idx = -1;
  for (let i = 0; i < LINES.length; i++) if (T >= LINES[i][0] && T < LINES[i][1]) idx = i;
  if (idx === curLine) return;
  curLine = idx;
  capEls[capIdx].style.opacity = 0;
  capIdx = 1 - capIdx;
  const el = capEls[capIdx];
  if (idx >= 0) {
    el.textContent = LINES[idx][2];
    el.style.color = T < 1.02 ? 'rgba(46,42,40,.86)' : 'rgba(208,216,240,.9)';
    el.style.opacity = 1;
  }
}

/* ---------- 画 ---------- */
let swayT = 0;
function render(now) {
  const s = state(T);
  const sway = Math.sin(now * 0.0006) * 0.006 + Math.sin(now * 0.00137) * 0.003;
  const half = Math.min(Math.min(W, H) * 0.088, 48);

  drawShadowMask(s.phi + sway, s.L, s.blur, half);

  // 直射光（被影子挖掉一块）
  sctx.setTransform(1, 0, 0, 1, 0, 0);
  sctx.globalCompositeOperation = 'source-over';
  sctx.clearRect(0, 0, sunC.width, sunC.height);
  const [lr, lg, lb] = s.light;
  if (lr + lg + lb > 1) {
    sctx.fillStyle = `rgb(${lr | 0},${lg | 0},${lb | 0})`;
    sctx.fillRect(0, 0, sunC.width, sunC.height);
    sctx.globalCompositeOperation = 'destination-out';
    sctx.drawImage(maskC, 0, 0);
    sctx.globalCompositeOperation = 'source-over';
  }

  // 天光 + 直射光
  lctx.globalCompositeOperation = 'source-over';
  const [kr, kg, kb] = s.sky;
  lctx.fillStyle = `rgb(${kr | 0},${kg | 0},${kb | 0})`;
  lctx.fillRect(0, 0, lightC.width, lightC.height);
  lctx.globalCompositeOperation = 'lighter';
  lctx.drawImage(sunC, 0, 0);
  lctx.globalCompositeOperation = 'source-over';

  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.globalCompositeOperation = 'source-over';
  ctx.drawImage(ground, 0, 0);
  ctx.globalCompositeOperation = 'multiply';
  ctx.drawImage(lightC, 0, 0);
  ctx.globalCompositeOperation = 'source-over';

  // 暗角
  const vg = ctx.createRadialGradient(cv.width / 2, cv.height * .55, Math.min(cv.width, cv.height) * .35,
                                      cv.width / 2, cv.height * .55, Math.hypot(cv.width, cv.height) * .62);
  vg.addColorStop(0, 'rgba(0,0,0,0)');
  vg.addColorStop(1, T < 1 ? 'rgba(30,26,22,.16)' : 'rgba(4,6,16,.35)');
  ctx.fillStyle = vg;
  ctx.fillRect(0, 0, cv.width, cv.height);

  drawArc(T);
}

/* 顶上的弧：白天走太阳，夜里走月亮 */
function drawArc(T) {
  const x0 = W * 0.09, x1 = W * 0.91, yb = H * 0.105 + 4, ah = Math.min(H * 0.05, 40);
  const night = T >= 1;
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  ctx.lineWidth = 1;
  const a = night ? sstep(1.18, 1.35, T) : 1 - sstep(0.985, 1.0, T);
  ctx.strokeStyle = night ? `rgba(200,212,242,${.28 * Math.max(a, .35)})` : 'rgba(60,54,48,.34)';
  ctx.setLineDash([2, 5]);
  ctx.beginPath();
  for (let i = 0; i <= 60; i++) {
    const u = i / 60, x = x0 + (x1 - x0) * u, y = yb - ah * Math.sin(Math.PI * u);
    i ? ctx.lineTo(x, y) : ctx.moveTo(x, y);
  }
  ctx.stroke();
  ctx.setLineDash([]);

  let u, r, col, glow;
  if (!night) { u = T; r = 5; col = [246, 206, 140]; glow = 'rgba(255,214,150,'; }
  else { u = clamp((T - 1.22) / 0.78, 0, 1) * 0.62; r = 6.5; col = [238, 242, 255]; glow = 'rgba(210,222,255,'; }
  if (a <= 0.01) return;
  const x = x0 + (x1 - x0) * u, y = yb - ah * Math.sin(Math.PI * u);
  const gr = ctx.createRadialGradient(x, y, 0, x, y, r * 4.5);
  gr.addColorStop(0, glow + (.5 * a) + ')'); gr.addColorStop(1, glow + '0)');
  ctx.fillStyle = gr;
  ctx.beginPath(); ctx.arc(x, y, r * 4.5, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = `rgba(${col[0]},${col[1]},${col[2]},${a})`;
  ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill();
}

/* ---------- 手 ---------- */
let dragging = false, lastX = 0, lastY = 0, lastTime = 0, intro = true;
const PER_W = 0.85;
function nudge(dT) {
  target = clamp(target + dT, 0, 2);
  if (!touched && Math.abs(target - 0.1) > 0.05) { touched = true; hint.style.opacity = 0; }
}
cv.addEventListener('pointerdown', e => {
  dragging = true; intro = false; lastX = e.clientX; lastY = e.clientY; lastTime = performance.now(); vel = 0;
  cv.setPointerCapture && cv.setPointerCapture(e.pointerId);
});
cv.addEventListener('pointermove', e => {
  if (!dragging) return;
  const dx = e.clientX - lastX, dy = e.clientY - lastY;
  const now = performance.now(), dt = Math.max(now - lastTime, 1);
  const d = (Math.abs(dx) >= Math.abs(dy) ? dx : -dy * 0.6) / Math.min(W, 520) * PER_W;
  nudge(d);
  vel = vel * 0.6 + (d / dt) * 0.4;
  lastX = e.clientX; lastY = e.clientY; lastTime = now;
});
const up = () => { dragging = false; };
cv.addEventListener('pointerup', up); cv.addEventListener('pointercancel', up);
window.addEventListener('wheel', e => { intro = false; nudge((e.deltaX + e.deltaY) * 0.0009); e.preventDefault(); }, { passive: false });
window.addEventListener('keydown', e => {
  if (e.key === 'ArrowRight' || e.key === 'ArrowDown' || e.key === ' ') { intro = false; nudge(0.04); }
  if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') { intro = false; nudge(-0.04); }
});

const hm = location.hash.match(/t=([\d.]+)/);
if (hm) { T = target = parseFloat(hm[1]); intro = false; touched = true; hint.style.opacity = 0; capEls.forEach(e => e.style.transition = 'none'); }
let prev = performance.now();
function frame(now) {
  const dt = Math.min(now - prev, 50); prev = now;
  if (intro) target = Math.min(target + dt * 0.000005, 0.13);
  if (!dragging && Math.abs(vel) > 1e-6) { nudge(vel * dt); vel *= Math.pow(0.9, dt / 16); }
  T += (target - T) * (1 - Math.pow(0.84, dt / 16));
  render(now);
  updateCaption(T);
  requestAnimationFrame(frame);
}

window.addEventListener('resize', () => { clearTimeout(resize._t); resize._t = setTimeout(resize, 150); });
resize();
requestAnimationFrame(frame);
})();
</script>
</body>
</html>
