<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#141312">
<title>吃什么呢</title>
<style>
  :root{
    --bg:#141312;
    --ink:#ebe5d8;
    --dim:#7d776c;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);overflow:hidden;
    font-family:"PingFang SC","Hiragino Sans GB","Noto Sans CJK SC","Source Han Sans SC","Microsoft YaHei",sans-serif;
    font-weight:300;-webkit-user-select:none;user-select:none;touch-action:manipulation}
  #paint{position:fixed;inset:0;width:100%;height:100%;display:block}
  #app{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
    padding:0 24px 4vh}
  #top{position:absolute;left:0;right:0;top:calc(env(safe-area-inset-top) + 7vh);text-align:center;
    font-size:13px;letter-spacing:.2em;color:var(--dim);text-shadow:0 0 10px var(--bg),0 0 4px var(--bg)}
  #stage{position:relative;width:100%;display:flex;align-items:center;justify-content:center;padding-bottom:34px}
  #holder{position:relative;width:min(64vw,300px,40vh);aspect-ratio:1/1}
  #holder svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
  #caption{min-height:3.6em;max-width:20em;text-align:center;font-size:16px;line-height:1.8;
    letter-spacing:.06em;text-wrap:balance;text-shadow:0 0 12px var(--bg),0 0 5px var(--bg),0 0 2px var(--bg);opacity:0;transform:translateY(6px);transition:opacity .9s ease,transform .9s ease}
  #caption.on{opacity:1;transform:none}
  #btn{margin-top:18px;height:40px;padding:0 18px;border:0;background:none;color:var(--dim);
    font:inherit;font-size:14px;letter-spacing:.25em;cursor:pointer;opacity:0;pointer-events:none;transition:opacity .6s}
  #btn.on{opacity:1;pointer-events:auto}
  #btn span,#hint{text-shadow:0 0 10px var(--bg),0 0 4px var(--bg)}
  #btn span{border-bottom:1px solid #4a463f;padding-bottom:3px}
  #hint{position:absolute;left:0;right:0;bottom:-6px;text-align:center;font-size:12px;letter-spacing:.3em;color:var(--dim);
    opacity:0;transition:opacity .8s}
  #hint.on{opacity:1}

  .egg{cursor:pointer;transform-origin:100px 180px}
  .idle{animation:idle 3.6s ease-in-out infinite}
  @keyframes idle{0%,100%{transform:rotate(0)}46%{transform:rotate(0)}50%{transform:rotate(-3deg)}54%{transform:rotate(2.5deg)}58%{transform:rotate(-1deg)}62%{transform:rotate(0)}}
  .knock{animation:knock .28s ease-out}
  @keyframes knock{0%{transform:rotate(0)}30%{transform:rotate(4deg) translateY(2px)}65%{transform:rotate(-2deg)}100%{transform:rotate(0)}}
  .rollin{animation:rollin .9s cubic-bezier(.2,.8,.3,1) both}
  @keyframes rollin{from{transform:translateX(160%) rotate(220deg)}to{transform:translateX(0) rotate(0)}}
  .crack{fill:none;stroke:#3b352c;stroke-width:2;stroke-linejoin:round;stroke-linecap:round;
    stroke-dasharray:400;stroke-dashoffset:400;transition:stroke-dashoffset .35s ease-out}
  .crack.on{stroke-dashoffset:0}
  .topHalf,.botHalf{transition:transform .7s cubic-bezier(.3,.6,.3,1),opacity .6s ease .15s}
  .topHalf.off{transform:translate(-30px,-70px) rotate(-28deg);opacity:0}
  .botHalf.off{transform:translate(24px,60px) rotate(16deg);opacity:0}
  .shy{transform-origin:100px 105px;animation:shy 1.6s cubic-bezier(.3,.7,.3,1) forwards}
  @keyframes shy{0%{transform:translate(0,0) rotate(0)}12%{transform:translate(0,-10px) rotate(-4deg)}
    24%{transform:translate(0,0) rotate(0)}100%{transform:translate(58px,4px) rotate(118deg)}}

  .reveal{opacity:0;transform:scale(.86);transform-origin:100px 110px;transition:opacity .8s ease .2s,transform 1s cubic-bezier(.2,.9,.3,1.2) .2s}
  .reveal.on{opacity:1;transform:none}
  .floaty{animation:floaty 5s ease-in-out infinite}
  @keyframes floaty{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
  .steam{animation:steam 3.2s ease-in-out infinite;opacity:.0}
  .steam.b{animation-delay:1.1s}.steam.c{animation-delay:2.1s}
  @keyframes steam{0%{opacity:0;transform:translateY(8px)}40%{opacity:.7}100%{opacity:0;transform:translateY(-16px)}}
  .jiggle{transform-origin:100px 104px;animation:jiggle 2.8s ease-in-out infinite}
  @keyframes jiggle{0%,60%,100%{transform:scale(1,1)}66%{transform:scale(1.04,.9)}72%{transform:scale(.97,1.07)}78%{transform:scale(1.02,.96)}84%{transform:scale(.99,1.02)}90%{transform:scale(1,1)}}
  .shimmer{animation:shimmer 2.4s ease-in-out infinite}
  @keyframes shimmer{0%,100%{transform:translateX(0)}50%{transform:translateX(3px)}}

  #coda{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
    background:rgba(20,19,18,.0);pointer-events:none;opacity:0;transition:opacity 1.4s ease}
  #coda.on{opacity:1;pointer-events:auto;background:rgba(20,19,18,.72)}
  #coda p{margin:0;font-size:17px;line-height:2.2;letter-spacing:.12em;text-align:center}
  #coda .gap{height:2.4em}
  #coda .last{font-size:15px;color:#d9d2c3}
  #coda button{margin-top:44px}
</style>
</head>
<body>
<canvas id="paint"></canvas>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <filter id="wob" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency="0.035" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="4"/>
    </filter>
    <filter id="lace" x="-15%" y="-15%" width="130%" height="130%">
      <feTurbulence type="fractalNoise" baseFrequency="0.09" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="9"/>
    </filter>
    <radialGradient id="gShell" cx="38%" cy="30%" r="75%">
      <stop offset="0" stop-color="#fffaf0"/>
      <stop offset=".55" stop-color="#efe5d2"/>
      <stop offset="1" stop-color="#cdbd9f"/>
    </radialGradient>
    <radialGradient id="gWhite" cx="40%" cy="35%" r="70%">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset=".7" stop-color="#f3eee4"/>
      <stop offset="1" stop-color="#ddd3c1"/>
    </radialGradient>
    <radialGradient id="gYolk" cx="38%" cy="34%" r="70%">
      <stop offset="0" stop-color="#ffd76a"/>
      <stop offset=".6" stop-color="#f6b12a"/>
      <stop offset="1" stop-color="#e08d12"/>
    </radialGradient>
    <radialGradient id="gTea" cx="38%" cy="30%" r="75%">
      <stop offset="0" stop-color="#b98455"/>
      <stop offset=".6" stop-color="#8b5a32"/>
      <stop offset="1" stop-color="#5c3a1f"/>
    </radialGradient>
    <radialGradient id="gFade" cx="50%" cy="54%" r="38%">
      <stop offset=".45" stop-color="#fff"/><stop offset="1" stop-color="#000"/>
    </radialGradient>
    <mask id="mFade" maskUnits="userSpaceOnUse" x="-40" y="-40" width="280" height="280">
      <rect x="-40" y="-40" width="280" height="280" fill="url(#gFade)"/>
    </mask>
    <clipPath id="cTop"><path d="M0 0 H200 V112 L160 112 L140 102 L126 116 L112 104 L98 118 L84 102 L70 116 L58 104 L40 112 L0 112 Z"/></clipPath>
    <clipPath id="cBot"><path d="M0 200 H200 V112 L160 112 L140 102 L126 116 L112 104 L98 118 L84 102 L70 116 L58 104 L40 112 L0 112 Z"/></clipPath>
    <clipPath id="cEgg"><path d="M100 30 C140 30 158 95 158 125 C158 160 132 180 100 180 C68 180 42 160 42 125 C42 95 60 30 100 30 Z"/></clipPath>
  </defs>
</svg>

<div id="app">
  <div id="top"></div>
  <div id="stage">
    <div id="holder"></div>
    <div id="hint"></div>
  </div>
  <div id="caption"></div>
  <button id="btn"><span>再来一个</span></button>
</div>

<div id="coda">
  <p>吃了几种来着</p>
  <p>记不太清了</p>
  <p>只记得每一个都挺好</p>
  <div class="gap"></div>
  <p class="last">祝你天天吃鸡蛋，天天不一样</p>
  <button id="btn2" class="on" style="height:40px;padding:0 18px;border:0;background:none;color:#7d776c;font:inherit;font-size:14px;letter-spacing:.25em;cursor:pointer"><span style="border-bottom:1px solid #4a463f;padding-bottom:3px">再来一个</span></button>
</div>

<script>
(function(){
  const EGG = "M100 30 C140 30 158 95 158 125 C158 160 132 180 100 180 C68 180 42 160 42 125 C42 95 60 30 100 30 Z";
  const BLOB = "M60 70 C80 40 135 45 150 70 C175 90 170 140 140 155 C115 172 70 168 52 145 C32 120 40 90 60 70 Z";
  const BOWL = (fill) => `<path d="M28 104 C30 150 64 176 100 176 C136 176 170 150 172 104 Z" fill="${fill}"/>
      <path d="M28 104 C30 150 64 176 100 176" fill="none" stroke="rgba(255,255,255,.18)" stroke-width="3"/>`;
  const yolk = (x,y,r) => `<circle cx="${x}" cy="${y}" r="${r}" fill="url(#gYolk)"/>
      <ellipse cx="${x-r*.35}" cy="${y-r*.4}" rx="${r*.28}" ry="${r*.16}" fill="#fff6d8" opacity=".75" transform="rotate(-30 ${x-r*.35} ${y-r*.4})"/>`;

  const DISHES = [
    { say:"水煮的，壳一整片剥下来了，偷偷得意了一下",
      svg:`<g filter="url(#wob)">
        <path d="${EGG}" fill="url(#gWhite)" transform="translate(-16 2) rotate(-8 100 105)"/>
        <path d="M134 166 C136 134 162 112 190 120 C182 132 176 150 184 172 C168 164 150 162 134 166 Z" fill="#ece0c6"/>
        <path d="M142 160 C146 140 162 126 180 126 C174 140 172 152 176 164 C164 160 152 158 142 160 Z" fill="#d9c8a6"/>
      </g>`},
    { say:"溏心的，筷子戳下去那一下最好玩",
      svg:`<g filter="url(#wob)">
        <ellipse cx="100" cy="104" rx="66" ry="50" fill="url(#gWhite)"/>
        <path d="M84 116 C86 140 90 160 97 170 C103 176 109 168 107 156 C105 140 114 128 116 116 Z" fill="#f2a41c"/>
        ${yolk(100,100,30)}
      </g>`},
    { say:"煎的，蛋黄歪到一边去了，像在斜着眼睛看人",
      svg:`<g filter="url(#wob)">
        <path d="${BLOB}" fill="url(#gWhite)"/>
        ${yolk(130,90,21)}
        <path d="M118 84 C126 80 136 80 144 84" stroke="#e9d9b5" stroke-width="2" fill="none" opacity=".0"/>
      </g>`},
    { say:"边煎焦了，焦的那圈最香，先吃那圈",
      svg:`<g filter="url(#wob)">
        <path d="${BLOB}" fill="#f4eee2" stroke="#8a4f1f" stroke-width="12" stroke-linejoin="round" filter="url(#lace)"/>
        <path d="${BLOB}" fill="none" stroke="#c4823d" stroke-width="6" filter="url(#lace)" transform="translate(100 107) scale(.94) translate(-100 -107)"/>
        <path d="${BLOB}" fill="url(#gWhite)" transform="translate(100 107) scale(.88) translate(-100 -107)"/>
        ${yolk(102,104,23)}
      </g>`},
    { say:"打散了倒进汤里，散成一小片云，没想去抓",
      svg:`<g filter="url(#wob)">
        ${BOWL("#3f5bbf")}
        <ellipse cx="100" cy="104" rx="72" ry="16" fill="#c99a48"/>
        <g stroke="#fff1bd" stroke-width="5" stroke-linecap="round" fill="none">
          <path d="M58 104 q10 -7 20 0 t20 0"/><path d="M104 100 q8 -6 18 0 t16 2"/>
        </g>
        <g class="floaty" stroke="#fff3c8" stroke-width="5" stroke-linecap="round" fill="none" opacity=".92">
          <path d="M62 64 q8 -14 22 -6 q10 -14 26 -2 q14 -6 18 8"/>
          <path d="M96 40 q8 -10 18 -2 q10 -8 16 4"/>
          <path d="M70 84 q12 -6 24 0"/>
        </g>
      </g>`},
    { say:"茶叶蛋，壳上的裂纹像张地图，都是还没去过的地方",
      svg:`<g filter="url(#wob)">
        <path d="${EGG}" fill="url(#gTea)"/>
        <g clip-path="url(#cEgg)" fill="none" stroke="#3a2212" stroke-width="1.2" stroke-linejoin="round" opacity=".9">
          <path d="M50 110 L64 108 L66 100"/><path d="M80 112 L84 122 L76 126"/><path d="M100 96 L106 100 L104 110"/>
          <path d="M126 92 L132 100 L146 98"/><path d="M128 112 L134 120 L118 128"/><path d="M60 138 L72 146"/>
          <path d="M100 128 L108 136 L106 144"/><path d="M84 66 L96 78"/><path d="M128 52 L122 70"/><path d="M148 120 L138 132"/>
          <path d="M112 156 L120 166 L132 160"/><path d="M78 160 L90 150"/>
          <path d="M44 92 L62 98 L70 86 L88 92 L96 78 L114 84 L122 70 L140 76 L158 70"/>
          <path d="M62 98 L58 118 L76 126 L72 146 L90 150 L94 172"/>
          <path d="M88 92 L94 110 L114 108 L118 128 L138 132 L144 152 L158 150"/>
          <path d="M114 84 L118 64 L104 52 L108 34"/>
          <path d="M76 126 L94 110"/><path d="M118 128 L106 144 L90 150"/>
          <path d="M44 132 L58 118"/><path d="M140 76 L146 98 L138 132"/>
          <path d="M70 86 L72 60 L88 52"/><path d="M146 98 L160 104"/>
        </g>
        <g clip-path="url(#cEgg)" fill="#c99764" opacity=".55">
          <path d="M96 78 L114 84 L114 108 L94 110 L88 92 Z"/><path d="M72 146 L90 150 L94 172 L70 172 Z"/>
        </g>
      </g>`},
    { say:"埋进晒烫的沙子里，等它自己熟，不着急",
      svg:`<g filter="url(#wob)">
        <circle cx="150" cy="40" r="15" fill="#f3cf72"/>
        <g class="shimmer" stroke="#e48bb4" stroke-width="2" fill="none" stroke-linecap="round" opacity=".8">
          <path d="M40 70 q6 -5 12 0 t12 0 t12 0"/><path d="M60 86 q6 -5 12 0 t12 0"/>
        </g>
        <g mask="url(#mFade)">
          <path d="M-30 220 L-30 150 C30 138 96 110 150 114 C182 116 205 126 230 134 L230 220 Z" fill="#b98f45"/>
          <path d="${EGG}" fill="url(#gShell)" transform="translate(96 140) scale(.6) translate(-100 -105)"/>
          <path d="M-30 220 L-30 166 C20 150 60 136 96 136 C140 136 176 156 230 166 L230 220 Z" fill="#d9b468"/>
          <path d="M30 170 q26 -12 52 -8 M116 152 q26 2 50 14 M60 192 q34 -8 70 0" stroke="#bf9548" stroke-width="2" fill="none" stroke-linecap="round"/>
        </g>
      </g>`},
    { say:"打开是双黄的，今天白赚一个",
      svg:`<g filter="url(#wob)">
        <path d="${BLOB}" fill="url(#gWhite)" transform="translate(100 107) scale(1.06,1) translate(-100 -107)"/>
        ${yolk(82,100,20)}${yolk(124,114,20)}
      </g>`},
    { say:"半夜卧在泡面上，说好只吃一口的",
      svg:`<g filter="url(#wob)">
        <path d="M156 30 a14 14 0 1 0 10 24 a11 11 0 1 1 -10 -24 Z" fill="#e8dfc6" opacity=".85"/>
        ${BOWL("#c2306a")}
        <ellipse cx="100" cy="104" rx="72" ry="16" fill="#d9a85a"/>
        <g stroke="#f3dea6" stroke-width="3" fill="none" stroke-linecap="round">
          <path d="M40 104 q6 -6 12 0 t12 0 t12 0 t12 0"/><path d="M120 106 q6 -6 12 0 t12 0 t12 0"/>
          <path d="M60 110 q6 -5 12 0 t12 0 t12 0 t12 0 t12 0"/>
        </g>
        <g transform="translate(100 94) scale(.42,.3) translate(-100 -107)">
          <path d="${BLOB}" fill="url(#gWhite)"/>
        </g>
        <ellipse cx="102" cy="92" rx="10" ry="7" fill="url(#gYolk)"/>
      </g>
      <g stroke="#ebe5d8" stroke-width="2.5" fill="none" stroke-linecap="round">
        <path class="steam" d="M78 76 q-6 -10 0 -20 t0 -20"/>
        <path class="steam b" d="M102 72 q-6 -10 0 -20 t0 -20"/>
        <path class="steam c" d="M126 76 q-6 -10 0 -20 t0 -20"/>
      </g>`},
    { say:"蒸的，碗一晃它就跟着抖半天",
      svg:`<g filter="url(#wob)">
        ${BOWL("#8f7fd0")}
        <g class="jiggle">
          <ellipse cx="100" cy="104" rx="70" ry="17" fill="#f5d06a"/>
          <ellipse cx="82" cy="100" rx="22" ry="4" fill="#fff4c8" opacity=".7"/>
          <circle cx="112" cy="106" r="2.4" fill="#6b4320"/><circle cx="122" cy="103" r="1.8" fill="#6b4320"/><circle cx="104" cy="110" r="1.6" fill="#6b4320"/>
        </g>
      </g>`},
    { say:"蛋黄破了，流出来一小截，像冲你吐舌头",
      svg:`<g filter="url(#wob)">
        <path d="${BLOB}" fill="url(#gWhite)"/>
        <g transform="rotate(32 82 120)">
          <ellipse cx="82" cy="120" rx="15" ry="11" fill="#f2a628"/>
          <path d="M82 111 L82 125" stroke="#d07d0c" stroke-width="1.6" stroke-linecap="round"/>
        </g>
        ${yolk(104,96,24)}
      </g>`},
  ];
  const SHY = { shy:true, say:"这颗不想被打开，那就不打开" };

  const holder = document.getElementById('holder');
  const caption = document.getElementById('caption');
  const btn = document.getElementById('btn');
  const btn2 = document.getElementById('btn2');
  const hint = document.getElementById('hint');
  const top = document.getElementById('top');
  const coda = document.getElementById('coda');

  const h = new Date().getHours();
  top.textContent = (h >= 23 || h < 4) ? "这么晚了，吃什么呢" : "吃什么呢";

  // ---------- order ----------
  function shuffle(a){ for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; }
  let queue = [], firstRound = true, current = null;
  function refill(){
    queue = shuffle(DISHES.slice());
    if(current && queue[0] === current) queue.push(queue.shift());
    if(firstRound){ queue.splice(3 + Math.floor(Math.random()*2), 0, SHY); firstRound = false; }
  }
  refill();

  let state = 'idle', taps = 0, seen = 0, codaShown = false;

  // ---------- sound ----------
  let ac = null;
  function audio(){ if(!ac){ try{ ac = new (window.AudioContext||window.webkitAudioContext)(); }catch(e){} } if(ac && ac.state==='suspended') ac.resume(); return ac; }
  function tok(){
    const a = audio(); if(!a) return;
    const o = a.createOscillator(), g = a.createGain();
    o.type='sine'; o.frequency.setValueAtTime(1150,a.currentTime); o.frequency.exponentialRampToValueAtTime(700,a.currentTime+.05);
    g.gain.setValueAtTime(.18,a.currentTime); g.gain.exponentialRampToValueAtTime(.001,a.currentTime+.07);
    o.connect(g).connect(a.destination); o.start(); o.stop(a.currentTime+.08);
  }
  function crunch(){
    const a = audio(); if(!a) return;
    const n = Math.floor(a.sampleRate*.12), buf = a.createBuffer(1,n,a.sampleRate), d = buf.getChannelData(0);
    for(let i=0;i<n;i++){ const t=i/n; d[i]=(Math.random()*2-1)*Math.pow(1-t,3)*(Math.random()<.25?1:.35); }
    const s = a.createBufferSource(); s.buffer=buf;
    const f = a.createBiquadFilter(); f.type='bandpass'; f.frequency.value=2600; f.Q.value=.8;
    const g = a.createGain(); g.gain.value=.5;
    s.connect(f).connect(g).connect(a.destination); s.start();
  }

  // ---------- egg ----------
  function wholeEgg(){
    holder.innerHTML = `<svg viewBox="0 0 200 200">
      <g class="rollin" style="transform-origin:100px 105px"><g class="egg idle" id="egg">
        <ellipse cx="100" cy="182" rx="44" ry="5" fill="#000" opacity=".35"/>
        <path class="full" d="${EGG}" fill="url(#gShell)"/>
        <g class="topHalf" style="transform-origin:100px 110px"><g clip-path="url(#cTop)"><path d="${EGG}" fill="url(#gShell)"/></g></g>
        <g class="botHalf" style="transform-origin:100px 130px"><g clip-path="url(#cBot)"><path d="${EGG}" fill="url(#gShell)"/></g></g>
        <path class="crack" d="M48 109 L58 104 L70 116 L84 102 L98 118 L112 104 L126 116 L140 102 L152 108"/>
      </g></g></svg>`;
    taps = 0; state = 'whole';
    current = queue.shift(); if(!queue.length) refill();
    const egg = holder.querySelector('#egg');
    egg.addEventListener('pointerdown', onEgg);
    hint.textContent = '敲一下';
    setTimeout(()=>{ if(state==='whole' && taps===0) hint.classList.add('on'); }, seen===0 ? 900 : 1800);
  }

  function onEgg(e){
    e.preventDefault();
    if(state !== 'whole') return;
    const egg = holder.querySelector('#egg');
    egg.classList.remove('idle');
    taps++;
    if(current.shy){ state='busy'; hint.classList.remove('on'); tok();
      holder.querySelector('ellipse').style.opacity = 0;
      egg.classList.remove('knock'); void egg.getBBox(); egg.classList.add('shy');
      setTimeout(()=>say(current.say), 1300);
      return;
    }
    if(taps === 1){
      tok();
      egg.classList.remove('knock'); void egg.getBBox(); egg.classList.add('knock');
      holder.querySelector('.crack').classList.add('on');
      hint.textContent = '再敲一下';
    } else {
      state = 'busy'; hint.classList.remove('on');
      crunch();
      holder.querySelector('.crack').style.opacity = 0;
      holder.querySelector('.full').style.display = 'none';
      holder.querySelector('.topHalf').classList.add('off');
      holder.querySelector('.botHalf').classList.add('off');
      holder.querySelector('ellipse').style.opacity = 0;
      const n = 1 + (Math.random()<.6 ? 1 : 0);
      for(let i=0;i<n;i++) setTimeout(addStroke, 120 + i*380);
      setTimeout(()=>{
        const r = document.createElementNS('http://www.w3.org/2000/svg','g');
        r.setAttribute('class','reveal'); r.innerHTML = current.svg;
        holder.querySelector('svg').appendChild(r);
        requestAnimationFrame(()=>requestAnimationFrame(()=>r.classList.add('on')));
        setTimeout(()=>say(current.say), 700);
      }, 380);
    }
  }

  function say(text){
    caption.innerHTML = text.split(/(?<=，)/).map(c => `<span style="white-space:nowrap">${c}</span>`).join('');
    caption.classList.add('on');
    seen++;
    setTimeout(()=>{ btn.classList.add('on'); state='done'; }, 1200);
  }

  function next(){
    if(state !== 'done') return;
    state = 'busy';
    btn.classList.remove('on');
    caption.classList.remove('on');
    if(seen >= 7 && !codaShown){
      codaShown = true;
      holder.style.transition='opacity .8s'; holder.style.opacity=0;
      for(let i=0;i<3;i++) setTimeout(addStroke, 200+i*450);
      setTimeout(()=>coda.classList.add('on'), 900);
      return;
    }
    const s = holder.querySelector('svg'); if(s){ s.style.transition='opacity .45s, transform .45s'; s.style.opacity=0; s.style.transform='translateX(-30%)'; }
    setTimeout(wholeEgg, 480);
  }
  btn.addEventListener('click', next);
  btn2.addEventListener('click', ()=>{
    coda.classList.remove('on');
    holder.style.opacity=1;
    setTimeout(wholeEgg, 500);
  });

  // ---------- paint (dry-brush strokes on dark ground) ----------
  const cv = document.getElementById('paint'), cx = cv.getContext('2d');
  let W=0, H=0, DPR=1;
  const strokes = [];
  const PAL = ['#4a63c9','#6f8fe0','#e48bb4','#c2306a','#c9a43c','#3f8fb5','#9a86cf','#5a74d6','#e8a3c3'];
  function resize(){
    DPR = Math.min(window.devicePixelRatio||1, 2);
    W = innerWidth; H = innerHeight;
    cv.width = W*DPR; cv.height = H*DPR;
    cx.setTransform(DPR,0,0,DPR,0,0);
    cx.clearRect(0,0,W,H);
    strokes.forEach(s=>drawStroke(s,1));
  }
  let seed = 1;
  function rnd(){ seed = (seed*16807)%2147483647; return (seed-1)/2147483646; }

  function makeStroke(){
    // keep strokes mostly away from very top text and from overlapping each other too much
    const len = W*(.22 + Math.random()*.32);
    const w = 16 + Math.random()*12, bend = (Math.random()-.5)*18;
    const keep = [];                                   // leave the words readable
    const c = caption.getBoundingClientRect(), b = btn.getBoundingClientRect(), t = top.getBoundingClientRect();
    keep.push([c.top - 6, b.bottom + 6], [t.top - 6, t.bottom + 6]);
    const clash = y => keep.some(([a,z]) => y + w/2 + Math.abs(bend) > a && y - w/2 - Math.abs(bend) < z);
    let y, tries = 0;
    do { y = H*(.06 + Math.random()*.9); tries++; }
    while(tries < 40 && (clash(y) || strokes.some(s => Math.abs(s.y - y) < 12)));
    const x = -W*.05 + Math.random()*(W*1.05 - len*.6);
    return { x, y, len, w, bend,
      color: PAL[Math.floor(Math.random()*PAL.length)], seed: Math.floor(Math.random()*1e9)+1 };
  }
  function drawStroke(s, p){
    seed = s.seed;
    const lines = Math.round(s.w*1.8);
    cx.save();
    cx.globalCompositeOperation = 'source-over';
    cx.strokeStyle = s.color;
    cx.lineCap = 'round';
    for(let i=0;i<lines;i++){
      const off = (i/(lines-1)-.5)*s.w;
      const startT = rnd()*.06, endT = 1 - rnd()*rnd()*.35;          // ragged ends
      const alpha = .18 + rnd()*.4;
      const lw = 1 + rnd()*1.6;
      const jit = (rnd()-.5)*1.4;
      const segs = 40;
      const upto = Math.min(endT, startT + (endT-startT)*p);
      cx.globalAlpha = alpha; cx.lineWidth = lw;
      cx.beginPath();
      let pen = false;
      for(let k=0;k<=segs;k++){
        const t = startT + (upto-startT)*(k/segs);
        if(rnd() < .05 + .25*Math.max(0,(t-.7)/.3)){ pen=false; continue; }   // dry gaps, more near the tail
        const px = s.x + t*s.len;
        const py = s.y + off + jit + Math.sin(t*Math.PI)*s.bend - off*.12*t;
        if(!pen){ cx.moveTo(px,py); pen=true; } else cx.lineTo(px,py);
      }
      cx.stroke();
    }
    cx.restore();
  }
  function addStroke(){
    const s = makeStroke();
    strokes.push(s);
    const t0 = performance.now(), dur = 650;
    const snap = document.createElement('canvas'); snap.width = cv.width; snap.height = cv.height;
    snap.getContext('2d').drawImage(cv,0,0);
    function f(now){
      const p = Math.min(1,(now-t0)/dur), e = 1-Math.pow(1-p,3);
      cx.save(); cx.setTransform(1,0,0,1,0,0); cx.clearRect(0,0,cv.width,cv.height); cx.drawImage(snap,0,0); cx.restore();
      drawStroke(s, e);
      if(p<1) requestAnimationFrame(f);
    }
    requestAnimationFrame(f);
  }
  addEventListener('resize', resize);
  resize();

  // start
  setTimeout(wholeEgg, 500);
})();
</script>
</body>
</html>
