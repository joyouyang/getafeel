<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#1c2230">
<title>低头</title>
<style>
  html,body{margin:0;height:100%;background:#1c2230;overflow:hidden;
    -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
  canvas{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab}
  canvas:active{cursor:grabbing}
  #line{position:fixed;left:0;right:0;top:calc(env(safe-area-inset-top,0px) + 9vh);
    margin:0 auto;max-width:21em;padding:0 2em;box-sizing:border-box;
    font:400 15px/1.9 "PingFang SC","Hiragino Sans GB","Noto Sans SC","Microsoft YaHei",sans-serif;
    letter-spacing:.12em;color:#3a3833;opacity:0;transition:opacity 1.1s ease,color 1.5s ease;pointer-events:none;
    text-align:left}
  #line.on{opacity:.82}
  @media (min-aspect-ratio:1/1){ #line{margin:0;left:7vw;right:auto;top:12vh} }
  #hint{position:fixed;left:0;right:0;bottom:calc(env(safe-area-inset-bottom,0px) + 4.5vh);text-align:center;
    font:400 12px/1 "PingFang SC","Noto Sans SC",sans-serif;letter-spacing:.3em;color:#fff;opacity:0;
    transition:opacity 1.6s ease;pointer-events:none;mix-blend-mode:difference}
  #hint.on{opacity:.45}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="line"></div>
<div id="hint">左右拖动 · 轻点地面</div>
<script>
(() => {
const cv = document.getElementById('c');
const ctx = cv.getContext('2d');
const lineEl = document.getElementById('line');
const hintEl = document.getElementById('hint');

let W, H, dpr, floorTex, soft, sCtx, sharp, shCtx, comb, cCtx, SOFT_DIV;
const canFilter = typeof ctx.filter === 'string';

function mk(w, h){ const c = document.createElement('canvas'); c.width = Math.max(1, w|0); c.height = Math.max(1, h|0); return c; }

// 随机数（固定种子，地砖每次长得一样）
let seed = 7;
function rnd(){ seed = (seed * 16807) % 2147483647; return (seed - 1) / 2147483646; }

function resize(){
  dpr = Math.min(window.devicePixelRatio || 1, 2);
  W = window.innerWidth; H = window.innerHeight;
  cv.width = W * dpr; cv.height = H * dpr;
  SOFT_DIV = canFilter ? 2 : 5;
  soft = mk(W * dpr / SOFT_DIV, H * dpr / SOFT_DIV); sCtx = soft.getContext('2d');
  sharp = mk(W * dpr, H * dpr); shCtx = sharp.getContext('2d');
  comb = mk(W * dpr, H * dpr); cCtx = comb.getContext('2d');
  buildFloor();
}

function buildFloor(){
  seed = 7;
  floorTex = mk(W * dpr, H * dpr);
  const g = floorTex.getContext('2d');
  g.scale(dpr, dpr);
  g.fillStyle = '#c6c2ba'; g.fillRect(0, 0, W, H);
  // 大块的斑驳
  for (let i = 0; i < 160; i++){
    const x = rnd() * W, y = rnd() * H, r = 20 + rnd() * 90;
    const gr = g.createRadialGradient(x, y, 0, x, y, r);
    const dark = rnd() < .5;
    gr.addColorStop(0, dark ? 'rgba(60,58,55,.05)' : 'rgba(255,255,250,.05)');
    gr.addColorStop(1, 'rgba(0,0,0,0)');
    g.fillStyle = gr; g.fillRect(x - r, y - r, r * 2, r * 2);
  }
  // 地砖
  const ts = Math.max(W, H) * 0.23, ang = -0.52;
  const R = Math.hypot(W, H);
  g.save(); g.translate(W * 0.55, H * 0.6); g.rotate(ang);
  const n = Math.ceil(R / ts) + 1;
  for (let i = -n; i <= n; i++) for (let j = -n; j <= n; j++){
    const v = (rnd() - .5) * 0.07;
    g.fillStyle = v > 0 ? `rgba(255,255,248,${v})` : `rgba(40,38,35,${-v})`;
    g.fillRect(i * ts, j * ts * 1.0, ts, ts);
  }
  g.lineWidth = 1.1;
  for (let i = -n; i <= n; i++){
    g.strokeStyle = 'rgba(255,255,250,.42)';
    g.beginPath(); g.moveTo(i * ts, -R); g.lineTo(i * ts, R); g.stroke();
    g.beginPath(); g.moveTo(-R, i * ts); g.lineTo(R, i * ts); g.stroke();
    g.strokeStyle = 'rgba(40,38,35,.10)';
    g.beginPath(); g.moveTo(i * ts + 1.2, -R); g.lineTo(i * ts + 1.2, R); g.stroke();
    g.beginPath(); g.moveTo(-R, i * ts + 1.2); g.lineTo(R, i * ts + 1.2); g.stroke();
  }
  g.restore();
  // 石材颗粒
  const N = (W * H / 9) | 0;
  for (let i = 0; i < N; i++){
    const x = rnd() * W, y = rnd() * H, s = 0.4 + rnd() * 1.3;
    const d = rnd();
    g.fillStyle = d < .55 ? `rgba(70,68,64,${.08 + rnd() * .22})` : `rgba(250,248,240,${.08 + rnd() * .25})`;
    g.fillRect(x, y, s, s);
  }
}

// ---------- 时间 ----------
// t ∈ [0,1) 循环：0 正午 → .55 日落 → 夜 → .88 天亮 → 回到正午
let t = 0.30, vel = 0, lastInput = -1e9, started = performance.now();

const smooth = (a, b, x) => { const k = Math.min(1, Math.max(0, (x - a) / (b - a))); return k * k * (3 - 2 * k); };
const lerp = (a, b, k) => a + (b - a) * k;
const hex = h => [parseInt(h.slice(1,3),16), parseInt(h.slice(3,5),16), parseInt(h.slice(5,7),16)];

// 地面被照亮的颜色（关键帧）
const LIT = [
  [0.00, '#e9e6df'], [0.28, '#ece2d0'], [0.42, '#f1d2a4'], [0.50, '#e9a978'],
  [0.545,'#8d6c72'], [0.585,'#4a4658'], [0.63, '#344059'], [0.84, '#344059'],
  [0.90, '#59617a'], [0.95, '#b9b9bf'], [1.00, '#e9e6df']
];
function keyColor(KF, x){
  for (let i = 0; i < KF.length - 1; i++){
    const [a, ca] = KF[i], [b, cb] = KF[i + 1];
    if (x >= a && x <= b){
      const k = smooth(0, 1, (x - a) / (b - a)), A = hex(ca), B = hex(cb);
      return A.map((v, j) => Math.round(lerp(v, B[j], k)));
    }
  }
  return hex(KF[0][1]);
}

function lights(x){
  const L = [];
  const sunA = x < 0.55 ? 1 - smooth(0.47, 0.55, x) : smooth(0.88, 0.96, x);
  if (sunA > 0.001){
    let e, th;
    if (x < 0.55){ e = 50 * (1 - x / 0.55); th = lerp(-0.07, 0.13, x / 0.55); }
    else { const k = (x - 0.88) / 0.12; e = lerp(4, 50, k); th = lerp(-0.16, -0.07, k); }
    e = Math.max(e, 2.2);
    const cot = 1 / Math.tan(e * Math.PI / 180);
    const warm = smooth(0.30, 0.50, x) * (x < 0.6 ? 1 : 0);
    L.push({ kind: 'sun', a: 0.6 * sunA, th, len: H * 0.42 * cot, cot,
      col: warm > 0 ? mix([46,46,52], [52,44,78], warm) : [46,46,52], shade: x < 0.6 });
  }
  const moonA = smooth(0.57, 0.64, x) * (1 - smooth(0.85, 0.91, x));
  if (moonA > 0.001) L.push({ kind: 'moon', a: 0.55 * moonA, th: 0.07, len: H * 1.05, col: [8, 12, 24] });
  const lampA = smooth(0.70, 0.77, x) * (1 - smooth(0.84, 0.89, x));
  if (lampA > 0.001) L.push({ kind: 'lamp', a: 0.42 * lampA, th: -0.36, len: H * 0.58, col: [16, 12, 10], glow: lampA });
  return L;
}
function mix(a, b, k){ return a.map((v, i) => Math.round(lerp(v, b[i], k))); }

// ---------- 影子的形状 ----------
// 局部坐标：脚在 (0,0)，头顶在 y≈-1；x 以身宽为单位
function figure(g){
  g.beginPath();
  // 两条腿
  g.moveTo(-0.16, 0.12); g.quadraticCurveTo(-0.14, -0.12, -0.13, -0.34); g.lineTo(-0.03, -0.34); g.quadraticCurveTo(-0.03, -0.1, -0.025, 0.12); g.closePath();
  g.moveTo(0.025, 0.12); g.quadraticCurveTo(0.035, -0.1, 0.035, -0.34); g.lineTo(0.14, -0.34); g.quadraticCurveTo(0.15, -0.12, 0.17, 0.12); g.closePath();
  // 长外套
  g.moveTo(-0.18, -0.30);
  g.quadraticCurveTo(-0.15, -0.52, -0.148, -0.74);
  g.quadraticCurveTo(-0.14, -0.81, -0.085, -0.835);
  g.lineTo(0.085, -0.835);
  g.quadraticCurveTo(0.15, -0.81, 0.155, -0.74);
  g.quadraticCurveTo(0.18, -0.52, 0.205, -0.30);
  g.quadraticCurveTo(0.02, -0.285, -0.17, -0.31);
  g.closePath();
  g.fill();
  // 头和披下来的头发，一整块
  g.beginPath();
  g.moveTo(-0.045, -0.82);
  g.quadraticCurveTo(-0.085, -0.835, -0.078, -0.885);
  g.quadraticCurveTo(-0.08, -0.975, 0.0, -0.985);
  g.quadraticCurveTo(0.08, -0.975, 0.078, -0.89);
  g.quadraticCurveTo(0.088, -0.84, 0.05, -0.82);
  g.closePath();
  g.fill();

  // 垂下的那只手
  g.lineCap = 'round'; g.lineJoin = 'round';
  g.lineWidth = 0.055;
  g.beginPath(); g.moveTo(-0.13, -0.78); g.quadraticCurveTo(-0.19, -0.6, -0.205, -0.42); g.stroke();
  g.beginPath(); g.ellipse(-0.208, -0.39, 0.034, 0.03, 0, 0, Math.PI * 2); g.fill();
  // 举起来的那只手，端着一杯东西
  g.lineWidth = 0.05;
  g.beginPath(); g.moveTo(-0.12, -0.79); g.lineTo(-0.215, -0.70); g.lineTo(-0.255, -0.765); g.stroke();
  // 杯子 + 吸管
  g.beginPath();
  g.moveTo(-0.295, -0.745); g.lineTo(-0.22, -0.745); g.lineTo(-0.226, -0.80); g.lineTo(-0.289, -0.80); g.closePath(); g.fill();
  g.lineWidth = 0.012;
  g.beginPath(); g.moveTo(-0.262, -0.80); g.lineTo(-0.252, -0.84); g.stroke();
}

// 海鸥（俯看下去的影子）
function gullShape(g, f){
  g.beginPath();
  g.moveTo(0.34, 0);
  g.quadraticCurveTo(0.2, -0.07, 0.06, -0.08);
  g.quadraticCurveTo(0.06, -0.30 * f, 0.02, -0.46 * f);
  g.quadraticCurveTo(-0.06, -0.78 * f, -0.22, -1.0 * f);
  g.quadraticCurveTo(-0.22, -0.55 * f, -0.17, -0.08);
  g.lineTo(-0.40, -0.07); g.lineTo(-0.46, 0); g.lineTo(-0.40, 0.07); g.lineTo(-0.17, 0.08);
  g.quadraticCurveTo(-0.22, 0.55 * f, -0.22, 1.0 * f);
  g.quadraticCurveTo(-0.06, 0.78 * f, 0.02, 0.46 * f);
  g.quadraticCurveTo(0.06, 0.30 * f, 0.06, 0.08);
  g.quadraticCurveTo(0.2, 0.07, 0.34, 0);
  g.closePath(); g.fill();
}

const gulls = [];
function spawnGulls(px, py, count){
  const ang = (Math.random() < .5 ? 0 : Math.PI) + (Math.random() - .5) * 1.4;
  const speed = Math.min(W, H) * (0.75 + Math.random() * 0.35);
  const D = Math.hypot(W, H) * 0.75;
  const ux = Math.cos(ang), uy = Math.sin(ang);
  for (let i = 0; i < count; i++){
    const off = (i === 0 ? 0 : (Math.random() - .5) * Math.min(W, H) * 0.5);
    const lag = i * (0.25 + Math.random() * 0.4);
    gulls.push({
      x: px - ux * (D + lag * speed) - uy * off, y: py - uy * (D + lag * speed) + ux * off,
      vx: ux * speed, vy: uy * speed, ang, ph: Math.random() * 6,
      fr: 4.5 + Math.random() * 2, size: Math.min(W, H, 600) * (0.14 + Math.random() * 0.07),
      life: 0, max: (2 * D + lag * speed) / speed + 0.5, glide: Math.random() * 3
    });
  }
}

// ---------- 画 ----------
function drawLight(Lt, x){
  const fw = W * dpr, fh = H * dpr;
  const feetX = W * 0.5, feetY = H + Math.min(W, H) * 0.03;
  const Wb = Math.min(W * 0.95, H * 0.52);
  const c = Math.cos(Lt.th), s = Math.sin(Lt.th);
  const len = Math.max(Lt.len, H * 0.05);
  const colStr = `rgb(${Lt.col[0]},${Lt.col[1]},${Lt.col[2]})`;

  // 柔和层：远处的模糊、楼投下的大块阴影、海鸥
  const k = dpr / SOFT_DIV;
  sCtx.setTransform(1, 0, 0, 1, 0, 0);
  sCtx.clearRect(0, 0, soft.width, soft.height);
  sCtx.fillStyle = colStr; sCtx.strokeStyle = colStr;
  if (canFilter) sCtx.filter = `blur(${Math.round((3 + Math.min(14, len / H * 2.5)) * k)}px)`;
  sCtx.setTransform(Wb * c * k, Wb * s * k, -len * s * k, len * c * k, feetX * k, feetY * k);
  figure(sCtx);
  if (Lt.shade){
    // 旁边那栋楼的影子，太阳越低越宽
    const d = (-0.47 + 0.036 * Math.min(Lt.cot, 26)) * Math.hypot(W, H);
    sCtx.setTransform(k, 0, 0, k, 0, 0);
    sCtx.translate(W * 0.5, H * 0.5); sCtx.rotate(Math.PI - 0.62);
    const B = Math.hypot(W, H) * 3;
    sCtx.fillRect(-B, -B, B + d, 2 * B);
  }
  if (Lt.main && gulls.length){
    // 鸟飞得高，影子本该更虚；但太虚就看不出是鸟了
    if (canFilter) sCtx.filter = `blur(${Math.round(2 * k)}px)`;
    for (const gl of gulls){
      sCtx.setTransform(k, 0, 0, k, 0, 0);
      sCtx.translate(gl.x + Math.sin(Lt.th) * -40, gl.y + 30); sCtx.rotate(gl.ang); sCtx.scale(gl.size, gl.size);
      const flap = (Math.sin(gl.glide + gl.life * 0.9) > 0.35) ? 0.92 : 0.55 + 0.45 * Math.abs(Math.sin(gl.ph + gl.life * gl.fr));
      gullShape(sCtx, flap);
    }
  }
  if (canFilter) sCtx.filter = 'none';

  // 清晰层：脚边的影子是实的，越远越虚
  shCtx.setTransform(1, 0, 0, 1, 0, 0);
  shCtx.globalCompositeOperation = 'source-over';
  shCtx.clearRect(0, 0, fw, fh);
  shCtx.fillStyle = colStr; shCtx.strokeStyle = colStr;
  shCtx.setTransform(Wb * c * dpr, Wb * s * dpr, -len * s * dpr, len * c * dpr, feetX * dpr, feetY * dpr);
  figure(shCtx);
  shCtx.setTransform(dpr, 0, 0, dpr, 0, 0);
  shCtx.globalCompositeOperation = 'destination-in';
  const reach = Math.min(len * 0.55, H * 0.9);
  const gr = shCtx.createLinearGradient(feetX, feetY, feetX + s * reach, feetY - c * reach);
  gr.addColorStop(0, 'rgba(0,0,0,1)'); gr.addColorStop(0.5, 'rgba(0,0,0,.6)'); gr.addColorStop(1, 'rgba(0,0,0,0)');
  shCtx.fillStyle = gr; shCtx.fillRect(0, 0, W, H);
  shCtx.globalCompositeOperation = 'source-over';

  // 合成
  cCtx.setTransform(1, 0, 0, 1, 0, 0);
  cCtx.clearRect(0, 0, fw, fh);
  cCtx.imageSmoothingEnabled = true;
  cCtx.drawImage(soft, 0, 0, fw, fh);
  cCtx.drawImage(sharp, 0, 0);

  ctx.save();
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.globalCompositeOperation = 'multiply';
  ctx.globalAlpha = Lt.a;
  ctx.drawImage(comb, 0, 0);
  ctx.restore();
}

function render(){
  const fw = W * dpr, fh = H * dpr;
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.globalCompositeOperation = 'source-over'; ctx.globalAlpha = 1;
  ctx.drawImage(floorTex, 0, 0);
  const lc = keyColor(LIT, t);
  ctx.globalCompositeOperation = 'multiply';
  ctx.fillStyle = `rgb(${lc[0]},${lc[1]},${lc[2]})`;
  ctx.fillRect(0, 0, fw, fh);
  ctx.globalCompositeOperation = 'source-over';

  const Ls = lights(t);
  // 路灯在左下角，夜里有一点暖光
  const lamp = Ls.find(l => l.kind === 'lamp');
  if (lamp){
    ctx.save(); ctx.scale(dpr, dpr);
    ctx.globalCompositeOperation = 'screen';
    const r = Math.max(W, H) * 0.9;
    const g = ctx.createRadialGradient(W * 1.15, H * 1.05, 0, W * 1.15, H * 1.05, r);
    g.addColorStop(0, `rgba(120,90,55,${0.55 * lamp.glow})`); g.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
    ctx.restore();
  }
  let mainI = -1, best = 0;
  Ls.forEach((l, i) => { if (l.kind !== 'lamp' && l.a > best){ best = l.a; mainI = i; } });
  Ls.forEach((l, i) => { l.main = i === mainI; drawLight(l, t); });

  // 晚上地面上很淡的一层冷光
  const night = smooth(0.58, 0.66, t) * (1 - smooth(0.86, 0.92, t));
  if (night > 0){
    ctx.save(); ctx.scale(dpr, dpr);
    ctx.globalCompositeOperation = 'screen';
    const g = ctx.createRadialGradient(W * 0.35, -H * 0.1, 0, W * 0.35, -H * 0.1, H * 1.1);
    g.addColorStop(0, `rgba(70,90,130,${0.35 * night})`); g.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
    ctx.restore();
  }
  // 暗角
  ctx.save(); ctx.scale(dpr, dpr);
  const v = ctx.createRadialGradient(W / 2, H * 0.55, Math.min(W, H) * 0.3, W / 2, H * 0.55, Math.hypot(W, H) * 0.65);
  v.addColorStop(0, 'rgba(0,0,0,0)'); v.addColorStop(1, 'rgba(0,0,0,.22)');
  ctx.fillStyle = v; ctx.fillRect(0, 0, W, H);
  ctx.restore();

  const dark = t > 0.455 && t < 0.905;
  lineEl.style.color = dark ? '#d3d8e2' : '#37352f';
  lineEl.style.textShadow = dark ? '0 0 14px rgba(10,12,20,.55)' : '0 0 14px rgba(250,246,238,.6)';
  document.querySelector('meta[name=theme-color]').content = `rgb(${lc.map(v => Math.round(v * 0.62)).join(',')})`;
}

// ---------- 字 ----------
const LINES = [
  [0.00, '中午。影子缩在脚边，<br>小小一团。'],
  [0.15, '也没什么事。<br>就站一会儿。'],
  [0.30, '斜过去了。<br>它比我先走到前面。'],
  [0.43, '越晚越长。<br>长到后来，分不清哪一截是我，<br>哪一截是楼的。'],
  [0.53, '天黑了。<br>它没有不见，是铺满了。'],
  [0.62, '今天什么也没做成。<br>不过地上这么大一片，都是它。'],
  [0.745,'两处光，就有两个。<br>哪个都算，哪个都不全。'],
  [0.875,'又短回来了。<br>也行。']
];
function lineFor(x){ let s = LINES[0][1]; for (const [a, l] of LINES) if (x >= a) s = l; return s; }

let shown = '', pending = null, override = null, overrideUntil = 0, swapTimer = 0;
function setLine(s){
  if (s === shown || s === pending) return;
  pending = s;
  lineEl.classList.remove('on');
  clearTimeout(swapTimer);
  swapTimer = setTimeout(() => { lineEl.innerHTML = s; shown = s; pending = null; lineEl.classList.add('on'); }, shown ? 900 : 50);
}

let taps = 0;
function onTap(x, y){
  taps++;
  spawnGulls(x, y, taps === 1 ? 2 : 1 + (Math.random() * 3 | 0));
  const now = performance.now();
  if (taps === 1){ override = '头顶飞过去了几只。<br>没抬头。地上知道。'; overrideUntil = now + 5200; }
  else if (taps === 6){ override = '飞过去的都不归我。<br>也不用归我。'; overrideUntil = now + 5200; }
  lastInput = now;
}

// ---------- 输入 ----------
let down = null, lastX = 0, lastY = 0, lastT = 0, moved = 0;
cv.addEventListener('pointerdown', e => {
  down = { x: e.clientX, y: e.clientY }; lastX = e.clientX; lastY = e.clientY; lastT = performance.now(); moved = 0; vel = 0;
  cv.setPointerCapture && cv.setPointerCapture(e.pointerId);
});
cv.addEventListener('pointermove', e => {
  if (!down) return;
  const dx = e.clientX - lastX, dy = e.clientY - lastY;
  moved += Math.abs(dx) + Math.abs(dy);
  const now = performance.now(), dt = Math.max(8, now - lastT);
  const dtT = dx / (Math.min(W, 520) * 7);
  t = (t + dtT + 1) % 1;
  vel = vel * 0.6 + (dtT / dt * 1000) * 0.4 * 0.3;
  lastX = e.clientX; lastY = e.clientY; lastT = now; lastInput = now;
  if (moved > 30) hintEl.classList.remove('on');
});
function up(e){
  if (!down) return;
  if (moved < 10) onTap(e.clientX, e.clientY); else hintSeen = true;
  if (performance.now() - lastT > 80) vel = 0;
  down = null;
}
cv.addEventListener('pointerup', up);
cv.addEventListener('pointercancel', () => { down = null; vel = 0; });
window.addEventListener('wheel', e => {
  const d = (Math.abs(e.deltaX) > Math.abs(e.deltaY) ? e.deltaX : e.deltaY);
  t = (t + d / (W * 8) + 1) % 1; lastInput = performance.now(); hintEl.classList.remove('on');
}, { passive: true });
window.addEventListener('keydown', e => {
  if (e.key === 'ArrowRight') { t = (t + 0.01) % 1; lastInput = performance.now(); }
  if (e.key === 'ArrowLeft')  { t = (t - 0.01 + 1) % 1; lastInput = performance.now(); }
  if (e.key === ' ') onTap(W * Math.random(), H * Math.random());
});
let hintSeen = false;

window.addEventListener('resize', resize);
resize();

// ---------- 循环 ----------
let prev = performance.now(), nextAutoGull = 9000;
function frame(now){
  const dt = Math.min(0.05, (now - prev) / 1000); prev = now;
  if (!down){
    if (Math.abs(vel) > 1e-4){ t = (t + vel * dt + 1) % 1; vel *= Math.pow(0.04, dt); }
    else vel = 0;
    if (now - lastInput > 3500) t = (t + dt / 260) % 1;   // 不碰它，它也会慢慢走
  }
  for (let i = gulls.length - 1; i >= 0; i--){
    const g = gulls[i]; g.life += dt; g.x += g.vx * dt; g.y += g.vy * dt;
    if (g.life > g.max) gulls.splice(i, 1);
  }
  const el = now - started;
  if (el > nextAutoGull && (t < 0.5 || (t > 0.63 && t < 0.85))){
    spawnGulls(W * (0.2 + Math.random() * 0.6), H * (0.2 + Math.random() * 0.5), 1 + (Math.random() * 2 | 0));
    nextAutoGull = el + 16000 + Math.random() * 14000;
  }
  render();

  // 字
  if (el < 2600) setLine('低头。');
  else if (override && now < overrideUntil) setLine(override);
  else { override = null; setLine(lineFor(t)); }
  if (el > 3200 && !hintSeen && now - lastInput > 2500) hintEl.classList.add('on');
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
})();
</script>
