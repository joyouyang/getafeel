<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#151b26">
<title>下一拍</title>
<style>
html,body{margin:0;height:100%;overflow:hidden;background:#151b26;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;overscroll-behavior:none}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block}
#ui{position:fixed;inset:0;pointer-events:none;font-family:"Songti SC","STSong","Noto Serif CJK SC","Source Han Serif SC","Noto Serif SC",serif}
#label{position:absolute;top:calc(env(safe-area-inset-top) + 7.5vh);left:0;right:0;text-align:center;font-size:16px;letter-spacing:.22em;color:rgba(232,226,212,.78);transition:opacity 1.2s ease}
#label span{transition:opacity .5s ease}
.line{position:absolute;left:0;right:0;text-align:center;color:#253049;opacity:0;transition:opacity 2.6s ease;padding:0 24px}
#l1{top:calc(env(safe-area-inset-top) + 11vh);font-size:22px;letter-spacing:.14em}
#l2{top:calc(env(safe-area-inset-top) + 11vh + 40px);font-size:22px;letter-spacing:.14em}
#l3{top:calc(env(safe-area-inset-top) + 11vh + 104px);font-size:15px;letter-spacing:.2em;color:#3a4560}
.hint{position:absolute;bottom:calc(env(safe-area-inset-bottom) + 6vh);left:0;right:0;text-align:center;font-size:13px;letter-spacing:.16em;color:rgba(232,226,212,.6);opacity:0;transition:opacity 1.6s ease;font-family:-apple-system,"PingFang SC","Noto Sans CJK SC",sans-serif;padding:0 20px}
#hint2{color:rgba(246,232,196,.62)}
#snd{position:fixed;top:calc(env(safe-area-inset-top) + 10px);right:12px;font:12px -apple-system,"PingFang SC","Noto Sans CJK SC",sans-serif;color:rgba(232,226,212,.42);padding:8px 10px;letter-spacing:.1em;pointer-events:auto;cursor:pointer;transition:color 1.5s}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="ui">
  <div id="label"><span id="labelText">还没发生的事，先慌一遍</span></div>
  <div class="line" id="l1">城没有尽头，也没关系。</div>
  <div class="line" id="l2">一次只走一小节。</div>
  <div class="line" id="l3">剩下的，交给下一拍。</div>
  <div class="hint" id="hint1">按住，往上推</div>
  <div class="hint" id="hint2">点哪里都行。点早了，它会等到下一拍。</div>
</div>
<div id="snd">声音 开</div>
<script>
(()=>{
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
const $=id=>document.getElementById(id);
let W=0,H=0,DPR=1;

/* ---------- 小工具 ---------- */
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const lerp=(a,b,t)=>a+(b-a)*t;
const smooth=(a,b,t)=>{t=clamp((t-a)/(b-a),0,1);return t*t*(3-2*t)};
const hex=h=>[parseInt(h.slice(1,3),16),parseInt(h.slice(3,5),16),parseInt(h.slice(5,7),16)];
const mixA=(a,b,t)=>[lerp(a[0],b[0],t),lerp(a[1],b[1],t),lerp(a[2],b[2],t)];
const rgb=(c,a=1)=>`rgba(${c[0]|0},${c[1]|0},${c[2]|0},${a})`;
let seed=11;const rnd=()=>{seed=(seed*16807)%2147483647;return (seed-1)/2147483646};

/* ---------- 调色：冷 → 傍晚金色 → 再晚一点 ---------- */
const P={
 cold:{skyTop:'#121823',skyMid:'#1d2533',skyHor:'#2b3343',water:'#19212d',hill:'#222a35',wall:'#30343b',path:'#2a2e35',lawnSun:'#1b2520',lawnSh:'#111814',body:'#2a211d',rod:'#a99064',ink:'#dfe3ea'},
 gold:{skyTop:'#9cb6d2',skyMid:'#d3d9de',skyHor:'#f2d2ae',water:'#3a5677',hill:'#8f9b88',wall:'#ddc193',path:'#cfb68b',lawnSun:'#87a13f',lawnSh:'#21391f',body:'#4a3427',rod:'#c9a86a',ink:'#2a2f3a'},
 dusk:{skyTop:'#7488ad',skyMid:'#c5b6bd',skyHor:'#eea889',water:'#31466a',hill:'#7c8178',wall:'#d2a37a',path:'#bf9670',lawnSun:'#7b8a3a',lawnSh:'#1b2f1b',body:'#4a3427',rod:'#c9a86a',ink:'#2a2f3a'}
};
for(const k in P)for(const j in P[k])P[k][j]=hex(P[k][j]);
let mood=0,dusk=0;
const C=k=>mixA(mixA(P.cold[k],P.gold[k],mood),P.dusk[k],dusk);

/* ---------- 布局 ---------- */
let horY,wallY,pathY,lawnY,hillPts=[],specks=[],sparkles=[],grass=[];
const HN=90;
function hillY(x){
  const u=x/W;
  const h=H*(0.008+0.011*(0.5+0.5*Math.sin(u*5.3+1.2))+0.006*(0.5+0.5*Math.sin(u*14.1+0.4))+0.003*Math.sin(u*31+2)+0.024*smooth(0.5,1.02,u));
  return horY-h;
}
function layout(){
  DPR=Math.min(2,window.devicePixelRatio||1);
  W=innerWidth;H=innerHeight;
  cv.width=Math.round(W*DPR);cv.height=Math.round(H*DPR);
  ctx.setTransform(DPR,0,0,DPR,0,0);
  horY=H*0.575;wallY=H*0.600;pathY=H*0.617;lawnY=H*0.632;
  hillPts=[];
  for(let i=0;i<HN;i++){const x=-0.04*W+1.08*W*i/(HN-1);hillPts.push([x,hillY(x)])}
  seed=23;specks=[];
  const sc=['#efe9de','#e2d4bf','#f4f1ea','#cdb99c','#b8654a','#d8d2c6','#a9b0a4'].map(hex);
  for(let i=0;i<Math.round(W*0.55);i++){
    const x=rnd()*W,top=hillY(x),y=lerp(top+2,horY-1,Math.pow(rnd(),0.7));
    specks.push([x,y,1+rnd()*3.2,1+rnd()*3.5,sc[(rnd()*sc.length)|0],rnd()]);
  }
  grass=[];for(let i=0;i<260;i++)grass.push([rnd(),Math.pow(rnd(),1.3),(rnd()-0.5)*3,rnd()]);
  sparkles=[];
  for(let i=0;i<26;i++)sparkles.push([rnd()*W,lerp(horY+3,wallY-3,rnd()),6+rnd()*18,rnd()*6.28]);
}
addEventListener('resize',layout);layout();

/* ---------- 声音 ---------- */
let ac=null,master=null,wet=null,noiseBuf=null,soundOn=true;
function initAudio(){
  if(ac){if(ac.state==='suspended')ac.resume();return}
  const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;
  ac=new AC();
  master=ac.createGain();master.gain.value=soundOn?0.9:0;
  const comp=ac.createDynamicsCompressor();comp.threshold.value=-14;comp.ratio.value=3;
  master.connect(comp);comp.connect(ac.destination);
  noiseBuf=ac.createBuffer(1,ac.sampleRate*0.5,ac.sampleRate);
  const d=noiseBuf.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;
  // 简单混响
  const len=ac.sampleRate*2.8,ir=ac.createBuffer(2,len,ac.sampleRate);
  for(let c=0;c<2;c++){const b=ir.getChannelData(c);for(let i=0;i<len;i++)b[i]=(Math.random()*2-1)*Math.pow(1-i/len,2.6)}
  const conv=ac.createConvolver();conv.buffer=ir;
  wet=ac.createGain();wet.gain.value=0.32;wet.connect(conv);conv.connect(master);
}
function tickSound(sharp,vol=1){
  if(!ac)return;const t=ac.currentTime+0.005;
  const s=ac.createBufferSource();s.buffer=noiseBuf;
  const f=ac.createBiquadFilter();f.type='bandpass';f.frequency.value=lerp(1500,4200,sharp);f.Q.value=lerp(2.5,7,sharp);
  const g=ac.createGain();const dec=lerp(0.07,0.03,sharp);
  g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(lerp(0.22,0.42,sharp)*vol,t+0.002);g.gain.exponentialRampToValueAtTime(0.0001,t+dec);
  s.connect(f);f.connect(g);g.connect(master);s.start(t,Math.random()*0.3,dec+0.02);
  const o=ac.createOscillator();o.type='sine';o.frequency.value=lerp(820,1300,sharp);
  const g2=ac.createGain();g2.gain.setValueAtTime(0.0001,t);g2.gain.exponentialRampToValueAtTime(lerp(0.12,0.07,sharp)*vol,t+0.002);g2.gain.exponentialRampToValueAtTime(0.0001,t+dec*1.4);
  o.connect(g2);g2.connect(master);o.start(t);o.stop(t+dec*1.5+0.02);
}
function stepSound(when,vol){
  if(!ac)return;
  const s=ac.createBufferSource();s.buffer=noiseBuf;
  const f=ac.createBiquadFilter();f.type='lowpass';f.frequency.value=520;
  const g=ac.createGain();g.gain.setValueAtTime(0.0001,when);g.gain.exponentialRampToValueAtTime(vol,when+0.012);g.gain.exponentialRampToValueAtTime(0.0001,when+0.13);
  s.connect(f);f.connect(g);g.connect(master);s.start(when,Math.random()*0.3,0.16);
}
const mf=m=>440*Math.pow(2,(m-69)/12);
function piano(midi,when,vel,dur){
  if(!ac)return;
  const f0=mf(midi);
  const out=ac.createGain();out.gain.value=1;
  const lp=ac.createBiquadFilter();lp.type='lowpass';lp.frequency.setValueAtTime(lerp(1800,5200,vel),when);lp.frequency.exponentialRampToValueAtTime(700,when+dur);
  out.connect(lp);lp.connect(master);lp.connect(wet);
  const parts=[[1,1],[2,0.42],[3,0.16],[4,0.08],[5,0.03]];
  for(const [h,a] of parts){
    const o=ac.createOscillator();o.type='sine';o.frequency.value=f0*h*(1+0.0006*h*h);
    o.detune.value=(Math.random()-0.5)*4;
    const g=ac.createGain();const pk=0.11*vel*a;const dd=dur/(1+h*0.6);
    g.gain.setValueAtTime(0.0001,when);g.gain.exponentialRampToValueAtTime(pk,when+0.006);
    g.gain.exponentialRampToValueAtTime(pk*0.35,when+0.09);g.gain.exponentialRampToValueAtTime(0.0001,when+dd);
    o.connect(g);g.connect(out);o.start(when);o.stop(when+dd+0.05);
  }
}
// 四小节，慢慢转
const PROG=[
  {bass:41,notes:[57,60,64,67,72],hi:[72,76,79,81,84]},
  {bass:40,notes:[55,59,62,67,71],hi:[71,74,76,79,83]},
  {bass:38,notes:[53,57,60,64,69],hi:[69,72,76,77,81]},
  {bass:36,notes:[52,55,59,62,67],hi:[67,71,74,76,79]}
];
function playChord(bar,when){
  const c=PROG[bar%4];
  piano(c.bass+12,when,0.5,3.6);
  c.notes.forEach((n,i)=>piano(n,when+0.03+i*0.045,0.38-i*0.03,3.4));
}

/* ---------- 状态 ---------- */
const BPM_FAST=212,BPM_SLOW=68;
const bpmOf=w=>BPM_FAST*Math.pow(BPM_SLOW/BPM_FAST,w);
let w=0.03,dragging=false,lastY=0,everDragged=false;
let stage=0;            // 0 心急  1 快稳住了  2 变成傍晚  3 傍晚
let phase=0,lastTick=0,settleTicks=0;
let tt=0;               // 变化进度
let sceneT=0,beatPos=0,lastBeat=-1;
let worries=[],taps=[];
let tStart=performance.now(),idleSince=performance.now();

const WORRY=[
  '下周的班还没排出来','作业是不是交错版本了','万一那件事黄了','他是不是不高兴了',
  '以后到底留不留下来','钱够不够撑到月底','快递到底到哪了','消息还没回，先不看',
  '这样下去会不会来不及','万一选错了呢','明年这个时候我在哪','要不要换个方向',
  '电只剩一点了','是不是又想多了','那个邮件还没回','要是到时候没人等我',
  '万一考砸了','房子到期了怎么办','是不是该早点开始','会不会只有我这样'
];
let wi=(Math.random()*WORRY.length)|0;

const LABELS=[[0.2,'还没发生的事，先慌一遍'],[0.42,'心跑在脚前面'],[0.64,'还是有点赶'],[0.86,'嗯，再慢一点'],[2,'走路的速度']];
let curLabel='';
function setLabel(){
  let s='';for(const [th,t] of LABELS){if(w<th){s=t;break}}
  if(s!==curLabel){curLabel=s;const el=$('labelText');el.style.opacity=0;setTimeout(()=>{el.textContent=s;el.style.opacity=1},220)}
}

/* ---------- 输入 ---------- */
function onDown(e){
  initAudio();
  idleSince=performance.now();
  if(stage<2){dragging=true;lastY=e.clientY;everDragged=true;$('hint1').style.opacity=0}
  else if(stage===3&&sceneT>1.5)addTap(e.clientX,e.clientY);
}
function onMove(e){
  if(!dragging)return;
  const dy=e.clientY-lastY;lastY=e.clientY;
  w=clamp(w-dy/(H*0.5),0,1);idleSince=performance.now();
}
function onUp(){dragging=false}
addEventListener('pointerdown',e=>{if(e.target.id==='snd')return;onDown(e)});
addEventListener('pointermove',onMove);
addEventListener('pointerup',onUp);addEventListener('pointercancel',onUp);
addEventListener('wheel',e=>{initAudio();if(stage<2){w=clamp(w-e.deltaY/1400,0,1);everDragged=true;$('hint1').style.opacity=0;idleSince=performance.now()}},{passive:true});
addEventListener('keydown',e=>{
  initAudio();
  if(stage<2&&(e.key==='ArrowUp'||e.key==='ArrowDown')){w=clamp(w+(e.key==='ArrowUp'?0.06:-0.06),0,1);everDragged=true;$('hint1').style.opacity=0}
  if(stage===3&&(e.key===' '||e.key==='Enter'))addTap(W*(0.15+Math.random()*0.7),H*(0.68+Math.random()*0.25));
});
$('snd').addEventListener('pointerdown',e=>{
  e.stopPropagation();initAudio();soundOn=!soundOn;
  $('snd').textContent=soundOn?'声音 开':'声音 关';
  if(master)master.gain.setTargetAtTime(soundOn?0.9:0,ac.currentTime,0.05);
});
document.addEventListener('visibilitychange',()=>{if(!ac)return;if(document.hidden)ac.suspend();else ac.resume()});

/* ---------- 点早了，它会等 ---------- */
function nextBeatInfo(){
  const spb=60/BPM_SLOW;
  const n=Math.floor(beatPos)+1;
  return {n,dt:(n-beatPos)*spb};
}
function addTap(x,y){
  const {n,dt}=nextBeatInfo();
  const same=taps.filter(t=>t.beat===n).length;
  if(same>=5)return;
  const c=PROG[Math.floor(n/4)%4];
  let pool=c.hi.slice();
  const used=taps.filter(t=>t.beat===n).map(t=>t.midi);
  pool=pool.filter(m=>!used.includes(m));
  const midi=pool[(Math.random()*pool.length)|0]||c.hi[0];
  taps.push({x,y,beat:n,born:performance.now(),fire:performance.now()+dt*1000,midi,fired:false});
  if(ac)piano(midi,ac.currentTime+dt,0.42,2.6);
}

/* ---------- 画 ---------- */
function drawScene(now,hillA,arcPts,arcA,extrasA){
  // 天
  const g=ctx.createLinearGradient(0,0,0,horY);
  g.addColorStop(0,rgb(C('skyTop')));g.addColorStop(0.55,rgb(C('skyMid')));g.addColorStop(1,rgb(C('skyHor')));
  ctx.fillStyle=g;ctx.fillRect(0,0,W,horY+1);
  // 低处的暖光
  const glowA=0.5*mood*(1+dusk*0.6);
  if(glowA>0.01){
    const rg=ctx.createRadialGradient(W*0.08,horY,0,W*0.08,horY,Math.max(W,H)*0.6);
    rg.addColorStop(0,`rgba(255,214,160,${glowA})`);rg.addColorStop(1,'rgba(255,214,160,0)');
    ctx.fillStyle=rg;ctx.fillRect(0,0,W,horY+1);
  }
  // 远处的山丘：由摆的弧线变来
  if(hillA>0.001){
    ctx.beginPath();ctx.moveTo(hillPts[0][0],horY+1);
    for(const p of hillPts)ctx.lineTo(p[0],p[1]);
    ctx.lineTo(hillPts[HN-1][0],horY+1);ctx.closePath();
    ctx.fillStyle=rgb(C('hill'),hillA);ctx.fill();
    for(const s of specks){if(s[1]<hillY(s[0])+1)continue;ctx.fillStyle=rgb(s[4],hillA*0.85*(0.6+0.4*mood));ctx.fillRect(s[0],s[1]-s[3],s[2],s[3])}
    // 一层雾
    const hz=ctx.createLinearGradient(0,horY-H*0.06,0,horY);
    hz.addColorStop(0,'rgba(240,215,190,0)');hz.addColorStop(1,`rgba(240,215,190,${0.28*hillA*mood})`);
    ctx.fillStyle=hz;ctx.fillRect(0,horY-H*0.06,W,H*0.06);
  }
  if(arcPts&&arcA>0.001){
    ctx.beginPath();arcPts.forEach((p,i)=>i?ctx.lineTo(p[0],p[1]):ctx.moveTo(p[0],p[1]));
    ctx.strokeStyle=rgb(mixA(mixA([236,226,205],[250,246,236],mood),C('hill'),hillA),arcA);ctx.lineWidth=stage<2?1.2:1.6;
    ctx.setLineDash(stage<2?[2,5]:[]);ctx.stroke();ctx.setLineDash([]);
  }
  // 水
  ctx.fillStyle=rgb(C('water'));ctx.fillRect(0,horY,W,wallY-horY+1);
  if(mood>0.2){
    for(const s of sparkles){const a=(0.5+0.5*Math.sin(now/700+s[3]))*0.35*mood;ctx.fillStyle=`rgba(255,240,215,${a})`;ctx.fillRect(s[0],s[1],s[2],1)}
  }
  // 矮墙 + 小路
  ctx.fillStyle=rgb(C('wall'));ctx.fillRect(0,wallY,W,pathY-wallY+1);
  ctx.strokeStyle=rgb(mixA(C('wall'),[90,70,50],0.25),0.5);ctx.lineWidth=1;
  ctx.beginPath();ctx.moveTo(0,wallY+(pathY-wallY)*0.5);ctx.lineTo(W,wallY+(pathY-wallY)*0.5);ctx.stroke();
  for(let x=(-now/90000)%1*0;x<W;x+=H*0.05){ctx.beginPath();ctx.moveTo(x,wallY);ctx.lineTo(x,wallY+(pathY-wallY)*0.5);ctx.moveTo(x+H*0.025,wallY+(pathY-wallY)*0.5);ctx.lineTo(x+H*0.025,pathY);ctx.stroke()}
  ctx.fillStyle=rgb(C('path'));ctx.fillRect(0,pathY,W,lawnY-pathY+1);
  // 草地
  const lg=ctx.createLinearGradient(0,lawnY,0,H);
  lg.addColorStop(0,rgb(mixA(C('lawnSun'),[200,190,90],0.12*mood)));lg.addColorStop(1,rgb(C('lawnSun')));
  ctx.fillStyle=lg;ctx.fillRect(0,lawnY,W,H-lawnY);
  // 大片影子，太阳落一点，它就往上爬一点
  const sy=lerp(H*0.705,H*0.668,dusk);
  const edge=x=>{const u=x/W;return sy+H*0.012*Math.sin(u*5.2+1)+H*0.006*Math.sin(u*17)-H*0.018*u};
  // 草
  ctx.lineWidth=1;
  for(const g2 of grass){
    const x=g2[0]*W,y=lerp(lawnY+3,H,g2[1]);
    const inSh=y>edge(x);
    const base=inSh?C('lawnSh'):C('lawnSun');
    ctx.strokeStyle=rgb(mixA(base,g2[3]>0.5?[255,250,200]:[0,0,0],0.12),0.5);
    ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(x+g2[2],y-3-g2[3]*4);ctx.stroke();
  }
  for(let L2=3;L2>=0;L2--){
    ctx.beginPath();ctx.moveTo(0,H);
    for(let i=0;i<=40;i++){const x=W*i/40;ctx.lineTo(x,edge(x)-L2*2.2)}
    ctx.lineTo(W,H);ctx.closePath();
    ctx.fillStyle=rgb(C('lawnSh'),L2?0.16:0.86);ctx.fill();
  }
  for(const g2 of grass){
    const x=g2[0]*W,y=lerp(lawnY+3,H,g2[1]);
    if(y<=edge(x)+2)continue;
    ctx.strokeStyle=rgb(mixA(C('lawnSh'),g2[3]>0.5?[160,190,120]:[0,0,0],0.18),0.45);
    ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(x+g2[2],y-3-g2[3]*4);ctx.stroke();
  }
  // 其他路灯
  if(extrasA>0.001){
    lamp(W*0.17,pathY+H*0.008,H*0.17,1.6,extrasA*0.9,0.7);
    lamp(W*0.9,lawnY+H*0.014,H*0.335,2.6,extrasA,1.05);
    lamp(W*0.33,pathY+H*0.004,H*0.14,1.3,extrasA*0.6,0.6);
  }
}
let lampGlow=0;
function lamp(x,base,h,lw,a,s){
  ctx.strokeStyle=`rgba(32,34,38,${a})`;ctx.lineWidth=lw;
  ctx.beginPath();ctx.moveTo(x,base);ctx.lineTo(x,base-h);ctx.stroke();
  capShape(x,base-h,16*s,10*s,5*s,`rgba(32,34,38,${a})`);
  if(lampGlow>0.01)glow(x,base-h+4*s,26*s,a*lampGlow);
}
function capShape(x,y,tw,bw,h,fill){
  ctx.beginPath();ctx.moveTo(x-tw,y-h*0.4);ctx.lineTo(x+tw,y-h*0.4);ctx.lineTo(x+bw,y+h*0.6);ctx.lineTo(x-bw,y+h*0.6);ctx.closePath();
  ctx.fillStyle=fill;ctx.fill();
}
function glow(x,y,r,a){
  const g=ctx.createRadialGradient(x,y,0,x,y,r);
  g.addColorStop(0,`rgba(255,224,160,${0.9*a})`);g.addColorStop(0.25,`rgba(255,210,140,${0.35*a})`);g.addColorStop(1,'rgba(255,210,140,0)');
  ctx.fillStyle=g;ctx.beginPath();ctx.arc(x,y,r,0,6.283);ctx.fill();
}

/* 节拍器 / 路灯 */
function metro(now,amp,e,bodyA){
  const pivot=[W*0.5,lerp(H*0.765,lawnY+H*0.002,e)];
  const L=lerp(H*0.40,H*0.265,e);
  const th=amp*Math.sin(phase);
  // 身体
  if(bodyA>0.001){
    const by=pivot[1]+H*0.065+(1-bodyA)*H*0.04;
    const bw=Math.min(W*0.25,H*0.15),tw=bw*0.3,ty=pivot[1]-H*0.2+(1-bodyA)*H*0.04;
    const bc=C('body');
    const bg=ctx.createLinearGradient(pivot[0]-bw,0,pivot[0]+bw,0);
    bg.addColorStop(0,rgb(mixA(bc,[0,0,0],0.25),bodyA));bg.addColorStop(0.5,rgb(mixA(bc,[255,220,180],0.08),bodyA));bg.addColorStop(1,rgb(mixA(bc,[0,0,0],0.4),bodyA));
    ctx.beginPath();ctx.moveTo(pivot[0]-bw,by);ctx.lineTo(pivot[0]-tw,ty);ctx.lineTo(pivot[0]+tw,ty);ctx.lineTo(pivot[0]+bw,by);ctx.closePath();
    ctx.fillStyle=bg;ctx.fill();
    // 面板 + 刻度
    const fw=tw*0.62,fbw=bw*0.42,fy0=ty+H*0.012,fy1=pivot[1]-H*0.01;
    ctx.beginPath();ctx.moveTo(pivot[0]-fbw,fy1);ctx.lineTo(pivot[0]-fw,fy0);ctx.lineTo(pivot[0]+fw,fy0);ctx.lineTo(pivot[0]+fbw,fy1);ctx.closePath();
    ctx.fillStyle=rgb(mixA([233,222,198],C('body'),0.35),bodyA*0.9);ctx.fill();
    ctx.strokeStyle=rgb(C('body'),bodyA*0.6);ctx.lineWidth=0.8;
    for(let i=0;i<14;i++){const y=lerp(fy1-4,fy0+4,i/13);const hw=lerp(fbw,fw,i/13)*(i%3===0?0.5:0.28);ctx.beginPath();ctx.moveTo(pivot[0]-hw,y);ctx.lineTo(pivot[0]-hw*0.15,y);ctx.moveTo(pivot[0]+hw*0.15,y);ctx.lineTo(pivot[0]+hw,y);ctx.stroke()}
    // 底座
    ctx.fillStyle=rgb(mixA(bc,[0,0,0],0.45),bodyA);ctx.fillRect(pivot[0]-bw*1.06,by-2,bw*2.12,H*0.012);
  }
  // 摆杆（快的时候带一点残影）
  const rodC=mixA(C('rod'),[32,34,38],e);
  const lw=lerp(3.2,2.4,e);
  const ghosts=stage<2?Math.round(clamp((1-w)*4,0,4)):0;
  for(let k=ghosts;k>=0;k--){
    const ph=phase-k*0.16*(BPM_FAST/120);
    const a=k===0?1:0.12*(1-k/5);
    const t2=amp*Math.sin(ph);
    const tip=[pivot[0]+L*Math.sin(t2),pivot[1]-L*Math.cos(t2)];
    ctx.strokeStyle=rgb(rodC,a);ctx.lineWidth=lw;ctx.lineCap='round';
    ctx.beginPath();ctx.moveTo(pivot[0],pivot[1]);ctx.lineTo(tip[0],tip[1]);ctx.stroke();
    // 小砝码 → 灯罩
    const s=lerp(lerp(0.26,0.93,w),1,e)*L;
    const wx=pivot[0]+s*Math.sin(t2),wy=pivot[1]-s*Math.cos(t2);
    ctx.save();ctx.translate(wx,wy);ctx.rotate(t2);
    const wc=mixA(mixA(C('rod'),[255,236,200],0.15),[32,34,38],e);
    capShape(0,lerp(0,1,e),lerp(11,20,e),lerp(13,11,e),lerp(17,6,e),rgb(wc,a));
    ctx.restore();
  }
  if(lampGlow>0.01&&e>0.99)glow(pivot[0],pivot[1]-L+4,34,lampGlow);
  return {pivot,L};
}
function arcPoints(pivot,L,amp,morph){
  const pts=[];
  for(let i=0;i<HN;i++){
    const t=lerp(-amp,amp,i/(HN-1));
    const a=[pivot[0]+L*Math.sin(t),pivot[1]-L*Math.cos(t)];
    const k=morph*(0.85+0.15*Math.sin(i/HN*3.14));
    pts.push([lerp(a[0],hillPts[i][0],clamp(k,0,1)),lerp(a[1],hillPts[i][1],clamp(k,0,1))]);
  }
  return pts;
}

/* 散步的人 */
const PEOPLE=[
  {x:0.12,dir:1,sp:0.95,top:'#edf1f5',bot:'#2f4a78',dog:true,off:0},
  {x:0.40,dir:-1,sp:0.8,top:'#c4885d',bot:'#e7dac4',dress:true,off:0.5},
  {x:0.47,dir:-1,sp:0.8,top:'#2a2c31',bot:'#e9e4da',off:0.3},
  {x:0.63,dir:1,sp:1.05,top:'#7b3030',bot:'#3a3a3c',off:0.8},
  {x:0.78,dir:-1,sp:0.9,top:'#f3efe6',bot:'#efe9dc',dress:true,off:0.2},
  {x:0.93,dir:1,sp:1.15,top:'#1e2732',bot:'#141414',off:0.6}
].map(p=>({...p,fx:p.x,top:hex(p.top),bot:hex(p.bot)}));
function person(p,a,bp){
  const h=Math.min(H*0.034,W*0.075),x=p.x,y=pathY+H*0.009;
  const sw=Math.sin((bp+p.off)*Math.PI);
  const bob=Math.abs(sw)*h*0.02;
  const hip=y-h*0.46-bob;
  const lit=0.85+0.15*mood;
  ctx.lineCap='round';
  ctx.strokeStyle=rgb(mixA(p.bot,[20,20,24],0.25),a);ctx.lineWidth=h*0.085;
  ctx.beginPath();ctx.moveTo(x,hip);ctx.lineTo(x+sw*h*0.13*p.dir,y);ctx.moveTo(x,hip);ctx.lineTo(x-sw*h*0.13*p.dir,y);ctx.stroke();
  if(p.dress){
    ctx.fillStyle=rgb(mixA(p.bot,[0,0,0],1-lit),a);
    ctx.beginPath();ctx.moveTo(x-h*0.06,y-h*0.78-bob);ctx.lineTo(x+h*0.06,y-h*0.78-bob);ctx.lineTo(x+h*0.13,y-h*0.25-bob);ctx.lineTo(x-h*0.13,y-h*0.25-bob);ctx.closePath();ctx.fill();
  }else{
    ctx.strokeStyle=rgb(mixA(p.bot,[0,0,0],1-lit),a);ctx.lineWidth=h*0.12;
    ctx.beginPath();ctx.moveTo(x,hip);ctx.lineTo(x,hip-h*0.02);ctx.stroke();
  }
  ctx.strokeStyle=rgb(mixA(p.top,[0,0,0],1-lit),a);ctx.lineWidth=h*0.17;
  ctx.beginPath();ctx.moveTo(x,hip-h*0.02);ctx.lineTo(x,y-h*0.8-bob);ctx.stroke();
  // 手臂
  ctx.lineWidth=h*0.06;
  ctx.beginPath();ctx.moveTo(x,y-h*0.76-bob);ctx.lineTo(x-sw*h*0.1*p.dir,y-h*0.5-bob);ctx.stroke();
  ctx.fillStyle=rgb([62,44,36],a);
  ctx.beginPath();ctx.arc(x,y-h*0.9-bob,h*0.085,0,6.283);ctx.fill();
  if(p.dog){
    const dx=x+p.dir*h*0.42,dy=y;
    const dc=rgb([219,170,96],a);
    // 牵绳
    ctx.strokeStyle=`rgba(40,40,40,${a*0.6})`;ctx.lineWidth=0.7;
    ctx.beginPath();ctx.moveTo(x+p.dir*h*0.06,y-h*0.52-bob);ctx.quadraticCurveTo(x+p.dir*h*0.3,y-h*0.2,dx+p.dir*h*0.1,dy-h*0.2);ctx.stroke();
    const ds=Math.sin((bp*2+0.3)*Math.PI);
    ctx.strokeStyle=dc;ctx.lineWidth=h*0.045;
    ctx.beginPath();
    for(const o of [-0.08,0.08]){ctx.moveTo(dx+o*h,dy-h*0.11);ctx.lineTo(dx+o*h+ds*h*0.04*(o>0?1:-1),dy)}
    ctx.stroke();
    ctx.fillStyle=dc;
    ctx.beginPath();ctx.ellipse(dx,dy-h*0.14,h*0.13,h*0.055,0,0,6.283);ctx.fill();
    ctx.beginPath();ctx.arc(dx+p.dir*h*0.13,dy-h*0.2,h*0.055,0,6.283);ctx.fill();
    // 尾巴
    ctx.beginPath();ctx.moveTo(dx-p.dir*h*0.12,dy-h*0.16);ctx.lineTo(dx-p.dir*h*0.2,dy-h*0.24+Math.sin(performance.now()/110)*h*0.03);ctx.stroke();
  }
}

/* 心里冒出来的那些 */
function spawnWorry(now){
  const t=WORRY[wi%WORRY.length];wi++;
  ctx.font='14px -apple-system,"PingFang SC","Noto Sans CJK SC",sans-serif';
  const tw=ctx.measureText(t).width;
  const left=Math.random()<0.5;
  const minX=W*0.05,maxX=W*0.95-tw;
  let x=left?lerp(minX,Math.max(minX,W*0.5-tw-16),Math.random()):lerp(Math.min(maxX,W*0.5+16),maxX,Math.random());
  x=clamp(x,6,W-tw-6);
  let y=lerp(H*0.17,H*0.56,Math.random());
  for(let k=0;k<6;k++){if(worries.some(o=>Math.abs(o.y-y)<20&&Math.abs(o.x-x)<tw))y=lerp(H*0.17,H*0.56,Math.random());}
  worries.push({t,x,y,born:now,life:2200+Math.random()*1400,vy:0,dying:false});
  if(worries.length>16)worries.shift();
}
function drawWorries(now,dt){
  ctx.font='14px -apple-system,"PingFang SC","Noto Sans CJK SC",sans-serif';
  ctx.textBaseline='middle';
  const calm=stage>=2||w>0.62;
  const jit=stage<2?(1-w)*2.2:0;
  worries=worries.filter(o=>{
    const age=now-o.born;
    if(calm&&!o.dying){o.dying=true;o.dieAt=now}
    let a;
    if(o.dying){const k=(now-o.dieAt)/2600;if(k>=1)return false;o.vy+=dt*22;o.y+=o.vy*dt;a=(1-k)*Math.min(1,age/180)*0.8}
    else{if(age>o.life)return false;a=Math.min(1,age/120)*Math.min(1,(o.life-age)/500)*0.82}
    const c=o.dying?mixA(C('ink'),C('lawnSh'),clamp((o.y-H*0.5)/(H*0.2),0,1)):mixA([222,227,236],C('ink'),mood);
    ctx.fillStyle=rgb(c,a);
    ctx.fillText(o.t,o.x+(Math.random()-0.5)*jit,o.y+(Math.random()-0.5)*jit);
    return true;
  });
}

/* ---------- 主循环 ---------- */
let prev=performance.now();
const AMP=0.47;
function frame(now){
  const dt=Math.min(0.05,(now-prev)/1000);prev=now;
  ctx.clearRect(0,0,W,H);

  let amp=AMP,e=0,bodyA=1,hillA=0,arcMorph=0,arcA=0.28,extrasA=0,peopleA=0;

  if(stage<2){
    if(stage===1&&!dragging)w=lerp(w,1,1-Math.pow(0.02,dt));
    const bpm=bpmOf(w);
    phase+=dt*Math.PI*bpm/60;
    const ti=Math.floor((phase+Math.PI/2)/Math.PI);
    if(ti!==lastTick){
      lastTick=ti;
      const sharp=clamp(1-w*1.15,0,1);
      if(soundOn)tickSound(sharp,1);
      if(stage===0&&Math.random()<clamp((0.62-w)/0.62,0,1)*0.95+0.05*(w<0.62))spawnWorry(now);
      if(stage===1){settleTicks++;if(settleTicks>=4){stage=2;tt=0;$('label').style.opacity=0;PEOPLE.forEach(p=>p.x=p.fx*W)}}
    }
    if(stage===0&&w>=0.9&&!dragging){stage=1;settleTicks=0}
    if(stage===1&&(dragging&&w<0.88)){stage=0}
    mood=lerp(mood,smooth(0,1,w)*0.72,1-Math.pow(0.08,dt));
    setLabel();
    if(!everDragged&&now-tStart>1600)$('hint1').style.opacity=1;
    if(everDragged&&stage===0&&w<0.5&&now-idleSince>6000)$('hint1').style.opacity=1;
  }else{
    if(stage===2){
      tt+=dt/6.5;
      if(tt>=1){tt=1;stage=3;sceneT=0;beatPos=0;lastBeat=-1}
    }
    const T=stage===2?tt:1;
    amp=AMP*(1-smooth(0,0.5,T));
    e=smooth(0.22,0.82,T);
    bodyA=1-smooth(0.08,0.5,T);
    arcMorph=smooth(0.18,0.78,T);
    arcA=lerp(0.28,0.8,smooth(0.04,0.22,T))*(1-smooth(0.8,1,T));
    hillA=smooth(0.5,0.95,T);
    extrasA=smooth(0.55,0.98,T);
    peopleA=smooth(0.7,1,T);
    mood=lerp(mood,1,1-Math.pow(0.25,dt));
    // 慢慢停下的摆还要继续走完自己的拍子
    const bpmNow=BPM_SLOW;
    phase+=dt*Math.PI*bpmNow/60;
    const ti=Math.floor((phase+Math.PI/2)/Math.PI);
    if(ti!==lastTick){lastTick=ti;if(stage===2&&amp>0.04&&soundOn)tickSound(0,clamp(amp/AMP,0,1)*0.8)}
    w=1;
  }

  if(stage===3){
    sceneT+=dt;
    const spb=60/BPM_SLOW;
    beatPos+=dt/spb;
    const b=Math.floor(beatPos);
    if(b!==lastBeat){
      lastBeat=b;
      // 提前排好下一拍，跟“点早了”的音落在同一刻
      if(ac){
        const when=ac.currentTime+(b+1-beatPos)*spb;
        const nb=b+1;
        if(nb%4===0&&nb>=4)playChord(nb/4-1,when);
        stepSound(when,nb%2?0.035:0.05);
      }
    }
    dusk=0.75*smooth(0,160,sceneT);
    lampGlow=0.85*smooth(22,45,sceneT);
    if(sceneT>0.6)$('l1').style.opacity=1;
    if(sceneT>3.2)$('l2').style.opacity=1;
    if(sceneT>8.5)$('l3').style.opacity=0.85;
    if(sceneT>12.5&&taps.length===0)$('hint2').style.opacity=1;
    if(taps.length>2)$('hint2').style.opacity=0;
    $('snd').style.color='rgba(40,48,66,.38)';
  }

  // 场景 + 节拍器
  const pivotNow=[W*0.5,lerp(H*0.765,lawnY+H*0.002,e)],Lnow=lerp(H*0.40,H*0.265,e);
  const arc=arcPoints(pivotNow,Lnow,AMP,arcMorph);
  drawScene(now,hillA,arc,arcA,extrasA);

  // 人走在矮墙前
  if(peopleA>0.001){
    const bp=stage===3?beatPos:0;
    for(const p of PEOPLE){
      if(stage===3){
        const stride=Math.min(H*0.034,W*0.075)*0.42;
        p.x+=p.dir*p.sp*stride*(BPM_SLOW/60)*dt;
        if(p.x>W+30)p.x=-30;if(p.x<-30)p.x=W+30;
      }
      person(p,peopleA,bp);
    }
  }
  metro(now,amp,e,bodyA);
  drawWorries(now,dt);

  // 点下去的那些：先轻轻等着，拍子到了才亮
  taps=taps.filter(t=>{
    if(!t.fired){
      if(now>=t.fire)t.fired=true;
      const k=(now-t.born)/180;
      ctx.strokeStyle=`rgba(255,236,200,${0.55*Math.min(1,k)})`;ctx.lineWidth=1;
      ctx.beginPath();ctx.arc(t.x,t.y,3+Math.sin(now/90)*0.6,0,6.283);ctx.stroke();
      return true;
    }
    const k=(now-t.fire)/1900;if(k>=1)return false;
    glow(t.x,t.y,10+40*Math.sqrt(k),(1-k)*0.9);
    ctx.strokeStyle=`rgba(255,226,170,${(1-k)*0.6})`;ctx.lineWidth=1;
    ctx.beginPath();ctx.arc(t.x,t.y,6+46*k,0,6.283);ctx.stroke();
    return true;
  });

  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
})();
</script>
