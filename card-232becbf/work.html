<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>把快乐置顶</title>
<style>
  html,body{margin:0;height:100%;background:#1a2849;overflow:hidden;overscroll-behavior:none;
    touch-action:manipulation;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
  body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Noto Sans SC","Source Han Sans SC","Microsoft YaHei",sans-serif;color:#fff}
  canvas{position:fixed;inset:0;width:100%;height:100%;display:block}
  #sa{position:fixed;top:0;left:0;padding-top:env(safe-area-inset-top,0px);visibility:hidden;pointer-events:none}
  button{font-family:inherit;-webkit-appearance:none;appearance:none;cursor:pointer}

  #intro{position:fixed;left:0;right:0;top:24%;display:flex;flex-direction:column;align-items:center;gap:18px;
    pointer-events:none;transition:opacity .5s ease, transform .5s ease}
  #intro.out{opacity:0;transform:translateY(-16px)}
  #intro .q{margin:0;font-size:17px;letter-spacing:.12em;opacity:.78}
  #go{pointer-events:auto;border:0;border-radius:999px;padding:15px 36px;font-size:22px;font-weight:800;letter-spacing:.06em;
    color:#1a2849;background:#ffc94a;box-shadow:0 6px 0 #d4951c,0 14px 30px rgba(0,0,0,.25);animation:bob 2.4s ease-in-out infinite}
  #go:active{transform:translateY(4px);box-shadow:0 2px 0 #d4951c}
  #intro .snd{margin:0;font-size:15px;opacity:.5}
  @keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}

  #bubble{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 11%);transform:translate(-50%,8px) scale(.85);
    background:#fff;color:#1a2849;padding:10px 17px;border-radius:20px;font-size:15px;font-weight:700;white-space:nowrap;
    opacity:0;pointer-events:none;transition:opacity .25s ease, transform .35s cubic-bezier(.3,1.6,.5,1);
    box-shadow:0 8px 24px rgba(0,0,0,.22)}
  #bubble::after{content:"";position:absolute;left:50%;bottom:-7px;margin-left:-7px;border:7px solid transparent;border-bottom:0;border-top-color:#fff}
  #bubble.on{opacity:1;transform:translate(-50%,0) scale(1)}

  #hint{position:fixed;left:0;right:0;bottom:calc(env(safe-area-inset-bottom,0px) + 6.5%);text-align:center;font-size:15px;
    letter-spacing:.08em;opacity:0;pointer-events:none;transition:opacity .4s ease}
  #hint.on{opacity:.72;animation:pulse 1.8s ease-in-out infinite}
  @keyframes pulse{0%,100%{opacity:.72}50%{opacity:.4}}

  #src{position:fixed;left:0;right:0;text-align:center;font-size:12px;letter-spacing:.1em;color:#cfd8f2;opacity:0;
    pointer-events:none;transition:opacity 1.2s ease}
  #src.on{opacity:.62}

  #again{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 5%);transform:translateX(-50%);
    border:1.5px solid rgba(255,255,255,.45);background:rgba(10,14,32,.35);color:#fff;border-radius:999px;padding:10px 24px;
    font-size:15px;letter-spacing:.1em;opacity:0;pointer-events:none;transition:opacity .8s ease}
  #again.on{opacity:1;pointer-events:auto}

  #mute{position:fixed;right:calc(env(safe-area-inset-right,0px) + 26px);top:calc(env(safe-area-inset-top,0px) + 12px);
    width:38px;height:38px;border-radius:50%;border:0;background:rgba(255,255,255,.1);color:#fff;display:none;
    align-items:center;justify-content:center;padding:0}
  #mute.on{display:flex}
  #mute svg{width:20px;height:20px}
</style>
</head>
<body>
<div id="sa"></div>
<canvas id="c"></canvas>

<div id="intro">
  <p class="q">不知道吃什么的时候</p>
  <button id="go">就吃汉堡！</button>
  <p class="snd">🔊</p>
</div>
<div id="bubble"></div>
<div id="hint"></div>
<div id="src">黄子弘凡演唱会 · 鸟巢 · 散场时的大屏</div>
<button id="again">再做一个</button>
<button id="mute" aria-label="声音">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M4 9v6h4l5 4V5L8 9H4z" fill="currentColor" stroke="none"/>
    <path id="w1" d="M16.5 8.5a5 5 0 0 1 0 7"/><path id="w2" d="M19 6a8.5 8.5 0 0 1 0 12"/>
    <path id="mx" d="M16 9l6 6M22 9l-6 6" style="display:none"/>
  </svg>
</button>

<script>
(() => {
'use strict';
const $ = id => document.getElementById(id);
const cv = $('c'), g = cv.getContext('2d');
const FONT = '-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Noto Sans SC","Source Han Sans SC","Microsoft YaHei",sans-serif';
const rnd = (a, b) => a + Math.random() * (b - a);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const ease = t => 1 - Math.pow(1 - clamp(t, 0, 1), 3);
const lerp = (a, b, t) => a + (b - a) * t;

let W, H, DPR, colW, cx, S, SAT = 0;

/* ====================== burger parts ====================== */
const DEF = {
  bunB:   { h: 30, w: 1.00 },
  patty:  { h: 28, w: 1.03 },
  cheese: { h: 8,  w: 1.02 },
  lettuce:{ h: 12, w: 1.10 },
  honey:  { h: 7,  w: 0.92 },
  bunT:   { h: 64, w: 1.00 },
};
const ORDER = ['bunB', 'patty', 'cheese', 'lettuce', 'honey', 'bunT'];
const SAY = { patty: '马上要回到珠海吃烧烤了', honey: '小熊维尼同款蜂蜜！' };

const SEEDS = (() => {
  let s = 11; const r = () => (s = (s * 16807) % 2147483647) / 2147483647;
  const a = []; let n = 0;
  while (a.length < 15 && n++ < 800) {
    const u = (r() - .5) * .78, v = .28 + r() * .62;
    if (v > .9 * (1 - 3.3 * u * u)) continue;
    if (a.some(p => Math.hypot((p[0] - u) * 228, (p[1] - v) * 64) < 24)) continue;
    a.push([u, v, (r() - .5) * 1.3]);
  }
  return a;
})();
const DRIPS = [[.08, 16, 5], [.24, 9, 4], [.43, 25, 6], [.61, 13, 4.5], [.78, 21, 5.5], [.92, 8, 3.5]];

function rr(x, y, w, h, r) {
  const [a, b, c, d] = Array.isArray(r) ? r : [r, r, r, r];
  g.beginPath();
  g.moveTo(x + a, y); g.lineTo(x + w - b, y); g.quadraticCurveTo(x + w, y, x + w, y + b);
  g.lineTo(x + w, y + h - c); g.quadraticCurveTo(x + w, y + h, x + w - c, y + h);
  g.lineTo(x + d, y + h); g.quadraticCurveTo(x, y + h, x, y + h - d);
  g.lineTo(x, y + a); g.quadraticCurveTo(x, y, x + a, y); g.closePath();
}
function vgrad(y0, y1, c0, c1) { const gr = g.createLinearGradient(0, y0, 0, y1); gr.addColorStop(0, c0); gr.addColorStop(1, c1); return gr; }
function smoothPath(pts, start) {
  if (start) g.moveTo(pts[0][0], pts[0][1]); else g.lineTo(pts[0][0], pts[0][1]);
  for (let i = 1; i < pts.length - 1; i++) {
    const mx = (pts[i][0] + pts[i + 1][0]) / 2, my = (pts[i][1] + pts[i + 1][1]) / 2;
    g.quadraticCurveTo(pts[i][0], pts[i][1], mx, my);
  }
  const l = pts[pts.length - 1]; g.lineTo(l[0], l[1]);
}

function drawPart(k, x, yb, h, w, age) {
  const l = x - w / 2, r = x + w / 2;
  if (k === 'bunB') {
    g.fillStyle = vgrad(yb - h, yb, '#eaa65a', '#bf712c');
    rr(l, yb - h, w, h, [7 * S, 7 * S, h * .55, h * .55]); g.fill();
    g.fillStyle = '#f7dcaa';
    rr(l + 3 * S, yb - h, w - 6 * S, h * .34, [6 * S, 6 * S, 3 * S, 3 * S]); g.fill();
    g.fillStyle = 'rgba(255,255,255,.16)';
    g.beginPath(); g.ellipse(x - w * .22, yb - h * .45, w * .2, h * .1, 0, 0, 7); g.fill();
  } else if (k === 'patty') {
    g.save();
    g.fillStyle = vgrad(yb - h, yb, '#7a442b', '#41200f');
    rr(l, yb - h, w, h, h * .45); g.fill(); g.clip();
    g.strokeStyle = 'rgba(22,8,2,.55)'; g.lineWidth = 4.5 * S; g.lineCap = 'round';
    const gap = 24 * S;
    for (let px = l + 10 * S; px < r + h; px += gap) {
      g.beginPath(); g.moveTo(px, yb - h - 2); g.lineTo(px - h * .75, yb + 2); g.stroke();
    }
    g.fillStyle = 'rgba(255,190,140,.22)';
    rr(l + w * .08, yb - h + 3 * S, w * .84, 3 * S, 2 * S); g.fill();
    g.restore();
  } else if (k === 'cheese') {
    const melt = ease(age / 1.1);
    g.fillStyle = '#ffc93a';
    rr(l, yb - h, w, h, 3 * S); g.fill();
    [[.15, 15, 13], [.52, 19, 17], [.86, 13, 10]].forEach(([p, dw, dl]) => {
      const px = l + w * p; dw *= S; dl = dl * S * melt;
      g.beginPath(); g.moveTo(px - dw, yb - 1);
      g.quadraticCurveTo(px - dw * .25, yb + dl * .15, px - dw * .2, yb + dl);
      g.quadraticCurveTo(px, yb + dl + 4 * S * melt, px + dw * .2, yb + dl);
      g.quadraticCurveTo(px + dw * .25, yb + dl * .15, px + dw, yb - 1);
      g.closePath(); g.fill();
    });
    g.fillStyle = 'rgba(255,255,255,.35)'; g.fillRect(l + 5 * S, yb - h + 1.5 * S, w - 10 * S, 1.5 * S);
  } else if (k === 'lettuce') {
    const n = 16, top = [], bot = [];
    for (let i = 0; i <= n; i++) {
      const px = l + w * i / n;
      top.push([px, yb - h + (i % 2 ? 2.5 : -1.5) * S]);
      bot.push([px, yb + (i % 2 ? 5 : -.5) * S]);
    }
    g.fillStyle = '#8dd14e';
    g.beginPath(); smoothPath(top, true); smoothPath(bot.slice().reverse(), false); g.closePath(); g.fill();
    g.strokeStyle = '#65ad34'; g.lineWidth = 1.6 * S;
    g.beginPath(); smoothPath(top.map(p => [p[0], p[1] + h * .55]).slice(1, -1), true); g.stroke();
  } else if (k === 'honey') {
    const p = ease(age / 1.7);
    g.fillStyle = 'rgba(255,170,25,.95)';
    rr(l, yb - h, w, h, h / 2); g.fill();
    DRIPS.forEach(([f, ml, dw]) => {
      const px = l + w * f, len = ml * S * p; dw *= S;
      if (len < 1) return;
      rr(px - dw / 2, yb - 3, dw, len + 3, dw / 2); g.fill();
      g.beginPath(); g.arc(px, yb + len, dw * .72, 0, 7); g.fill();
    });
    g.fillStyle = 'rgba(255,255,255,.55)';
    rr(l + w * .1, yb - h + 1.5 * S, w * .5, 1.6 * S, 1 * S); g.fill();
    DRIPS.forEach(([f, ml, dw]) => {
      const len = ml * S * p; if (len < 6) return;
      g.beginPath(); g.arc(l + w * f - dw * S * .22, yb + len - dw * S * .2, dw * S * .2, 0, 7); g.fill();
    });
  } else if (k === 'bunT') {
    const c = 6 * S;
    g.fillStyle = vgrad(yb - h, yb, '#f2b766', '#c3742f');
    g.beginPath(); g.moveTo(l, yb - c);
    g.bezierCurveTo(l + w * .02, yb - h * 1.3, r - w * .02, yb - h * 1.3, r, yb - c);
    g.quadraticCurveTo(r, yb, r - 9 * S, yb); g.lineTo(l + 9 * S, yb); g.quadraticCurveTo(l, yb, l, yb - c);
    g.closePath(); g.fill();
    g.fillStyle = 'rgba(255,255,255,.2)';
    g.beginPath(); g.ellipse(x - w * .17, yb - h * .7, w * .2, h * .13, -.25, 0, 7); g.fill();
    g.fillStyle = '#fff4d8';
    SEEDS.forEach(([u, v, rot]) => {
      g.beginPath(); g.ellipse(x + u * w, yb - v * h, 3.4 * S, 1.6 * S, rot, 0, 7); g.fill();
    });
  }
}

/* ====================== state ====================== */
let mode = 'intro';         // intro | stack | pin | finale
let stack = [];             // {k, x0, x, t}
let cur = null;             // falling / swinging piece
let swingPh = 0;
let lastLand = -9, lastLandIdx = -1;
let pin = null;
let fin = null;
let parts = [];
let ripples = [];
let now = 0, prev = 0;
let hintTimer = 0, bubbleTimer = 0;

const BW = () => 228 * S;
const swingY = () => H * .3;
function baseY() {
  const a = H * .74, b = H * .8;
  return fin ? lerp(a, b, ease((now - fin.t0) / 1.4)) : a;
}
function layout() {
  let y = baseY();
  const since = now - lastLand;
  const sq = lastLand > 0 ? .12 * Math.exp(-since * 7) * Math.cos(since * 24) : 0;
  const n = stack.length;
  for (let i = 0; i < n; i++) {
    const L = stack[i];
    const f = 1 - sq * (i === n - 1 ? 1.2 : .7) * (i + 1) / n;
    L.yb = y; L.h = DEF[L.k].h * S * f; L.w = DEF[L.k].w * BW() * (1 + sq * .25 * (i + 1) / n);
    L.dx = lerp(L.x0, L.x, ease((now - L.t) / .28));
    y -= L.h;
  }
  return y;
}

/* ====================== audio ====================== */
let A = null, bus, revIn, master, NB, APPL, muted = false;
const M = m => 440 * Math.pow(2, (m - 69) / 12);
function initAudio() {
  if (A) { if (A.state === 'suspended') A.resume(); return; }
  const AC = window.AudioContext || window.webkitAudioContext;
  if (!AC) return;
  try { A = new AC(); } catch (e) { A = null; return; }
  master = A.createGain(); master.gain.value = muted ? 0 : .9;
  const comp = A.createDynamicsCompressor();
  comp.threshold.value = -16; comp.knee.value = 12; comp.ratio.value = 4; comp.attack.value = .004; comp.release.value = .25;
  bus = A.createGain(); bus.gain.value = .85;
  bus.connect(comp); comp.connect(master); master.connect(A.destination);
  // noise
  NB = A.createBuffer(1, A.sampleRate * 2, A.sampleRate);
  const nd = NB.getChannelData(0); for (let i = 0; i < nd.length; i++) nd[i] = Math.random() * 2 - 1;
  // reverb
  const rv = A.createConvolver(), len = Math.floor(A.sampleRate * 2.2), ib = A.createBuffer(2, len, A.sampleRate);
  for (let c = 0; c < 2; c++) { const d = ib.getChannelData(c); for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 3); }
  rv.buffer = ib; revIn = A.createGain(); revIn.gain.value = .55; revIn.connect(rv); rv.connect(comp);
  APPL = makeApplause(4);
  const sb = A.createBufferSource(); sb.buffer = A.createBuffer(1, 1, A.sampleRate); sb.connect(A.destination); sb.start(0);
  if (A.state === 'suspended') A.resume();
}
function makeApplause(sec) {
  const sr = A.sampleRate, n = Math.floor(sec * sr), b = A.createBuffer(2, n, sr);
  for (let ch = 0; ch < 2; ch++) {
    const d = b.getChannelData(ch), claps = sec * 85;
    for (let k = 0; k < claps; k++) {
      const t0 = Math.floor(Math.random() * n), L = Math.floor(sr * (.006 + Math.random() * .016));
      const amp = .25 + Math.random() * .75, a = .25 + Math.random() * .6; let lp = 0;
      for (let i = 0; i < L; i++) {
        const w = Math.random() * 2 - 1; lp += a * (w - lp);
        d[(t0 + i) % n] += (w - lp * .6) * Math.exp(-i / (L * .3)) * amp * .3;
      }
    }
  }
  return b;
}
function send(node, wet) { node.connect(bus); if (wet) { const s = A.createGain(); s.gain.value = wet; node.connect(s); s.connect(revIn); } }
function env(gn, t, a, pk, d) { gn.gain.setValueAtTime(.0001, t); gn.gain.linearRampToValueAtTime(pk, t + a); gn.gain.exponentialRampToValueAtTime(.0001, t + a + d); }
function osc(type, f, t, dur) { const o = A.createOscillator(); o.type = type; o.frequency.setValueAtTime(f, t); o.start(t); o.stop(t + dur + .05); return o; }
function noise(t, dur, type, f, q, v, wet) {
  const s = A.createBufferSource(); s.buffer = NB;
  const fl = A.createBiquadFilter(); fl.type = type; fl.frequency.value = f; fl.Q.value = q;
  const gn = A.createGain(); env(gn, t, .002, v, dur);
  s.connect(fl).connect(gn); send(gn, wet); s.start(t, Math.random() * 1.5); s.stop(t + dur + .05);
}
function kick(t, v) {
  const o = osc('sine', 160, t, .4); o.frequency.exponentialRampToValueAtTime(46, t + .13);
  const gn = A.createGain(); env(gn, t, .003, v, .32); o.connect(gn); send(gn);
  noise(t, .015, 'highpass', 2500, .6, v * .2);
}
const hat = (t, v) => noise(t, .045, 'highpass', 7500, .7, v);
function clap(t, v = .15) { for (let i = 0; i < 3; i++) noise(t + i * .011, .02, 'bandpass', 1400, .9, v); noise(t + .033, .16, 'bandpass', 1300, .9, v * .9, .25); }
function bass(t, f, dur, v) {
  const o = osc('sawtooth', f, t, dur), fl = A.createBiquadFilter();
  fl.type = 'lowpass'; fl.frequency.setValueAtTime(1000, t); fl.frequency.exponentialRampToValueAtTime(260, t + dur); fl.Q.value = 3;
  const gn = A.createGain(); env(gn, t, .008, v, dur); o.connect(fl).connect(gn); send(gn);
  const o2 = osc('sine', f, t, dur), g2 = A.createGain(); env(g2, t, .008, v * .8, dur); o2.connect(g2); send(g2);
}
function pluck(t, fs, v) {
  fs.forEach(f => {
    const o = osc('triangle', f, t, .3), o2 = osc('square', f * 1.004, t, .3), fl = A.createBiquadFilter();
    fl.type = 'lowpass'; fl.frequency.setValueAtTime(3200, t); fl.frequency.exponentialRampToValueAtTime(500, t + .2);
    const g2 = A.createGain(); g2.gain.value = .25; o2.connect(g2).connect(fl); o.connect(fl);
    const gn = A.createGain(); env(gn, t, .004, v, .22); fl.connect(gn); send(gn, .2);
  });
}
function bell(t, f, v = .12, dur = 1.2) {
  const c = osc('sine', f, t, dur), m = osc('sine', f * 3.5, t, dur), mg = A.createGain();
  mg.gain.setValueAtTime(f * 1.1, t); mg.gain.exponentialRampToValueAtTime(1, t + dur * .6);
  m.connect(mg).connect(c.frequency);
  const gn = A.createGain(); env(gn, t, .003, v, dur); c.connect(gn); send(gn, .4);
  const h = osc('sine', f * 2, t, dur * .5), hg = A.createGain(); env(hg, t, .002, v * .22, dur * .4); h.connect(hg); send(hg, .3);
}
function pad(t, fs, dur, v = .03) {
  fs.forEach(f => [-8, 8].forEach(dt => {
    const o = osc('sawtooth', f, t, dur + .8); o.detune.value = dt;
    const fl = A.createBiquadFilter(); fl.type = 'lowpass'; fl.frequency.value = 1500;
    const gn = A.createGain(); gn.gain.setValueAtTime(.0001, t); gn.gain.linearRampToValueAtTime(v, t + .25);
    gn.gain.setValueAtTime(v, t + dur); gn.gain.exponentialRampToValueAtTime(.0001, t + dur + .7);
    o.connect(fl).connect(gn); send(gn, .35);
  }));
}
function crash(t, v = .2) { noise(t, 1.8, 'highpass', 5000, .5, v, .4); noise(t, .6, 'bandpass', 3000, .8, v * .5, .3); }
function thump(t, v = .4) {
  const o = osc('sine', 115, t, .25); o.frequency.exponentialRampToValueAtTime(55, t + .12);
  const gn = A.createGain(); env(gn, t, .002, v, .2); o.connect(gn); send(gn);
  noise(t, .05, 'lowpass', 900, .7, v * .35);
}
function sizzle(t) {
  noise(t, 1.5, 'highpass', 5500, .5, .05);
  for (let i = 0; i < 36; i++) noise(t + Math.random() * 1.4, .01 + Math.random() * .02, 'highpass', 3000 + Math.random() * 4000, 1, .06 + Math.random() * .12);
}
function bloop(t) { const o = osc('sine', 280, t, .3); o.frequency.exponentialRampToValueAtTime(720, t + .16); const gn = A.createGain(); env(gn, t, .01, .13, .22); o.connect(gn); send(gn, .25); }
function crunch(t) { for (let i = 0; i < 5; i++) noise(t + i * .018 + Math.random() * .01, .03, 'bandpass', 2500 + Math.random() * 2500, 1.5, .16); }
function plop(t) { const o = osc('sine', 520, t, .2); o.frequency.exponentialRampToValueAtTime(260, t + .1); const gn = A.createGain(); env(gn, t, .004, .12, .14); o.connect(gn); send(gn); }
function boing(t) {
  const o = osc('sine', 180, t, .5); o.frequency.exponentialRampToValueAtTime(360, t + .08); o.frequency.exponentialRampToValueAtTime(270, t + .4);
  const lfo = osc('sine', 13, t, .5), lg = A.createGain(); lg.gain.value = 10; lfo.connect(lg).connect(o.frequency);

}

    [-1, 1].forEach(sd => {
      const ox = cx + sd * colW * .55, sw = Math.sin(now * .7 + sd) * colW * .2;
      const gr = g.createLinearGradient(ox, -20, cx + sw, by);
      gr.addColorStop(0, `rgba(160,190,255,${.16 * N})`); gr.addColorStop(1, 'rgba(160,190,255,0)');
      g.fillStyle = gr; g.beginPath(); g.moveTo(ox - 6, -20); g.lineTo(ox + 6, -20);
      g.lineTo(cx + sw + 70 * S, by + 60 * S); g.lineTo(cx + sw - 70 * S, by + 60 * S); g.closePath(); g.fill();
    });
    // crowd lights
    const bx = cx, byc = baseY() - 70 * S;
    for (const L of LIGHTS) {
      const on = clamp((ft - .25 - L.d / 520) / .5, 0, 1); if (on <= 0) continue;
      let b = (.42 + .3 * Math.sin(now * 2.1 + L.ph)) * on + beat * .25;
      for (const r of ripples) { const rd = (now - r.t) * 420, dd = Math.hypot(L.x - r.x, L.y - r.y); if (Math.abs(dd - rd) < 34) b += .7 * (1 - (now - r.t) / 1.6); }
      const sx = L.x + Math.sin(now * 1.5 + L.row * .55) * 3.5 * S;
      const s = L.sz * (1 + beat * .25);
      g.globalAlpha = clamp(b, 0, 1) * N;
      g.drawImage(SPR[L.spr], sx - s, L.y - s, s * 2, s * 2);
    }
    g.restore(); g.globalAlpha = 1;
    ripples = ripples.filter(r => now - r.t < 1.6);
    // nest lattice
    g.globalAlpha = N; g.drawImage(LAT, 0, 0, W, H); g.globalAlpha = 1;
    // screen
    const la = ease((ft - 1.0) / .7);
    if (la > 0) {
      const lx = cx - LED.fw / 2, ly = SAT + Math.max(30, H * .065);
      g.save(); g.globalAlpha = la; g.translate(cx, ly + LED.fh / 2); g.scale(.94 + .06 * la, .94 + .06 * la); g.translate(-cx, -(ly + LED.fh / 2));
      g.drawImage(LED.off, lx, ly, LED.fw, LED.fh);
      const sweep = ease((ft - 1.5) / 1.8) * LED.fw;
      if (sweep > 0) {
        g.save(); g.beginPath(); g.rect(lx, ly, sweep, LED.fh); g.clip();
        g.globalAlpha = la * (.9 + .1 * Math.sin(now * 23)) ; g.drawImage(LED.on, lx, ly, LED.fw, LED.fh);
        g.globalCompositeOperation = 'lighter'; g.globalAlpha = .25 + beat * .25; g.drawImage(LED.on, lx, ly, LED.fw, LED.fh);
        g.restore();
      }
      g.restore();
      src.style.top = (ly + LED.fh + 12) + 'px';
    }
  }

  // ---- plate shadow
  const B = baseY();
  g.fillStyle = 'rgba(0,0,0,.28)';
  g.beginPath(); g.ellipse(cx, B + 3 * S, BW() * .62, 9 * S, 0, 0, 7); g.fill();
  g.fillStyle = 'rgba(255,255,255,.07)';
  g.beginPath(); g.ellipse(cx, B + 2 * S, BW() * .66, 11 * S, 0, 0, 7); g.fill();

  // ---- stack
  const top = layout();
  for (const L of stack) drawPart(L.k, L.dx, L.yb, L.h, L.w, now - L.t);

  // ---- progress dots (6)
  if (mode === 'stack' || mode === 'pin') {
    const n = ORDER.length, gap = 18 * S, y0 = SAT + 26;
    for (let i = 0; i < n; i++) {
      const x = cx + (i - (n - 1) / 2) * gap, f = i < stack.length;
      const pop = f ? 1 + .5 * Math.exp(-(now - stack[i].t) * 8) : 1;
      g.fillStyle = f ? '#ffc94a' : 'rgba(255,255,255,.18)';
      g.beginPath(); g.arc(x, y0, 4 * S * pop, 0, 7); g.fill();
    }
  }

  // ---- current piece
  if (cur) {
    const d = DEF[cur.k], h = d.h * S, w = d.w * BW();
    const A0 = Math.min(colW * .2, 80 * S);
    if (cur.phase === 'wait' && now >= cur.t0) { cur.phase = 'enter'; cur.t0 = now; }
    if (cur.phase !== 'wait') {
      if (cur.phase === 'enter' || cur.phase === 'swing') {
        swingPh += dt * 2.1;
        cur.x = cx + Math.sin(swingPh) * A0;
        const e = ease((now - cur.t0) / .45);
        cur.y = lerp(-h - 30, swingY(), e);
        if (e >= 1) cur.phase = 'swing';
      } else if (cur.phase === 'fall') {
        cur.vy += 2600 * S * dt; cur.y += cur.vy * dt;
        if (cur.y >= top) { cur.y = top; }
      }
      // guide shadow
      if (cur.phase !== 'fall') {
        g.fillStyle = 'rgba(255,255,255,.06)';
        g.beginPath(); g.ellipse(cur.x, top, w * .42, 4 * S, 0, 0, 7); g.fill();
      }
      drawPart(cur.k, cur.x, cur.y, h, w, 0);
      if (cur.phase === 'fall' && cur.y >= top) land();
    }
  }

  // ---- skewer
  if (pin && stack.length === 6) {
    const T = stack[5], peak = T.yb - T.h * .96;
    let tip;
    if (pin.state === 'enter') {
      const e = ease((now - pin.t0) / .6);
      tip = lerp(-40 * S, peak - 64 * S, e);
      if (now >= pin.t0 && e >= 1) pin.state = 'hover';
      if (now < pin.t0) tip = -9999;
    } else if (pin.state === 'hover') {
      tip = peak - 64 * S + Math.sin((now - pin.t0) * 3) * 6 * S;
      // chevrons
      for (let i = 0; i < 3; i++) {
        const a = (Math.sin(now * 4 - i * .9) + 1) / 2;
        g.strokeStyle = `rgba(255,201,74,${.25 + a * .6})`; g.lineWidth = 2.5 * S; g.lineCap = 'round'; g.lineJoin = 'round';
        const yy = tip + 12 * S + i * 11 * S;
        g.beginPath(); g.moveTo(T.dx - 7 * S, yy); g.lineTo(T.dx, yy + 6 * S); g.lineTo(T.dx + 7 * S, yy); g.stroke();
      }
    } else if (pin.state === 'drive') {
      const e = clamp((now - pin.t1) / .18, 0, 1);
      tip = lerp(peak - 64 * S, peak + 26 * S, e * e);
      if (e >= 1) pinned();
    } else tip = peak + 26 * S;
    if (tip > -9000) drawSkewer(T.dx, tip, peak + 1, now, pin.state === 'in' ? 6 : 3.5);
  }

  stepParts(dt); drawParts();

  if (bubbleTimer && now > bubbleTimer) { bubble.classList.remove('on'); bubbleTimer = 0; }
  requestAnimationFrame(frame);
}

function resize() {
  DPR = Math.min(2, window.devicePixelRatio || 1); W = innerWidth; H = innerHeight;
  cv.width = Math.round(W * DPR); cv.height = Math.round(H * DPR);
  colW = Math.min(W, 480); cx = W / 2;
  S = clamp(Math.min(colW / 390, H / 780), .72, 1.25);
  SAT = parseFloat(getComputedStyle($('sa')).paddingTop) || 0;
  buildLattice(); buildLights(); buildLED();
}
window.addEventListener('resize', resize);
resize();
requestAnimationFrame(frame);

// for checking without a finger: ?auto
window.__burger = { tap: () => onTap(cx, H * .5), state: () => ({ mode, n: stack.length, cur: cur && cur.phase, pin: pin && pin.state, audio: A && A.state, seq: seq.on, F: { ...F } }) };
})();
</script>
</body>
</html>
