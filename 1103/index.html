<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#cdb999">
<title>11.03</title>
<style>
:root{--kraft:#cdb999;--kraft2:#c3ad8b;--label:#f4efe6;--ink:#3b3530;--line:rgba(59,53,48,.55)}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
body{background:var(--kraft);transition:opacity .9s}
/* 牛皮纸的纤维 */
body::before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.55;
  background:
    repeating-linear-gradient(83deg,rgba(255,255,255,.05) 0 1px,transparent 1px 7px),
    repeating-linear-gradient(-7deg,rgba(80,60,30,.05) 0 1px,transparent 1px 11px),
    radial-gradient(120% 80% at 30% 20%,rgba(255,250,240,.18),transparent 60%),
    radial-gradient(90% 70% at 80% 90%,rgba(90,70,40,.14),transparent 70%)}
body.out{opacity:0}
/* 面单 */
.label{position:fixed;left:50%;top:46%;width:min(80vw,330px);padding:34px 22px 30px;transform:translate(-50%,-50%) rotate(-1.2deg);
  background:var(--label);border-radius:3px;box-shadow:0 1px 0 rgba(0,0,0,.04),0 10px 30px rgba(60,40,20,.18)}
.label::before{content:"";position:absolute;left:0;right:0;top:12px;border-top:1px dashed rgba(59,53,48,.18)}
.boxes{display:flex;justify-content:center;gap:6px}
.boxes span{width:30px;height:38px;border:1px solid var(--line);display:flex;align-items:center;justify-content:center;
  font:400 22px/1 "Bradley Hand","Snell Roundhand","Noteworthy",cursive;color:var(--ink);background:rgba(255,255,255,.35)}
.boxes span:nth-child(4){margin-right:8px}
.boxes span.cur{animation:hint 2.2s ease-in-out infinite}
@keyframes hint{0%,100%{border-color:var(--line)}50%{border-color:rgba(59,53,48,.95);box-shadow:inset 0 -2px 0 rgba(59,53,48,.35)}}
.label.no{animation:no .42s}
@keyframes no{20%,60%{transform:translate(calc(-50% - 7px),-50%) rotate(-1.2deg)}40%,80%{transform:translate(calc(-50% + 7px),-50%) rotate(-1.2deg)}}
.label.wait .boxes span{opacity:.45}
/* 真正接收输入的框，盖在格子上、看不见 */
#pw{position:absolute;inset:0;width:100%;height:100%;opacity:.01;border:0;background:transparent;color:transparent;caret-color:transparent;font-size:16px;outline:none}
</style>
</head>
<body>
<div class="label" id="label">
  <div class="boxes" id="boxes"><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span></div>
  <input id="pw" type="tel" inputmode="numeric" pattern="[0-9]*" maxlength="8" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" aria-label="8 位数字">
</div>
<script>
(function () {   // 不留全局变量：解锁后主页写进同一个窗口，重名会冲突
  'use strict';
  var KEY = 'gaf-home-pw:' + location.pathname, busy = false;
  var label = document.getElementById('label'), input = document.getElementById('pw');
  var cells = document.getElementById('boxes').children;
  function paint() {
    var v = input.value;
    for (var i = 0; i < cells.length; i++) { cells[i].textContent = v[i] || ''; cells[i].className = i === v.length ? 'cur' : ''; }
  }
  function unlock(pw) {
    return fetch('bundle.bin', { cache: 'no-cache' }).then(function (r) { return r.arrayBuffer(); }).then(function (ab) {
      var buf = new Uint8Array(ab), salt = buf.slice(0, 16), iv = buf.slice(16, 28), ct = buf.slice(28);
      return crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveKey']).then(function (base) {
        return crypto.subtle.deriveKey({ name: 'PBKDF2', salt: salt, iterations: 200000, hash: 'SHA-256' }, base, { name: 'AES-GCM', length: 256 }, false, ['decrypt']);
      }).then(function (key) { return crypto.subtle.decrypt({ name: 'AES-GCM', iv: iv }, key, ct); });
    }).then(function (pt) { return new TextDecoder().decode(pt); });
  }
  function show(html, fade) {
    function go() { document.open(); document.write(html); document.close(); }
    if (fade) { document.body.classList.add('out'); setTimeout(go, 900); } else go();
  }
  function tryPw() {
    var pw = input.value.replace(/\D/g, ''); if (pw.length < 8 || busy) return;
    busy = true; label.classList.add('wait'); input.blur();
    unlock(pw).then(function (html) {
      try { localStorage.setItem(KEY, pw); } catch (_) {}
      show(html, true);
    }, function () {
      busy = false; label.classList.remove('wait'); input.value = ''; paint();
      label.classList.remove('no'); void label.offsetWidth; label.classList.add('no');
      setTimeout(function () { input.focus(); }, 60);
    });
  }
  input.addEventListener('input', function () { input.value = input.value.replace(/\D/g, '').slice(0, 8); paint(); if (input.value.length === 8) tryPw(); });
  input.addEventListener('keydown', function (e) { if (e.key === 'Enter') { e.preventDefault(); tryPw(); } });
  paint();
  var saved = null; try { saved = localStorage.getItem(KEY); } catch (_) {}
  if (saved) {   // 这台手机输对过一次，下次直接打开
    unlock(saved).then(function (html) { show(html, false); }, function () { try { localStorage.removeItem(KEY); } catch (_) {} input.focus(); });
  } else setTimeout(function () { input.focus(); }, 50);
})();
</script>
</body>
</html>
