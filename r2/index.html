<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Get 到你了吗</title>
<style>
:root{--paper:#fbfaf7;--ink:#111;--blue:#2557d6;--red:#e23b3b;--muted:#8a8780;--line:#d9d6cf;--card:#fff}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--paper:#151517;--ink:#ecebe8;--blue:#7aa2ff;--red:#ff7a7a;--muted:#8f8d88;--line:#34343a;--card:#1d1d20}}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--paper);color:var(--ink);font:16px/1.5 -apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
.wrap{max-width:560px;margin:0 auto;padding:max(28px,env(safe-area-inset-top)) 16px 120px}
h1{font-size:24px;margin:8px 0 6px;font-weight:700}
h2{font-size:18px;margin:30px 0 8px}
.sub{color:var(--muted);font-size:14px;margin:0}
.blue{color:var(--blue)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:18px 0}
.tile{position:relative;aspect-ratio:4/5;border-radius:14px;overflow:hidden;text-align:left;display:flex;flex-direction:column;justify-content:flex-end;padding:12px;color:#fff;background:#333 center/cover no-repeat}
.tile::before{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,0) 45%,rgba(0,0,0,.62))}
.tile>*{position:relative}
.tile .t{font-size:19px;font-weight:700;text-shadow:0 1px 10px rgba(0,0,0,.4)}
.tile .b{font-size:12px;opacity:.88}
.tile .stamp{position:absolute;top:10px;right:10px;font-size:12px;font-weight:700;padding:3px 8px;border-radius:999px;background:var(--card);color:var(--ink)}
.tile .stamp.yes{color:var(--blue)}
.tile .stamp.no{color:var(--muted)}
.tile .seen{position:absolute;top:10px;left:10px;font-size:11px;padding:2px 7px;border-radius:999px;background:rgba(0,0,0,.45)}
.tile.pick{outline:3px solid var(--blue);outline-offset:2px}
.viewer{position:fixed;inset:0;z-index:70;background:#000;display:none}
.viewer.on{display:block}
.viewer iframe{position:absolute;left:0;top:0;width:100%;height:calc(100% - var(--barH));border:0;background:#000}
.viewer{--barH:calc(64px + env(safe-area-inset-bottom))}
.vfade{position:absolute;left:0;right:0;top:0;bottom:var(--barH);background:#000;opacity:0;pointer-events:none;transition:opacity .18s}
.vtop{position:absolute;left:0;right:0;top:0;padding:max(12px,env(safe-area-inset-top)) 14px 10px;pointer-events:none;color:#fff;text-shadow:0 1px 8px rgba(0,0,0,.6);transition:opacity .8s}
.vtop.fade{opacity:0}
.vtop b{display:block;font-size:17px}
.vtop span{font-size:12px;opacity:.85}
.vbar{position:absolute;left:0;right:0;bottom:0;height:var(--barH);padding:9px 10px env(safe-area-inset-bottom);background:#111;display:flex;align-items:flex-start;gap:8px}
.ib{height:46px;min-width:46px;padding:0 14px;border-radius:999px;background:rgba(255,255,255,.12);color:#fff;font-size:17px;white-space:nowrap}
.ib.on{color:#ffd76a}
.vnext{margin-left:auto;height:46px;padding:0 20px;border-radius:999px;background:#fff;color:#111;font-weight:700;font-size:16px}
.vmark{flex:1;height:46px;border-radius:999px;font-weight:700;font-size:15px}
.vmark.no{background:rgba(255,255,255,.12);color:#fff}
.vmark.yes{background:#fff;color:#2557d6}
.panel{position:absolute;left:0;right:0;bottom:var(--barH);padding:12px 14px;background:rgba(17,17,17,.95);display:none;justify-content:center}
.panel.on{display:flex}
.loading{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:rgba(255,255,255,.6);font-size:14px}
.dock{position:absolute;left:0;right:0;bottom:0;padding:12px 14px max(14px,env(safe-area-inset-bottom));display:flex;gap:10px;justify-content:center;background:linear-gradient(transparent,rgba(0,0,0,.45))}
.pill{min-width:132px;padding:12px 18px;border-radius:999px;background:rgba(255,255,255,.93);color:#111;font-weight:600;font-size:15px;box-shadow:0 4px 18px rgba(0,0,0,.25)}
.pill.yes{color:#2557d6}
.pill.ghost{background:rgba(0,0,0,.4);color:#fff;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.rate{position:absolute;left:0;right:0;bottom:0;padding:12px 14px max(14px,env(safe-area-inset-bottom));background:linear-gradient(transparent,rgba(0,0,0,.62));display:flex;flex-direction:column;gap:10px;align-items:center}
.stars{display:flex;gap:6px}
.stars button{font-size:30px;color:rgba(255,255,255,.45);line-height:1}
.stars button.on{color:#ffd76a}
.say{display:flex;gap:8px;width:100%;max-width:520px}
.say input{flex:1;min-width:0;padding:11px 14px;border-radius:999px;border:0;background:rgba(255,255,255,.93);color:#111;font:inherit;font-size:15px}
.say button{padding:0 16px;border-radius:999px;background:rgba(255,255,255,.93);color:#111;font-weight:600}
.q{margin:26px 0 10px;font-weight:600}
.q small{display:block;color:var(--muted);font-weight:400;font-size:13px}
.scale{display:flex;gap:8px}
.scale button{flex:1;padding:10px 0;border:1.5px solid var(--line);border-radius:10px;font-weight:600}
.scale button.on{border-color:var(--blue);color:var(--blue)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips button{padding:8px 14px;border:1.5px solid var(--line);border-radius:999px;font-size:14px}
.chips button.on{border-color:var(--blue);color:var(--blue)}
.cta{display:block;width:100%;margin-top:26px;padding:15px;border-radius:14px;background:var(--ink);color:var(--paper);font-weight:700;font-size:16px}
.cta[disabled]{opacity:.3}
.cta.soft{background:transparent;color:var(--ink);border:1.5px solid var(--line);margin-top:12px}
.note{color:var(--red);font-size:13px;min-height:20px;margin-top:8px}
.msgs{list-style:none;padding:0;margin:8px 0 0}
.msgs li{padding:10px 0;border-top:1px solid var(--line);font-size:15px}
.msgs li small{display:block;color:var(--muted);font-size:12px}
.toast{position:fixed;left:50%;top:40%;transform:translate(-50%,-50%);z-index:90;background:rgba(0,0,0,.78);color:#fff;padding:10px 16px;border-radius:12px;font-size:14px;opacity:0;transition:opacity .3s;pointer-events:none}
.toast.on{opacity:1}
.center{min-height:70vh;display:flex;flex-direction:column;justify-content:center}
.nameinput{display:block;width:100%;margin-top:22px;padding:14px 16px;border:1.5px solid var(--line);border-radius:14px;background:var(--card);color:var(--blue);font:inherit;font-size:18px}
.nameinput:focus{outline:none;border-color:var(--ink)}
.ctabox{margin-top:26px;padding:16px;border:1.5px solid var(--line);border-radius:14px;display:flex;flex-direction:column;gap:6px}
.ctabox b{font-size:16px}
.ctabox span{color:var(--muted);font-size:14px}
.ctabox a{align-self:flex-start;margin-top:6px;padding:10px 16px;border-radius:999px;background:var(--blue);color:#fff;text-decoration:none;font-weight:600}
.link-sm{display:block;margin:18px auto 0;color:var(--muted);font-size:13px;text-decoration:underline}
.homebar{position:sticky;top:0;z-index:20;margin:0 -16px 8px;padding:max(10px,env(safe-area-inset-top)) 16px 10px;background:var(--paper)}
.homebar .homebtn{display:block;text-align:center;padding:16px;border-radius:14px;background:var(--blue);color:#fff;font-size:18px;font-weight:700;text-decoration:none}
.homebar button{display:block;width:100%;padding:16px;border-radius:14px;background:var(--ink);color:var(--paper);font-size:18px;font-weight:700}
.pair{display:flex;gap:10px;margin-top:26px}
.pair .cta{margin-top:0;flex:1}
.pair .cta.soft{flex:0 0 38%}
</style>
</head>
<body>
<div id="app"><div class="wrap center"><p class="sub">正在打开……</p></div></div>
<div class="viewer" id="viewer"><iframe title="作品" allow="autoplay; accelerometer; gyroscope"></iframe><div class="loading" id="vload">正在打开作品……</div>
  <div class="vfade" id="vfade"></div><div class="vtop" id="vtop"><b></b><span></span></div>
  <div id="vdock"></div>
</div>
<div class="toast" id="toast"></div>
<script>
'use strict';
const API = 'https://chrxqhraickomolmvnap.supabase.co/rest/v1/';
const ANON_KEY = 'sb_publishable_Me2STWDSBkhxlGJWXPWBKQ_a9vgAQaI';   // 公开密钥：responses 只能写；gaf_comments 能写，只能读已通过的
const DRY = new URLSearchParams(location.search).has('dry');           // 本机测试：不发任何数据，只记在 window.__sent
const BLOCK_ME = { A: '先天（名字、生日、出生地）', Q4: '微信头像', Q5: '朋友圈背景', Q67: 'comfort food 和衣服', Q8: '解锁后的第一屏', Q9: '随便说的一句话' };
const BLOCK_TA = { A: '先天', Q4: '头像', Q5: '朋友圈背景', Q67: '吃穿', Q8: '第一屏', Q9: '一句话' };

const $ = s => document.querySelector(s), app = $('#app'), viewer = $('#viewer'), ifr = viewer.querySelector('iframe'), vtop = $('#vtop'), vdock = $('#vdock');
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const now = () => Date.now();
function toast(t) { const e = $('#toast'); e.textContent = t; e.classList.add('on'); setTimeout(() => e.classList.remove('on'), 1600); }

// —— 解密 ——
const enc = new TextEncoder(), dec = new TextDecoder();
const SALT = enc.encode('gaf-r2-review-2026');
const hex = b => [...new Uint8Array(b)].map(x => x.toString(16).padStart(2, '0')).join('');
async function open(key, buf) { const u = new Uint8Array(buf); return crypto.subtle.decrypt({ name: 'AES-GCM', iv: u.slice(0, 12) }, key, u.slice(12)); }
async function getBin(p) { const r = await fetch(p, { cache: 'no-cache' }); if (!r.ok) throw new Error(r.status); return r.arrayBuffer(); }
let K, ENV, POOL, ENVNAME;
const htmlCache = new Map();
const workHtml = wid => { if (!htmlCache.has(wid)) htmlCache.set(wid, getBin('w/' + wid + '.bin').then(b => open(K, b)).then(b => dec.decode(b))); return htmlCache.get(wid); };

// —— 存在这台手机里的进度 ——
let S;
const load = () => { try { return JSON.parse(localStorage.getItem('gaf-r2:' + ENV.who) || 'null'); } catch (e) { return null; } };
const save = () => { try { localStorage.setItem('gaf-r2:' + ENV.who, JSON.stringify(S)); } catch (e) {} };
const deviceId = () => { try { const d = JSON.parse(localStorage.getItem('gaf-device') || 'null'); if (d && d.id) return d.id; } catch (e) {} return S.dev; };

// —— 发数据 ——
window.__sent = [];
function post(table, body, keepalive) {
  if (DRY) { window.__sent.push({ table, body }); return Promise.resolve(true); }
  return fetch(API + table, { method: 'POST', keepalive: !!keepalive, headers: { 'Content-Type': 'application/json', apikey: ANON_KEY, Prefer: 'return=minimal' }, body: JSON.stringify(body) })
    .then(r => r.ok).catch(() => false);
}
const base = () => ({ who: ENV.who, entry: S && S.entry, device_id: deviceId(), ua: navigator.userAgent.slice(0, 200), at: new Date().toISOString() });
// 每关掉一件作品记一条（10-20 加）：没交卷、交卷后回来再看，也都有时间
const SURVEY = '../survey/?invite=3jwnbb';   // 访客想要自己的作品时去填问卷，邀请码 V01
const isVisitor = () => ENV && ENV.who === 'visitor';
function logView(role, wid, sec, extra, keepalive) {
  post('responses', { payload: { schema: 'gaf.view.v1', ...base(), role, work_id: wid, block: POOL.works[wid] && POOL.works[wid].b, seconds: sec, ...(extra || {}) } }, keepalive);
}

// —— 看作品：和问卷同站，嵌进来，暂停时停声音和动画 ——
function prelude(){var P=false,ctxs=[],q=[];var AC=window.AudioContext||window.webkitAudioContext;
  if(AC){var W=function(a){var c=a===undefined?new AC():new AC(a);ctxs.push(c);return c};W.prototype=AC.prototype;try{window.AudioContext=W;window.webkitAudioContext=W}catch(e){}}
  var raf=window.requestAnimationFrame.bind(window);window.requestAnimationFrame=function(cb){if(P){q.push(cb);return -1}return raf(cb)};
  window.__gaf={pause:function(){P=true;ctxs.forEach(function(c){try{c.close()}catch(e){}})}};
  ['pointerdown','touchstart'].forEach(function(t){addEventListener(t,function(){try{parent.postMessage({gaf:'touch'},'*')}catch(e){}},{capture:true,passive:true})});}
const inject = h => { const t = '<script>(' + prelude.toString() + ')()<\/script>'; return /<head[^>]*>/i.test(h) ? h.replace(/<head[^>]*>/i, m => m + t) : t + h; };
let vtopTimer, viewing = null;
const wait = ms => new Promise(r => setTimeout(r, ms));
async function play(wid, sub) {
  const switching = viewer.classList.contains('on');
  viewing = { wid, t0: now() };
  vtop.querySelector('b').textContent = '《' + POOL.works[wid].t + '》'; vtop.querySelector('span').textContent = sub;
  vtop.classList.remove('fade'); clearTimeout(vtopTimer); vtopTimer = setTimeout(() => vtop.classList.add('fade'), 3500);
  if (switching) { $('#vfade').style.opacity = '1'; await wait(180); try { ifr.contentWindow.__gaf && ifr.contentWindow.__gaf.pause(); } catch (e) {} }
  else { $('#vload').style.display = 'flex'; viewer.classList.add('on'); document.body.style.overflow = 'hidden'; }
  try {
    const h = await workHtml(wid);
    if (viewing && viewing.wid === wid) { ifr.srcdoc = inject(h); setTimeout(() => { $('#vload').style.display = 'none'; $('#vfade').style.opacity = '0'; }, 250); }
  } catch (e) { $('#vload').style.display = 'flex'; $('#vload').textContent = '作品没打开，点 ← 返回再试一次'; $('#vfade').style.opacity = '0'; }
}
function lap() { const v = viewing; viewing = null; return v ? Math.round((now() - v.t0) / 1000) : 0; }   // 结束这一件的计时
function stop() {
  try { ifr.contentWindow.__gaf && ifr.contentWindow.__gaf.pause(); } catch (e) {}
  ifr.srcdoc = ''; viewer.classList.remove('on'); vdock.innerHTML = ''; document.body.style.overflow = '';
  $('#vload').textContent = '正在打开作品……'; $('#vfade').style.opacity = '0';
  return lap();
}
addEventListener('message', e => { if (e.data && e.data.gaf === 'touch') vtop.classList.add('fade'); });

const tile = (wid, label, extra = '', attr = '') => {
  const w = POOL.works[wid];
  return `<button class="tile ${extra}" style="background-image:url(data:image/jpeg;base64,${w.img})" ${attr}><span class="t">${esc(w.t)}</span><span class="b">${esc(label)}</span></button>`;
};

// ============ 第一块：看自己的作品 ============
function mineTile(wid, mode) {
  const m = S.marks[wid];
  const stamp = m ? `<span class="stamp ${m}">${m === 'yes' ? 'get 到了' : '没 get 到'}</span>` : '';
  const c = MSG[wid] ? `<span class="seen">💬 ${MSG[wid].length}</span>` : '';
  return tile(wid, BLOCK_ME[POOL.works[wid].b], mode === 'best' && S.best === wid ? 'pick' : '', `data-${mode}="${wid}"`).replace('<span class="t">', stamp + c + '<span class="t">');
}
function openMine(wid) {
  play(wid, '来自你回答的：' + BLOCK_ME[POOL.works[wid].b]);
  vdock.innerHTML = `<div class="vbar"><button class="ib" id="vback" aria-label="返回">←</button><button class="vmark no" data-m="no">没 get 到</button><button class="vmark yes" data-m="yes">get 到我了</button></div>`;
  const done = mark => { const sec = stop(); S.mineTime[wid] = (S.mineTime[wid] || 0) + sec; if (mark) S.marks[wid] = mark; save(); logView('self', wid, sec, { mark: mark || null, submitted: !!S.submitted }); render(); };
  vdock.querySelectorAll('[data-m]').forEach(b => b.onclick = () => done(b.dataset.m));
  $('#vback').onclick = () => done(null);
}
function wrapUp() {
  const mine = ENV.mine;
  return `<div class="q">哪一件最 get 到你？<small>点一下选中</small></div>
  <div class="grid">${mine.map(w => mineTile(w, 'best')).join('')}</div>
  ${S.best ? `<div class="q">它 get 到你几分？</div><div class="scale">${[1, 2, 3, 4, 5].map(n => `<button data-score="${n}" class="${S.score === n ? 'on' : ''}">${n}</button>`).join('')}</div>
  <div class="q">是因为什么？<small>可以不选</small></div><div class="chips">${[['mine', '看到了自己的东西'], ['feel', '被说中了那种感觉'], ['both', '都有']].map(([k, t]) => `<button data-why="${k}" class="${S.why === k ? 'on' : ''}">${t}</button>`).join('')}</div>` : ''}
  <div class="q">有没有完全没 get 到你的？</div>
  <div class="chips">${mine.map(w => `<button data-worst="${w}" class="${S.worst === w ? 'on' : ''}">《${esc(POOL.works[w].t)}》</button>`).join('')}<button data-worst="none" class="${S.worst === 'none' ? 'on' : ''}">没有</button></div>
  <button class="cta" id="send" ${S.best && S.score && S.worst ? '' : 'disabled'}>交给我</button><div class="note" id="note"></div>`;
}
async function submitMine() {
  const blk = w => POOL.works[w] ? POOL.works[w].b : w;
  const payload = { schema: 'gaf.review.v1', ...base(),
    marks: Object.fromEntries(ENV.mine.map(w => [blk(w), S.marks[w]])), best: blk(S.best), score: S.score, why: S.why,
    worst: S.worst === 'none' ? 'none' : blk(S.worst), seconds_per_work: Object.fromEntries(ENV.mine.map(w => [blk(w), S.mineTime[w] || 0])),
    titles: Object.fromEntries(ENV.mine.map(w => [blk(w), POOL.works[w].t])), total_s: Math.round((now() - S.t0) / 1000) };
  $('#send').disabled = true;
  const ok = await post('responses', { payload });
  if (!ok) { $('#note').textContent = '没发出去，网络好一点再点一次'; $('#send').disabled = false; return; }
  S.submitted = true; save(); render(); scrollTo(0, 0);
}

// ============ 第二块：一个人一个人地看 ============
function others() { const mine = new Set(ENV.mine); return POOL.groups.map((g, i) => i).filter(i => !POOL.groups[i].some(w => mine.has(w))); }
let visit = null;   // 正在看的这个人：{ g, n, t0, opened: {wid: 秒} }
function enterPerson() {
  const order = S.order;
  if (S.pos >= order.length) { S.page = 'end'; save(); return render(); }
  const g = order[S.pos];
  visit = { g, n: S.pos + 1, t0: now(), opened: {} };
  S.page = 'browse'; save(); render(); scrollTo(0, 0);
}
function leavePerson(keepalive) {
  if (!visit) return;
  const sec = Math.round((now() - visit.t0) / 1000);
  S.browse.people = Math.max(S.browse.people, visit.n); S.browse.seconds += sec; save();
  post('responses', { payload: { schema: 'gaf.browse.v1', ...base(), person_no: visit.n, group: POOL.groups[visit.g][0], seconds: sec,
    opened: visit.opened, total_people: S.browse.people, total_seconds: S.browse.seconds, round: S.rounds || 0 } }, keepalive);
  visit = null;
}
function nextOf(wid) {   // 这个人的下一件；最后一件之后是下一个人的第一件
  const g = POOL.groups[visit.g], i = g.indexOf(wid);
  if (i + 1 < g.length) return { wid: g[i + 1] };
  if (S.pos + 1 < S.order.length) return { wid: POOL.groups[S.order[S.pos + 1]][0], person: true };
  return null;
}
function openOther(wid) {
  play(wid, '来自 TA 的：' + BLOCK_TA[POOL.works[wid].b]);
  const nx = nextOf(wid); if (nx) workHtml(nx.wid);   // 先把下一件取好，切过去才快
  const r = { star: 0, say: '', sent: false };
  vdock.innerHTML = `<div class="panel" id="panel"></div><div class="vbar"><button class="ib" id="vback" aria-label="返回">←</button>
    <button class="ib" id="bStar" aria-label="打星">☆</button><button class="ib" id="bSay" aria-label="留一句话">💬</button>
    <button class="vnext" id="bNext">${nx ? (nx.person ? '下一个人 →' : '下一个 →') : '看完了'}</button></div>`;
  const panel = $('#panel'), close = () => { panel.classList.remove('on'); panel.innerHTML = ''; panel.dataset.k = ''; };
  $('#bStar').onclick = () => {
    if (panel.dataset.k === 'star') return close();
    panel.dataset.k = 'star'; panel.classList.add('on');
    panel.innerHTML = `<div class="stars">${[1, 2, 3, 4, 5].map(n => `<button data-star="${n}" class="${r.star >= n ? 'on' : ''}" aria-label="${n} 星">★</button>`).join('')}</div>`;
    panel.querySelectorAll('[data-star]').forEach(b => b.onclick = () => {
      r.star = +b.dataset.star; panel.querySelectorAll('[data-star]').forEach(x => x.classList.toggle('on', +x.dataset.star <= r.star));
      $('#bStar').textContent = '★ ' + r.star; $('#bStar').classList.add('on'); setTimeout(close, 350);
    });
  };
  $('#bSay').onclick = () => {
    if (panel.dataset.k === 'say') return close();
    panel.dataset.k = 'say'; panel.classList.add('on');
    panel.innerHTML = `<div class="say"><input id="say" placeholder="给 TA 留一句话（TA 会看到）" maxlength="120" value="${esc(r.say)}"><button id="sendSay">发送</button></div>`;
    const inp = $('#say'); setTimeout(() => inp.focus(), 30);
    const send = () => { const t = inp.value.trim(); if (!t) return close(); r.say = t; r.sent = true;
      post('gaf_comments', { work_id: wid, star: r.star || null, say: t }); S.rated[wid] = 1; save();
      $('#bSay').textContent = '💬 ✓'; $('#bSay').classList.add('on'); close(); toast('留下了，TA 之后会看到'); };
    $('#sendSay').onclick = send; inp.onkeydown = e => { if (e.key === 'Enter') send(); };
  };
  const leave = () => {   // 离开这一件：记时间；只打了星、没留话的，这时把星发出去
    const sec = lap(); if (visit) visit.opened[wid] = (visit.opened[wid] || 0) + sec;
    logView(isVisitor() ? 'visitor' : 'other', wid, sec, { person_no: visit && visit.n, star: r.star || null, said: r.sent });
    if (r.star && !r.sent) { post('gaf_comments', { work_id: wid, star: r.star, say: null }); S.rated[wid] = 1; save(); }
  };
  $('#vback').onclick = () => { leave(); stop(); render(); };
  $('#bNext').onclick = () => {
    leave();
    if (!nx) { stop(); leavePerson(); S.pos = S.order.length; S.page = 'end'; save(); return render(); }
    if (nx.person) {
      leavePerson(); S.pos++; visit = { g: S.order[S.pos], n: S.pos + 1, t0: now(), opened: {} }; S.page = 'browse'; save(); render();
      toast('第 ' + visit.n + ' 个人');
    }
    openOther(nx.wid);
  };
}
addEventListener('pagehide', () => {
  if (viewing) {   // 关页面时正在看作品：算进停留时间，也记一条
    const sec = Math.round((now() - viewing.t0) / 1000);
    if (visit) visit.opened[viewing.wid] = (visit.opened[viewing.wid] || 0) + sec;
    const own = ENV.mine.includes(viewing.wid);
    logView(own ? 'self' : isVisitor() ? 'visitor' : 'other', viewing.wid, sec, { closed_page: true }, true);
    viewing.t0 = now();
  }
  leavePerson(true);
});

// ============ 别人留给你的话 ============
let MSG = {};
async function loadMessages() {
  if (DRY || !ENV.mine.length) return;
  try {
    const q = `gaf_comments?select=work_id,star,say,created_at&work_id=in.(${ENV.mine.join(',')})&order=created_at.desc`;
    const r = await fetch(API + q, { headers: { apikey: ANON_KEY } }); if (!r.ok) return;
    MSG = {}; for (const m of await r.json()) (MSG[m.work_id] = MSG[m.work_id] || []).push(m);
  } catch (e) {}
}
function messagesHtml() {
  const list = ENV.mine.flatMap(w => (MSG[w] || []).map(m => ({ ...m, t: POOL.works[w].t })));
  if (!list.length) return '';
  return `<h2>别人留给你的</h2><ul class="msgs">${list.map(m => `<li>${m.say ? esc(m.say) : '★'.repeat(m.star || 0)}<small>《${esc(m.t)}》${m.say && m.star ? ' · ' + '★'.repeat(m.star) : ''}</small></li>`).join('')}</ul>`;
}

// ============ 页面 ============
function render() {
  let body;
  const cta = `<div class="ctabox"><b>你也想要一组这样的作品吗？</b><span>回答 10 个小问题，我从你的回答里做给你。</span><a href="${SURVEY}" target="_blank" rel="noopener">去填问卷 →</a></div>`;
  if (S.page === 'browse' && visit) {
    const g = POOL.groups[visit.g];
    body = `<div class="homebar">${isVisitor() ? `<a class="homebtn" href="${SURVEY}" target="_blank" rel="noopener">我也想要 · 去填问卷 →</a>` : '<button id="home">← 回到我的作品</button>'}</div><h1>第 ${visit.n} 个人</h1><p class="sub">这些都是根据 TA 的回答做的。点开玩一玩，喜欢就给颗星、留句话。</p>
      <div class="grid">${g.map(w => tile(w, '来自 TA 的：' + BLOCK_TA[POOL.works[w].b], '', `data-other="${w}"`).replace('<span class="t">', (visit.opened[w] != null ? '<span class="seen">看过</span>' : '') + '<span class="t">')).join('')}</div>
      <div class="pair">${S.pos > 0 ? '<button class="cta soft" id="prevP">← 上一个人</button>' : ''}<button class="cta" id="nextP">${S.pos + 1 < S.order.length ? '看下一个人 →' : '看完了'}</button></div>${isVisitor() ? cta : ''}`;
  } else if (S.page === 'end') {
    body = `<div class="center"><h1>所有人都看完了</h1><p class="sub">你一共看了 ${S.browse.people} 个人。谢谢你来逛。</p><button class="cta" id="goO">再从头看一遍</button>${isVisitor() ? cta : ''}<button class="cta soft" id="home">${isVisitor() ? '回到开头' : '回到我的作品'}</button></div>`;
  } else if (isVisitor()) {
    const goTxt = S.browse.people > 0 && S.pos < S.order.length ? `接着看（已经看了 ${S.browse.people} 个人）` : S.pos >= S.order.length ? '所有人都看过了，再从头看一遍' : '看第一个人';
    body = `<h1>随便看看</h1><p class="sub">这里每个人都回答了 10 个小问题，我只用其中一个回答，为 TA 做一件作品。<br>都是匿名的。一个人一个人地看，看到喜欢的可以给颗星、留句话。</p>
      <button class="cta" id="goO">${goTxt}</button>${cta}<button class="link-sm" id="notme">我填过问卷，用名字打开我的作品</button>`;
  } else {
    const left = ENV.mine.filter(w => !S.marks[w]).length, all = !left;
    if (!S.submitted) {
      body = `<h1>我从你的回答里 get 到的你</h1><p class="sub">每件来自你回答的一道题。点开玩一玩，看完告诉我有没有 get 到你。${left ? `还剩 <span class="blue">${left}</span> 件。` : ''}</p>
        <div class="grid">${ENV.mine.map(w => mineTile(w, 'open')).join('')}</div>${all ? wrapUp() : ''}${viaName ? '<button class="link-sm" id="notme">不是你？换个名字</button>' : ''}`;
    } else {
      body = `<h1>你的作品</h1><p class="sub">谢谢你，已经收到了。随时可以回来再玩。</p>
        <div class="grid">${ENV.mine.map(w => mineTile(w, 'open')).join('')}</div>
        ${messagesHtml()}
        ${viaName ? '<button class="link-sm" id="notme">不是你？换个名字</button>' : ''}
        <h2>去看看别人</h2><p class="sub">别人也做了这样的作品，都是匿名的。你的作品也会匿名出现在别人那里，包括没填过问卷、只是来逛逛的人。</p>
        <button class="cta" id="goO">${S.browse.people > 0 && S.pos < S.order.length ? `接着看（已经看了 ${S.browse.people} 个人）` : S.pos >= S.order.length ? '所有人都看过了，再从头看一遍' : '看第一个人'}</button>`;
    }
  }
  app.innerHTML = `<div class="wrap">${body}</div>`;
  app.querySelectorAll('[data-open]').forEach(b => b.onclick = () => openMine(b.dataset.open));
  app.querySelectorAll('[data-best]').forEach(b => b.onclick = () => { S.best = b.dataset.best; save(); render(); });
  app.querySelectorAll('[data-score]').forEach(b => b.onclick = () => { S.score = +b.dataset.score; save(); render(); });
  app.querySelectorAll('[data-why]').forEach(b => b.onclick = () => { S.why = S.why === b.dataset.why ? null : b.dataset.why; save(); render(); });
  app.querySelectorAll('[data-worst]').forEach(b => b.onclick = () => { S.worst = b.dataset.worst; save(); render(); });
  app.querySelectorAll('[data-other]').forEach(b => b.onclick = () => openOther(b.dataset.other));
  const on = (id, f) => { const e = $('#' + id); if (e) e.onclick = f; };
  on('send', submitMine);
  on('notme', notMe);
  app.querySelectorAll(`a[href="${SURVEY}"]`).forEach(a => a.onclick = () => post('responses', { payload: { schema: 'gaf.visit.v1', ...base(), action: 'cta', where: a.closest('.homebar') ? 'top' : 'bottom', person_no: visit && visit.n, total_people: S.browse.people } }, true));
  on('goO', () => { if (S.pos >= S.order.length) { S.pos = 0; S.rounds = (S.rounds || 0) + 1; save(); } enterPerson(); });
  on('nextP', () => { leavePerson(); S.pos++; save(); enterPerson(); });
  on('prevP', () => { leavePerson(); S.pos = Math.max(0, S.pos - 1); save(); enterPerson(); });
  on('home', () => { leavePerson(); S.page = 'home'; save(); render(); scrollTo(0, 0); });
}

function fail(t) { app.innerHTML = `<div class="wrap center"><h1>打不开</h1><p class="sub">${t}</p></div>`; }
// 公共入口：填问卷第 1 题的名字。写法统一规则必须和 build.mjs 的 normName 一致
const normName = s => s.normalize('NFKC').toLowerCase().replace(/[\s·・.\-_'"’]/g, '');
let viaName = false;
async function unlock(secret) {
  try {
    ENVNAME = hex(await crypto.subtle.digest('SHA-256', enc.encode('env:' + secret))).slice(0, 20);
    const r = await fetch('e/' + ENVNAME + '.bin', { cache: 'no-cache' }); if (!r.ok) return 'missing';
    const tk = await crypto.subtle.deriveKey({ name: 'PBKDF2', salt: SALT, iterations: 150000, hash: 'SHA-256' },
      await crypto.subtle.importKey('raw', enc.encode(secret), 'PBKDF2', false, ['deriveKey']), { name: 'AES-GCM', length: 256 }, false, ['decrypt']);
    ENV = JSON.parse(dec.decode(await open(tk, await r.arrayBuffer())));
    K = await crypto.subtle.importKey('raw', Uint8Array.from(atob(ENV.k), c => c.charCodeAt(0)), 'AES-GCM', false, ['decrypt']);
    POOL = JSON.parse(dec.decode(await open(K, await getBin('pool.bin'))));
    return 'ok';
  } catch (e) { return 'error'; }
}
function askName(msg) {
  app.innerHTML = `<div class="wrap center"><h1>你叫什么？</h1><p class="sub">填你在问卷第 1 题写的名字，就能看到我从你的回答里做出来的作品。</p>
    <input id="nm" class="nameinput" autocomplete="off" autocapitalize="off" placeholder="名字" maxlength="40">
    <button class="cta" id="go">打开</button><div class="note" id="note">${msg || ''}</div>
    <button class="link-sm" id="visit">没填过问卷？随便看看别人的 →</button></div>`;
  const go = async () => {
    const n = normName($('#nm').value || '');
    if (!n) { $('#note').textContent = '先填名字'; return; }
    $('#go').disabled = true; $('#note').textContent = ''; $('#go').textContent = '正在找……';
    const r = await unlock('name:' + n);
    if (r === 'ok') { viaName = true; try { localStorage.setItem('gaf-r2-name', n); } catch (e) {} return start(); }
    $('#go').disabled = false; $('#go').textContent = '打开';
    $('#note').textContent = r === 'missing' ? '没找到这个名字。请填你在问卷第 1 题写的那个写法，比如英文名或昵称。' : '网络不太好，再点一次试试';
  };
  $('#go').onclick = go; $('#nm').onkeydown = e => { if (e.key === 'Enter') go(); };
  $('#visit').onclick = async () => { $('#visit').disabled = true; const r = await unlock('visitor'); if (r === 'ok') { viaName = false; try { localStorage.setItem('gaf-r2-name', '#visitor'); } catch (e) {} return start(); } $('#visit').disabled = false; $('#note').textContent = '网络不太好，再点一次试试'; };
  setTimeout(() => $('#nm').focus(), 50);
}
async function start() {
  S = load() || {};
  const shuffled = others(); for (let i = shuffled.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]]; }
  S = Object.assign({ marks: {}, best: null, score: null, why: null, worst: null, submitted: false, mineTime: {}, t0: now(),
    order: shuffled, pos: 0, page: 'home', browse: { people: 0, seconds: 0 }, rated: {}, dev: 'r2-' + Math.random().toString(36).slice(2, 10) }, S);
  S.entry = isVisitor() ? 'visitor' : viaName ? 'name' : 'link';
  if (S.page === 'browse') S.page = 'home';
  save();
  await loadMessages();
  render();
}
function notMe() { try { localStorage.removeItem('gaf-r2-name'); } catch (e) {} ENV = null; viaName = false; askName(); }
(async () => {
  const token = location.hash.slice(1).trim();
  if (token) {   // 专属链接；#visitor 是访客链接
    const r = await unlock(token === 'visitor' ? 'visitor' : token);
    return r === 'ok' ? start() : fail('这个链接打不开。请检查链接是否完整，或者稍后再试。');
  }
  let saved = null; try { saved = localStorage.getItem('gaf-r2-name'); } catch (e) {}
  if (saved === '#visitor' && await unlock('visitor') === 'ok') return start();
  if (saved && saved !== '#visitor' && await unlock('name:' + saved) === 'ok') { viaName = true; return start(); }
  askName();
})();
</script>
